function downloadMaterialTemplate(){
  const headers=["Kod","Ürün","Kategori","Birim","Miktar","Min"];
  const rows=[
    ["PVC-B-32","PVC Boru Ø32 mm (6 m)","Mekanik Tesisat","Metre",0,0],
    ["PVC-D-32","PVC Dirsek 90° Ø32 mm","Mekanik Tesisat","Adet",0,0],
    ["PPR-B-25","PPRC Boru Ø25 mm PN20","Mekanik Tesisat","Metre",0,0],
    ["PPR-D90-25","PPRC Dirsek 90° Ø25 mm","Mekanik Tesisat","Adet",0,0],
    ["","","","","",""],
    ["ÖRNEK","Kendi listenizi bu satırların altına yapıştırın","Mekanik Tesisat","Adet",0,0]
  ];
  if(typeof XLSX!=="undefined"){
    const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
    ws["!cols"]=[{wch:14},{wch:36},{wch:18},{wch:10},{wch:10},{wch:8}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"MalzemeListesi");
    XLSX.writeFile(wb,"Malzeme_Import_Sablon.xlsx");
    showToast("Şablon indirildi. Listeyi yapıştırıp İçe Aktar ile yükleyin.");
  } else {
    exportToCSV("Malzeme_Import_Sablon", headers, rows);
    showToast("CSV şablon indirildi.");
  }
}
function handleStockImportFile(file){
  if(!file) return;
  if(!roleCan("stock_out") && state.session.role!=="admin"){ showToast("Yetkiniz yok.","red"); return; }
  const name=(file.name||"").toLowerCase();
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      let rows=[];
      if(name.endsWith(".csv")){
        const text=String(ev.target.result||"");
        const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<2){ showToast("CSV boş veya başlıksız.","red"); return; }
        const sep=lines[0].includes(";")&&!lines[0].includes(",") ? ";" : ",";
        const headers=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,""));
          const obj={}; headers.forEach((h,j)=>obj[h]=cols[j]||"");
          rows.push(obj);
        }
      } else {
        if(typeof XLSX==="undefined"){ showToast("Excel kütüphanesi yüklenemedi. CSV deneyin.","red"); return; }
        const data=new Uint8Array(ev.target.result);
        const wb=XLSX.read(data,{type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
      }
      applyStockImportRows(rows);
    }catch(err){
      console.error(err);
      showToast("Dosya okunamadı: "+(err.message||"hata"),"red");
    }
  };
  if(name.endsWith(".csv")) reader.readAsText(file,"utf-8");
  else reader.readAsArrayBuffer(file);
}
function downloadEqTemplate(){
  const headers=["kod","ad","lokasyon","birim_turu","alt_tip","enlem","boylam","kat","daire","oda","seri_no","uretici","saha_notu","aktif"];
  const sample=[["G5","G5 Blok","Şantiye","Bina","Blok",36.20,36.16,5,20,"","","","","evet"]];
  if(typeof XLSX==="undefined"){
    const csv=headers.join(";")+"\n"+sample.map(r=>r.join(";")).join("\n");
    const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ekipman_sablon.csv"; a.click();
    return;
  }
  const ws=XLSX.utils.aoa_to_sheet([headers,...sample]);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Ekipman");
  XLSX.writeFile(wb, "ekipman_sablon.xlsx");
  showToast("Şablon indirildi");
}
function exportEquipmentDb(){
  const rows=(state.data.equipment||[]).map(e=>({
    kod:e.code||"", ad:e.name||"", lokasyon:e.location||"",
    birim_turu:e.unitType||e.type||"", alt_tip:e.subType||"",
    enlem:e.lat!=null?e.lat:"", boylam:e.lng!=null?e.lng:"",
    kat:e.katSayisi!=null?e.katSayisi:"", daire:e.daireSayisi!=null?e.daireSayisi:"", oda:e.odaSayisi!=null?e.odaSayisi:"",
    seri_no:e.serialNo||"", uretici:e.manufacturer||"",
    saha_notu:e.fieldNote||"", aktif:e.active===false?"hayır":"evet",
    imalat_pct:isBinaEq(e)?overallProgress(ensureEqProgress(e)):""
  }));
  if(!rows.length){ showToast("Dışa aktarılacak ekipman yok.","amber"); return; }
  exportReportWorkbook("ekipman_veritabani",[{
    name:"Ekipman",
    headers:Object.keys(rows[0]),
    rows:rows.map(r=>Object.values(r))
  }]);
}
function handleEqImportFile(file){
  if(!file||!roleCan("equipment")){ showToast("Yetkiniz yok.","red"); return; }
  const name=(file.name||"").toLowerCase();
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      let rows=[];
      if(name.endsWith(".csv")){
        const text=String(ev.target.result||"");
        const lines=text.split(/\r?\n/).filter(Boolean);
        if(lines.length<2){ showToast("Boş dosya.","amber"); return; }
        const sep=lines[0].includes(";")?";":",";
        const headers=lines[0].split(sep).map(h=>h.trim());
        rows=lines.slice(1).map(line=>{
          const cols=line.split(sep);
          const o={}; headers.forEach((h,i)=>o[h]=cols[i]!=null?cols[i].trim():""); return o;
        });
      } else {
        if(typeof XLSX==="undefined"){ showToast("Excel kütüphanesi yok.","red"); return; }
        const wb=XLSX.read(ev.target.result,{type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
      }
      applyEqImportRows(rows);
    }catch(err){
      console.error(err);
      showToast("Dosya okunamadı: "+(err.message||"hata"),"red");
    }
  };
  if(name.endsWith(".csv")) reader.readAsText(file,"utf-8");
  else reader.readAsArrayBuffer(file);
}
function applyEqImportRows(rows){
  if(!rows||!rows.length){ showToast("Satır yok.","red"); return; }
  let added=0, updated=0, skipped=0;
  mutateData(cur=>{
    if(!Array.isArray(cur.equipment)) cur.equipment=[];
    const numOrNull=(v)=>{ if(v===""||v==null) return null; const n=Number(String(v).replace(",",".")); return Number.isFinite(n)?n:null; };
    const isYes=(v)=>{ const s=foldTR(String(v||"")); return !s || s==="evet" || s==="1" || s==="true" || s==="aktif" || s==="yes"; };
    rows.forEach(row=>{
      const code=pickField(row,["kod","code","eq","ekipman kodu","equipment code"]);
      const name=pickField(row,["ad","name","isim","ekipman","equipment"]);
      if(!code && !name){ skipped++; return; }
      const unitTypeRaw=pickField(row,["birim_turu","birim turu","unittype","unit type","tur","tür","type"])||"Diğer";
      let unitType=EQ_UNIT_TYPES.find(u=>foldTR(u)===foldTR(unitTypeRaw))||"Diğer";
      if(/bina/i.test(unitTypeRaw)) unitType="Bina";
      const lat=numOrNull(pickField(row,["enlem","lat","latitude"]));
      const lng=numOrNull(pickField(row,["boylam","lng","lon","longitude"]));
      const norm=(lat!=null&&lng!=null)?normalizeLatLng(lat,lng):null;
      const payload={
        code: code||("EQ-"+String((cur.equipment.length)+1).padStart(4,"0")),
        name: name||code,
        location: pickField(row,["lokasyon","location","yer","adres"])||"",
        unitType, type: unitType,
        subType: pickField(row,["alt_tip","alt tip","subtype","tip"])||"",
        serialNo: pickField(row,["seri_no","seri no","serial","sn"])||"",
        manufacturer: pickField(row,["uretici","üretici","manufacturer","marka","brand"])||"",
        fieldNote: pickField(row,["saha_notu","saha notu","not","note","fieldnote"])||"",
        katSayisi: numOrNull(pickField(row,["kat","kat sayisi","katsayisi","floors"])),
        daireSayisi: numOrNull(pickField(row,["daire","daire sayisi","daireSayisi","units"])),
        odaSayisi: numOrNull(pickField(row,["oda","oda sayisi","rooms"])),
        active: isYes(pickField(row,["aktif","active","status"])),
        lat: norm?norm.lat:null, lng: norm?norm.lng:null,
        mapLabelTech: true
      };
      const exist=cur.equipment.find(e=>foldTR(e.code)===foldTR(payload.code));
      if(exist){
        Object.assign(exist, payload, { id:exist.id, progress:exist.progress, updatedAt:nowISO() });
        if(unitType==="Bina" && !exist.progress) exist.progress=defaultImalatProgress();
        updated++;
      } else {
        const rowEq={ id:uid(), ...payload, createdAt:nowISO() };
        if(unitType==="Bina") rowEq.progress=defaultImalatProgress();
        cur.equipment.push(rowEq);
        added++;
      }
    });
    cur.audit.push(pushAudit("Ekipman Import", "+"+added+" yeni · "+updated+" güncellendi · atlanan "+skipped));
    showToast("Ekipman aktarıldı: "+added+" yeni, "+updated+" güncellendi");
    state._mapFp=null;
    return cur;
  });
}
function pickField(row, keys){
  const entries=Object.entries(row);
  for(const k of keys){
    const found=entries.find(([h])=>String(h).toLowerCase().trim()===k || String(h).toLowerCase().includes(k));
    if(found && found[1]!=="" && found[1]!=null) return String(found[1]).trim();
  }
  return "";
}
function applyStockImportRows(rows){
  if(!rows||!rows.length){ showToast("Satır bulunamadı.","red"); return; }
  let updated=0, added=0;
  mutateData(cur=>{
    let stock=[...cur.stock];
    let products=[...cur.products];
    rows.forEach(row=>{
      const item=pickField(row,["ürün","urun","malzeme","item","name","ad","ürün adı","urun adi"]);
      const qtyRaw=pickField(row,["miktar","qty","stok","quantity","adet"]);
      const unit=pickField(row,["birim","unit"])||"Adet";
      const category=pickField(row,["kategori","category","grup"])||"Diğer";
      const code=pickField(row,["kod","code","sku"]);
      const minRaw=pickField(row,["min","minimum","min stok","minlevel"]);
      if(!item) return;
      const qty=Number(String(qtyRaw).replace(",","."))||0;
      const minLevel=Number(String(minRaw).replace(",","."))||0;
      const sIdx=stock.findIndex(s=>s.item.toLowerCase()===item.toLowerCase() && String(s.unit).toLowerCase()===unit.toLowerCase());
      if(sIdx>=0){ stock[sIdx]={...stock[sIdx], qty, category, minLevel: minLevel||stock[sIdx].minLevel||0}; updated++; }
      else { stock.push({id:uid(), item, category, unit, qty, minLevel}); added++; }
      if(code || !products.some(p=>p.name.toLowerCase()===item.toLowerCase())){
        if(!products.some(p=>p.name.toLowerCase()===item.toLowerCase())){
          products.push({id:uid(), code:code||("IMP-"+String(products.length+1).padStart(4,"0")), name:item, category, unit, minLevel});
        }
      }
    });
    cur.stock=stock;
    cur.products=products;
    cur.movements.push({id:uid(),at:nowISO(),type:"Excel Import",item:"Toplu stok",qty:updated+added,unit:"satır",ref:fileNameSafe(),by:state.session.fullName});
    cur.audit.push(pushAudit("Stok Import", `+${added} yeni · ${updated} güncellendi`));
    showToast(`Stok aktarıldı: ${added} yeni, ${updated} güncellendi.`);
    return cur;
  });
}
function fileNameSafe(){ return "import_"+new Date().toISOString().slice(0,10); }

/* ============================ SUPABASE ============================ */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){
    try{
      if(state.data && !dataIsEmpty(state.data)){
        saveLocalBackup(state.data);
        if(state._dirty){ persistKeepalive(state.data); flushPersist(); }
      }
    }catch(e){}
  } else if(document.visibilityState==="visible"){
    try{ if(state.session && !state._dirty) softSyncFromServer({silent:true}); }catch(e){}
  }
});
window.addEventListener("pagehide",()=>{
  try{
    if(state.data && !dataIsEmpty(state.data)){
      saveLocalBackup(state.data);
      persistKeepalive(state.data);
    }
  }catch(e){}
});
window.addEventListener("beforeunload",e=>{
  try{
    if(state.data && !dataIsEmpty(state.data)){
      saveLocalBackup(state.data);
      if(state._dirty){
        persistKeepalive(state.data);
        e.preventDefault();
        e.returnValue="";
      }
    }
  }catch(err){}
});
// online olunca hemen yaz
window.addEventListener("online",()=>{
  try{
    if(state._dirty && state.data) flushPersist();
  }catch(e){}
});
function startSupabase(){
  const script=document.createElement("script");
  script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
  script.onload=async function(){
    const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    window.storage={
      async get(key){ const {data,error}=await db.from("app_storage").select("value").eq("key",key).maybeSingle(); if(error) throw error; if(!data) return null; return {value:data.value}; },
      async set(key,value){ const {error}=await db.from("app_storage").upsert({key,value,updated_at:new Date().toISOString()},{onConflict:"key"}); if(error) throw error; return true; }
    };
    loadAll();
  };
  script.onerror=()=>alert("Supabase bağlantısı kurulamadı.");
  document.head.appendChild(script);
}
startSupabase();
