function handleNewTalep(){
  let item=document.getElementById("talep-item").value.trim();
  const qty=document.getElementById("talep-qty").value;
  let category=document.getElementById("talep-category").value;
  let unit=document.getElementById("talep-unit").value;
  const woId=document.getElementById("talep-wo")?.value||"";
  let productId=null;
  // Katalogdan birebir veya esnek eşleşme
  if(item){
    const products=state.data.products||[];
    let p=products.find(x=>foldTR(x.name)===foldTR(item));
    if(!p){
      const hits=catalogFilter(products, item, x=>[x.code,x.name,x.category].join(" "), 1);
      if(hits.length && foldTR(hits[0].name)===foldTR(item)) p=hits[0];
    }
    if(p){ item=p.name; category=p.category||category; unit=p.unit||unit; productId=p.id||null; }
  }
  if(!item||!qty||Number(qty)<=0){ showToast("Ürün ve miktar zorunlu.","red"); return; }
  state.talepItemQuery="";

  mutateData(cur=>{
    const counter=(cur.counters.pr||0)+1;
    const no="PR-"+String(counter).padStart(5,"0");
    const wo=woId?cur.workOrders.find(w=>w.id===woId):null;
    const req={
      id:uid(), no, item, category, unit, qty:Number(qty),
      priority:document.getElementById("talep-priority")?.value||"Normal",
      needDate:document.getElementById("talep-needdate")?.value||null,
      note:(document.getElementById("talep-note")?.value||"").trim(),
      productId:productId||null, workOrderId:woId||null, workOrderNo:wo?.no||null,
      requester:state.session.id, requesterName:state.session.fullName,
      ...(resolveContactFromSelect("talep-contact")||{}),
      createdAt:nowISO(), status:"Beklemede",
      history:[{at:nowISO(),by:state.session.fullName,action:"PR oluşturuldu"+(wo?" · "+wo.no:"")}]
    };
    cur.counters.pr=counter;
    cur.requests=[req,...cur.requests];
    if(wo){
      // PR bağlamak durumu zorunlu "Malzeme Bekliyor" yapmaz — sadece geçmişe not düşer
      cur.workOrders=cur.workOrders.map(w=>w.id===woId?{...w, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"PR bağlandı: "+no}]}:w);
    }
    cur.audit.push(pushAudit("PR Oluşturuldu", no+" · "+item+(wo?" · "+wo.no:"")));
    state.tab="talepler"; state.modal=null;
    showToast(no+" oluşturuldu.");
    return cur;
  });
}

function handleTalepImportFile(file){
  if(!file) return;
  if(!roleCan("pr_create")){ showToast("Talep oluşturma yetkiniz yok.","red"); return; }
  const name=(file.name||"").toLowerCase();
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      let rows=[];
      if(name.endsWith(".csv")){
        const text=String(ev.target.result||"");
        const lines=text.replace(/^\uFEFF/,"").split(/\\r?\\n/).filter(l=>l.trim());
        if(lines.length<2){ showToast("CSV boş.","red"); return; }
        const sep=lines[0].includes(";")&&!lines[0].includes(",") ? ";" : ",";
        const headers=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,""));
          const obj={}; headers.forEach((h,j)=>obj[h]=cols[j]||"");
          rows.push(obj);
        }
      } else {
        if(typeof XLSX==="undefined"){ showToast("Excel kütüphanesi yok.","red"); return; }
        const data=new Uint8Array(ev.target.result);
        const wb=XLSX.read(data,{type:"array"});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      }
      applyTalepImportRows(rows);
    }catch(err){
      console.error(err);
      showToast("Dosya okunamadı.","red");
    }
  };
  if(name.endsWith(".csv")) reader.readAsText(file,"utf-8");
  else reader.readAsArrayBuffer(file);
}
function applyTalepImportRows(rows){
  if(!rows||!rows.length){ showToast("Satır yok.","red"); return; }
  let added=0, skipped=0;
  mutateData(cur=>{
    let counter=cur.counters.pr||0;
    const newReqs=[];
    rows.forEach(row=>{
      const item=pickField(row,["ürün","urun","malzeme","item","name","ad","ürün adı","urun adi"]);
      const qtyRaw=pickField(row,["miktar","qty","quantity","adet"]);
      const unit=pickField(row,["birim","unit"])||"Adet";
      const category=pickField(row,["kategori","category","grup"])||"Diğer";
      let priority=pickField(row,["öncelik","oncelik","priority"])||"Normal";
      if(!["Acil","Normal","Düşük","Yüksek"].includes(priority)) priority="Normal";
      const needDate=pickField(row,["ihtiyaç tarihi","ihtiyac tarihi","needdate","need date","tarih"])||null;
      const note=pickField(row,["not","note","açıklama","aciklama"])||"";
      const woNo=pickField(row,["iş emri no","is emri no","wo","work order","workorderno"]);
      const qty=Number(String(qtyRaw).replace(",","."))||0;
      if(!item||qty<=0){ skipped++; return; }
      counter++;
      const no="PR-"+String(counter).padStart(5,"0");
      const wo=woNo?(cur.workOrders||[]).find(w=>String(w.no).toLowerCase()===String(woNo).toLowerCase()):null;
      const req={
        id:uid(), no, item, category, unit, qty,
        priority, needDate:needDate||null, note,
        productId:null, workOrderId:wo?.id||null, workOrderNo:wo?.no||null,
        requester:state.session.id, requesterName:state.session.fullName,
        createdAt:nowISO(), status:"Beklemede",
        history:[{at:nowISO(),by:state.session.fullName,action:"Toplu import ile oluşturuldu"}]
      };
      newReqs.push(req);
      if(wo){
        cur.workOrders=cur.workOrders.map(w=>w.id===wo.id?{...w, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"PR bağlandı (import): "+no}]}:w);
      }
      added++;
    });
    cur.counters.pr=counter;
    cur.requests=[...newReqs, ...cur.requests];
    cur.audit.push(pushAudit("PR Toplu Import", added+" talep · "+skipped+" atlandı"));
    showToast(added ? (`${added} talep oluşturuldu` + (skipped ? `, ${skipped} satır atlandı` : "")) : "Geçerli satır yok.", added ? "green" : "red");
    return cur;
  });
}

      if(r.id!==id) return r;
      return {...r, status:decision==="approve"?"Onaylandı":"Reddedildi", approverName:state.session.fullName,

        history:[...(r.history||[]),{at:nowISO(),by:state.session.fullName,action:decision==="approve"?"Onaylandı":"Reddedildi: "+reason}]};

function handlePrCancel(id){
  if(!id) return;
  const r=(state.data.requests||[]).find(x=>x.id===id);
  if(!r){ showToast("Talep bulunamadı.","red"); return; }
  if(["İptal","PO Oluşturuldu","Teslim Alındı"].includes(r.status)){
    showToast("Bu talep iptal edilemez ("+r.status+").","red"); return;
  }
  // satinalma / admin / onaylayan; talep eden sadece kendi beklemedekini
  const role=state.session.role;
  const can = role==="admin" || roleCan("po_create") || roleCan("pr_approve")
    || (role==="talep_eden" && r.requester===state.session.id && r.status==="Beklemede");
  if(!can){ showToast("İptal yetkiniz yok.","red"); return; }
  const reason=prompt("İptal gerekçesi:");
  if(reason===null) return;
  if(!String(reason).trim()){ showToast("Gerekçe zorunlu.","red"); return; }
  mutateData(cur=>{
    cur.requests=cur.requests.map(x=>{
      if(x.id!==id) return x;
      return {...x, status:"İptal", cancelReason:String(reason).trim(), cancelledBy:state.session.fullName, cancelledAt:nowISO(),
        history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"İptal: "+String(reason).trim()}]};
    });
    // RFQ seçiminden çıkar
    state.rfqSelected=(state.rfqSelected||[]).filter(x=>x!==id);
    const req=cur.requests.find(x=>x.id===id);
    cur.audit.push(pushAudit("PR İptal", (req?.no||id)+" · "+String(reason).trim().slice(0,80)));
    state.modal=null;
    showToast("Talep iptal edildi.","amber");

  });
}

function handleCreatePO(reqId){
  const supplier=document.getElementById("order-supplier-"+reqId)?.value;
  const price=Number(document.getElementById("order-price-"+reqId)?.value);
  const qty=Number(document.getElementById("order-qty-"+reqId)?.value);
  const eta=document.getElementById("order-eta-"+reqId)?.value;
  if(!supplier||!(price>0)){ showToast("Cari ve birim fiyat zorunlu.","red"); return; }
  if(!(qty>0)){ showToast("Geçerli miktar girin.","red"); return; }
  mutateData(cur=>{
    const r=cur.requests.find(x=>x.id===reqId);
    if(!r||r.status!=="Onaylandı") return cur;
    const counter=(cur.counters.po||0)+1;
    const poNo="PO-"+String(counter).padStart(5,"0");
    const po={ id:uid(), no:poNo, requestId:r.id, requestNo:r.no, workOrderNo:r.workOrderNo||null,
      item:r.item, qty, unit:r.unit, category:r.category, supplier, unitPrice:price,
      total:price*qty, eta:eta||null, status:"Sipariş Verildi", receivedQty:0,
      createdAt:nowISO(), createdBy:state.session.fullName };
    cur.counters.po=counter;
    cur.purchaseOrders=[po,...cur.purchaseOrders];
    cur.requests=cur.requests.map(x=>x.id===reqId?{...x, status:"PO Oluşturuldu", poNo, supplier, unitPrice:price, qty,
      history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"PO: "+poNo+" · "+qty+" × "+price}]}:x);
    cur.audit.push(pushAudit("PO Oluşturuldu", poNo+" · "+r.item+" · "+qty+" · "+supplier));
    showToast(poNo+" oluşturuldu.");
    return cur;
  });
}
function handlePOUpdate(poId){
  if(!roleCan("po_create")&&state.session.role!=="yonetici"){ showToast("Satın alma yetkiniz yok.","red"); return; }
  const qty=Number(document.getElementById("po-qty-"+poId)?.value);
  const price=Number(document.getElementById("po-price-"+poId)?.value);
  const eta=document.getElementById("po-eta-"+poId)?.value||null;
  if(!(qty>0)){ showToast("Geçerli miktar.","red"); return; }
  if(!(price>0)){ showToast("Geçerli birim fiyat.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId);
    if(!po) return cur;
    if(["Teslim Alındı","İade Edildi","İptal"].includes(po.status)){ showToast("Bu PO güncellenemez.","red"); return cur; }
    const recv=Number(po.receivedQty)||0;
    if(qty<recv){ showToast("Miktar teslim alınanın ("+recv+") altında olamaz.","red"); return cur; }
    cur.purchaseOrders=cur.purchaseOrders.map(x=>{
      if(x.id!==poId) return x;
      return {...x, qty, unitPrice:price, total:qty*price, eta,
        history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:`Güncellendi: ${qty} × ${price}`}]};
    });
    // Bağlı PR miktar/fiyat senkron (opsiyonel)
    if(po.requestId){
      cur.requests=cur.requests.map(r=>r.id!==po.requestId?r:{...r, qty, unitPrice:price,
        history:[...(r.history||[]),{at:nowISO(),by:state.session.fullName,action:"PO üzerinden miktar/fiyat güncellendi"}]});
    }
    cur.audit.push(pushAudit("PO Güncellendi", po.no+" · "+qty+" × "+price));
    showToast("PO güncellendi.");
    return cur;
  });
}

function getRfqCompareOffers(rid){
  const offers=[];
  for(let n=1;n<=3;n++){
    const priceEl=document.querySelector('.rfq-cmp[data-rid="'+rid+'"][data-n="'+n+'"]');
    const price=Number(priceEl&&priceEl.value);
    const supplier=getRfqColSupplier(n);
    if(price>0) offers.push({n, price, supplier});
  }
  return offers;
}
function updateRfqBestCell(rid){
  const offers=getRfqCompareOffers(rid);
  const bestEl=document.getElementById("rfq-best-"+rid);
  if(!bestEl) return;
  if(!offers.length){ bestEl.textContent="—"; return; }
  const best=offers.reduce((a,b)=>b.price<a.price?b:a);
  bestEl.textContent=fmtTL(best.price)+(best.supplier?(" · "+best.supplier):"");
  bestEl.style.color="var(--green)";
  bestEl.dataset.price=String(best.price);
  bestEl.dataset.supplier=best.supplier||"";

function handleRfqTakeBest(rid){
  const offers=getRfqCompareOffers(rid);
  if(!offers.length){ showToast("Önce cari ve fiyat girin.","amber"); return; }
  const best=offers.reduce((a,b)=>b.price<a.price?b:a);
  if(!best.supplier){ showToast("En iyi teklifte cari seçili olmalı.","amber"); return; }
  // PO form alanlarını doldur (satın alma listesi)
  state.modal=null;
  state.tab="satinalma";
  state.saQuery="";
  render();
  setTimeout(()=>{
    const priceEl=document.getElementById("order-price-"+rid);
    const supEl=document.getElementById("order-supplier-"+rid);
    const etaEl=document.getElementById("order-eta-"+rid);
    if(priceEl) priceEl.value=String(best.price);
    if(supEl){
      // option yoksa ekle
      let found=false;
      for(const o of supEl.options){ if(o.value===best.supplier){ found=true; break; } }
      if(!found){ const o=document.createElement("option"); o.value=best.supplier; o.textContent=best.supplier; supEl.appendChild(o); }
      supEl.value=best.supplier;
    }
    if(etaEl && !etaEl.value) etaEl.value=(new Date()).toISOString().slice(0,10);
    // satırı görünür kıl
    const row=priceEl&&priceEl.closest(".card");
    if(row){ row.style.outline="1px solid var(--teal)"; row.scrollIntoView({behavior:"smooth",block:"center"}); }
    showToast("Alındı: "+best.supplier+" · "+fmtTL(best.price));
  }, 80);
}

function findSupplierByName(name){
  const n=String(name||"").trim().toLowerCase();
  if(!n) return null;
  return (state.data.suppliers||[]).find(s=>String(s.name||"").trim().toLowerCase()===n) || null;
}
function waPhoneDigits(phone){
  let d=String(phone||"").replace(/\D/g,"");
  if(!d) return "";
  // TR: 05xx → 905xx · 5xx → 905xx · 90 already ok
  if(d.startsWith("0") && d.length===11) d="9"+d;
  else if(d.length===10 && d.startsWith("5")) d="90"+d;
  return d;
}
function buildWoWaMessage(w, opts){
  const {reqType, machines, mNote, laborN, lNote}=opts;
  const coords=getCoordsForWO(w);
  const where=[w.location, w.equipment].filter(Boolean).join(", ");
  let msg="Merhaba,\n\n";
  msg += "Şurada bir iş var: " + (w.title||"") + (w.no ? " ("+w.no+")" : "") + ".\n";
  if(w.type) msg += w.type + " işi.\n";
  if(where) msg += "Yer: " + where + ".\n";
  if(coords) msg += "Konum: https://maps.google.com/?q=" + coords.lat + "," + coords.lng + "\n";
  msg += "\n";
  if(reqType==="machine"||reqType==="both"){
    if(machines && machines.length){
      msg += "Makine lazım: " + machines.join(", ");
      if(mNote) msg += " — " + mNote;
      msg += ".\n";
    } else if(mNote){
      msg += "Makine lazım: " + mNote + ".\n";
    } else {
      msg += "İş makinesi desteği gerekiyor.\n";
    }
  }
  if(reqType==="labor"||reqType==="both"){
    const n=laborN||2;
    msg += n + " kişilik işçi lazım";
    if(lNote) msg += " (" + lNote + ")";
    msg += ".\n";
  }
  msg += "\nUygun olursa haber verir misin?\n" + (state.session.fullName||"");
  return msg;
}
function isMobileDevice(){
  return /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent||"")
    || (window.matchMedia && window.matchMedia("(max-width: 900px)").matches && "ontouchstart" in window);
}
function openWhatsApp(phone, text){
  const link=whatsappLink(phone, text);
  if(!link) return false;
  // Mobil: aynı sekmede → WhatsApp uygulaması + sohbet
  if(isMobileDevice()){
    window.location.href=link;
    return true;
  }
  const a=document.createElement("a");
  a.href=link;
  a.target="_blank";
  a.rel="noopener noreferrer";
  document.body.appendChild(a);
  a.click();
  a.remove();
  return true;
}
function handleWoWaSend(woId){

  const machines=[...document.querySelectorAll(".wa-machine:checked")].map(x=>x.value);
  const mNote=(document.getElementById("wa-machine-note")?.value||"").trim();
  const laborN=Number(document.getElementById("wa-labor-n")?.value)||0;
  const lNote=(document.getElementById("wa-labor-note")?.value||"").trim();
  const body=buildWoWaMessage(w,{reqType,machines,mNote,laborN,lNote});
  const targets=[];
  if(to==="labor"||to==="both") targets.push({phone:co.laborForeman?.phone});
  if(to==="machine"||to==="both") targets.push({phone:co.machineForeman?.phone});
  const ok=targets.filter(x=>x.phone);
  if(!ok.length){ showToast("Formen telefonu Ayarlar’da tanımlı değil.","amber"); return; }
  state.modal=null;
  render();
  setTimeout(()=>{
    openWhatsApp(ok[0].phone, body);
    // Mobilde ikinci numara için yeni yönlendirme zor; sadece ilki
    if(ok[1] && !isMobileDevice()) setTimeout(()=>openWhatsApp(ok[1].phone, body), 1000);
  }, 50);
  showToast(isMobileDevice() ? "WhatsApp açılıyor…" : "WhatsApp Web açılıyor");

function whatsappLink(phone, text){
  const d=waPhoneDigits(phone);
  if(!d) return null;
  const q="?phone="+d+"&text="+encodeURIComponent(text||"");
  // Mobil → api.whatsapp.com / wa.me uygulama + numara
  if(isMobileDevice()) return "https://api.whatsapp.com/send"+q;
  // Masaüstü → Web
  return "https://web.whatsapp.com/send"+q;
}

function mapsLinkFromCoords(lat,lng){
  if(lat==null||lng==null||!Number.isFinite(Number(lat))||!Number.isFinite(Number(lng))) return "";
  return "https://maps.google.com/?q="+Number(lat)+","+Number(lng);
}
/** Muhataba gidecek detaylı iş emri WhatsApp metni */
function buildWoContactMessage(w){
  if(!w) return "";
  const lines=[];
  lines.push("Merhaba "+(w.contactName||"")+",");
  lines.push("");
  lines.push("📋 İş emri bilgilendirmesi");
  lines.push("——————————");
  lines.push("No: "+(w.no||"—"));
  lines.push("Başlık: "+(w.title||"—"));
  if(w.type) lines.push("Disiplin: "+w.type);
  if(w.status) lines.push("Durum: "+w.status);
  if(w.priority) lines.push("Öncelik: "+w.priority);
  if(w.equipment) lines.push("Ekipman: "+w.equipment);
  if(w.location) lines.push("Lokasyon: "+w.location);
  if(w.machine) lines.push("İş makinesi: "+w.machine+(w.machinePlate?" ("+w.machinePlate+")":""));
  const team=(w.team||[]).map(t=>t.name).filter(Boolean);
  if(team.length) lines.push("Ekip: "+team.join(", ")+" ("+team.length+" kişi)");
  else if(w.assigneeName) lines.push("Üstlenen: "+w.assigneeName);
  if(w.crewCount) lines.push("Personel sayısı: "+w.crewCount);
  if(w.description) lines.push("Açıklama: "+w.description);
  const coords=typeof getCoordsForWO==="function"?getCoordsForWO(w):null;
  if(coords){
    lines.push("Konum: "+Number(coords.lat).toFixed(6)+", "+Number(coords.lng).toFixed(6));
    lines.push("Harita: "+mapsLinkFromCoords(coords.lat, coords.lng));
  } else if(w.lat!=null && w.lng!=null){
    lines.push("Konum: "+Number(w.lat).toFixed(6)+", "+Number(w.lng).toFixed(6));
    lines.push("Harita: "+mapsLinkFromCoords(w.lat, w.lng));
  }
  lines.push("");
  lines.push("Gönderen: "+(state.session?.fullName||""));
  if(state.session?.phone) lines.push("Tel: "+state.session.phone);
  lines.push("Sabri Altan İşletme Sistemleri");
  return lines.join("\n");
}

function applyContactToEntity(entityType, entityId, contact){
  mutateData(cur=>{
    if(entityType==="wo"){
      cur.workOrders=(cur.workOrders||[]).map(w=>{
        if(w.id!==entityId) return w;
        return {
          ...w,
          contactUserId:contact?contact.contactUserId:null,
          contactName:contact?contact.contactName:null,
          contactPhone:contact?contact.contactPhone:null,
          history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:contact?("Muhatap: "+contact.contactName):"Muhatap kaldırıldı"}]
        };
      });
    } else if(entityType==="pr"){
      cur.requests=(cur.requests||[]).map(r=>{
        if(r.id!==entityId) return r;
        return {
          ...r,
          contactUserId:contact?contact.contactUserId:null,
          contactName:contact?contact.contactName:null,
          contactPhone:contact?contact.contactPhone:null,
          history:[...(r.history||[]),{at:nowISO(),by:state.session.fullName,action:contact?("Muhatap: "+contact.contactName):"Muhatap kaldırıldı"}]
        };
      });
    }
    cur.audit.push(pushAudit("Muhatap Güncellendi", (entityType||"")+" · "+(contact?.contactName||"kaldırıldı")));
    showToast(contact?"Muhatap güncellendi":"Muhatap kaldırıldı");
    return cur;
  });
}

function findStockRow(cur, key, name){
  return (cur.stock||[]).find(s=>(s.id&&s.id===key) || s.item===key || (name && s.item===name));
}
/** target: stock satırı veya ürün kartı; unitChoice birim uyuşmazlığında seçilen birim */
function handleStockMerge(opts){
  const { sourceKey, sourceName, targetKey, targetName, targetType, unitChoice } = opts||{};
  mutateData(cur=>{
    const other=findStockRow(cur, sourceKey, sourceName);
    if(!other){ showToast("Kaynak stok satırı bulunamadı.","amber"); return cur; }

    let keep=null;
    let targetProduct=null;
    if(targetType==="product" || String(targetKey||"").startsWith("prod:")){
      const pid=String(targetKey||"").replace(/^prod:/,"");
      targetProduct=(cur.products||[]).find(p=>p.id===pid) || (cur.products||[]).find(p=>foldTR(p.name)===foldTR(targetName||""));
      if(!targetProduct){ showToast("Ürün kartı bulunamadı.","amber"); return cur; }
      // Aynı isimli stok var mı?
      keep=findStockRow(cur, null, targetProduct.name) || (cur.stock||[]).find(s=>foldTR(s.item)===foldTR(targetProduct.name));
      if(!keep){
        keep={ id:uid(), item:targetProduct.name, category:targetProduct.category||other.category||"", unit:unitChoice||targetProduct.unit||other.unit||"Adet", qty:0, minLevel:targetProduct.minLevel||0 };
        cur.stock.push(keep);
      }
    } else {
      keep=findStockRow(cur, targetKey, targetName);
      if(!keep){ showToast("Hedef stok satırı bulunamadı.","amber"); return cur; }
    }

    if(keep===other || (keep.id && other.id && keep.id===other.id)){
      showToast("Kaynak ve hedef aynı satır olamaz.","amber"); return cur;
    }

    const unitSrc=String(other.unit||"").trim();
    const unitTgt=String(keep.unit||"").trim();
    const finalUnit = unitChoice || unitTgt || unitSrc || "Adet";

    // Birimler farklı ve kullanıcı seçmediyse engelle
    if(unitSrc && unitTgt && foldTR(unitSrc)!==foldTR(unitTgt) && !unitChoice){
      showToast("Birimler uyuşmuyor ("+unitSrc+" ≠ "+unitTgt+"). Hangi birimin kullanılacağını seçin.","amber");
      return cur;
    }

    const add=Number(other.qty)||0;
    keep.qty=(Number(keep.qty)||0)+add;
    keep.unit=finalUnit;
    keep.item = targetProduct ? targetProduct.name : keep.item; // ürün kartı ismine sabitle
    if(!keep.category && (other.category||targetProduct?.category)) keep.category=other.category||targetProduct.category;
    if((keep.minLevel==null||keep.minLevel==="") && targetProduct?.minLevel!=null) keep.minLevel=targetProduct.minLevel;
    else if((keep.minLevel==null||keep.minLevel==="") && other.minLevel!=null) keep.minLevel=other.minLevel;

    cur.stock=cur.stock.filter(s=>s!==other);
    // Kaynak ile aynı id kalmasın
    cur.stock=cur.stock.map(s=>s===keep?keep:s);

    cur.movements.push({id:uid(), at:nowISO(), type:"Birleşim", item:keep.item, qty:add, unit:finalUnit, ref:"MERGE", note:"← "+other.item+(unitSrc!==finalUnit?" · birim:"+unitSrc+"→"+finalUnit:""), by:state.session.fullName});
    cur.audit.push(pushAudit("Stok Birleştirme", other.item+" → "+keep.item+" (+"+add+" "+finalUnit+")"));
    showToast("Birleştirildi: "+keep.item+" (+"+add+" "+finalUnit+")");
    return cur;
  });
}
function refreshMergeUnitUI(){
  const fromEl=document.getElementById("merge-from");
  const keepEl=document.getElementById("merge-keep");
  const box=document.getElementById("merge-unit-box");
  const unitEl=document.getElementById("merge-unit");
  const hint=document.getElementById("merge-unit-hint");
  if(!fromEl||!keepEl||!box||!unitEl) return;
  const fo=fromEl.selectedOptions[0];
  const ko=keepEl.selectedOptions[0];
  if(!fo||!fo.value||!ko||!ko.value){
    box.style.display="none";
    if(hint) hint.style.display="none";
    return;
  }
  const u1=(fo.dataset.unit||"").trim();
  const u2=(ko.dataset.unit||"").trim();
  if(u1 && u2 && foldTR(u1)!==foldTR(u2)){
    box.style.display="";
    if(hint){
      hint.style.display="";
      hint.textContent="Birimler farklı: kaynak «"+u1+"» · hedef «"+u2+"». Kullanılacak birimi seçin.";
    }
    const units=[...new Set([u1,u2,...(typeof UNITS!=="undefined"?UNITS:[])])];
    unitEl.innerHTML=units.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join("");
    unitEl.value=u2||u1; // varsayılan hedef birimi
  } else {
    box.style.display="none";
    if(hint) hint.style.display="none";
  }
}
function handleBulkGRReceive(supplier, irsNo){
  const pos=(state.data.purchaseOrders||[]).filter(p=>(p.supplier||"")==supplier && (p.status==="Sipariş Verildi"||p.status==="Kısmi Teslim"));
  if(!pos.length){ showToast("Kalem yok.","amber"); return; }
  mutateData(cur=>{
    let n=0;
    pos.forEach(po0=>{
      const idx=cur.purchaseOrders.findIndex(x=>x.id===po0.id);
      if(idx<0) return;
      const po=cur.purchaseOrders[idx];
      const ordered=Number(po.qty)||0;
      const recv=Number(po.receivedQty)||0;
      const left=Math.max(0, ordered-recv);
      if(left<=0) return;
      const qty=left;
      const grC=(cur.counters.gr||0)+1; const grNo="GR-"+String(grC).padStart(5,"0"); cur.counters.gr=grC;
      po.receivedQty=recv+qty;
      po.lastIrsaliyeNo=irsNo;
      if(po.receivedQty>=ordered) po.status="Teslim Alındı";
      else po.status="Kısmi Teslim";
      cur.goodsReceipts.push({id:uid(), no:grNo, poId:po.id, poNo:po.no, item:po.item, qty, unit:po.unit, supplier:po.supplier, irsaliyeNo:irsNo, at:nowISO(), by:state.session.fullName});
      // stock
      let st=cur.stock.find(s=>s.item===po.item);
      if(st) st.qty=Number(st.qty||0)+qty;
      else cur.stock.push({id:uid(), item:po.item, category:po.category||"Diğer", unit:po.unit||"Adet", qty, minLevel:0});
      cur.movements.push({id:uid(), at:nowISO(), type:"Giriş", item:po.item, qty, unit:po.unit, ref:grNo, note:irsNo, by:state.session.fullName});
      cur.audit.push(pushAudit("Toplu GRN", grNo+" · "+po.no+" · +"+qty+" · "+irsNo));
      n++;
    });
    showToast(n? (n+" kalem GRN · "+irsNo) : "İşlenecek kalan yok", n?"green":"amber");
    return cur;
  });
}
function handleGRReceive(poId){
  const irs=document.getElementById("gr-irs-"+poId)?.value.trim();
  const qty=Number(document.getElementById("gr-qty-"+poId)?.value);
  const note=document.getElementById("gr-note-"+poId)?.value.trim();
  if(!irs){ showToast("İrsaliye no zorunlu.","red"); return; }
  if(!qty||qty<=0){ showToast("Geçerli miktar.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    const ordered=Number(po.qty)||0;
    const prevRecv=Number(po.receivedQty)||0;
    const remaining=Math.max(0, ordered-prevRecv);
    if(qty>remaining+1e-9){ showToast(`Kalan miktar ${remaining} ${po.unit}. Daha fazla giremezsiniz.`,"red"); return cur; }

    const grC=(cur.counters.gr||0)+1; const grNo="GR-"+String(grC).padStart(5,"0"); cur.counters.gr=grC;
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===po.item.toLowerCase()&&s.unit===po.unit);
    const prod=cur.products.find(p=>p.name.toLowerCase()===po.item.toLowerCase());
    if(idx>=0) stock[idx]={...stock[idx],qty:Number(stock[idx].qty)+qty};
    else stock.push({id:uid(),item:po.item,category:po.category,unit:po.unit,qty,minLevel:prod?.minLevel||0});

    const newRecv=prevRecv+qty;
    const full=newRecv>=ordered-1e-9;
    const left=Math.max(0, ordered-newRecv);

    cur.movements.push({id:uid(),at:nowISO(),type:"GRN Giriş",item:po.item,qty,unit:po.unit,ref:grNo+" / "+po.no,by:state.session.fullName});
    cur.goodsReceipts.push({
      id:uid(), no:grNo, poId:po.id, poNo:po.no, requestNo:po.requestNo,
      item:po.item, qty, unit:po.unit, supplier:po.supplier, irsaliyeNo:irs, note,
      orderedQty:ordered, receivedTotal:newRecv, remaining:left,
      at:nowISO(), by:state.session.fullName
    });

    // İrsaliye girilince faturalanabilir hale gelir (kısmi veya tam)
    cur.purchaseOrders=cur.purchaseOrders.map(x=>{
      if(x.id!==poId) return x;
      return {
        ...x,
        status: full ? "Teslim Alındı" : "Kısmi Teslim",
        receivedQty: newRecv,
        remainingQty: left,
        lastIrsaliyeNo: irs,
        lastGrNo: grNo,
        invoiceEligible: true,
        uninvoicedQty: Math.max(0, newRecv - (Number(x.invoicedQty)||0))
      };
    });
    cur.requests=cur.requests.map(x=>x.id===po.requestId?{
      ...x,
      status: full ? "Teslim Alındı" : (x.status==="PO Oluşturuldu"||x.status==="Sipariş Verildi"||x.status==="Kısmi Teslim" ? "Kısmi Teslim" : x.status),
      irsaliyeNo: irs, grNo,
      receivedQty: newRecv, remainingQty: left,
      history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:`GRN ${grNo}: +${qty} · kalan ${left} ${po.unit} · ${po.no}`}]
    }:x);
    cur.stock=stock;
    // Bağlı iş emri Malzeme Bekliyor ise bildirim
    const req=cur.requests.find(r=>r.id===po.requestId);
    if(req && req.workOrderId){
      const wo=cur.workOrders.find(w=>w.id===req.workOrderId);
      if(wo && wo.status==="Malzeme Bekliyor"){
        cur.notifications=(cur.notifications||[]);
        cur.notifications.unshift({id:uid(), at:nowISO(), type:"malzeme", title:"Malzeme geldi",
          body:(po.item||"")+" · "+qty+" "+(po.unit||"")+" stoka girdi · WO "+(wo.no||""),
          workOrderId:wo.id, read:false});
        // Otomatik durum değiştirme: malzeme geldi → saha devam edebilir (sadece bu WO)
        // İş kuralı: otomatik "Devam Ediyor" — ekip malzeme beklemesin
        cur.workOrders=cur.workOrders.map(w=>{
          if(w.id!==wo.id) return w;
          return {...w, status:"Devam Ediyor",
            history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"Malzeme GRN ile geldi → Devam Ediyor"}]};
        });
      }
    }
    cur.audit.push(pushAudit("GRN", `${grNo} · ${po.no} · +${qty} · kalan ${left}`));
    showToast(full ? `${grNo} tam teslim · fatura ekranına düştü` : `${grNo} kısmi · kalan ${left} ${po.unit} · fatura ekranına düştü`);
    return cur;
  });
}
function reverseGRN(grId){
  if(!["admin","yonetici","depo"].includes(state.session.role)){ showToast("Yetkiniz yok.","red"); return; }
  if(!confirm("Bu teslim alma ters kayıt edilecek (stok düşer). Emin misiniz?")) return;
  mutateData(cur=>{
    const gr=(cur.goodsReceipts||[]).find(g=>g.id===grId);
    if(!gr || gr.reversed){ showToast("Kayıt yok veya zaten ters.","amber"); return cur; }
    const qty=Number(gr.qty)||0;
    const po=cur.purchaseOrders.find(x=>x.id===gr.poId);
    if(po){
      const newRecv=Math.max(0,(Number(po.receivedQty)||0)-qty);
      const invd=Number(po.invoicedQty)||0;
      // ERP kuralı: faturalanan miktarın altına düşülemez
      if(newRecv+1e-9 < invd){
        showToast("Bu teslimat kısmen/tam faturalandı (faturalanan "+invd+"). Önce faturayı iptal edin.","red");
        return cur;
      }
    }
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===String(gr.item).toLowerCase()&&s.unit===gr.unit);
    if(idx>=0){
      const nq=Number(stock[idx].qty)-qty;
      if(nq<-1e-9){ showToast("Stok yetersiz, ters kayıt yapılamaz.","red"); return cur; }
      stock[idx]={...stock[idx], qty:Math.max(0,nq)};
    }
    gr.reversed=true; gr.reversedAt=nowISO(); gr.reversedBy=state.session.fullName;
    if(po){
      const newRecv=Math.max(0,(Number(po.receivedQty)||0)-qty);
      const ordered=Number(po.qty)||0;
      po.receivedQty=newRecv;
      po.remainingQty=Math.max(0,ordered-newRecv);
      po.uninvoicedQty=Math.max(0,newRecv-(Number(po.invoicedQty)||0));
      if(newRecv<=1e-9){ po.status="Sipariş Verildi"; po.invoiceEligible=false; }
      else if(newRecv<ordered-1e-9){ po.status="Kısmi Teslim"; po.invoiceEligible=true; }
      else { po.status="Teslim Alındı"; po.invoiceEligible=true; }
      // PR durumunu senkronla
      if(po.requestId){
        cur.requests=cur.requests.map(r=>{
          if(r.id!==po.requestId) return r;
          let st=r.status;
          if(newRecv<=1e-9) st="PO Oluşturuldu";
          else if(newRecv<ordered-1e-9) st="Kısmi Teslim";
          else st="Teslim Alındı";
          return {...r, status:st, receivedQty:newRecv, remainingQty:Math.max(0,ordered-newRecv),
            history:[...(r.history||[]),{at:nowISO(),by:state.session.fullName,action:"GRN ters: -"+qty}]};
        });
      }
    }
    cur.stock=stock;
    cur.movements.push({id:uid(),at:nowISO(),type:"GRN Ters",item:gr.item,qty:-qty,unit:gr.unit,ref:(gr.no||"")+" TERS",by:state.session.fullName});
    cur.audit.push(pushAudit("GRN Ters Kayıt", (gr.no||grId)+" · -"+qty));
    showToast("Ters kayıt yapıldı · stok ve PO güncellendi");
    return cur;
  });
}
function reverseFieldLog(logId){

  mutateData(cur=>{
    const log=(cur.fieldLogs||[]).find(x=>x.id===logId);
    if(!log || log.reversed){ showToast("Kayıt yok veya zaten ters.","amber"); return cur; }
    const qty=Number(log.qty)||0;
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===String(log.item).toLowerCase()&&s.unit===log.unit);
    if(idx>=0) stock[idx]={...stock[idx], qty:Number(stock[idx].qty)+qty};
    else stock.push({id:uid(),item:log.item,unit:log.unit,qty,category:"",minLevel:0});

    cur.audit.push(pushAudit("Saha Çıkış Ters", log.item+" · +"+qty));
    showToast("Stoka iade edildi");
    return cur;
  });
}
function handleGRReturn(poId){
  const reason=document.getElementById("gr-note-"+poId)?.value.trim();
  if(!reason){ showToast("İade gerekçesi zorunlu.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    cur.purchaseOrders=cur.purchaseOrders.map(x=>x.id===poId?{...x,status:"İade Edildi",returnReason:reason}:x);
    cur.requests=cur.requests.map(x=>x.id===po.requestId?{...x,status:"İade Edildi",returnReason:reason,history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"İade: "+reason}]}:x);
    cur.audit.push(pushAudit("PO İade", po.no+" · "+reason));
    showToast("İade kaydedildi.","red"); return cur;
  });
}

function calculateSupplierBalance(name){
  const inv=state.data.invoices.filter(i=>i.supplier===name&&i.status==="Onaylandı"&&!i.isReturn).reduce((s,i)=>s+Number(i.total||0),0);
  const ret=state.data.invoices.filter(i=>i.supplier===name&&(i.isReturn||i.status==="İade Faturası")).reduce((s,i)=>s+Number(i.total||0),0);
  const paid=state.data.payments.filter(p=>p.supplier===name&&p.status==="Ödendi"&&!p.reversed).reduce((s,p)=>s+Number(p.amount||0),0);
  return {invTotal:inv, returnTotal:ret, paidTotal:paid, balance:inv-ret-paid};
}
/** Cari hesap özeti: tarih sırası borç (+) / alacak (−) */
function buildCariLedger(name, dateFrom, dateTo){
  const rows=[];
  const inRange=d=>{
    if(!d) return true;
    const day=String(d).slice(0,10);
    if(dateFrom && day<dateFrom) return false;
    if(dateTo && day>dateTo) return false;
    return true;
  };
  // Sipariş (bilgi — bakiyeye etki etmez, amount 0)
  (state.data.purchaseOrders||[]).filter(p=>p.supplier===name).forEach(p=>{
    const d=p.orderedAt||p.date||p.createdAt;
    if(!inRange(d)) return;
    rows.push({date:d, type:"Sipariş", ref:p.no, desc:(p.item||"")+" × "+(p.qty||"")+" "+(p.unit||""), debit:0, credit:0, info:true, amount:0});
  });
  // Teslimat / irsaliye
  (state.data.goodsReceipts||[]).forEach(g=>{
    const po=(state.data.purchaseOrders||[]).find(x=>x.id===g.poId);
    if(!po || po.supplier!==name) return;
    const d=g.date||g.at;
    if(!inRange(d)) return;
    rows.push({date:d, type:"Teslimat", ref:g.irsaliyeNo||g.no||po.no, desc:(g.item||po.item||"")+" · "+(g.qty||"")+" "+(g.unit||po.unit||""), debit:0, credit:0, info:true, amount:0});
  });
  // Faturalar + iade faturaları (cari alacak)
  (state.data.invoices||[]).filter(i=>i.supplier===name).forEach(i=>{
    if(!inRange(i.date)) return;
    const amt=Math.abs(Number(i.total)||0);
    if(i.isReturn || i.status==="İade Faturası"){
      rows.push({date:i.date, type:"İade Fatura", ref:i.no, desc:(i.item||"")+(i.reason?" · "+i.reason:""), debit:0, credit:amt, amount:-amt});
    } else if(i.status==="Onaylandı"){
      rows.push({date:i.date, type:"Fatura", ref:i.no, desc:(i.item||"")+(i.partial?" (parçalı)":""), debit:amt, credit:0, amount:amt});
    } else if(i.status==="Fiyat Uyuşmuyor"){
      rows.push({date:i.date, type:"Uyuşmazlık", ref:i.no, desc:(i.item||"")+" · beklenen "+fmtTL(i.expected||0), debit:0, credit:0, info:true, amount:0});
    }
  });
  // Depo iade irsaliyeleri (bilgi)
  (state.data.returnShipments||[]).filter(r=>r.supplier===name).forEach(r=>{
    const d=r.at||r.date;
    if(!inRange(d)) return;
    const desc=(r.lines||[]).map(l=>l.item+" × "+l.qty).join(", ")||r.reason||"";
    rows.push({date:d, type:"İade İrsaliye", ref:r.irsaliyeNo||r.no, desc:desc+(r.status?" · "+r.status:""), debit:0, credit:0, info:true, amount:0});
  });
  // Ödemeler
  (state.data.payments||[]).filter(p=>p.supplier===name).forEach(p=>{
    const d=p.paidDate||p.date;
    if(!inRange(d)) return;
    const amt=Number(p.amount)||0;
    if(p.status==="Ödendi"){
      rows.push({date:d, type:"Ödeme", ref:p.invoiceNo||p.poNo||"", desc:(p.method||"Ödeme")+(p.refNo?" · "+p.refNo:""), debit:0, credit:amt, amount:-amt});
    } else if(p.status==="Ödeme Bekliyor"){
      rows.push({date:d, type:"Ödeme bekliyor", ref:p.invoiceNo||"", desc:"Henüz ödenmedi", debit:0, credit:0, info:true, amount:0});
    }
  });
  // Satış (cari müşteri olarak)
  (state.data.sales||[]).filter(s=>foldTR(s.customer||"")===foldTR(name)).forEach(s=>{
    if(!inRange(s.date||s.at)) return;
    const amt=Number(s.amount)||0;
    rows.push({date:s.date||s.at, type:"Satış", ref:s.no||"", desc:s.item||s.desc||"", debit:0, credit:amt, amount:-amt});
  });
  rows.sort((a,b)=>new Date(a.date||0)-new Date(b.date||0) || String(a.ref).localeCompare(String(b.ref)));
  let running=0;
  rows.forEach(r=>{
    running += (Number(r.debit)||0) - (Number(r.credit)||0);
    r.balance=running;
  });
  const debitSum=rows.reduce((s,r)=>s+(Number(r.debit)||0),0);
  const creditSum=rows.reduce((s,r)=>s+(Number(r.credit)||0),0);
  return { rows, debitSum, creditSum, balance:debitSum-creditSum };
}
function exportCariEkstre(name){
  const from=document.getElementById("ekstre-from")?.value||"";
  const to=document.getElementById("ekstre-to")?.value||"";
  const {rows, debitSum, creditSum, balance}=buildCariLedger(name, from, to);
  const headers=["Tarih","Tip","Belge No","Açıklama","Borç","Alacak","Bakiye"];
  const data=rows.map(r=>[
    r.date?String(r.date).slice(0,16).replace("T"," "):"",
    r.type, r.ref||"", r.desc||"",
    Number(r.debit)||0, Number(r.credit)||0, Number(r.balance)||0
  ]);
  data.push(["","","","TOPLAM", debitSum, creditSum, balance]);
  const safe=(name||"cari").replace(/[^\w\u00C0-\u024f]+/g,"_").slice(0,40);
  exportToXLSX("Cari_Ekstre_"+safe+(from?"_"+from:"")+(to?"_"+to:""), "Ekstre", headers, data);
  showToast("Ekstre Excel indirildi");
}

function handleSubSave(editId){
  const name=(document.getElementById("sub-name")?.value||"").trim();
  const type=document.getElementById("sub-type")?.value||"Diğer";
  const contact=(document.getElementById("sub-contact")?.value||"").trim();
  const phone=(document.getElementById("sub-phone")?.value||"").trim();
  const note=(document.getElementById("sub-note")?.value||"").trim();
  if(!name){ showToast("Taşeron adı zorunlu.","red"); return; }
  mutateData(cur=>{
    if(!Array.isArray(cur.subcontractors)) cur.subcontractors=[];
    if(editId){
      const s=cur.subcontractors.find(x=>x.id===editId);
      if(s){ s.name=name; s.type=type; s.contact=contact; s.phone=phone; s.note=note; }
      cur.audit.push(pushAudit("Taşeron Güncellendi", name+" · "+type));
    } else {
      const c=(cur.counters.sub||0)+1; cur.counters.sub=c;
      cur.subcontractors.push({id:uid(), no:"TAS-"+String(c).padStart(4,"0"), name, type, contact, phone, note, active:true, createdAt:nowISO()});
      cur.audit.push(pushAudit("Taşeron Eklendi", name+" · "+type));
    }
    showToast(editId?"Güncellendi":"Taşeron eklendi");
    return cur;
  });
  state.modal=null;
}
function handleSubDaySave(subId){
  const day=state.subDay||todayISODate();
  const el=document.getElementById("sub-hc-"+subId);
  const hc=Math.max(0, Number(el?.value)||0);
  mutateData(cur=>{
    if(!Array.isArray(cur.subcontractorDaily)) cur.subcontractorDaily=[];
    const sub=cur.subcontractors.find(x=>x.id===subId);
    let row=cur.subcontractorDaily.find(x=>x.date===day && x.subId===subId);
    if(row){ row.headcount=hc; row.by=state.session.fullName; row.at=nowISO(); }
    else cur.subcontractorDaily.push({id:uid(), date:day, subId, headcount:hc, by:state.session.fullName, at:nowISO(), note:""});
    cur.audit.push(pushAudit("Taşeron Personel", (sub?.name||subId)+" · "+day+" · "+hc+" kişi"));
    showToast("Kayıt: "+hc+" kişi");
    return cur;
  });
}
function handleSubBulkSave(){
  const day=state.subDay||todayISODate();
  const inputs=[...document.querySelectorAll(".sub-bulk-hc")];
  if(!inputs.length) return;
  mutateData(cur=>{
    if(!Array.isArray(cur.subcontractorDaily)) cur.subcontractorDaily=[];
    inputs.forEach(inp=>{
      const subId=inp.dataset.id;
      const hc=Math.max(0, Number(inp.value)||0);
      let row=cur.subcontractorDaily.find(x=>x.date===day && x.subId===subId);
      if(row){ row.headcount=hc; row.by=state.session.fullName; row.at=nowISO(); }
      else cur.subcontractorDaily.push({id:uid(), date:day, subId, headcount:hc, by:state.session.fullName, at:nowISO(), note:""});
    });
    const total=cur.subcontractorDaily.filter(x=>x.date===day).reduce((s,x)=>s+(Number(x.headcount)||0),0);
    cur.audit.push(pushAudit("Taşeron Toplu Gün", day+" · toplam "+total+" kişi"));
    showToast("Gün kaydı: "+total+" kişi saha");
    return cur;
  });
}

function calcInvoiceExpected(poId, fromDisc){
  const qty=Number(document.getElementById("inv-qty-"+poId)?.value)||0;
  const invPrice=Number(document.getElementById("inv-price-"+poId)?.value)||0;
  const poPrice=Number(document.getElementById("pv-po-unit-"+poId)?.textContent)||invPrice;
  const kdv=Number(document.getElementById("inv-kdv-"+poId)?.value)||0;
  const discPctEl=document.getElementById("inv-disc-pct-"+poId);
  const discAmtEl=document.getElementById("inv-disc-amt-"+poId);
  let discPct=Number(discPctEl?.value)||0;
  let discAmt=Number(discAmtEl?.value)||0;
  // Fatura bedeli: girilen birim fiyat × miktar (yoksa PO fiyatı)
  const unit=invPrice>0?invPrice:poPrice;
  const brut=qty*unit;
  if(fromDisc==="pct"){
    discAmt=brut*(discPct/100);
    if(discAmtEl && document.activeElement!==discAmtEl) discAmtEl.value=discAmt?Number(discAmt.toFixed(2)):"";
  } else if(fromDisc==="amt"){
    discPct=brut>0?(discAmt/brut)*100:0;
    if(discPctEl && document.activeElement!==discPctEl) discPctEl.value=discPct?Number(discPct.toFixed(2)):"";
  } else if(discPct>0 && !(discAmt>0)) discAmt=brut*(discPct/100);
  else if(discAmt>0 && !(discPct>0) && brut>0) discPct=(discAmt/brut)*100;
  if(discAmt>brut) discAmt=brut;
  const net=Math.max(0, brut-discAmt);
  const expected=net*(1+kdv/100);
  return { qty, unit, poPrice, invPrice, kdv, discPct, discAmt, brut, net, expected };
}
function updateInvoicePreview(poId, fromDisc){
  const c=calcInvoiceExpected(poId, fromDisc);
  if(!c) return;
  const totalEl=document.getElementById("inv-total-"+poId);
  const set=(id,v)=>{ const e=document.getElementById(id+"-"+poId); if(e) e.textContent=v; };
  set("pv-gross", fmtTL(c.brut));
  set("pv-disc", c.discAmt?fmtTL(c.discAmt):"—");
  set("pv-base", fmtTL(c.net));
  set("pv-kdv", fmtTL(c.net*(c.kdv/100)));
  set("pv-total", fmtTL(c.expected));
  // Fatura bedeli otomatik — kullanıcı total alanında değilken veya her hesapta güncelle
  if(totalEl && document.activeElement!==totalEl){
    totalEl.value = c.expected>0 ? Number(c.expected.toFixed(2)) : "";
  }
  const diffEl=document.getElementById("pv-diff-"+poId);
  if(diffEl){
    const invT=Number(totalEl?.value);
    if(!totalEl?.value && !(c.expected>0)){ diffEl.textContent="Miktar / birim fiyat girin"; diffEl.style.color="var(--text-mute)"; }
    else {
      const base=c.qty*(c.poPrice||c.unit);
      let dAmt=c.discAmt, dPct=c.discPct;
      if(dPct>0 && !(dAmt>0)) dAmt=base*(dPct/100);
      const netPo=Math.max(0, base-dAmt);
      const expectedPo=netPo*(1+c.kdv/100);
      const diff=invT-expectedPo;
      if(Math.abs(diff)<=0.5){ diffEl.textContent="✓ PO ile uyumlu · bedel "+fmtTL(invT); diffEl.style.color="var(--green)"; }
      else { diffEl.textContent="⚠ PO beklenen "+fmtTL(expectedPo)+" · fatura "+fmtTL(invT)+" · fark "+fmtTL(diff); diffEl.style.color="var(--red)"; }
    }
  }
}
function refreshAllInvoicePreviews(){
  document.querySelectorAll("[id^=inv-price-]").forEach(el=>{
    const id=el.id.replace("inv-price-","");
    if(id) updateInvoicePreview(id);
  });
}

function handleInvoiceMatch(poId){
  const invNo=document.getElementById("inv-no-"+poId)?.value.trim();
  let total=Number(document.getElementById("inv-total-"+poId)?.value);
  const kdv=document.getElementById("inv-kdv-"+poId)?.value;
  const unitPrice=Number(document.getElementById("inv-price-"+poId)?.value);
  let discPct=Number(document.getElementById("inv-disc-pct-"+poId)?.value)||0;
  let discAmt=Number(document.getElementById("inv-disc-amt-"+poId)?.value)||0;
  if(!invNo){ showToast("Fatura no zorunlu.","red"); return; }
  if(!total||total<=0){
    updateInvoicePreview(poId);
    total=Number(document.getElementById("inv-total-"+poId)?.value);
  }
  if(!total||total<=0){ showToast("Fatura bedeli hesaplanamadı.","red"); return; }

  const qtyInput=Number(document.getElementById("inv-qty-"+poId)?.value);
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    const maxBill=Math.max(0, (Number(po.receivedQty)||0) - (Number(po.invoicedQty)||0));
    let billQty=qtyInput>0 ? qtyInput : maxBill;
    if(billQty>maxBill) billQty=maxBill;
    if(billQty<=0){ showToast("Faturalanacak teslim miktarı yok.","red"); return cur; }
    const poPrice=Number(po.unitPrice)||0;
    const invUnit=unitPrice||poPrice;
    const brut=poPrice*billQty;
    if(discPct>0 && !(discAmt>0)) discAmt=brut*(discPct/100);
    if(discAmt>0 && !(discPct>0) && brut>0) discPct=(discAmt/brut)*100;
    if(discAmt>brut) discAmt=brut;
    const netBase=Math.max(0, brut-discAmt);
    const expectedWithKdv=netBase*(1+Number(kdv)/100);
    const match=Math.abs(total-expectedWithKdv)<=0.5;
    const price=invUnit;
    const priceDiff=Math.abs(invUnit-poPrice);
    const invC=(cur.counters.inv||0)+1; const invId="INV-"+String(invC).padStart(5,"0"); cur.counters.inv=invC;
    const partial=billQty+1e-9 < maxBill;

    if(match){
      cur.invoices.push({id:uid(),no:invNo,systemNo:invId,poId:po.id,poNo:po.no,requestNo:po.requestNo,
        item:po.item,qty:billQty,unit:po.unit,supplier:po.supplier,kdv,total,unitPrice:price,
        discountPct:discPct, discountAmt:discAmt, netBase, gross:brut,
        status:"Onaylandı",date:nowISO(),matchedBy:state.session.fullName, partial:!!partial});
      cur.payments.push({id:uid(),invoiceNo:invNo,requestNo:po.requestNo,poNo:po.no,supplier:po.supplier,
        amount:total,status:"Ödeme Bekliyor",date:nowISO()});
      cur.purchaseOrders=cur.purchaseOrders.map(x=>{
        if(x.id!==poId) return x;
        const invd=(Number(x.invoicedQty)||0)+billQty;
        return {...x, invoicedQty:invd, uninvoicedQty:Math.max(0,(Number(x.receivedQty)||0)-invd)};
      });
      cur.audit.push(pushAudit("3-Way Match OK", invNo+" · "+po.no+" · qty "+billQty+(partial?" (parçalı)":"")));
      showToast(partial ? "Parçalı fatura onaylandı. Kalan sonra faturalanır." : "Eşleşme başarılı. Ödeme listesine eklendi.");
    } else {
      cur.invoices.push({id:uid(),no:invNo,systemNo:invId,poId:po.id,poNo:po.no,requestNo:po.requestNo,
        item:po.item,qty:billQty,supplier:po.supplier,kdv,total,unitPrice:price,
        discountPct:discPct, discountAmt:discAmt, netBase, gross:brut,
        status:"Fiyat Uyuşmuyor",date:nowISO(),expected:expectedWithKdv,note:"Fatura "+total.toFixed(2)+" ≠ beklenen "+expectedWithKdv.toFixed(2)+(priceDiff>0.009?" · birim farkı":"")});
      cur.audit.push(pushAudit("Fatura Uyuşmazlık", invNo+" · beklenen "+expectedWithKdv.toFixed(2)));
      showToast(`Uyuşmazlık: Fatura ${fmtTL(total)} ≠ Beklenen ${fmtTL(expectedWithKdv)}`,"red");
    }
    return cur;
  });
}
function handleInvoiceReject(poId){
  const reason=prompt("İptal gerekçesi:");
  if(reason===null||!reason.trim()){ showToast("Gerekçe zorunlu.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    cur.purchaseOrders=cur.purchaseOrders.map(x=>x.id===poId?{...x,status:"İptal",cancelReason:reason}:x);
    cur.requests=cur.requests.map(x=>x.id===po.requestId?{...x,status:"İptal",cancelReason:reason,history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"İptal: "+reason}]}:x);
    cur.audit.push(pushAudit("PO/Fatura İptal", po.no+" · "+reason));
    showToast("İptal edildi.","red"); return cur;
  });
}

function handleReversePayment(payId){
  if(!["admin","yonetici","muhasebe"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  if(!confirm("Bu ödemeyi ters kayıt edilsin mi?\\nDurum tekrar «Ödeme Bekliyor» olur. Hatalı ödeme için kullanın.")) return;
  mutateData(cur=>{
    const p=(cur.payments||[]).find(x=>x.id===payId);
    if(!p){ showToast("Ödeme yok.","red"); return cur; }
    if(p.reversed){ showToast("Zaten ters.","amber"); return cur; }
    if(p.status!=="Ödendi"){ showToast("Sadece ödenmiş kayıt terslenebilir.","amber"); return cur; }
    p.reversed=true;
    p.reversedAt=nowISO();
    p.reversedBy=state.session.fullName;
    p.prevStatus="Ödendi";
    p.prevMethod=p.method;
    p.prevMethodDetails=p.methodDetails;
    p.status="Ödeme Bekliyor";
    p.method="";
    p.methodDetails="";
    p.paidDate=null;
    cur.audit.push(pushAudit("Ödeme Ters Kayıt", (p.invoiceNo||p.id)+" · "+fmtTL(p.amount)));
    showToast("Ödeme ters kayıt edildi — tekrar ödenebilir");
    return cur;
  });
}

function handleReturnShipSubmit(){
  if(!["admin","depo","yonetici"].includes(state.session?.role)){ showToast("Depo yetkiniz yok.","red"); return; }
  const supplier=(document.getElementById("rs-supplier")?.value||"").trim();
  const irs=(document.getElementById("rs-irs")?.value||"").trim();
  const reason=(document.getElementById("rs-reason")?.value||"").trim();
  if(!supplier||!irs||!reason){ showToast("Cari, irsaliye no ve gerekçe zorunlu.","red"); return; }
  const checks=[...document.querySelectorAll(".rs-chk:checked")];
  if(!checks.length){ showToast("En az bir stok kalemi seçin.","amber"); return; }
  const lines=[];
  for(const chk of checks){
    const item=chk.dataset.item, unit=chk.dataset.unit||"Adet";
    const q=Number(document.querySelector('.rs-qty[data-item="'+item+'"]')?.value);
    if(!(q>0)){ showToast("Miktar girin: "+item,"amber"); return; }
    lines.push({ item, unit, qty:q, stockId:chk.dataset.id||null });
  }
  let ship=null;
  mutateData(cur=>{
    cur.returnShipments=cur.returnShipments||[];
    // stok düş
    for(const l of lines){
      let st=cur.stock.find(s=>(l.stockId&&s.id===l.stockId) || (foldTR(s.item)===foldTR(l.item) && s.unit===l.unit));
      if(!st) st=cur.stock.find(s=>foldTR(s.item)===foldTR(l.item));
      if(!st || Number(st.qty)<l.qty-1e-9){ showToast("Yetersiz stok: "+l.item,"red"); return cur; }
      st.qty=Number(st.qty)-l.qty;
      cur.movements.push({id:uid(),at:nowISO(),type:"İade İrsaliye",item:l.item,qty:-l.qty,unit:l.unit,ref:irs,by:state.session.fullName,supplier});
    }
    const c=(cur.counters.rs||0)+1; cur.counters.rs=c;
    const no="IRS-IADE-"+String(c).padStart(5,"0");
    ship={
      id:uid(), no, irsaliyeNo:irs, supplier, reason, status:"Muhasebe Bekliyor",
      lines, at:nowISO(), by:state.session.fullName
    };
    cur.returnShipments.unshift(ship);
    cur.notifications=(cur.notifications||[]);
    cur.notifications.unshift({id:uid(),at:nowISO(),type:"iade",title:"İade irsaliyesi",body:no+" · "+supplier+" · muhasebe bekliyor",read:false});
    cur.audit.push(pushAudit("İade İrsaliye", no+" · "+supplier+" · "+lines.length+" kalem"));
    showToast("İade irsaliyesi kesildi — muhasebe fatura kesebilir");
    return cur;
  });
  if(ship){ generateReturnIrsaliyePDF(ship); state.modal=null; }
}

function handleReturnInvoiceShipSubmit(shipId){
  if(!["admin","yonetici","muhasebe"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  const no=(document.getElementById("ret-ship-inv-no")?.value||"").trim();
  const reason=(document.getElementById("ret-ship-reason")?.value||"").trim();
  if(!no){ showToast("İade fatura no zorunlu.","red"); return; }
  let created=null;
  mutateData(cur=>{
    const ship=(cur.returnShipments||[]).find(r=>r.id===shipId);
    if(!ship||ship.status==="Faturalandı"){ showToast("İrsaliye uygun değil.","amber"); return cur; }
    const lines=[];
    (ship.lines||[]).forEach(l=>{
      const priceEl=document.getElementById("ret-ship-price-"+foldTR(l.item).replace(/\s/g,"-"));
      // simpler: by index
    });
    // prices by index
    (ship.lines||[]).forEach((l,idx)=>{
      const unitPrice=Number(document.getElementById("ret-ship-price-"+idx)?.value)||0;
      const kdv=Number(document.getElementById("ret-ship-kdv-"+idx)?.value)||20;
      if(!(unitPrice>=0)) return;
      const net=unitPrice*l.qty;
      const total=Number((net*(1+kdv/100)).toFixed(2));
      lines.push({ item:l.item, qty:l.qty, unit:l.unit, unitPrice, kdv, total, invoiceNo:"", poNo:"" });
    });
    if(!lines.length){ showToast("Birim fiyat girin.","amber"); return cur; }
    const total=lines.reduce((s,l)=>s+l.total,0);
    const invC=(cur.counters.inv||0)+1; cur.counters.inv=invC;
    const systemNo="RET-"+String(invC).padStart(5,"0");
    created={
      id:uid(), no, systemNo, isReturn:true, status:"İade Faturası",
      date:nowISO(), by:state.session.fullName, reason:reason||ship.reason,
      supplier:ship.supplier, item:lines.length===1?lines[0].item:lines[0].item+" +"+(lines.length-1),
      qty:lines[0].qty, unit:lines[0].unit, kdv:lines[0].kdv, total, unitPrice:lines[0].unitPrice,
      returnShipmentId:ship.id, returnIrsaliyeNo:ship.irsaliyeNo||ship.no,
      lines, stockReturned:false, depoDone:true
    };
    cur.invoices.push(created);
    ship.status="Faturalandı"; ship.invoiceId=created.id; ship.invoiceNo=no; ship.invoicedAt=nowISO();
    // Try link original invoices same supplier+item to reduce invoicedQty
    lines.forEach(l=>{
      const orig=(cur.invoices||[]).find(i=>!i.isReturn && i.status==="Onaylandı" && i.supplier===ship.supplier && foldTR(i.item)===foldTR(l.item));
      if(orig){
        orig.returnedQty=(Number(orig.returnedQty)||0)+l.qty;
        if(orig.poId){
          const po=cur.purchaseOrders.find(x=>x.id===orig.poId);
          if(po){
            po.invoicedQty=Math.max(0,(Number(po.invoicedQty)||0)-l.qty);
            po.uninvoicedQty=Math.max(0,(Number(po.receivedQty)||0)-(Number(po.invoicedQty)||0));
          }
        }
        cur.payments=(cur.payments||[]).map(p=>{
          if(p.invoiceNo!==orig.no || p.reversed) return p;
          if(p.status==="Ödeme Bekliyor"){
            const left=Math.max(0, Number(p.amount)-l.total);
            if(left<=0.5) return {...p, status:"İptal", cancelReason:"İade "+no, amount:0};
            return {...p, amount:Number(left.toFixed(2))};
          }
          return p;
        });
      }
    });
    cur.audit.push(pushAudit("İade Faturası", no+" · irsaliye "+(ship.no)+" · "+fmtTL(total)+" · cari "+ship.supplier));
    showToast("İade faturası cariye işlendi");
    return cur;
  });
  if(created){ generateReturnInvoicePDF(created); state.modal=null; }
}

function handleReturnInvoiceSubmit(){
  if(!["admin","yonetici","muhasebe"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  const no=(document.getElementById("ret-inv-no")?.value||"").trim();
  const reason=(document.getElementById("ret-inv-reason")?.value||"").trim();
  if(!no){ showToast("İade fatura no zorunlu.","red"); return; }
  if(!reason){ showToast("Gerekçe zorunlu.","red"); return; }
  const checks=[...document.querySelectorAll(".ret-inv-chk:checked")];
  if(!checks.length){ showToast("En az bir fatura kalemi seçin.","amber"); return; }

  const lines=[];
  for(const chk of checks){
    const id=chk.dataset.id;
    const inv=(state.data.invoices||[]).find(x=>x.id===id);
    if(!inv||inv.isReturn) continue;
    const maxQ=Number(inv.qty)||0;
    let q=Number(document.querySelector('.ret-inv-qty[data-id="'+id+'"]')?.value);
    if(!(q>0)){ showToast("Geçerli iade miktarı girin: "+(inv.no||""),"amber"); return; }
    if(q>maxQ+1e-9){ showToast("İade miktarı faturayı aşamaz: "+inv.no,"red"); return; }
    const unitPrice=Number(inv.unitPrice)||(maxQ?Number(inv.total)/maxQ:0);
    const ratio=maxQ>0?q/maxQ:1;
    const lineTotal=Number((Number(inv.total)*ratio).toFixed(2));
    lines.push({ inv, qty:q, unitPrice, lineTotal, kdv:inv.kdv, unit:inv.unit||"Adet" });
  }
  if(!lines.length){ showToast("Geçerli kalem yok.","amber"); return; }

  let created=null;
  mutateData(cur=>{
    const total=lines.reduce((s,l)=>s+l.lineTotal,0);
    const invC=(cur.counters.inv||0)+1; cur.counters.inv=invC;
    const systemNo="RET-"+String(invC).padStart(5,"0");
    const primary=lines[0];
    const supplier=primary.inv.supplier;
    const itemLabel=lines.length===1?primary.inv.item:(primary.inv.item+" +"+ (lines.length-1)+" kalem");
    created={
      id:uid(), no, systemNo, isReturn:true, status:"İade Faturası",
      date:nowISO(), by:state.session.fullName, reason,
      supplier, item:itemLabel, qty:primary.qty, unit:primary.unit,
      kdv:primary.kdv, total, unitPrice:primary.unitPrice,
      poNo:primary.inv.poNo, requestNo:primary.inv.requestNo, poId:primary.inv.poId,
      originalInvoiceIds:lines.map(l=>l.inv.id),
      lines:lines.map(l=>({ invoiceId:l.inv.id, invoiceNo:l.inv.no, item:l.inv.item, qty:l.qty, unit:l.unit, unitPrice:l.unitPrice, total:l.lineTotal, kdv:l.kdv, poId:l.inv.poId, poNo:l.inv.poNo })),
      stockReturned:false
    };
    cur.invoices.push(created);

    lines.forEach(l=>{
      const orig=cur.invoices.find(x=>x.id===l.inv.id);
      if(orig){
        orig.returnedQty=(Number(orig.returnedQty)||0)+l.qty;
        if((Number(orig.returnedQty)||0)+1e-9 >= (Number(orig.qty)||0)) orig.fullyReturned=true;
      }
      if(l.inv.poId){
        const po=cur.purchaseOrders.find(x=>x.id===l.inv.poId);
        if(po){
          po.invoicedQty=Math.max(0,(Number(po.invoicedQty)||0)-l.qty);
          po.uninvoicedQty=Math.max(0,(Number(po.receivedQty)||0)-(Number(po.invoicedQty)||0));
        }
      }
      cur.payments=(cur.payments||[]).map(p=>{
        if(p.invoiceNo!==l.inv.no || p.reversed) return p;
        if(p.status==="Ödeme Bekliyor"){
          const left=Math.max(0, Number(p.amount)-l.lineTotal);
          if(left<=0.5) return {...p, status:"İptal", cancelReason:"İade faturası "+no, amount:0};
          return {...p, amount:Number(left.toFixed(2)), note:(p.note||"")+" · iade "+no};
        }
        return p;
      });
    });

    cur.audit.push(pushAudit("İade Faturası", no+" · "+fmtTL(total)+" · cari "+supplier+" · "+reason));
    showToast("İade faturası cariye alacak yazıldı");
    return cur;
  });

  if(created){
    generateReturnInvoicePDF(created);
    state.modal=null;
  }
}

function handleExecutePayment(payId){

  const details=document.getElementById("pay-details")?.value.trim();
  if(!details){ showToast("IBAN / detay zorunlu.","red"); return; }

      if(p.id!==payId) return p;
      paid={...p,method,methodDetails:details,status:"Ödendi",paidDate:nowISO(),paidBy:state.session.fullName};

  });
  if(paid) generatePaymentReceiptPDF(paid);
  state.modal=null; showToast("Ödeme tamamlandı.");
}

function standardMechanicalCatalog(){
  // Stok 0 — standart talep / ürün kartı listesi
  const rows=[];
  const add=(code,name,cat,unit,min=0)=>rows.push({id:uid(),code,name,category:cat,unit,minLevel:min});
  // PVC boru (PN10/PN16 yaygın çaplar, metre)
  ["20","25","32","40","50","63","75","90","110"].forEach(d=>{
    add(`PVC-B-${d}`,`PVC Boru Ø${d} mm (6 m)`, "Mekanik Tesisat","Metre",0);
    add(`PVC-D-${d}`,`PVC Dirsek 90° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PVC-T-${d}`,`PVC Te Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PVC-M-${d}`,`PVC Muaf Ø${d} mm`, "Mekanik Tesisat","Adet",0);
  });
  // PVC redüksiyon / adaptör
  [["32","25"],["40","32"],["50","40"],["63","50"],["75","63"],["90","75"],["110","90"]].forEach(([a,b])=>{
    add(`PVC-R-${a}-${b}`,`PVC Redüksiyon Ø${a}→Ø${b} mm`, "Mekanik Tesisat","Adet",0);
  });
  // PPRC boru & fittings
  ["20","25","32","40","50","63","75"].forEach(d=>{
    add(`PPR-B-${d}`,`PPRC Boru Ø${d} mm PN20`, "Mekanik Tesisat","Metre",0);
    add(`PPR-D90-${d}`,`PPRC Dirsek 90° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-D45-${d}`,`PPRC Dirsek 45° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-T-${d}`,`PPRC Te Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-K-${d}`,`PPRC Kaplin (Manson) Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-BF-${d}`,`PPRC Dişi Adaptör Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-BM-${d}`,`PPRC Erkek Adaptör Ø${d} mm`, "Mekanik Tesisat","Adet",0);
  });
  [["25","20"],["32","25"],["40","32"],["50","40"],["63","50"]].forEach(([a,b])=>{
    add(`PPR-R-${a}-${b}`,`PPRC Redüksiyon Ø${a}→Ø${b} mm`, "Mekanik Tesisat","Adet",0);
  });
  // Yaygın ek malzemeler
  add("KELEP-25","Boru Kelepçesi Ø25","Mekanik Tesisat","Adet",0);
  add("KELEP-32","Boru Kelepçesi Ø32","Mekanik Tesisat","Adet",0);
  add("TEFLON","Teflon Bant","Sarf Malzeme","Adet",0);
  add("SILIKON","Silikon Kartuş","Sarf Malzeme","Adet",0);
  return rows;
}

function handleDbClean(){ handleDbReset("ops"); }
function handleDbReset(kind){
  if(kind==="ops" && !confirm("Talepler, PO, GRN, fatura, ödeme, hareketler silinecek. Cari/ürün/kullanıcı kalır. Emin misiniz?")) return;
  if(kind==="ops") state._allowEmptyWrite=true;
  if(kind==="cari" && !confirm("Tüm cari firmalar silinecek. Emin misiniz?")) return;
  if(kind==="users" && !confirm("Admin dışındaki tüm kullanıcılar silinecek. Emin misiniz?")) return;
  if(kind==="wo" && !confirm("Tüm iş emirleri ve WO malzeme tüketimleri silinecek. Emin misiniz?")) return;
  if(kind==="mech" && !confirm("Ürün kartları mekanik katalog ile değişecek, STOKLAR 0 olacak. Emin misiniz?")) return;
  if(kind==="mech") state._allowEmptyWrite=true;
  if(kind==="full"){
    if(!confirm("KOMPLE SIFIRLA: her şey silinir. Emin misiniz?")) return;
    const word=prompt('Onay için SIFIRLA yazın:');
    if(word!=="SIFIRLA"){ showToast("İptal — SIFIRLA yazılmadı.","amber"); return; }
    state._allowEmptyWrite=true;
  }

  if(kind==="users"){
    const adminOnly=(state.users||[]).filter(u=>u.role==="admin");
    const keep=adminOnly.length?adminOnly:seedUsers();
    saveUsers(keep);
    showToast("Kullanıcılar sıfırlandı (admin korundu).");
    return;
  }

  mutateData(cur=>{
    if(kind==="ops"){
      const next={...seedData(), company:cur.company, suppliers:cur.suppliers, products:cur.products, equipment:cur.equipment};
      next.stock=zeroStockFromProducts(cur.products);
      next.audit.push(pushAudit("DB Ops Temizlik","Admin"));
      showToast("İşlem verileri temizlendi."); return next;
    }
    if(kind==="cari"){
      cur.suppliers=[];
      cur.audit.push(pushAudit("Cari Sıfırlandı","Admin"));
      showToast("Cariler silindi."); return cur;
    }
    if(kind==="wo"){
      cur.workOrders=[]; cur.consumptions=[];
      cur.audit.push(pushAudit("İş Emirleri Sıfırlandı","Admin"));
      showToast("İş emirleri silindi."); return cur;
    }
    if(kind==="mech"){
      const products=standardMechanicalCatalog();
      cur.products=products;
      cur.stock=zeroStockFromProducts(products);
      cur.audit.push(pushAudit("Mekanik Katalog Yüklendi", products.length+" kalem · stok 0"));
      showToast(`Katalog yüklendi (${products.length} kalem), stok 0.`); return cur;
    }
    if(kind==="full"){
      const products=standardMechanicalCatalog();
      const next={...seedData(), products, stock:zeroStockFromProducts(products), company:cur.company||seedData().company};
      next.audit.push(pushAudit("Komple DB Sıfırlama","Admin"));
      showToast("Komple sıfırlandı + mekanik katalog."); return next;
    }
    return cur;
  });
  if(kind==="full"){
    const adminOnly=(state.users||[]).filter(u=>u.role==="admin");
    saveUsers(adminOnly.length?adminOnly:seedUsers());
  }
  setTimeout(()=>{ state._allowEmptyWrite=false; }, 800);
}

  return `<div class="modal-overlay" data-action="overlay-close"><div class="${modalCls}" data-modal-card="1">${inner}</div></div>`;

function handleCariFormSubmit(){
  if(!roleCan("cari_edit")){ showToast("Cari düzenleme sadece yöneticide.","red"); return; }
  const name=document.getElementById("cf-name").value.trim(); if(!name){ showToast("Ünvan zorunlu.","red"); return; }
  const editId=document.getElementById("cari-form")?.dataset?.id||"";
  const payload={
    name, contact:document.getElementById("cf-contact").value.trim(),
    taxOffice:document.getElementById("cf-taxOffice").value.trim(),
    taxNo:document.getElementById("cf-taxNo").value.trim(),
    phone:document.getElementById("cf-phone").value.trim()
  };
  mutateData(cur=>{
    if(editId){
      cur.suppliers=(cur.suppliers||[]).map(s=>s.id===editId?{...s,...payload}:s);
      cur.audit.push(pushAudit("Cari Güncellendi",name));
      showToast("Cari güncellendi.");
    } else {
      cur.suppliers=[...(cur.suppliers||[]),{id:uid(),...payload}];
      cur.audit.push(pushAudit("Cari Eklendi",name));
      showToast("Cari eklendi.");
    }
    state.modal=null; return cur;
  });
}
function handleCariDelete(id){
  if(!roleCan("cari_edit")){ showToast("Cari silme sadece yöneticide.","red"); return; }
  if(!confirm("Silinsin mi?")) return;
  mutateData(cur=>{ const s=cur.suppliers.find(x=>x.id===id); cur.suppliers=cur.suppliers.filter(x=>x.id!==id); cur.audit.push(pushAudit("Cari Silindi",s?.name||id)); showToast("Silindi."); return cur; });
}
function handleUserFormSubmit(){
  if(!roleCan("users")){ showToast("Sadece admin kullanıcı ekleyebilir/düzenleyebilir.","red"); return; }
  const editId=state.modal?.id||document.getElementById("user-form")?.dataset?.id||"";
  const fullName=document.getElementById("uf-name").value.trim();
  const username=document.getElementById("uf-username").value.trim();
  const password=document.getElementById("uf-password").value;
  const phone=(document.getElementById("uf-phone")?.value||"").trim();
  let role=document.getElementById("uf-role").value;
  if(state.session.role!=="admin"){ showToast("Rol atama sadece adminde.","red"); return; }
  if(!ROLES[role]) role="talep_eden";
  if(!fullName||!username){ showToast("Ad ve kullanıcı adı zorunlu.","red"); return; }
  if(!phone){ showToast("Telefon zorunlu (WhatsApp muhatap için).","red"); return; }
  if(editId){
    const other=state.users.find(u=>u.id!==editId && u.username.toLowerCase()===username.toLowerCase());
    if(other){ showToast("Kullanıcı adı mevcut.","red"); return; }
    saveUsers(state.users.map(u=>{
      if(u.id!==editId) return u;
      return {...u, fullName, username, phone, role, ...(password?{password}:{})};
    }));
    if(state.session.id===editId) state.session={...state.session, fullName, phone, role};
    state.modal=null; showToast("Güncellendi.");
    return;
  }
  if(!password){ showToast("Şifre zorunlu.","red"); return; }
  if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ showToast("Kullanıcı adı mevcut.","red"); return; }
  saveUsers([...state.users,{id:uid(),fullName,username,password,phone,role,active:true,createdAt:nowISO()}]);
  state.modal=null; showToast("Oluşturuldu.");
}
