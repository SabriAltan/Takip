<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurumsal ERP Pro · Final</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#0B0E13; --surface:#171D26; --surface2:#0F141B; --surface3:#1F2733;
    --border:#2B3542; --border-strong:#3A4657;
    --text:#E7EBF0; --text-dim:#94A3B3; --text-mute:#5B6675;
    --amber:#E8A33D; --amber-hover:#F3B65A; --amber-text:#171208;
    --teal:#2DD4A6; --red:#F0554F; --blue:#4C8DFF; --violet:#9C8CF0; --green:#34D399;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); }
  body{ font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5; }
  .font-display{ font-family:'Space Grotesk',system-ui,sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:13px; }
  h1,h2,h3{ margin:0; }
  .input{ width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); outline:none; transition:.15s; }
  .input:focus{ border-color:#c98c2c; box-shadow:0 0 0 3px rgba(232,163,61,.15); }
  .input::placeholder{ color:var(--text-mute); }
  select.input{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2394A3B3'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:28px; }
  .field-label{ display:block; font-size:12px; font-weight:500; color:var(--text-dim); margin-bottom:5px; }
  .req{ color:var(--amber); }
  .btn{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px; border:1px solid transparent; transition:.15s; white-space:nowrap; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--amber); color:var(--amber-text); }
  .btn-primary:hover{ background:var(--amber-hover); }
  .btn-ghost{ background:var(--surface3); color:var(--text); border-color:var(--border); }
  .btn-ghost:hover{ background:#28323F; }
  .btn-danger{ background:rgba(240,85,79,.12); color:#FCA5A1; border-color:rgba(240,85,79,.35); }
  .btn-danger:hover{ background:rgba(240,85,79,.22); }
  .btn-teal{ background:rgba(45,212,166,.15); color:#6EE7C5; border-color:rgba(45,212,166,.4); }
  .btn-teal:hover{ background:rgba(45,212,166,.25); }
  .btn-icon{ padding:6px; border-radius:6px; background:var(--surface3); color:var(--text-dim); border:none; display:inline-flex; }
  .btn-icon:hover{ background:#28323F; color:var(--text); }
  .btn-icon.danger{ background:rgba(240,85,79,.1); color:#F0554F; }
  .btn-block{ width:100%; justify-content:center; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .badge{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid; }
  .badge.tone-slate{ background:rgba(148,163,179,.1); color:#C3CBD6; border-color:rgba(148,163,179,.3); }
  .badge.tone-amber{ background:rgba(232,163,61,.13); color:#F0B65E; border-color:rgba(232,163,61,.4); }
  .badge.tone-blue{ background:rgba(76,141,255,.13); color:#8CB2FF; border-color:rgba(76,141,255,.4); }
  .badge.tone-teal{ background:rgba(45,212,166,.13); color:#6EE7C5; border-color:rgba(45,212,166,.4); }
  .badge.tone-green{ background:rgba(52,211,153,.13); color:#6EE7B7; border-color:rgba(52,211,153,.4); }
  .badge.tone-red{ background:rgba(240,85,79,.13); color:#FCA5A1; border-color:rgba(240,85,79,.4); }
  .badge.tone-violet{ background:rgba(156,140,240,.13); color:#C1B5F5; border-color:rgba(156,140,240,.4); }
  #app{ min-height:100vh; display:flex; }
  .sidebar{ width:248px; flex-shrink:0; min-height:100vh; border-right:1px solid #1D2430; background:#0E131A; display:flex; flex-direction:column; }
  .sidebar-head{ padding:16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #1D2430; }
  .logo-box{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--amber),#c98c2c); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; }
  .sidebar-title{ font-size:13px; font-weight:600; }
  .sidebar-sub{ font-size:10px; color:var(--text-mute); }
  .nav{ flex:1; padding:10px 8px; overflow-y:auto; }
  .nav-section{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-mute); padding:10px 12px 4px; }
  .nav-item{ display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border-radius:8px; border:none; background:none; color:var(--text-dim); font-size:13px; text-align:left; margin-bottom:2px; position:relative; }
  .nav-item:hover{ background:#171D26; color:var(--text); }
  .nav-item.active{ background:rgba(232,163,61,.13); color:#F0B65E; font-weight:600; }
  .nav-badge{ position:absolute; right:10px; background:var(--red); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; min-width:18px; text-align:center; }
  .sidebar-foot{ padding:12px; border-top:1px solid #1D2430; }
  .user-chip{ display:flex; align-items:center; gap:8px; padding:0 4px; margin-bottom:8px; }
  .avatar{ width:32px; height:32px; border-radius:999px; background:var(--surface3); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--text-dim); flex-shrink:0; }
  .user-chip-name{ font-size:12px; font-weight:500; }
  .user-chip-role{ font-size:10px; color:var(--text-mute); }
  main{ flex:1; min-width:0; padding:28px; max-width:1280px; overflow-x:hidden; }
  .page-title{ font-size:22px; font-weight:600; }
  .page-sub{ font-size:13px; color:var(--text-mute); margin:4px 0 20px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .stat-card{ display:flex; align-items:center; gap:12px; padding:16px; }
  .stat-icon{ width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
  .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-mute); }
  .stat-value{ font-size:20px; font-weight:600; }
  .table-responsive{ width:100%; overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
  thead tr{ background:var(--surface2); text-align:left; }
  th{ padding:10px 14px; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-mute); font-weight:600; }
  td{ padding:10px 14px; border-top:1px solid #1D2430; }
  tr:hover td{ background:rgba(255,255,255,.015); }
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal{ width:100%; max-width:580px; padding:22px; max-height:88vh; overflow-y:auto; }
  .modal.wide{ max-width:760px; }
  .modal-row{ display:flex; justify-content:space-between; gap:16px; padding:7px 0; border-top:1px solid #1D2430; }
  .modal-row:first-child{ border-top:none; }
  .modal-row .k{ font-size:12px; color:var(--text-mute); flex-shrink:0; }
  .modal-row .v{ font-size:13px; text-align:right; }
  #toast-container{ position:fixed; bottom:20px; right:20px; z-index:100; }
  .toast{ padding:11px 16px; border-radius:8px; font-size:13px; font-weight:600; border:1px solid; box-shadow:0 8px 24px rgba(0,0,0,.35); margin-top:10px; transition:opacity .3s; }
  .toast.green{ background:rgba(52,211,153,.13); border-color:rgba(52,211,153,.4); color:#6EE7B7; }
  .toast.red{ background:rgba(240,85,79,.13); border-color:rgba(240,85,79,.4); color:#FCA5A1; }
  .toast.amber{ background:rgba(232,163,61,.13); border-color:rgba(232,163,61,.4); color:#F0B65E; }
  .list-item{ padding:14px 16px; cursor:pointer; transition:background .12s; }
  .list-item:hover{ background:rgba(255,255,255,.02); }
  .filters-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .search-wrap{ position:relative; flex-grow:1; max-width:320px; }
  .search-wrap .input{ padding-left:34px; }
  .search-wrap .ic{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-mute); font-size:13px; }
  .empty{ text-align:center; padding:36px; color:var(--text-mute); font-size:13px; }
  .login-wrap{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
  .login-box{ width:100%; max-width:380px; }
  .flex-wrap-gap{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .timeline{ border-left:2px solid var(--border); margin-left:8px; padding-left:16px; }
  .timeline-item{ position:relative; margin-bottom:14px; }
  .timeline-item::before{ content:""; position:absolute; left:-21px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--amber); border:2px solid var(--bg); }
  .kpi-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
  .section-title{ font-size:13px; font-weight:600; margin:22px 0 10px; display:flex; align-items:center; gap:8px; }
  .alert-box{ padding:12px 14px; border-radius:8px; font-size:12px; margin-bottom:12px; border:1px solid; }
  .alert-box.warn{ background:rgba(232,163,61,.08); border-color:rgba(232,163,61,.35); color:#F0B65E; }
  .alert-box.danger{ background:rgba(240,85,79,.08); border-color:rgba(240,85,79,.35); color:#FCA5A1; }
  .alert-box.info{ background:rgba(76,141,255,.08); border-color:rgba(76,141,255,.35); color:#8CB2FF; }
  .alert-box.ok{ background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.35); color:#6EE7B7; }
  .preview-box{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px; margin-top:10px; }
  .preview-row{ display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
  .preview-row.total{ border-top:1px solid var(--border); margin-top:6px; padding-top:8px; font-weight:700; font-size:15px; }
  .funnel{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .funnel-step{ flex:1; min-width:100px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .funnel-step .n{ font-size:20px; font-weight:700; font-family:'IBM Plex Mono',monospace; }
  .funnel-step .l{ font-size:10px; color:var(--text-mute); text-transform:uppercase; margin-top:2px; }
  .chk{ width:16px; height:16px; accent-color:var(--amber); }
  @media (max-width:960px){
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
    .sidebar{ width:64px; }
    .sidebar-title,.sidebar-sub,.nav-item span:not(:first-child),.user-chip-name,.user-chip-role,.nav-section,.nav-badge{ display:none; }
    main{ padding:16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>
<script>
/* ========================================================================
   KURUMSAL ERP PRO v3
   P2P + SAP PM (İş Emri) + RFQ/Teklif + 3-Way Match + Gelişmiş Kokpit
   ======================================================================== */

const ROLES = {
  admin:      { label:"Sistem Yöneticisi", color:"amber" },
  onaylayan:  { label:"Onay Yetkilisi",  color:"blue" },
  satinalma:  { label:"Satın Alma",      color:"teal" },
  depo:       { label:"Depo / Stok",     color:"violet" },
  muhasebe:   { label:"Muhasebe / AP",   color:"green" },
  talep_eden: { label:"Talep Eden / Saha", color:"slate" },
};
const UNITS = ["Adet","Kutu","Paket","Kg","Litre","Metre","Set","Ton","m²","m³"];
const CATEGORIES = ["Ofis Malzemesi","Hammadde","Yedek Parça","Temizlik","Elektronik","Sarf Malzeme","Mekanik Tesisat","İnşaat","İş Güvenliği","Diğer"];
const PRIORITIES = ["Düşük","Normal","Yüksek","Acil"];
const PAY_METHODS = ["Banka Havale/EFT","Çek","Kredi Kartı","Nakit","Akreditif"];
const WO_TYPES = ["Arıza (Breakdown)","Planlı Bakım","İyileştirme","Montaj","Kontrol / Muayene","Diğer"];
const WO_STATUSES = ["Açık","Üstlenildi","Malzeme Bekliyor","Devam Ediyor","Beklemede","Teslimata Hazır","Tamamlandı","İptal"];

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const nowISO = () => new Date().toISOString();
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}); }
function fmtTL(n){ return (Number(n)||0).toLocaleString("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2}); }
function esc(s){ if(s==null) return ""; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusTone(s){
  const m={"Beklemede":"blue","Onaylandı":"teal","Reddedildi":"red","PO Oluşturuldu":"amber","Sipariş Verildi":"amber","Kısmi Teslim":"violet","Teslim Alındı":"green","İade Edildi":"red","Fatura Onaylandı":"green","Fiyat Uyuşmuyor":"red","Ödeme Bekliyor":"amber","Ödendi":"green","İptal":"red","Açık":"blue","Üstlenildi":"violet","Malzeme Bekliyor":"amber","Devam Ediyor":"teal","Teslimata Hazır":"green","Tamamlandı":"green"};
  return m[s]||"slate";
}
function badge(t,tone){ return `<span class="badge tone-${tone||statusTone(t)}">${esc(t)}</span>`; }
function exportToCSV(filename,headers,rows){
  const csv="\uFEFF"+headers.join(",")+"\n"+rows.map(e=>e.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename+"_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function seedUsers(){ return [{id:uid(),username:"admin",password:"admin123",fullName:"Sistem Yöneticisi",role:"admin",active:true,createdAt:nowISO()}]; }
function seedData(){
  return {
    company:{ name:"Kurumsal Şirket A.Ş.", taxOffice:"", taxNo:"", address:"", phone:"" },
    products:[], suppliers:[], equipment:[],
    workOrders:[],          // SAP PM tarzı İş Emirleri
    consumptions:[],        // Depodan alınan → ekipmana/WO'ya harcanan malzemeler
    messages:[],            // Diyalog (WO, PO, fatura, mal çıkış)
    requests:[], purchaseOrders:[], goodsReceipts:[],
    stock:[], movements:[], fieldLogs:[],
    invoices:[], payments:[], audit:[],
    counters:{ pr:0, po:0, gr:0, inv:0, pay:0, wo:0, eq:0 }
  };
}

let state = {
  users:null, data:null, session:null, loading:true,
  tab:"dashboard", modal:null,
  talepQuery:"", talepStatusFilter:"Tümü",
  woQuery:"", woStatusFilter:"Tümü",
  loginError:"", _pendingFocus:null,
  rfqSelected:[]  // for RFQ multi-select
};

/* ============================ STORAGE ============================ */
async function loadAll(){
  try{
    let u=null;
    try{ const r=await window.storage.get("users"); u=r?JSON.parse(r.value):null; }catch(e){}
    if(!u||!Array.isArray(u)||!u.length){ u=seedUsers(); try{ await window.storage.set("users",JSON.stringify(u)); }catch(e){} }
    state.users=u;
    let d=null;
    try{ const r2=await window.storage.get("erp-data-v5"); d=r2?JSON.parse(r2.value):null; }catch(e){}
    if(!d){ d=seedData(); try{ await window.storage.set("erp-data-v5",JSON.stringify(d)); }catch(e){} }
    ["products","suppliers","equipment","workOrders","consumptions","messages","requests","purchaseOrders","goodsReceipts","stock","movements","fieldLogs","invoices","payments","audit"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
    if(!d.company) d.company=seedData().company;
    if(!d.counters) d.counters=seedData().counters;
    state.data=d;
  }catch(e){ state.users=seedUsers(); state.data=seedData(); }
  state.loading=false; render();
}
setInterval(()=>{ if(state.session && !state.modal && !(document.activeElement&&document.activeElement.classList.contains('input'))) loadAll(); },9000);

async function mutateData(fn){
  try{
    const r=await window.storage.get("erp-data-v5");
    let cur=r?JSON.parse(r.value):seedData();
    ["products","suppliers","equipment","workOrders","consumptions","messages","requests","purchaseOrders","goodsReceipts","stock","movements","fieldLogs","invoices","payments","audit"].forEach(k=>{ if(!Array.isArray(cur[k])) cur[k]=[]; });
    if(!cur.company) cur.company=seedData().company;
    if(!cur.counters) cur.counters=seedData().counters;
    const next=fn(cur);
    await window.storage.set("erp-data-v5",JSON.stringify(next));
    state.data=next; render();
  }catch(e){ showToast("Kayıt hatası.","red"); console.error(e); }
}
async function saveUsers(next){ state.users=next; try{ await window.storage.set("users",JSON.stringify(next)); }catch(e){ showToast("Kullanıcı kaydı başarısız.","red"); } render(); }
function pushAudit(action,detail){ return {id:uid(),at:nowISO(),user:state.session?.fullName||"Sistem",role:state.session?.role||"",action,detail}; }
function showToast(msg,tone="green"){
  const c=document.getElementById("toast-container"); const t=document.createElement("div");
  t.className=`toast ${tone}`; t.textContent=msg; c.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; setTimeout(()=>t.remove(),300); },3200);
}

/* ============================ RENDER CORE ============================ */
function render(){
  const app=document.getElementById("app");
  if(state.loading||!state.users||!state.data){ app.innerHTML=`<div class="login-wrap"><div class="login-box"><div class="card" style="padding:28px;text-align:center;color:var(--text-mute);">Sistem yükleniyor…</div></div></div>`; return; }
  if(!state.session){ app.innerHTML=renderLogin(); restoreFocus(); return; }
  app.innerHTML=renderShell(); restoreFocus();
  if(state.tab==="dashboard") setTimeout(initDashboardMap, 60);
  if(state.modal && (state.modal.type==="eq-form" || state.modal.type==="wo-form")) setTimeout(initGeoPickerMap, 80);
}
function restoreFocus(){
  if(!state._pendingFocus) return;
  const el=document.getElementById(state._pendingFocus.id);
  if(el){ el.focus(); if(typeof state._pendingFocus.pos==="number"&&el.setSelectionRange) try{ el.setSelectionRange(state._pendingFocus.pos,state._pendingFocus.pos);}catch(e){} }
  state._pendingFocus=null;
}
function renderLogin(){
  return `<div class="login-wrap"><div class="login-box">
    <div style="margin-bottom:18px;text-align:center;">
      <div style="font-size:36px;margin-bottom:6px;">📦</div>
      <h1 class="font-display" style="font-size:18px;font-weight:600;">Kurumsal ERP Pro</h1>
      <p style="font-size:12px;color:var(--text-mute);margin:4px 0 0;">Procure-to-Pay · Bakım · Saha · Finans</p>
    </div>
    <div class="card" style="padding:22px;">
      <form id="login-form">
        <div style="margin-bottom:12px;"><span class="field-label">Kullanıcı adı <span class="req">*</span></span><input class="input" id="login-username" autocomplete="username" autofocus></div>
        <div style="margin-bottom:12px;"><span class="field-label">Şifre <span class="req">*</span></span><input class="input" type="password" id="login-password" autocomplete="current-password"></div>
        <div id="login-error-box">${state.loginError?`<div style="color:var(--red);font-size:12px;margin-bottom:8px;">${esc(state.loginError)}</div>`:""}</div>
        <button type="submit" class="btn btn-primary btn-block">Giriş Yap →</button>
      </form>
    </div>
  </div></div>`;
}
function handleLogin(){
  const uname=document.getElementById("login-username").value.trim();
  const pass=document.getElementById("login-password").value;
  const u=state.users.find(x=>x.username.toLowerCase()===uname.toLowerCase());
  if(!u||u.password!==pass){ document.getElementById("login-error-box").innerHTML=`<div style="color:var(--red);font-size:12px;margin-bottom:8px;">Kullanıcı adı veya şifre hatalı.</div>`; return; }
  if(!u.active){ document.getElementById("login-error-box").innerHTML=`<div style="color:var(--red);font-size:12px;margin-bottom:8px;">Hesap pasif.</div>`; return; }
  state.loginError=""; state.session=u; state.tab="dashboard"; render();
}

/* ============================ NAV ============================ */
/* Rol matrisi:
   admin      — tam yetki
   onaylayan  — PR onay, iş akışı, rapor, görüntüleme
   satinalma  — PO/RFQ, cari, ürün, talep görüntüleme

function roleCan(action){
  const r=state.session?.role;
  if(!r||r==="admin") return true;
  const map={
    wo_take:["talep_eden","depo"],
    wo_create:["talep_eden","depo","satinalma"],
    pr_create:["talep_eden","depo","satinalma"],
    pr_approve:["onaylayan"],
    po_create:["satinalma"],
    grn:["depo"],
    stock_out:["depo"],
    invoice:["muhasebe"],
    pay:["muhasebe"],
    users:["admin"],
    settings:["admin"],
    product:["depo","satinalma"],
    equipment:["depo"],
    cari:["satinalma","muhasebe"],
  };
  return (map[action]||[]).includes(r);
}

function countBadge(key){
  const d=state.data; if(!d) return 0;
  if(key==="onay") return d.requests.filter(r=>r.status==="Beklemede").length;
  if(key==="isEmirleri") return d.workOrders.filter(w=>!["Tamamlandı","İptal"].includes(w.status)).length;
  if(key==="satinalma") return d.requests.filter(r=>r.status==="Onaylandı").length;
  if(key==="stok") return d.purchaseOrders.filter(p=>p.status==="Sipariş Verildi"||p.status==="Kısmi Teslim").length;
  if(key==="muhasebe") return d.payments.filter(p=>p.status==="Ödeme Bekliyor").length;
  return 0;
}

function renderShell(){

    navHtml+=`<div class="nav-section">${esc(sec.section)}</div>`;
    vis.forEach(n=>{
      const b=countBadge(n.key);
      navHtml+=`<button class="nav-item ${state.tab===n.key?'active':''}" data-action="nav" data-tab="${n.key}">
        <span>${n.icon}</span><span>${esc(n.label)}</span>${b>0?`<span class="nav-badge">${b}</span>`:""}

  const pages={

function collectActiveWorkPins(){
  const pins=[];
  (state.data.workOrders||[]).filter(w=>!["Tamamlandı","İptal"].includes(w.status)).forEach(w=>{
    let lat=null, lng=null, place="";
    const eq = w.equipmentId ? (state.data.equipment||[]).find(e=>e.id===w.equipmentId)
      : (state.data.equipment||[]).find(e=>e.name && w.equipment && e.name===w.equipment);
    if(eq && eq.lat!=null && eq.lng!=null && eq.lat!=="" && eq.lng!==""){
      lat=Number(eq.lat); lng=Number(eq.lng); place=eq.name||"";
    }
    if(Number.isFinite(lat) && Number.isFinite(lng)){
      pins.push({
        lat, lng,
        title: (w.no||"")+" · "+(w.title||""),
        sub: (place?place+" · ":"")+(w.assigneeName||"Üstlenen yok")+" · "+(w.status||""),
        status: w.status
      });
    }
  });
  return pins;
}

let _dashMap=null;
function initDashboardMap(){
  const el=document.getElementById("dash-map");
  if(!el || typeof L==="undefined"){
    const h=document.getElementById("dash-map-hint");
    if(h && typeof L==="undefined") h.textContent="Harita kütüphanesi yüklenemedi (çevrimdışı olabilir).";
    return;
  }
  const pins=collectActiveWorkPins();
  try{ if(_dashMap){ _dashMap.remove(); _dashMap=null; } }catch(e){}
  const center = pins.length ? [pins[0].lat, pins[0].lng] : [39.0, 35.2]; // TR merkez
  _dashMap = L.map(el, {
    zoomControl:true, attributionControl:true,
    minZoom:4, maxZoom:19
  }).setView(center, pins.length?15:6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19, maxNativeZoom:19, attribution:"&copy; OpenStreetMap"
  }).addTo(_dashMap);
  const bounds=[];
  pins.forEach(p=>{
    const m=L.circleMarker([p.lat,p.lng],{
      radius:10, color:"#0B0E13", weight:2,
      fillColor: p.status==="Devam Ediyor"?"#2DD4A6":(p.status==="Malzeme Bekliyor"?"#E8A33D":"#4C8DFF"),
      fillOpacity:0.95
    }).addTo(_dashMap);
    m.bindPopup(`<strong>${esc(p.title)}</strong><br><span style="font-size:12px">${esc(p.sub)}</span>
      <br><a href="${routeUrlGoogle(p.lat,p.lng)}" target="_blank" rel="noopener" style="color:#4C8DFF;font-size:12px;">🚗 Google Rota</a>
      · <a href="${mapUrlPin(p.lat,p.lng)}" target="_blank" rel="noopener" style="color:#2DD4A6;font-size:12px;">📍 Harita</a>`);
    bounds.push([p.lat,p.lng]);
  });
  if(bounds.length>=1){
    const b=L.latLngBounds(bounds);
    _dashMap.fitBounds(b.pad(0.35), { maxZoom:18, padding:[40,40], animate:true });
  }
  const h=document.getElementById("dash-map-hint");
  if(h) h.textContent = pins.length
    ? `${pins.length} aktif pin · haritayı yakınlaştırıp sokak seviyesine inebilirsiniz`
    : "Aktif işte koordinatlı ekipman yok — Ekipman kartına lat/lng ekleyin.";
  setTimeout(()=>{ try{ _dashMap.invalidateSize(); }catch(e){} }, 200);
}

function renderIsEmirleri(){

function renderIsAkisi(){
  /* YÖNETİM / RAPOR — kart tahtası, teyitler, entegrasyon */
  const cols=[
    { key:"Açık", label:"Açık", tone:"blue" },
    { key:"active", label:"Üzerinde Çalışılıyor", match:s=>["Üstlenildi","Devam Ediyor"].includes(s), tone:"violet" },
    { key:"Malzeme Bekliyor", label:"Malzeme Bekliyor", tone:"amber" },
    { key:"Teslimata Hazır", label:"Teslimata Hazır", tone:"teal" },
    { key:"Tamamlandı", label:"Tamamlandı", tone:"green" },
  ];
  const wos=state.data.workOrders;
  function colItems(col){
    if(col.match) return wos.filter(w=>col.match(w.status));
    return wos.filter(w=>w.status===col.key);
  }
  function confChecks(w){
    const team=(w.team||[]).length;
    const cons=(state.data.consumptions||[]).filter(c=>c.workOrderId===w.id).length;
    const prs=state.data.requests.filter(r=>r.workOrderId===w.id);
    const prDone=prs.filter(r=>["Teslim Alındı","PO Oluşturuldu","Onaylandı","Sipariş Verildi"].includes(r.status)||r.status==="Teslim Alındı").length;
    const msgs=getMessages("wo",w.id).length;
    const checks=[

              return `<div class="card" style="padding:12px;margin-bottom:8px;cursor:pointer;" data-action="select-wo" data-id="${w.id}">

function handleCreateWO(){
  const title=document.getElementById("wo-title")?.value.trim();
  if(!title){ showToast("Başlık zorunlu.","red"); return; }
  mutateData(cur=>{
    const c=(cur.counters.wo||0)+1;
    const no="WO-"+String(c).padStart(5,"0");
    const eqId=document.getElementById("wo-equipment")?.value||"";
    const eq=cur.equipment.find(e=>e.id===eqId);
    const wo={
      id:uid(), no, title,
      type:document.getElementById("wo-type").value,
      priority:document.getElementById("wo-priority").value,
      equipment:eq?eq.name:"", equipmentId:eqId||null,
      location:document.getElementById("wo-location")?.value.trim()||(eq?.location||""),
      lat: eq && Number.isFinite(Number(eq.lat)) ? Number(eq.lat) : null,
      lng: eq && Number.isFinite(Number(eq.lng)) ? Number(eq.lng) : null,
      description:document.getElementById("wo-desc")?.value.trim()||"",
      requester:state.session.id, requesterName:state.session.fullName,
      assigneeId:null, assigneeName:null,
      team:[],  // ekip üyeleri {id, name, joinedAt}
      status:"Açık", createdAt:nowISO(),
      history:[{at:nowISO(),by:state.session.fullName,action:"İş emri açıldı"+(eq&&eq.lat?` · konum ${eq.lat},${eq.lng}`:"")}]
    };
    cur.counters.wo=c;
    cur.workOrders=[wo,...cur.workOrders];
    cur.audit.push(pushAudit("İş Emri Açıldı", no+" · "+title));
    state.modal=null;
    showToast(no+" oluşturuldu.");
    return cur;
  });
}

function handleWOTake(id){
  if(!id){ showToast("İş emri bulunamadı.","red"); return; }
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0){ showToast("İş emri bulunamadı.","red"); return cur; }
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal"].includes(w.status)){ showToast("Kapalı iş emrine katılınamaz.","red"); return cur; }
    const team=[...(w.team||[])];
    if(team.some(t=>t.id===state.session.id)){ showToast("Zaten ekipsiniz.","amber"); return cur; }
    team.push({ id:state.session.id, name:state.session.fullName, joinedAt:nowISO() });
    const isFirst=!w.assigneeId;
    // Saha: İşi Al = üzerine al ve çalışmaya başla
    let nextStatus=w.status;
    if(["Açık","Üstlenildi"].includes(w.status||"") || !w.status) nextStatus="Devam Ediyor";
    cur.workOrders[idx]={
      ...w,
      team,
      status: nextStatus,
      assigneeId: w.assigneeId || state.session.id,
      assigneeName: w.assigneeName || state.session.fullName,
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:isFirst?`İşi aldı → ${nextStatus}`:`Ekibe katıldı (${team.length} kişi)`}]
    };
    cur.audit.push(pushAudit("İşi Aldı", cur.workOrders[idx].no+" · "+state.session.fullName+" · ekip "+team.length));
    showToast(isFirst ? "İş alındı — bitince Bitir deyin." : `Ekibe katıldınız (${team.length} kişi)`);
    return cur;
  });
}

function handleWOAdvance(id, toStatus){
  if(!id||!toStatus) return;
  if(!WO_STATUSES.includes(toStatus)){ showToast("Geçersiz durum.","red"); return; }
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0) return cur;
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal"].includes(w.status)){ showToast("Kapalı iş emri.","red"); return cur; }
    // Ekipte değilse otomatik ekle
    const team=[...(w.team||[])];
    if(!team.some(t=>t.id===state.session.id)){
      team.push({ id:state.session.id, name:state.session.fullName, joinedAt:nowISO() });
    }
    cur.workOrders[idx]={
      ...w,
      team,
      status: toStatus,
      assigneeId: w.assigneeId || state.session.id,
      assigneeName: w.assigneeName || state.session.fullName,
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:`Durum: ${w.status} → ${toStatus}`}]
    };
    cur.audit.push(pushAudit("WO Kademe", cur.workOrders[idx].no+" · "+w.status+" → "+toStatus));
    showToast(`Durum: ${toStatus}`);
    return cur;
  });
}

function handleWOComplete(id){
  const note=document.getElementById("wo-comp-note")?.value.trim();
  const hours=document.getElementById("wo-comp-hours")?.value;
  if(!note){ showToast("Yapılan iş açıklaması zorunlu.","red"); return; }
  mutateData(cur=>{
    cur.workOrders=cur.workOrders.map(w=>{
      if(w.id!==id) return w;
      return {...w, status:"Tamamlandı", completionNote:note, laborHours:Number(hours)||0, completedAt:nowISO(), completedBy:state.session.fullName,
        history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"Tamamlandı: "+note.slice(0,80)}]};
    });
    const w=cur.workOrders.find(x=>x.id===id);
    cur.audit.push(pushAudit("İş Emri Kapatıldı", (w?.no||id)+" · "+note.slice(0,60)));
    state.modal=null;
    showToast("İş emri kapatıldı.");
    return cur;
  });
}

function handleWOConsume(){
  const woId=document.getElementById("cons-wo")?.value;
  const itemVal=document.getElementById("cons-item")?.value;
  const qty=Number(document.getElementById("cons-qty")?.value);
  if(!woId||!itemVal||!qty||qty<=0){ showToast("Tüm alanları doldurun.","red"); return; }
  const [itemName,itemUnit]=itemVal.split("|");
  mutateData(cur=>{
    const wo=cur.workOrders.find(w=>w.id===woId);
    if(!wo) return cur;
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===itemName.toLowerCase()&&s.unit===itemUnit);
    if(idx<0||Number(stock[idx].qty)<qty){ showToast("Yetersiz stok!","red"); return cur; }
    stock[idx]={...stock[idx], qty:Number(stock[idx].qty)-qty};
    const cons={ id:uid(), workOrderId:wo.id, workOrderNo:wo.no, equipment:wo.equipment||"", equipmentId:wo.equipmentId||null,
      item:itemName, unit:itemUnit, qty, by:state.session.fullName, at:nowISO() };
    cur.stock=stock;
    cur.consumptions=[cons,...(cur.consumptions||[])];
    cur.movements.push({id:uid(),at:nowISO(),type:"WO Tüketim",item:itemName,qty:-qty,unit:itemUnit,ref:wo.no+(wo.equipment?" / "+wo.equipment:""),by:state.session.fullName});
    cur.workOrders=cur.workOrders.map(w=>{
      if(w.id!==woId) return w;
      // Malzeme alınca: Açık/Üstlenildi/Malzeme Bekliyor → Devam Ediyor
      let st=w.status;
      if(["Açık","Üstlenildi","Malzeme Bekliyor"].includes(st)) st="Devam Ediyor";
      return {...w, status:st, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"Malzeme: "+itemName+" × "+qty+" "+itemUnit+" → "+st}]};
    });
    cur.audit.push(pushAudit("WO Malzeme", wo.no+" · "+itemName+" × "+qty));
    // Minimal irsaliye
    generateMinimalDeliveryNote({ item:itemName, qty, unit:itemUnit, person:state.session.fullName, location:wo.equipment||wo.location||wo.no, date:nowISO(), ref:wo.no });
    state.modal=null;
    showToast("Malzeme ekipmana işlendi, stok düşüldü.");
    return cur;
  });
}

function handleWOStatus(id){
  const next=prompt("Yeni durum:\n"+WO_STATUSES.join(" / "));
  if(!next||!WO_STATUSES.includes(next.trim())){ if(next!==null) showToast("Geçersiz durum.","red"); return; }
  mutateData(cur=>{
    cur.workOrders=cur.workOrders.map(w=>{
      if(w.id!==id) return w;
      return {...w, status:next.trim(), history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"Durum → "+next.trim()}]};
    });
    const w=cur.workOrders.find(x=>x.id===id);
    cur.audit.push(pushAudit("İş Emri Durum", (w?.no||id)+" → "+next.trim()));
    showToast("Durum güncellendi.");
    return cur;
  });
}

      requester:state.session.id, requesterName:state.session.fullName,
      createdAt:nowISO(), status:"Beklemede",
      history:[{at:nowISO(),by:state.session.fullName,action:"PR oluşturuldu"+(wo?" · "+wo.no:"")}]
    };
    cur.counters.pr=counter;
    cur.requests=[req,...cur.requests];
    if(wo){
      // PR bağlamak durumu zorunlu "Malzeme Bekliyor" yapmaz — sadece geçmişe not düşer
      cur.workOrders=cur.workOrders.map(w=>w.id===woId?{...w, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"PR bağlandı: "+no}]}:w);
    }
    cur.audit.push(pushAudit("PR Oluşturuldu", no+" · "+item+(wo?" · "+wo.no:"")));
    state.tab="talepler"; state.modal=null;
    showToast(no+" oluşturuldu.");
    return cur;
  });
}

function handleOnayDecide(id,decision){
  const reason=decision==="reject"?prompt("Red gerekçesi:"):null;
  if(decision==="reject"&&(reason===null||!reason.trim())){ showToast("Gerekçe zorunlu.","red"); return; }
  mutateData(cur=>{
    cur.requests=cur.requests.map(r=>{
      if(r.id!==id) return r;
      return {...r, status:decision==="approve"?"Onaylandı":"Reddedildi", approverName:state.session.fullName,
        rejectReason:decision==="reject"?reason:undefined,
        history:[...(r.history||[]),{at:nowISO(),by:state.session.fullName,action:decision==="approve"?"Onaylandı":"Reddedildi: "+reason}]};
    });
    const r=cur.requests.find(x=>x.id===id);
    cur.audit.push(pushAudit(decision==="approve"?"PR Onaylandı":"PR Reddedildi", r?.no||id));
    return cur;
  });
  showToast(decision==="approve"?"Onaylandı.":"Reddedildi.", decision==="approve"?"green":"red");
}

function handleCreatePO(reqId){
  const supplier=document.getElementById("order-supplier-"+reqId)?.value;
  const price=document.getElementById("order-price-"+reqId)?.value;
  const eta=document.getElementById("order-eta-"+reqId)?.value;
  if(!supplier||!price||Number(price)<=0){ showToast("Cari ve birim fiyat zorunlu.","red"); return; }
  mutateData(cur=>{
    const r=cur.requests.find(x=>x.id===reqId);
    if(!r||r.status!=="Onaylandı") return cur;
    const counter=(cur.counters.po||0)+1;
    const poNo="PO-"+String(counter).padStart(5,"0");
    const po={ id:uid(), no:poNo, requestId:r.id, requestNo:r.no, workOrderNo:r.workOrderNo||null,
      item:r.item, qty:r.qty, unit:r.unit, category:r.category, supplier, unitPrice:Number(price),
      total:Number(price)*Number(r.qty), eta:eta||null, status:"Sipariş Verildi",
      createdAt:nowISO(), createdBy:state.session.fullName };
    cur.counters.po=counter;
    cur.purchaseOrders=[po,...cur.purchaseOrders];
    cur.requests=cur.requests.map(x=>x.id===reqId?{...x, status:"PO Oluşturuldu", poNo, supplier, unitPrice:Number(price),
      history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"PO: "+poNo}]}:x);
    cur.audit.push(pushAudit("PO Oluşturuldu", poNo+" · "+r.item+" · "+supplier));
    showToast(poNo+" oluşturuldu.");
    return cur;
  });
}

function handleGRReceive(poId){
  const irs=document.getElementById("gr-irs-"+poId)?.value.trim();
  const qty=Number(document.getElementById("gr-qty-"+poId)?.value);
  const note=document.getElementById("gr-note-"+poId)?.value.trim();
  if(!irs){ showToast("İrsaliye no zorunlu.","red"); return; }
  if(!qty||qty<=0){ showToast("Geçerli miktar.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    const ordered=Number(po.qty)||0;
    const prevRecv=Number(po.receivedQty)||0;
    const remaining=Math.max(0, ordered-prevRecv);
    if(qty>remaining+1e-9){ showToast(`Kalan miktar ${remaining} ${po.unit}. Daha fazla giremezsiniz.`,"red"); return cur; }

    const grC=(cur.counters.gr||0)+1; const grNo="GR-"+String(grC).padStart(5,"0"); cur.counters.gr=grC;
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===po.item.toLowerCase()&&s.unit===po.unit);
    const prod=cur.products.find(p=>p.name.toLowerCase()===po.item.toLowerCase());
    if(idx>=0) stock[idx]={...stock[idx],qty:Number(stock[idx].qty)+qty};
    else stock.push({id:uid(),item:po.item,category:po.category,unit:po.unit,qty,minLevel:prod?.minLevel||0});

    const newRecv=prevRecv+qty;
    const full=newRecv>=ordered-1e-9;
    const left=Math.max(0, ordered-newRecv);

    cur.movements.push({id:uid(),at:nowISO(),type:"GRN Giriş",item:po.item,qty,unit:po.unit,ref:grNo+" / "+po.no,by:state.session.fullName});
    cur.goodsReceipts.push({
      id:uid(), no:grNo, poId:po.id, poNo:po.no, requestNo:po.requestNo,
      item:po.item, qty, unit:po.unit, supplier:po.supplier, irsaliyeNo:irs, note,
      orderedQty:ordered, receivedTotal:newRecv, remaining:left,
      at:nowISO(), by:state.session.fullName
    });

    // İrsaliye girilince faturalanabilir hale gelir (kısmi veya tam)
    cur.purchaseOrders=cur.purchaseOrders.map(x=>{
      if(x.id!==poId) return x;
      return {
        ...x,
        status: full ? "Teslim Alındı" : "Kısmi Teslim",
        receivedQty: newRecv,
        remainingQty: left,
        lastIrsaliyeNo: irs,
        lastGrNo: grNo,
        invoiceEligible: true,
        uninvoicedQty: Math.max(0, newRecv - (Number(x.invoicedQty)||0))
      };
    });
    cur.requests=cur.requests.map(x=>x.id===po.requestId?{
      ...x,
      status: full ? "Teslim Alındı" : (x.status==="PO Oluşturuldu"||x.status==="Sipariş Verildi"||x.status==="Kısmi Teslim" ? "Kısmi Teslim" : x.status),
      irsaliyeNo: irs, grNo,
      receivedQty: newRecv, remainingQty: left,
      history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:`GRN ${grNo}: +${qty} · kalan ${left} ${po.unit} · ${po.no}`}]
    }:x);
    cur.stock=stock;
    cur.audit.push(pushAudit("GRN", `${grNo} · ${po.no} · +${qty} · kalan ${left}`));
    showToast(full ? `${grNo} tam teslim · fatura ekranına düştü` : `${grNo} kısmi · kalan ${left} ${po.unit} · fatura ekranına düştü`);
    return cur;
  });
}
function handleGRReturn(poId){
  const reason=document.getElementById("gr-note-"+poId)?.value.trim();
  if(!reason){ showToast("İade gerekçesi zorunlu.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    cur.purchaseOrders=cur.purchaseOrders.map(x=>x.id===poId?{...x,status:"İade Edildi",returnReason:reason}:x);
    cur.requests=cur.requests.map(x=>x.id===po.requestId?{...x,status:"İade Edildi",returnReason:reason,history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"İade: "+reason}]}:x);
    cur.audit.push(pushAudit("PO İade", po.no+" · "+reason));
    showToast("İade kaydedildi.","red"); return cur;
  });
}

  const inv=state.data.invoices.filter(i=>i.supplier===name&&i.status==="Onaylandı").reduce((s,i)=>s+Number(i.total||0),0);
  const paid=state.data.payments.filter(p=>p.supplier===name&&p.status==="Ödendi").reduce((s,p)=>s+Number(p.amount||0),0);

function updateInvoicePreview(poId){
  const priceEl=document.getElementById("inv-price-"+poId);
  const kdvEl=document.getElementById("inv-kdv-"+poId);
  const totalEl=document.getElementById("inv-total-"+poId);
  if(!priceEl||!kdvEl) return;
  const qty=Number(priceEl.dataset.qty)||0;
  const price=Number(priceEl.value)||0;
  const kdv=Number(kdvEl.value)||0;
  const base=qty*price;
  const kdvAmt=base*(kdv/100);
  const expected=base+kdvAmt;
  const baseEl=document.getElementById("pv-base-"+poId);
  const kdvAmtEl=document.getElementById("pv-kdv-"+poId);
  const totEl=document.getElementById("pv-total-"+poId);
  const diffEl=document.getElementById("pv-diff-"+poId);
  if(baseEl) baseEl.textContent=fmtTL(base);
  if(kdvAmtEl) kdvAmtEl.textContent=fmtTL(kdvAmt);
  if(totEl) totEl.textContent=fmtTL(expected);
  // Auto-fill total if empty or was matching previous
  if(totalEl && (!totalEl.value || totalEl.dataset.autofill==="1")){
    totalEl.value=expected.toFixed(2);
    totalEl.dataset.autofill="1";
  }
  if(diffEl && totalEl){
    const invTotal=Number(totalEl.value)||0;
    const diff=invTotal-expected;
    const tol=Math.max(expected*0.02,1);
    if(!invTotal){ diffEl.textContent="—"; diffEl.style.color=""; }
    else if(Math.abs(diff)<=tol){ diffEl.textContent="✓ Uyumlu ("+fmtTL(diff)+")"; diffEl.style.color="var(--green)"; }
    else { diffEl.textContent="⚠ Fark: "+fmtTL(diff); diffEl.style.color="var(--red)"; }
  }
}

function handleInvoiceMatch(poId){
  const invNo=document.getElementById("inv-no-"+poId)?.value.trim();
  const total=Number(document.getElementById("inv-total-"+poId)?.value);
  const kdv=document.getElementById("inv-kdv-"+poId)?.value;
  const unitPrice=Number(document.getElementById("inv-price-"+poId)?.value);
  if(!invNo){ showToast("Fatura no zorunlu.","red"); return; }
  if(!total||total<=0){ showToast("Geçerli tutar girin.","red"); return; }

  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    const price=unitPrice||Number(po.unitPrice);
    const billQty=Math.max(0, (Number(po.receivedQty)||0) - (Number(po.invoicedQty)||0));
    if(billQty<=0){ showToast("Faturalanacak teslim miktarı yok.","red"); return cur; }
    const expectedBase=price*billQty;
    const expectedWithKdv=expectedBase*(1+Number(kdv)/100);
    const diff=Math.abs(total-expectedWithKdv);
    const match=diff<=Math.max(expectedWithKdv*0.02,1);
    const invC=(cur.counters.inv||0)+1; const invId="INV-"+String(invC).padStart(5,"0"); cur.counters.inv=invC;

    if(match){
      cur.invoices.push({id:uid(),no:invNo,systemNo:invId,poId:po.id,poNo:po.no,requestNo:po.requestNo,
        item:po.item,qty:billQty,unit:po.unit,supplier:po.supplier,kdv,total,unitPrice:price,
        status:"Onaylandı",date:nowISO(),matchedBy:state.session.fullName});
      cur.payments.push({id:uid(),invoiceNo:invNo,requestNo:po.requestNo,poNo:po.no,supplier:po.supplier,
        amount:total,status:"Ödeme Bekliyor",date:nowISO()});
      cur.purchaseOrders=cur.purchaseOrders.map(x=>{
        if(x.id!==poId) return x;
        const invd=(Number(x.invoicedQty)||0)+billQty;
        return {...x, invoicedQty:invd, uninvoicedQty:Math.max(0,(Number(x.receivedQty)||0)-invd)};
      });
      cur.audit.push(pushAudit("3-Way Match OK", invNo+" · "+po.no+" · qty "+billQty));
      showToast("Eşleşme başarılı. Ödeme listesine eklendi.");
    } else {
      cur.invoices.push({id:uid(),no:invNo,systemNo:invId,poId:po.id,poNo:po.no,requestNo:po.requestNo,
        item:po.item,qty:billQty,supplier:po.supplier,kdv,total,unitPrice:price,
        status:"Fiyat Uyuşmuyor",date:nowISO(),expected:expectedWithKdv,note:"Tolerans dışı"});
      cur.audit.push(pushAudit("Fatura Uyuşmazlık", invNo+" · beklenen "+expectedWithKdv.toFixed(2)));
      showToast(`Uyuşmazlık: Fatura ${fmtTL(total)} ≠ Beklenen ${fmtTL(expectedWithKdv)}`,"red");
    }
    return cur;
  });
}
function handleInvoiceReject(poId){
  const reason=prompt("İptal gerekçesi:");
  if(reason===null||!reason.trim()){ showToast("Gerekçe zorunlu.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    cur.purchaseOrders=cur.purchaseOrders.map(x=>x.id===poId?{...x,status:"İptal",cancelReason:reason}:x);
    cur.requests=cur.requests.map(x=>x.id===po.requestId?{...x,status:"İptal",cancelReason:reason,history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"İptal: "+reason}]}:x);
    cur.audit.push(pushAudit("PO/Fatura İptal", po.no+" · "+reason));
    showToast("İptal edildi.","red"); return cur;
  });
}
function handleExecutePayment(payId){
  const method=document.getElementById("pay-method")?.value;
  const details=document.getElementById("pay-details")?.value.trim();
  if(!details){ showToast("IBAN / detay zorunlu.","red"); return; }
  let paid=null;
  mutateData(cur=>{
    cur.payments=cur.payments.map(p=>{
      if(p.id!==payId) return p;
      paid={...p,method,methodDetails:details,status:"Ödendi",paidDate:nowISO(),paidBy:state.session.fullName};
      return paid;
    });
    if(paid) cur.audit.push(pushAudit("Ödeme", paid.invoiceNo+" · "+fmtTL(paid.amount)));
    return cur;
  });
  if(paid) generatePaymentReceiptPDF(paid);
  state.modal=null; showToast("Ödeme tamamlandı.");
}

function standardMechanicalCatalog(){
  // Stok 0 — standart talep / ürün kartı listesi
  const rows=[];
  const add=(code,name,cat,unit,min=0)=>rows.push({id:uid(),code,name,category:cat,unit,minLevel:min});
  // PVC boru (PN10/PN16 yaygın çaplar, metre)
  ["20","25","32","40","50","63","75","90","110"].forEach(d=>{
    add(`PVC-B-${d}`,`PVC Boru Ø${d} mm (6 m)`, "Mekanik Tesisat","Metre",0);
    add(`PVC-D-${d}`,`PVC Dirsek 90° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PVC-T-${d}`,`PVC Te Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PVC-M-${d}`,`PVC Muaf Ø${d} mm`, "Mekanik Tesisat","Adet",0);
  });
  // PVC redüksiyon / adaptör
  [["32","25"],["40","32"],["50","40"],["63","50"],["75","63"],["90","75"],["110","90"]].forEach(([a,b])=>{
    add(`PVC-R-${a}-${b}`,`PVC Redüksiyon Ø${a}→Ø${b} mm`, "Mekanik Tesisat","Adet",0);
  });
  // PPRC boru & fittings
  ["20","25","32","40","50","63","75"].forEach(d=>{
    add(`PPR-B-${d}`,`PPRC Boru Ø${d} mm PN20`, "Mekanik Tesisat","Metre",0);
    add(`PPR-D90-${d}`,`PPRC Dirsek 90° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-D45-${d}`,`PPRC Dirsek 45° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-T-${d}`,`PPRC Te Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-K-${d}`,`PPRC Kaplin (Manson) Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-BF-${d}`,`PPRC Dişi Adaptör Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-BM-${d}`,`PPRC Erkek Adaptör Ø${d} mm`, "Mekanik Tesisat","Adet",0);
  });
  [["25","20"],["32","25"],["40","32"],["50","40"],["63","50"]].forEach(([a,b])=>{
    add(`PPR-R-${a}-${b}`,`PPRC Redüksiyon Ø${a}→Ø${b} mm`, "Mekanik Tesisat","Adet",0);
  });
  // Yaygın ek malzemeler
  add("KELEP-25","Boru Kelepçesi Ø25","Mekanik Tesisat","Adet",0);
  add("KELEP-32","Boru Kelepçesi Ø32","Mekanik Tesisat","Adet",0);
  add("TEFLON","Teflon Bant","Sarf Malzeme","Adet",0);
  add("SILIKON","Silikon Kartuş","Sarf Malzeme","Adet",0);
  return rows;
}

function handleDbClean(){ handleDbReset("ops"); }
function handleDbReset(kind){
  if(kind==="ops" && !confirm("Talepler, PO, GRN, fatura, ödeme, hareketler silinecek. Cari/ürün/kullanıcı kalır. Emin misiniz?")) return;
  if(kind==="cari" && !confirm("Tüm cari firmalar silinecek. Emin misiniz?")) return;
  if(kind==="users" && !confirm("Admin dışındaki tüm kullanıcılar silinecek. Emin misiniz?")) return;
  if(kind==="wo" && !confirm("Tüm iş emirleri ve WO malzeme tüketimleri silinecek. Emin misiniz?")) return;
  if(kind==="mech" && !confirm("Ürün kartları mekanik katalog ile değişecek, stoklar 0 olacak. Emin misiniz?")) return;
  if(kind==="full" && !confirm("KOMPLE SIFIRLA: her şey silinir, admin + mekanik katalog kalır. Son kez onaylıyor musunuz?")) return;

  if(kind==="users"){
    const adminOnly=(state.users||[]).filter(u=>u.role==="admin");
    const keep=adminOnly.length?adminOnly:seedUsers();
    saveUsers(keep);
    showToast("Kullanıcılar sıfırlandı (admin korundu).");
    return;
  }

  mutateData(cur=>{
    if(kind==="ops"){
      const next={...seedData(), company:cur.company, suppliers:cur.suppliers, products:cur.products, equipment:cur.equipment};
      next.stock=zeroStockFromProducts(cur.products);
      next.audit.push(pushAudit("DB Ops Temizlik","Admin"));
      showToast("İşlem verileri temizlendi."); return next;
    }
    if(kind==="cari"){
      cur.suppliers=[];
      cur.audit.push(pushAudit("Cari Sıfırlandı","Admin"));
      showToast("Cariler silindi."); return cur;
    }
    if(kind==="wo"){
      cur.workOrders=[]; cur.consumptions=[];
      cur.audit.push(pushAudit("İş Emirleri Sıfırlandı","Admin"));
      showToast("İş emirleri silindi."); return cur;
    }
    if(kind==="mech"){
      const products=standardMechanicalCatalog();
      cur.products=products;
      cur.stock=zeroStockFromProducts(products);
      cur.audit.push(pushAudit("Mekanik Katalog Yüklendi", products.length+" kalem · stok 0"));
      showToast(`Katalog yüklendi (${products.length} kalem), stok 0.`); return cur;
    }
    if(kind==="full"){
      const products=standardMechanicalCatalog();
      const next={...seedData(), products, stock:zeroStockFromProducts(products), company:cur.company||seedData().company};
      next.audit.push(pushAudit("Komple DB Sıfırlama","Admin"));
      showToast("Komple sıfırlandı + mekanik katalog."); return next;
    }
    return cur;
  });
  if(kind==="full"){
    const adminOnly=(state.users||[]).filter(u=>u.role==="admin");
    saveUsers(adminOnly.length?adminOnly:seedUsers());
  }
}

/* ============================ FORM HANDLERS ============================ */
function handleCariFormSubmit(){
  const name=document.getElementById("cf-name").value.trim(); if(!name){ showToast("Ünvan zorunlu.","red"); return; }
  mutateData(cur=>{
    cur.suppliers=[...(cur.suppliers||[]),{id:uid(),name,contact:document.getElementById("cf-contact").value.trim(),
      taxOffice:document.getElementById("cf-taxOffice").value.trim(),taxNo:document.getElementById("cf-taxNo").value.trim(),phone:document.getElementById("cf-phone").value.trim()}];
    cur.audit.push(pushAudit("Cari Eklendi",name)); state.modal=null; showToast("Eklendi."); return cur;
  });
}
function handleCariDelete(id){
  if(!confirm("Silinsin mi?")) return;
  mutateData(cur=>{ const s=cur.suppliers.find(x=>x.id===id); cur.suppliers=cur.suppliers.filter(x=>x.id!==id); cur.audit.push(pushAudit("Cari Silindi",s?.name||id)); showToast("Silindi."); return cur; });
}
function handleUserFormSubmit(){
  const fullName=document.getElementById("uf-name").value.trim(), username=document.getElementById("uf-username").value.trim(), password=document.getElementById("uf-password").value, role=document.getElementById("uf-role").value;
  if(!fullName||!username||!password){ showToast("Tüm alanlar zorunlu.","red"); return; }
  if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ showToast("Kullanıcı adı mevcut.","red"); return; }
  saveUsers([...state.users,{id:uid(),fullName,username,password,role,active:true,createdAt:nowISO()}]);
  state.modal=null; showToast("Oluşturuldu.");
}
function handleUserDelete(id){ if(!confirm("Silinsin mi?")) return; saveUsers(state.users.filter(u=>u.id!==id)); showToast("Silindi."); }
function handleProductFormSubmit(){
  const code=document.getElementById("pf-code").value.trim(), name=document.getElementById("pf-name").value.trim();
  if(!code||!name){ showToast("Kod ve ad zorunlu.","red"); return; }
  mutateData(cur=>{
    cur.products=[...(cur.products||[]),{id:uid(),code,name,category:document.getElementById("pf-category").value,unit:document.getElementById("pf-unit").value,minLevel:Number(document.getElementById("pf-min").value)||0}];
    cur.audit.push(pushAudit("Ürün Eklendi",code+" · "+name)); state.modal=null; showToast("Eklendi."); return cur;
  });
}
function handleProductDelete(id){
  if(!confirm("Silinsin mi?")) return;
  mutateData(cur=>{ const p=cur.products.find(x=>x.id===id); cur.products=cur.products.filter(x=>x.id!==id); cur.audit.push(pushAudit("Ürün Silindi",p?.name||id)); showToast("Silindi."); return cur; });
}
function handleEqFormSubmit(){
  const code=document.getElementById("eq-code").value.trim(), name=document.getElementById("eq-name").value.trim();
  if(!code||!name){ showToast("Kod ve ad zorunlu.","red"); return; }
  const norm=normalizeLatLng(parseCoord(document.getElementById("eq-lat")?.value), parseCoord(document.getElementById("eq-lng")?.value));
  mutateData(cur=>{
    cur.equipment=[...(cur.equipment||[]),{id:uid(),code,name,
      location:document.getElementById("eq-location").value.trim(),
      type:document.getElementById("eq-type").value.trim(),
      lat: norm?norm.lat:null, lng: norm?norm.lng:null
    }];
    cur.audit.push(pushAudit("Ekipman Eklendi",code+" · "+name+(norm?` · enlem ${norm.lat}, boylam ${norm.lng}`:"")));
    state.modal=null; showToast(norm?"Eklendi (konum kaydedildi).":"Eklendi (konum yok)."); return cur;
  });
}
function getCoordsForWO(w){
  if(!w) return null;
  if(w.lat!=null && w.lng!=null && Number.isFinite(Number(w.lat)) && Number.isFinite(Number(w.lng))){
    return { lat:Number(w.lat), lng:Number(w.lng), label:w.location||w.equipment||w.title||w.no };
  }
  const eq = w.equipmentId
    ? (state.data.equipment||[]).find(e=>e.id===w.equipmentId)
    : (state.data.equipment||[]).find(e=>e.name && w.equipment && e.name===w.equipment);
  if(eq && eq.lat!=null && eq.lng!=null && Number.isFinite(Number(eq.lat)) && Number.isFinite(Number(eq.lng))){
    return { lat:Number(eq.lat), lng:Number(eq.lng), label:eq.name||w.location||w.title };
  }
  return null;
}
function routeUrlGoogle(lat,lng){ return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`; }
function routeUrlApple(lat,lng){ return `https://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`; }
function routeUrlOSM(lat,lng){ return `https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=;${lat}%2C${lng}#map=15/${lat}/${lng}`; }
function mapUrlPin(lat,lng){ return `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=17/${lat}/${lng}`; }
function renderRouteButtons(lat,lng,extraClass=""){
  if(!Number.isFinite(Number(lat))||!Number.isFinite(Number(lng))) return "";
  return `<div class="flex-wrap-gap ${extraClass}" style="margin-top:8px;">
    <a class="btn btn-primary" style="padding:8px 12px;font-size:12px;text-decoration:none;" href="${routeUrlGoogle(lat,lng)}" target="_blank" rel="noopener">🚗 Google Rota</a>

function parseCoord(v){
  if(v==null||v==="") return null;
  const n=Number(String(v).trim().replace(",","."));
  return Number.isFinite(n) ? n : null;
}
/** Leaflet / GPS her zaman [enlem, boylam] = [latitude, longitude] */
function normalizeLatLng(lat,lng){
  let a=Number(lat), b=Number(lng);
  if(!Number.isFinite(a)||!Number.isFinite(b)) return null;
  // Yanlışlıkla ters yazılmışsa düzelt (enlem asla ±90 dışı olamaz)
  if(Math.abs(a)>90 && Math.abs(b)<=90){ const t=a; a=b; b=t; }
  if(a<-90||a>90||b<-180||b>180) return null;
  // (0,0) okyanus — geçersiz say
  if(Math.abs(a)<1e-6 && Math.abs(b)<1e-6) return null;
  return { lat:a, lng:b };
}
function setLatLngInputs(lat,lng){
  const norm=normalizeLatLng(lat,lng);
  if(!norm){ showToast("Geçersiz koordinat.","red"); return false; }
  const latEl=document.getElementById("eq-lat")||document.getElementById("wo-lat");
  const lngEl=document.getElementById("eq-lng")||document.getElementById("wo-lng");
  // Sıra kritik: enlem → lat alanı, boylam → lng alanı
  if(latEl){ latEl.value=norm.lat.toFixed(6); latEl.setAttribute("data-geo","lat"); }
  if(lngEl){ lngEl.value=norm.lng.toFixed(6); lngEl.setAttribute("data-geo","lng"); }
  applyPickerView(norm.lat, norm.lng);
  return true;
}
function applyPickerView(lat,lng){
  if(!_pickerMap) return;
  try{
    const ll=L.latLng(lat,lng); // Leaflet: (lat, lng) — asla ters değil
    if(_pickerMarker) _pickerMarker.setLatLng(ll);
    else _pickerMarker=L.marker(ll,{draggable:true}).addTo(_pickerMap);
    _pickerMap.setView(ll, Math.max(_pickerMap.getZoom()||14, 16), { animate:true });
  }catch(e){ console.warn(e); }
}
function fillGeoFromDevice(){
  const secure=window.isSecureContext || location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1";
  if(!secure){
    showToast("Konum için HTTPS veya localhost gerekir. Haritada Hatay’a yakınlaştırıp tıklayın.","amber");
    return;
  }
  if(!navigator.geolocation){ showToast("Tarayıcı konum desteklemiyor. Haritadan tıklayın.","red"); return; }
  showToast("GPS konumu alınıyor…","amber");

  const onOk=function(pos){
    // Geolocation API: coords.latitude = enlem, coords.longitude = boylam
    const latitude=pos.coords.latitude;
    const longitude=pos.coords.longitude;
    const norm=normalizeLatLng(latitude, longitude);
    if(!norm){
      showToast("Cihaz geçersiz koordinat verdi. Haritadan seçin.","red");
      return;
    }
    // Boylam ~0 veya Afrika bandı gibi bariz hataları reddet (Hatay ~36.2, 36.1)
    if(Math.abs(norm.lng)<1 && Math.abs(norm.lat)<40){
      showToast("Konum hatalı (Afrika/okyanus). İzni kontrol edip tekrar deneyin veya haritadan seçin.","red");
      return;
    }
    setLatLngInputs(norm.lat, norm.lng);
    if(!_pickerMap) initGeoPickerMap();
    applyPickerView(norm.lat, norm.lng);
    showToast("Konum alındı: enlem "+norm.lat.toFixed(5)+" · boylam "+norm.lng.toFixed(5));
  };
  const onErr=function(err){
    const code=err && err.code;
    let msg="Konum alınamadı.";
    if(code===1) msg="Konum izni reddedildi. Tarayıcı / telefon konum iznini açın.";
    else if(code===2) msg="Konum bilgisi yok. GPS açın veya haritadan tıklayın.";
    else if(code===3) msg="Zaman aşımı. Açık alanda tekrar deneyin veya haritadan seçin.";
    showToast(msg,"red");
  };
  // Önce yüksek doğruluk (GPS), olmazsa ağ konumu
  navigator.geolocation.getCurrentPosition(onOk, function(err){
    navigator.geolocation.getCurrentPosition(onOk, onErr, {
      enableHighAccuracy:false, timeout:12000, maximumAge:60000
    });
  }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}
let _pickerMap=null, _pickerMarker=null;
function initGeoPickerMap(){
  const el=document.getElementById("eq-map-picker")||document.getElementById("wo-map-picker");
  if(!el || typeof L==="undefined") return;
  try{ if(_pickerMap){ _pickerMap.remove(); _pickerMap=null; _pickerMarker=null; } }catch(e){}
  const latEl=document.getElementById("eq-lat")||document.getElementById("wo-lat");
  const lngEl=document.getElementById("eq-lng")||document.getElementById("wo-lng");
  let lat=parseCoord(latEl?.value), lng=parseCoord(lngEl?.value);
  const norm=normalizeLatLng(lat,lng);
  // Varsayılan: Türkiye ortası (Hatay/İstanbul kayması yok, Afrika hiç değil)
  if(!norm){ lat=39.0; lng=35.2; } else { lat=norm.lat; lng=norm.lng; }
  _pickerMap=L.map(el,{ zoomControl:true, minZoom:4, maxZoom:19 }).setView([lat,lng], norm?15:6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{ maxZoom:19, attribution:"© OSM" }).addTo(_pickerMap);
  _pickerMarker=L.marker([lat,lng],{ draggable:true }).addTo(_pickerMap);
  _pickerMarker.on("dragend",()=>{
    const p=_pickerMarker.getLatLng();
    // Leaflet LatLng: .lat = enlem, .lng = boylam
    setLatLngInputs(p.lat, p.lng);
  });
  _pickerMap.on("click",e=>{
    const la=e.latlng.lat, lo=e.latlng.lng;
    _pickerMarker.setLatLng([la,lo]);
    setLatLngInputs(la, lo);
    showToast("Seçildi: "+la.toFixed(5)+", "+lo.toFixed(5));
  });
  setTimeout(()=>{ try{ _pickerMap.invalidateSize(); }catch(e){} }, 200);
}

function handleFieldOutSubmit(){
  const itemVal=document.getElementById("fo-item")?.value, qty=Number(document.getElementById("fo-qty")?.value);
  const person=document.getElementById("fo-person")?.value.trim(), location=document.getElementById("fo-location")?.value.trim();

  mutateData(cur=>{
    let stock=[...cur.stock];

    cur.audit.push(pushAudit("Saha Sevk",itemName+" · "+qty+" · "+location));

function handleStockImportFile(file){
  if(!file) return;
  if(!roleCan("stock_out") && state.session.role!=="admin"){ showToast("Yetkiniz yok.","red"); return; }
  const name=(file.name||"").toLowerCase();
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      let rows=[];
      if(name.endsWith(".csv")){
        const text=String(ev.target.result||"");
        const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<2){ showToast("CSV boş veya başlıksız.","red"); return; }
        const sep=lines[0].includes(";")&&!lines[0].includes(",") ? ";" : ",";
        const headers=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,""));
          const obj={}; headers.forEach((h,j)=>obj[h]=cols[j]||"");
          rows.push(obj);
        }
      } else {
        if(typeof XLSX==="undefined"){ showToast("Excel kütüphanesi yüklenemedi. CSV deneyin.","red"); return; }
        const data=new Uint8Array(ev.target.result);
        const wb=XLSX.read(data,{type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
      }
      applyStockImportRows(rows);
    }catch(err){
      console.error(err);
      showToast("Dosya okunamadı: "+(err.message||"hata"),"red");
    }
  };
  if(name.endsWith(".csv")) reader.readAsText(file,"utf-8");
  else reader.readAsArrayBuffer(file);
}
function pickField(row, keys){
  const entries=Object.entries(row);
  for(const k of keys){
    const found=entries.find(([h])=>String(h).toLowerCase().trim()===k || String(h).toLowerCase().includes(k));
    if(found && found[1]!=="" && found[1]!=null) return String(found[1]).trim();
  }
  return "";
}
function applyStockImportRows(rows){
  if(!rows||!rows.length){ showToast("Satır bulunamadı.","red"); return; }
  let updated=0, added=0;
  mutateData(cur=>{
    let stock=[...cur.stock];
    let products=[...cur.products];
    rows.forEach(row=>{
      const item=pickField(row,["ürün","urun","malzeme","item","name","ad","ürün adı","urun adi"]);
      const qtyRaw=pickField(row,["miktar","qty","stok","quantity","adet"]);
      const unit=pickField(row,["birim","unit"])||"Adet";
      const category=pickField(row,["kategori","category","grup"])||"Diğer";
      const code=pickField(row,["kod","code","sku"]);
      const minRaw=pickField(row,["min","minimum","min stok","minlevel"]);
      if(!item) return;
      const qty=Number(String(qtyRaw).replace(",","."))||0;
      const minLevel=Number(String(minRaw).replace(",","."))||0;
      const sIdx=stock.findIndex(s=>s.item.toLowerCase()===item.toLowerCase() && String(s.unit).toLowerCase()===unit.toLowerCase());
      if(sIdx>=0){ stock[sIdx]={...stock[sIdx], qty, category, minLevel: minLevel||stock[sIdx].minLevel||0}; updated++; }
      else { stock.push({id:uid(), item, category, unit, qty, minLevel}); added++; }
      if(code || !products.some(p=>p.name.toLowerCase()===item.toLowerCase())){
        if(!products.some(p=>p.name.toLowerCase()===item.toLowerCase())){
          products.push({id:uid(), code:code||("IMP-"+String(products.length+1).padStart(4,"0")), name:item, category, unit, minLevel});
        }
      }
    });
    cur.stock=stock;
    cur.products=products;
    cur.movements.push({id:uid(),at:nowISO(),type:"Excel Import",item:"Toplu stok",qty:updated+added,unit:"satır",ref:fileNameSafe(),by:state.session.fullName});
    cur.audit.push(pushAudit("Stok Import", `+${added} yeni · ${updated} güncellendi`));
    showToast(`Stok aktarıldı: ${added} yeni, ${updated} güncellendi.`);
    return cur;
  });
}
function fileNameSafe(){ return "import_"+new Date().toISOString().slice(0,10); }
