function handleCampRoomDup(roomId){
  if(!["admin","yonetici","kamp_amiri"].includes(state.session.role)){ showToast("Yetkiniz yok.","red"); return; }
  if(!roomId){ showToast("Oda seçilmedi.","amber"); return; }
  try{
    mutateData(cur=>{
      if(!Array.isArray(cur.campRooms)) cur.campRooms=[];
      const src=cur.campRooms.find(r=>r.id===roomId);
      if(!src){ showToast("Oda bulunamadı.","amber"); return cur; }
      if(!cur.counters) cur.counters={};
      const c=(cur.counters.room||0)+1; cur.counters.room=c;
      // Oda numarası: isimdeki sayıyı +1
      const srcNo=String(src.name||src.code||"").trim();
      const m=srcNo.match(/^(.*?)(\d+)(\D*)$/);
      let newName;
      if(m){
        const num=Number(m[2])+1;
        const pad=m[2].length;
        newName=(m[1]||"")+String(num).padStart(pad,"0")+(m[3]||"");
      } else {
        newName=srcNo ? srcNo+"-2" : String(c);
      }
      // Aynı isim varsa artırmaya devam
      let guard=0;
      while(cur.campRooms.some(r=>r.active!==false && String(r.name||"")===newName) && guard<50){
        const m2=String(newName).match(/^(.*?)(\d+)(\D*)$/);
        if(m2){
          const num=Number(m2[2])+1;
          newName=(m2[1]||"")+String(num).padStart(m2[2].length,"0")+(m2[3]||"");
        } else newName=newName+"x";
        guard++;
      }
      cur.campRooms.push({
        id:uid(), no:"ODA-"+String(c).padStart(3,"0"),
        code:newName, name:newName,
        capacity:Math.min(10, Number(src.capacity)||4),
        block:src.block||"", floor:src.floor||"",
        condition:src.condition||"Kullanıma hazır",
        note:src.note||"", active:true, createdAt:nowISO(),
        clonedFrom:src.id
      });
      cur.audit=cur.audit||[];
      cur.audit.push(pushAudit("Kamp Oda Çoğalt", (src.name||src.code||"")+" → "+newName));
      showToast("Oda çoğaltıldı: "+newName);
      return cur;
    });
  }catch(err){
    console.error(err);
    showToast("Çoğaltma hatası: "+(err.message||err),"red");
  }
}
function handleCampRoomSave(editId){
  if(!["admin","yonetici","kamp_amiri"].includes(state.session.role)){ showToast("Yetkiniz yok.","red"); return; }
  const roomNo=(document.getElementById("camp-room-no")?.value||document.getElementById("camp-room-name")?.value||"").trim();
  const capacity=Math.min(10, Math.max(0, Number(document.getElementById("camp-room-cap")?.value)||0));
  const block=(document.getElementById("camp-room-block")?.value||"").trim();
  const floor=(document.getElementById("camp-room-floor")?.value||"").trim();
  const condition=document.getElementById("camp-room-cond")?.value||"Kullanıma hazır";
  const note=(document.getElementById("camp-room-note")?.value||"").trim();
  if(!roomNo){ showToast("Oda numarası zorunlu.","red"); return; }
  state.modal=null;
  mutateData(cur=>{
    if(!Array.isArray(cur.campRooms)) cur.campRooms=[];
    if(!cur.counters) cur.counters={};
    if(cur.counters.room==null) cur.counters.room=0;
    // Aynı blok+katta aynı oda no uyarısı
    const dup=cur.campRooms.find(x=>x.active!==false && x.id!==editId && String(x.name||x.code||"")===roomNo && String(x.block||"")===block && String(x.floor||"")===floor);
    if(dup){ showToast("Bu blok/katta oda numarası zaten var: "+roomNo,"amber"); return cur; }
    if(editId){
      const r=cur.campRooms.find(x=>x.id===editId);
      if(!r){ showToast("Oda bulunamadı.","amber"); return cur; }
      r.code=roomNo; r.name=roomNo; r.capacity=capacity; r.block=block; r.floor=floor; r.condition=condition; r.note=note; r.active=true;
      cur.audit=cur.audit||[];
      cur.audit.push(pushAudit("Kamp Oda Güncellendi", "Oda "+roomNo+" · "+(block||"")+" · "+floor));
      showToast("Oda güncellendi · kaydediliyor…");
    } else {
      const c=(Number(cur.counters.room)||0)+1; cur.counters.room=c;
      cur.campRooms.push({
        id:uid(), no:"ODA-"+String(c).padStart(3,"0"),
        code:roomNo, name:roomNo,
        capacity, block, floor, condition, note,
        active:true, createdAt:nowISO()
      });
      cur.audit=cur.audit||[];
      cur.audit.push(pushAudit("Kamp Oda", "Oda "+roomNo+" · toplam "+cur.campRooms.filter(x=>x.active!==false).length));
      showToast("Oda "+roomNo+" eklendi · kaydediliyor…");
    }
    return cur;
  });
}

function handleCampRezSave(){
  if(!["admin","yonetici","kamp_amiri"].includes(state.session.role)){ showToast("Yetkiniz yok.","red"); return; }
  const roomId=document.getElementById("camp-rez-room")?.value||"";
  const personName=(document.getElementById("camp-rez-name")?.value||"").trim();
  const phone=(document.getElementById("camp-rez-phone")?.value||"").trim();
  const subId=document.getElementById("camp-rez-sub")?.value||"";
  const note=(document.getElementById("camp-rez-note")?.value||"").trim();
  const from=document.getElementById("camp-rez-from")?.value||"";
  const to=document.getElementById("camp-rez-to")?.value||"";
  if(!roomId||!personName||!from){ showToast("Oda, misafir ve giriş tarihi zorunlu.","red"); return; }

function handleCampRezCheckin(stayId){
  mutateData(cur=>{
    const s=(cur.campStays||[]).find(x=>x.id===stayId);
    if(!s || s.status!=="Rezerve"){ showToast("Rezervasyon yok.","amber"); return cur; }
    const room=(cur.campRooms||[]).find(r=>r.id===s.roomId);
    if(room && ["Kapalı","Bakımda","Arızalı"].includes(room.condition||"")){ showToast("Oda "+room.condition,"amber"); return cur; }
    s.status="Konaklayan"; s.checkIn=nowISO(); s.checkInBy=state.session.fullName;
    cur.audit.push(pushAudit("Rezervasyon Giriş", (s.no||"")+" · "+s.personName));
    showToast("Giriş: "+s.personName);
    return cur;
  });
}
function handleCampRezCancel(stayId){

    if(!cur.counters) cur.counters={};
    const c=(Number(cur.counters.stay)||0)+1; cur.counters.stay=c;
    cur.campStays.unshift({
      id:uid(), no:"KNK-"+String(c).padStart(5,"0"),

      personName, phone,

/** Taşeron + kişi sayısı ile toplu giriş; isimler sonra düzenlenir */
function handleCampBulkCheckin(){
  if(!["admin","yonetici","kamp_amiri"].includes(state.session.role)){ showToast("Yetkiniz yok.","red"); return; }
  const roomEl=document.getElementById("camp-bulk-room");
  const subEl=document.getElementById("camp-bulk-sub");
  const roomId=(roomEl && roomEl.value)||"";
  const subId=(subEl && subEl.value)||"";
  const count=Math.floor(Number(document.getElementById("camp-bulk-count")?.value)||0);
  const note=(document.getElementById("camp-bulk-note")?.value||"").trim();
  const checkIn=document.getElementById("camp-bulk-date")?.value || nowISO().slice(0,10);
  if(!roomId){ showToast("Oda seçin.","red"); return; }
  if(!subId){ showToast("Taşeron seçin (Taşeronlar menüsünden tanımlayın).","red"); return; }
  if(count<1 || count>80){ showToast("Kontenjan 1–80 arası olmalı.","red"); return; }
  state.modal=null;
  state.campTab="konaklayan";
  try{
  mutateData(cur=>{
    if(!Array.isArray(cur.campStays)) cur.campStays=[];
    if(!cur.counters) cur.counters={};
    if(cur.counters.stay==null) cur.counters.stay=0;
    const room=(cur.campRooms||[]).find(r=>r.id===roomId);
    if(!room){ showToast("Oda yok.","red"); return cur; }
    if(["Kapalı","Bakımda","Arızalı"].includes(room.condition||"")){ showToast("Oda "+room.condition,"amber"); return cur; }
    const sub=(cur.subcontractors||[]).find(x=>x.id===subId);
    if(!sub){ showToast("Taşeron yok.","red"); return cur; }
    const occCur=campRoomOcc(roomId, cur.campStays);
    const cap=Math.min(10, Number(room.capacity)||0);
    const free=cap>0?Math.max(0,cap-occCur):count;
    if(cap>0 && count>free){ showToast("Boş yatak: "+free+" · kontenjan "+count+" sığmaz.","amber"); return cur; }
    const existing=(cur.campStays||[]).find(s=>s.roomId===roomId && s.status==="Konaklayan" && s.subId===sub.id && s.isQuota);
    if(existing){
      const nextHc=(Number(existing.headcount)||0)+count;
      if(cap>0 && (occCur - campStayBeds(existing) + nextHc) > cap){
        showToast("Kapasite aşılır.","amber"); return cur;
      }
      existing.headcount=nextHc;
      existing.isQuota=true;
      existing.personName=(sub.name||"Kontenjan")+" · "+nextHc+" kişi";
      existing.note=note||existing.note||"";
      existing.updatedAt=nowISO();
      cur.audit=cur.audit||[];
      cur.audit.push(pushAudit("Kamp Kontenjan +", "+"+count+" · "+(room.code||"")+" · "+sub.name+" → "+nextHc));
      showToast("Kontenjan: "+nextHc+" kişi (toplam saha "+campTotalOccupied(cur.campStays)+" kişi)");
      return cur;
    }
    const c=(Number(cur.counters.stay)||0)+1; cur.counters.stay=c;
    const at=checkIn.length===10?checkIn+"T08:00:00":checkIn;
    cur.campStays.unshift({
      id:uid(), no:"KNT-"+String(c).padStart(5,"0"),
      roomId, roomCode:room.code, roomName:room.name,
      personName:(sub.name||"Kontenjan")+" · "+count+" kişi",
      phone:"",
      subId:sub.id, subName:sub.name, subType:sub.type||null,
      checkIn:at, checkOut:null, status:"Konaklayan",
      headcount:count, isQuota:true,
      note:note||("Kontenjan · "+sub.name),
      by:state.session.fullName, at:nowISO()
    });
    cur.audit=cur.audit||[];
    cur.audit.push(pushAudit("Kamp Kontenjan", count+" kişi · "+(room.code||room.name)+" · "+sub.name));
    const tot=campTotalOccupied(cur.campStays);
    showToast(count+" kişi işlendi · saha toplamı "+tot+" kişi");
    return cur;
  });
  }catch(err){ console.error(err); showToast("Kontenjan hatası: "+(err.message||err),"red"); }
}
function handleCampStayRename(stayId){
  if(!["admin","yonetici","kamp_amiri"].includes(state.session.role)){ showToast("Yetkiniz yok.","red"); return; }
  const note=(document.getElementById("camp-stay-note")?.value||"").trim();
  mutateData(cur=>{
    const s=(cur.campStays||[]).find(x=>x.id===stayId);
    if(!s){ showToast("Kayıt yok.","amber"); return cur; }
    if(s.isQuota){
      const hc=Math.floor(Number(document.getElementById("camp-stay-hc")?.value)||0);
      if(hc<1||hc>80){ showToast("Kontenjan 1–80.","red"); return cur; }
      const room=(cur.campRooms||[]).find(r=>r.id===s.roomId);
      const others=(cur.campStays||[]).filter(x=>x.roomId===s.roomId && x.status==="Konaklayan" && x.id!==s.id)
        .reduce((a,x)=>a+(Number(x.headcount)>0?Number(x.headcount):1),0);
      const cap=Number(room?.capacity)||0;
      if(cap>0 && others+hc>cap){ showToast("Kapasite aşılır (boş "+Math.max(0,cap-others)+").","amber"); return cur; }
      const old=s.headcount;
      s.headcount=hc;
      s.personName=(s.subName||"Kontenjan")+" · "+hc+" kişi";
      if(note!=="") s.note=note;
      s.updatedAt=nowISO();
      cur.audit.push(pushAudit("Kamp Kontenjan", (old||"")+" → "+hc+" · "+(s.roomCode||"")));
      showToast("Kontenjan: "+hc+" kişi");
      return cur;
    }
    const personName=(document.getElementById("camp-stay-name")?.value||"").trim();
    const phone=(document.getElementById("camp-stay-phone")?.value||"").trim();
    if(!personName){ showToast("İsim zorunlu.","red"); return cur; }
    const old=s.personName;
    s.personName=personName;
    s.phone=phone;
    if(note!=="") s.note=note;
    s.namePlaceholder=false;
    cur.audit.push(pushAudit("Kamp İsim", (old||"")+" → "+personName));
    showToast("İsim güncellendi");
    return cur;
  });
  state.modal=null;
}

function handleSubSave(editId){
  const name=(document.getElementById("sub-name")?.value||"").trim();
  const type=document.getElementById("sub-type")?.value||"Diğer";
  const contact=(document.getElementById("sub-contact")?.value||"").trim();
  const phone=(document.getElementById("sub-phone")?.value||"").trim();
  const note=(document.getElementById("sub-note")?.value||"").trim();
  const workScope=(document.getElementById("sub-scope")?.value||"").trim();
  const contractAmount=Number(document.getElementById("sub-contract")?.value);
  const foreman=(document.getElementById("sub-foreman")?.value||"").trim();
  const foremanPhone=(document.getElementById("sub-foreman-phone")?.value||"").trim();
  const engineer=(document.getElementById("sub-engineer")?.value||"").trim();
  const engineerPhone=(document.getElementById("sub-engineer-phone")?.value||"").trim();
  const taxNo=(document.getElementById("sub-tax")?.value||"").trim();
  const iban=(document.getElementById("sub-iban")?.value||"").trim();
  const supplierName=(document.getElementById("sub-cari")?.value||"").trim();
  if(!name){ showToast("Taşeron adı zorunlu.","red"); return; }
  const payload={
    name, type, contact, phone, note, workScope,
    contractAmount: Number.isFinite(contractAmount)&&contractAmount>=0?contractAmount:null,
    foreman, foremanPhone, engineer, engineerPhone, taxNo, iban, supplierName
  };
  mutateData(cur=>{
    if(!Array.isArray(cur.subcontractors)) cur.subcontractors=[];
    if(!Array.isArray(cur.suppliers)) cur.suppliers=[];
    // Cari yoksa oluştur (taşeron carisi)
    if(supplierName){
      let sup=cur.suppliers.find(x=>foldTR(x.name)===foldTR(supplierName));
      if(!sup){
        sup={id:uid(), name:supplierName, contact:contact||foreman, phone:phone||foremanPhone, taxNo, note:"Taşeron cari · "+name, kind:"taşeron"};
        cur.suppliers=[sup, ...cur.suppliers];
      }
      payload.supplierId=sup.id;
      payload.supplierName=sup.name;
    }
    if(editId){
      const s=cur.subcontractors.find(x=>x.id===editId);
      if(s) Object.assign(s, payload);
      cur.audit.push(pushAudit("Taşeron Güncellendi", name+" · "+type));
    } else {
      const c=(cur.counters.sub||0)+1; cur.counters.sub=c;
      cur.subcontractors.push({id:uid(), no:"TAS-"+String(c).padStart(4,"0"), ...payload, active:true, createdAt:nowISO()});
      cur.audit.push(pushAudit("Taşeron Eklendi", name+" · "+type+(payload.contractAmount!=null?" · sözleşme "+payload.contractAmount:"")));
    }
    showToast(editId?"Güncellendi":"Taşeron eklendi");
    return cur;
  });
  state.modal=null;
}
function handleSubHakSave(editId){
  if(!["admin","yonetici","muhasebe"].includes(state.session.role)){ showToast("Yetkiniz yok.","red"); return; }
  const subId=document.getElementById("hak-sub")?.value||state.modal?.subId||"";
  const period=(document.getElementById("hak-period")?.value||"").trim();
  const workDesc=(document.getElementById("hak-work")?.value||"").trim();
  const workKind=document.getElementById("hak-kind")?.value||"İşçilik";
  const laborRaw=document.getElementById("hak-labor")?.value;
  const matRaw=document.getElementById("hak-material")?.value;
  const ihzRaw=document.getElementById("hak-ihrazat")?.value;
  const grossLegacy=Number(document.getElementById("hak-gross")?.value);
  const laborAmount=laborRaw!==""&&laborRaw!=null?Number(laborRaw):null;
  const materialAmount=matRaw!==""&&matRaw!=null?Number(matRaw):0;
  const ihrazatAmount=ihzRaw!==""&&ihzRaw!=null?Number(ihzRaw):0;
  let gross;
  if(laborAmount!=null && Number.isFinite(laborAmount)){
    gross=(laborAmount||0)+(Number.isFinite(materialAmount)?materialAmount:0)+(Number.isFinite(ihrazatAmount)?ihrazatAmount:0);
  } else if(Number.isFinite(grossLegacy) && grossLegacy>=0){
    gross=grossLegacy;
  } else {
    showToast("İşçilik veya brüt tutar girin.","red"); return;
  }
  if(!Number.isFinite(gross)||gross<0){ showToast("Geçersiz tutar.","red"); return; }
  const paidRaw=document.getElementById("hak-paid")?.value;
  let paidAmount=null;
  if(paidRaw!==""&&paidRaw!=null&&Number.isFinite(Number(paidRaw))) paidAmount=Math.max(0,Number(paidRaw));
  const invoiceNo=(document.getElementById("hak-invoice")?.value||"").trim();
  const invoiceDate=document.getElementById("hak-inv-date")?.value||"";
  const status=document.getElementById("hak-status")?.value||"Taslak";
  const note=(document.getElementById("hak-note")?.value||"").trim();
  if(!subId){ showToast("Taşeron seçin.","red"); return; }
  const dedTypes=["Avans mahsup","Stopaj","Ceza / gecikme","Teminat","Eksik iş","Diğer"];
  const deductions=[];
  dedTypes.forEach((tp,i)=>{
    const el=document.getElementById("hak-ded-"+i);
    const amt=Number(el?.value);
    if(Number.isFinite(amt)&&amt>0) deductions.push({ type:tp, amount:amt });
  });
  const dedSum=deductions.reduce((s,x)=>s+x.amount,0);
  const net=Math.max(0,gross-dedSum);
  // Ödendi durumunda paid boşsa net kabul
  if(status==="Ödendi" && paidAmount==null) paidAmount=net;
  mutateData(cur=>{
    if(!Array.isArray(cur.subHakedis)) cur.subHakedis=[];
    if(!cur.counters) cur.counters={};
    if(cur.counters.hak==null) cur.counters.hak=0;
    const sub=(cur.subcontractors||[]).find(x=>x.id===subId);
    const fields={
      subId, subName:sub?.name||"", period, workDesc, workKind,
      gross, laborAmount: laborAmount!=null?laborAmount:null,
      materialAmount: Number(materialAmount)||0,
      ihrazatAmount: Number(ihrazatAmount)||0,
      paidAmount: paidAmount,
      deductions, invoiceNo, invoiceDate, status, note,
      by:state.session.fullName
    };
    if(editId){
      const h=cur.subHakedis.find(x=>x.id===editId);
      if(h){
        Object.assign(h, fields, { updatedAt:nowISO() });
        if(h.subName===undefined) h.subName=sub?.name||"";
      }
      cur.audit.push(pushAudit("Hakediş Güncellendi",(h?.no||editId)+" · hak "+net+" · ödenen "+(paidAmount!=null?paidAmount:"—")));
      // payments sync
      if(Array.isArray(cur.payments)){
        let pay=cur.payments.find(p=>p.hakedisId===editId);
        if(pay){
          pay.amount=paidAmount!=null?paidAmount:net;
          pay.status=status==="Ödendi"?"Ödendi":(status==="İptal"?"İptal":"Ödeme Bekliyor");
        }
      }
    } else {
      const c=(cur.counters.hak||0)+1; cur.counters.hak=c;
      const no="HAK-"+String(c).padStart(5,"0");
      const row={ id:uid(), no, ...fields, at:nowISO() };
      cur.subHakedis=[row, ...cur.subHakedis];
      if(["Ödeme Bekliyor","Onaylandı","Ödendi"].includes(status) && (paidAmount!=null?paidAmount:net)>0){
        if(!Array.isArray(cur.payments)) cur.payments=[];
        cur.payments.unshift({
          id:uid(), supplier:sub?.supplierName||sub?.name||"", invoiceNo:invoiceNo||no,
          amount:paidAmount!=null?paidAmount:net, date:invoiceDate||nowISO().slice(0,10),
          status:status==="Ödendi"?"Ödendi":"Ödeme Bekliyor",
          source:"hakedis", hakedisId:row.id, note:"Hakediş "+no+(period?" · "+period:"")
        });
      }
      cur.audit.push(pushAudit("Hakediş Oluşturuldu", no+" · "+(sub?.name||"")+" · hak "+net+" · ödenen "+(paidAmount!=null?paidAmount:0)));
    }
    showToast(editId?"Hakediş güncellendi":"Hakediş kaydedildi");
    return cur;
  });
  state.modal=null;
}
function handleSubDaySave(subId){
  const day=state.subDay||todayISODate();

    const sub=cur.subcontractors.find(x=>x.id===subId);

    cur.audit.push(pushAudit("Taşeron Personel", (sub?.name||subId)+" · "+day+" · "+hc+" kişi"));

    return cur;
  });
}
function handleSubBulkSave(){
  const day=state.subDay||todayISODate();
  const inputs=[...document.querySelectorAll(".sub-bulk-hc")];

  mutateData(cur=>{
    if(!Array.isArray(cur.subcontractorDaily)) cur.subcontractorDaily=[];
    inputs.forEach(inp=>{

      const hc=Math.max(0, Number(inp.value)||0);
      let row=cur.subcontractorDaily.find(x=>x.date===day && x.subId===subId);
      if(row){ row.headcount=hc; row.by=state.session.fullName; row.at=nowISO(); }
      else cur.subcontractorDaily.push({id:uid(), date:day, subId, headcount:hc, by:state.session.fullName, at:nowISO(), note:""});

    const total=cur.subcontractorDaily.filter(x=>x.date===day).reduce((s,x)=>s+(Number(x.headcount)||0),0);

}

function renderMuhasebe(){

    return eligible && recv>invd+1e-9 && !["İptal","İade Edildi"].includes(p.status);
  });
  const pendingPay=d.payments.filter(p=>p.status==="Ödeme Bekliyor");

  // AP Aging simple
  const aging={d0:0,d30:0,d60:0,d90:0};

function calcInvoiceExpected(poId, fromDisc){
  const qty=Number(document.getElementById("inv-qty-"+poId)?.value)||0;
  const invPrice=Number(document.getElementById("inv-price-"+poId)?.value)||0;
  const poPrice=Number(document.getElementById("pv-po-unit-"+poId)?.textContent)||invPrice;
  const kdv=Number(document.getElementById("inv-kdv-"+poId)?.value)||0;
  const discPctEl=document.getElementById("inv-disc-pct-"+poId);
  const discAmtEl=document.getElementById("inv-disc-amt-"+poId);
  let discPct=Number(discPctEl?.value)||0;
  let discAmt=Number(discAmtEl?.value)||0;
  // Fatura bedeli: girilen birim fiyat × miktar (yoksa PO fiyatı)
  const unit=invPrice>0?invPrice:poPrice;
  const brut=qty*unit;
  if(fromDisc==="pct"){
    discAmt=brut*(discPct/100);
    if(discAmtEl && document.activeElement!==discAmtEl) discAmtEl.value=discAmt?Number(discAmt.toFixed(2)):"";
  } else if(fromDisc==="amt"){
    discPct=brut>0?(discAmt/brut)*100:0;
    if(discPctEl && document.activeElement!==discPctEl) discPctEl.value=discPct?Number(discPct.toFixed(2)):"";
  } else if(discPct>0 && !(discAmt>0)) discAmt=brut*(discPct/100);
  else if(discAmt>0 && !(discPct>0) && brut>0) discPct=(discAmt/brut)*100;
  if(discAmt>brut) discAmt=brut;
  const net=Math.max(0, brut-discAmt);
  const expected=net*(1+kdv/100);
  return { qty, unit, poPrice, invPrice, kdv, discPct, discAmt, brut, net, expected };
}
function updateInvoicePreview(poId, fromDisc){
  const c=calcInvoiceExpected(poId, fromDisc);
  if(!c) return;
  const totalEl=document.getElementById("inv-total-"+poId);
  const set=(id,v)=>{ const e=document.getElementById(id+"-"+poId); if(e) e.textContent=v; };
  set("pv-gross", fmtTL(c.brut));
  set("pv-disc", c.discAmt?fmtTL(c.discAmt):"—");
  set("pv-base", fmtTL(c.net));
  set("pv-kdv", fmtTL(c.net*(c.kdv/100)));
  set("pv-total", fmtTL(c.expected));
  // Fatura bedeli otomatik — kullanıcı total alanında değilken veya her hesapta güncelle
  if(totalEl && document.activeElement!==totalEl){
    totalEl.value = c.expected>0 ? Number(c.expected.toFixed(2)) : "";
  }
  const diffEl=document.getElementById("pv-diff-"+poId);
  if(diffEl){
    const invT=Number(totalEl?.value);
    if(!totalEl?.value && !(c.expected>0)){ diffEl.textContent="Miktar / birim fiyat girin"; diffEl.style.color="var(--text-mute)"; }
    else {
      const base=c.qty*(c.poPrice||c.unit);
      let dAmt=c.discAmt, dPct=c.discPct;
      if(dPct>0 && !(dAmt>0)) dAmt=base*(dPct/100);
      const netPo=Math.max(0, base-dAmt);
      const expectedPo=netPo*(1+c.kdv/100);
      const diff=invT-expectedPo;
      if(Math.abs(diff)<=0.5){ diffEl.textContent="✓ PO ile uyumlu · bedel "+fmtTL(invT); diffEl.style.color="var(--green)"; }
      else { diffEl.textContent="⚠ PO beklenen "+fmtTL(expectedPo)+" · fatura "+fmtTL(invT)+" · fark "+fmtTL(diff); diffEl.style.color="var(--red)"; }
    }
  }
}
function refreshAllInvoicePreviews(){
  document.querySelectorAll("[id^=inv-price-]").forEach(el=>{
    const id=el.id.replace("inv-price-","");
    if(id) updateInvoicePreview(id);
  });
}

function handleInvoiceMatch(poId){
  const invNo=document.getElementById("inv-no-"+poId)?.value.trim();
  let total=Number(document.getElementById("inv-total-"+poId)?.value);
  const kdv=document.getElementById("inv-kdv-"+poId)?.value;
  const unitPrice=Number(document.getElementById("inv-price-"+poId)?.value);
  let discPct=Number(document.getElementById("inv-disc-pct-"+poId)?.value)||0;
  let discAmt=Number(document.getElementById("inv-disc-amt-"+poId)?.value)||0;
  if(!invNo){ showToast("Fatura no zorunlu.","red"); return; }
  if(!total||total<=0){
    updateInvoicePreview(poId);
    total=Number(document.getElementById("inv-total-"+poId)?.value);
  }
  if(!total||total<=0){ showToast("Fatura bedeli hesaplanamadı.","red"); return; }

  const qtyInput=Number(document.getElementById("inv-qty-"+poId)?.value);
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    const maxBill=Math.max(0, (Number(po.receivedQty)||0) - (Number(po.invoicedQty)||0));
    let billQty=qtyInput>0 ? qtyInput : maxBill;
    if(billQty>maxBill) billQty=maxBill;
    if(billQty<=0){ showToast("Faturalanacak teslim miktarı yok.","red"); return cur; }
    const poPrice=Number(po.unitPrice)||0;
    const invUnit=unitPrice||poPrice;
    const brut=poPrice*billQty;
    if(discPct>0 && !(discAmt>0)) discAmt=brut*(discPct/100);
    if(discAmt>0 && !(discPct>0) && brut>0) discPct=(discAmt/brut)*100;
    if(discAmt>brut) discAmt=brut;
    const netBase=Math.max(0, brut-discAmt);
    const expectedWithKdv=netBase*(1+Number(kdv)/100);
    const match=Math.abs(total-expectedWithKdv)<=0.5;
    const price=invUnit;
    const priceDiff=Math.abs(invUnit-poPrice);
    const invC=(cur.counters.inv||0)+1; const invId="INV-"+String(invC).padStart(5,"0"); cur.counters.inv=invC;
    const partial=billQty+1e-9 < maxBill;

    if(match){
      cur.invoices.push({id:uid(),no:invNo,systemNo:invId,poId:po.id,poNo:po.no,requestNo:po.requestNo,
        item:po.item,qty:billQty,unit:po.unit,supplier:po.supplier,kdv,total,unitPrice:price,
        discountPct:discPct, discountAmt:discAmt, netBase, gross:brut,
        status:"Onaylandı",date:nowISO(),matchedBy:state.session.fullName, partial:!!partial});
      cur.payments.push({id:uid(),invoiceNo:invNo,requestNo:po.requestNo,poNo:po.no,supplier:po.supplier,
        amount:total,status:"Ödeme Bekliyor",date:nowISO()});
      cur.purchaseOrders=cur.purchaseOrders.map(x=>{
        if(x.id!==poId) return x;
        const invd=(Number(x.invoicedQty)||0)+billQty;
        return {...x, invoicedQty:invd, uninvoicedQty:Math.max(0,(Number(x.receivedQty)||0)-invd)};
      });
      cur.audit.push(pushAudit("3-Way Match OK", invNo+" · "+po.no+" · qty "+billQty+(partial?" (parçalı)":"")));
      showToast(partial ? "Parçalı fatura onaylandı. Kalan sonra faturalanır." : "Eşleşme başarılı. Ödeme listesine eklendi.");
    } else {
      cur.invoices.push({id:uid(),no:invNo,systemNo:invId,poId:po.id,poNo:po.no,requestNo:po.requestNo,
        item:po.item,qty:billQty,supplier:po.supplier,kdv,total,unitPrice:price,
        discountPct:discPct, discountAmt:discAmt, netBase, gross:brut,
        status:"Fiyat Uyuşmuyor",date:nowISO(),expected:expectedWithKdv,note:"Fatura "+total.toFixed(2)+" ≠ beklenen "+expectedWithKdv.toFixed(2)+(priceDiff>0.009?" · birim farkı":"")});
      cur.audit.push(pushAudit("Fatura Uyuşmazlık", invNo+" · beklenen "+expectedWithKdv.toFixed(2)));
      showToast(`Uyuşmazlık: Fatura ${fmtTL(total)} ≠ Beklenen ${fmtTL(expectedWithKdv)}`,"red");
    }
    return cur;
  });
}
function handleInvoiceReject(poId){
  const reason=prompt("İptal gerekçesi:");
  if(reason===null||!reason.trim()){ showToast("Gerekçe zorunlu.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    cur.purchaseOrders=cur.purchaseOrders.map(x=>x.id===poId?{...x,status:"İptal",cancelReason:reason}:x);
    cur.requests=cur.requests.map(x=>x.id===po.requestId?{...x,status:"İptal",cancelReason:reason,history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"İptal: "+reason}]}:x);
    cur.audit.push(pushAudit("PO/Fatura İptal", po.no+" · "+reason));
    showToast("İptal edildi.","red"); return cur;
  });
}

function handleReversePayment(payId){
  if(!["admin","yonetici","muhasebe"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  if(!confirm("Bu ödemeyi ters kayıt edilsin mi?\\nDurum tekrar «Ödeme Bekliyor» olur. Hatalı ödeme için kullanın.")) return;
  mutateData(cur=>{
    const p=(cur.payments||[]).find(x=>x.id===payId);
    if(!p){ showToast("Ödeme yok.","red"); return cur; }
    if(p.reversed){ showToast("Zaten ters.","amber"); return cur; }
    if(p.status!=="Ödendi"){ showToast("Sadece ödenmiş kayıt terslenebilir.","amber"); return cur; }
    p.reversed=true;
    p.reversedAt=nowISO();
    p.reversedBy=state.session.fullName;
    p.prevStatus="Ödendi";
    p.prevMethod=p.method;
    p.prevMethodDetails=p.methodDetails;
    p.status="Ödeme Bekliyor";
    p.method="";
    p.methodDetails="";
    p.paidDate=null;
    cur.audit.push(pushAudit("Ödeme Ters Kayıt", (p.invoiceNo||p.id)+" · "+fmtTL(p.amount)));
    showToast("Ödeme ters kayıt edildi — tekrar ödenebilir");
    return cur;
  });
}

function handleReturnShipSubmit(){
  if(!["admin","depo","yonetici"].includes(state.session?.role)){ showToast("Depo yetkiniz yok.","red"); return; }
  const supplier=(document.getElementById("rs-supplier")?.value||"").trim();
  const irs=(document.getElementById("rs-irs")?.value||"").trim();
  const reason=(document.getElementById("rs-reason")?.value||"").trim();
  if(!supplier||!irs||!reason){ showToast("Cari, irsaliye no ve gerekçe zorunlu.","red"); return; }
  const checks=[...document.querySelectorAll(".rs-chk:checked")];
  if(!checks.length){ showToast("En az bir stok kalemi seçin.","amber"); return; }
  const lines=[];
  for(const chk of checks){
    const item=chk.dataset.item, unit=chk.dataset.unit||"Adet";
    const q=Number(document.querySelector('.rs-qty[data-item="'+item+'"]')?.value);
    if(!(q>0)){ showToast("Miktar girin: "+item,"amber"); return; }
    lines.push({ item, unit, qty:q, stockId:chk.dataset.id||null });
  }
  let ship=null;
  mutateData(cur=>{
    cur.returnShipments=cur.returnShipments||[];
    // stok düş
    for(const l of lines){
      let st=cur.stock.find(s=>(l.stockId&&s.id===l.stockId) || (foldTR(s.item)===foldTR(l.item) && s.unit===l.unit));
      if(!st) st=cur.stock.find(s=>foldTR(s.item)===foldTR(l.item));
      if(!st || Number(st.qty)<l.qty-1e-9){ showToast("Yetersiz stok: "+l.item,"red"); return cur; }
      st.qty=Number(st.qty)-l.qty;
      cur.movements.push({id:uid(),at:nowISO(),type:"İade İrsaliye",item:l.item,qty:-l.qty,unit:l.unit,ref:irs,by:state.session.fullName,supplier});
    }
    const c=(cur.counters.rs||0)+1; cur.counters.rs=c;
    const no="IRS-IADE-"+String(c).padStart(5,"0");
    ship={
      id:uid(), no, irsaliyeNo:irs, supplier, reason, status:"Muhasebe Bekliyor",
      lines, at:nowISO(), by:state.session.fullName
    };
    cur.returnShipments.unshift(ship);
    cur.notifications=(cur.notifications||[]);
    cur.notifications.unshift({id:uid(),at:nowISO(),type:"iade",title:"İade irsaliyesi",body:no+" · "+supplier+" · muhasebe bekliyor",read:false});
    cur.audit.push(pushAudit("İade İrsaliye", no+" · "+supplier+" · "+lines.length+" kalem"));
    showToast("İade irsaliyesi kesildi — muhasebe fatura kesebilir");
    return cur;
  });
  if(ship){ state.modal=null; showToast("İade irsaliyesi kaydedildi — yazdırmak için listeden 📄"); }
}

function handleReturnInvoiceShipSubmit(shipId){
  if(!["admin","yonetici","muhasebe"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  const no=(document.getElementById("ret-ship-inv-no")?.value||"").trim();

    const lines=[];
    (ship.lines||[]).forEach(l=>{
      const priceEl=document.getElementById("ret-ship-price-"+foldTR(l.item).replace(/\s/g,"-"));
      // simpler: by index
    });
    // prices by index
    (ship.lines||[]).forEach((l,idx)=>{
      const unitPrice=Number(document.getElementById("ret-ship-price-"+idx)?.value)||0;
      const kdv=Number(document.getElementById("ret-ship-kdv-"+idx)?.value)||20;
      if(!(unitPrice>=0)) return;
      const net=unitPrice*l.qty;
      const total=Number((net*(1+kdv/100)).toFixed(2));
      lines.push({ item:l.item, qty:l.qty, unit:l.unit, unitPrice, kdv, total, invoiceNo:"", poNo:"" });
    });
    if(!lines.length){ showToast("Birim fiyat girin.","amber"); return cur; }
    const total=lines.reduce((s,l)=>s+l.total,0);
    const invC=(cur.counters.inv||0)+1; cur.counters.inv=invC;
    const systemNo="RET-"+String(invC).padStart(5,"0");
    created={
      id:uid(), no, systemNo, isReturn:true, status:"İade Faturası",
      date:nowISO(), by:state.session.fullName, reason:reason||ship.reason,
      supplier:ship.supplier, item:lines.length===1?lines[0].item:lines[0].item+" +"+(lines.length-1),
      qty:lines[0].qty, unit:lines[0].unit, kdv:lines[0].kdv, total, unitPrice:lines[0].unitPrice,
      returnShipmentId:ship.id, returnIrsaliyeNo:ship.irsaliyeNo||ship.no,
      lines, stockReturned:false, depoDone:true
    };
    cur.invoices.push(created);
    ship.status="Faturalandı"; ship.invoiceId=created.id; ship.invoiceNo=no; ship.invoicedAt=nowISO();
    // Try link original invoices same supplier+item to reduce invoicedQty
    lines.forEach(l=>{
      const orig=(cur.invoices||[]).find(i=>!i.isReturn && i.status==="Onaylandı" && i.supplier===ship.supplier && foldTR(i.item)===foldTR(l.item));
      if(orig){
        orig.returnedQty=(Number(orig.returnedQty)||0)+l.qty;
        if(orig.poId){
          const po=cur.purchaseOrders.find(x=>x.id===orig.poId);
          if(po){
            po.invoicedQty=Math.max(0,(Number(po.invoicedQty)||0)-l.qty);
            po.uninvoicedQty=Math.max(0,(Number(po.receivedQty)||0)-(Number(po.invoicedQty)||0));
          }
        }
        cur.payments=(cur.payments||[]).map(p=>{
          if(p.invoiceNo!==orig.no || p.reversed) return p;
          if(p.status==="Ödeme Bekliyor"){
            const left=Math.max(0, Number(p.amount)-l.total);
            if(left<=0.5) return {...p, status:"İptal", cancelReason:"İade "+no, amount:0};
            return {...p, amount:Number(left.toFixed(2))};
          }
          return p;
        });
      }
    });
    cur.audit.push(pushAudit("İade Faturası", no+" · irsaliye "+(ship.no)+" · "+fmtTL(total)+" · cari "+ship.supplier));
    showToast("İade faturası cariye işlendi");
    return cur;
  });
  if(created){ state.modal=null; }
}

function handleReturnInvoiceSubmit(){
  if(!["admin","yonetici","muhasebe"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  const no=(document.getElementById("ret-inv-no")?.value||"").trim();
  const reason=(document.getElementById("ret-inv-reason")?.value||"").trim();
  if(!no){ showToast("İade fatura no zorunlu.","red"); return; }
  if(!reason){ showToast("Gerekçe zorunlu.","red"); return; }
  const checks=[...document.querySelectorAll(".ret-inv-chk:checked")];
  if(!checks.length){ showToast("En az bir fatura kalemi seçin.","amber"); return; }

  const lines=[];
  for(const chk of checks){
    const id=chk.dataset.id;
    const inv=(state.data.invoices||[]).find(x=>x.id===id);
    if(!inv||inv.isReturn) continue;
    const maxQ=Number(inv.qty)||0;
    let q=Number(document.querySelector('.ret-inv-qty[data-id="'+id+'"]')?.value);
    if(!(q>0)){ showToast("Geçerli iade miktarı girin: "+(inv.no||""),"amber"); return; }
    if(q>maxQ+1e-9){ showToast("İade miktarı faturayı aşamaz: "+inv.no,"red"); return; }
    const unitPrice=Number(inv.unitPrice)||(maxQ?Number(inv.total)/maxQ:0);
    const ratio=maxQ>0?q/maxQ:1;
    const lineTotal=Number((Number(inv.total)*ratio).toFixed(2));
    lines.push({ inv, qty:q, unitPrice, lineTotal, kdv:inv.kdv, unit:inv.unit||"Adet" });
  }
  if(!lines.length){ showToast("Geçerli kalem yok.","amber"); return; }

  let created=null;
  mutateData(cur=>{
    const total=lines.reduce((s,l)=>s+l.lineTotal,0);
    const invC=(cur.counters.inv||0)+1; cur.counters.inv=invC;
    const systemNo="RET-"+String(invC).padStart(5,"0");
    const primary=lines[0];
    const supplier=primary.inv.supplier;
    const itemLabel=lines.length===1?primary.inv.item:(primary.inv.item+" +"+ (lines.length-1)+" kalem");
    created={
      id:uid(), no, systemNo, isReturn:true, status:"İade Faturası",
      date:nowISO(), by:state.session.fullName, reason,
      supplier, item:itemLabel, qty:primary.qty, unit:primary.unit,
      kdv:primary.kdv, total, unitPrice:primary.unitPrice,
      poNo:primary.inv.poNo, requestNo:primary.inv.requestNo, poId:primary.inv.poId,
      originalInvoiceIds:lines.map(l=>l.inv.id),
      lines:lines.map(l=>({ invoiceId:l.inv.id, invoiceNo:l.inv.no, item:l.inv.item, qty:l.qty, unit:l.unit, unitPrice:l.unitPrice, total:l.lineTotal, kdv:l.kdv, poId:l.inv.poId, poNo:l.inv.poNo })),
      stockReturned:false
    };
    cur.invoices.push(created);

    lines.forEach(l=>{
      const orig=cur.invoices.find(x=>x.id===l.inv.id);
      if(orig){
        orig.returnedQty=(Number(orig.returnedQty)||0)+l.qty;
        if((Number(orig.returnedQty)||0)+1e-9 >= (Number(orig.qty)||0)) orig.fullyReturned=true;
      }
      if(l.inv.poId){
        const po=cur.purchaseOrders.find(x=>x.id===l.inv.poId);
        if(po){
          po.invoicedQty=Math.max(0,(Number(po.invoicedQty)||0)-l.qty);
          po.uninvoicedQty=Math.max(0,(Number(po.receivedQty)||0)-(Number(po.invoicedQty)||0));
        }
      }
      cur.payments=(cur.payments||[]).map(p=>{
        if(p.invoiceNo!==l.inv.no || p.reversed) return p;
        if(p.status==="Ödeme Bekliyor"){
          const left=Math.max(0, Number(p.amount)-l.lineTotal);
          if(left<=0.5) return {...p, status:"İptal", cancelReason:"İade faturası "+no, amount:0};
          return {...p, amount:Number(left.toFixed(2)), note:(p.note||"")+" · iade "+no};
        }
        return p;
      });
    });

    cur.audit.push(pushAudit("İade Faturası", no+" · "+fmtTL(total)+" · cari "+supplier+" · "+reason));
    showToast("İade faturası cariye alacak yazıldı");
    return cur;
  });

  if(created){
    generateReturnInvoicePDF(created);
    state.modal=null;
  }
}

/** Eski hareketlere fieldLogs'tan teslim alan / hedef tamamla */
function enrichMovementRow(m){
  if(!m) return m;
  if(m.person && (m.location||m.equipment)) return m;
  const logs=state.data.fieldLogs||[];
  const t0=m.at?new Date(m.at).getTime():0;
  let best=null, bestD=1e15;
  logs.forEach(f=>{
    if(!f || foldTR(f.item||"")!==foldTR(m.item||"")) return;
    if(m.unit && f.unit && foldTR(f.unit)!==foldTR(m.unit)) return;
    const t1=new Date(f.date||f.at||0).getTime();
    const d=t0&&t1?Math.abs(t0-t1):999999;
    // aynı ürün, 2 saat içinde veya miktar eşleşmesi
    if(d<bestD && (d<2*3600*1000 || Number(f.qty)===Math.abs(Number(m.qty)||0))){
      best=f; bestD=d;
    }
  });
  if(!best) return m;
  return {
    ...m,
    person: m.person||best.person||"",
    location: m.location||m.equipment||best.location||best.equipment||m.ref||"",
    equipment: m.equipment||best.equipment||best.location||"",
    by: m.by||best.by||""
  };
}
function movementsForExport(){
  return [...(state.data.movements||[])].slice().reverse().map(enrichMovementRow);
}

function standardMechanicalCatalog(){
  // Stok 0 — standart talep / ürün kartı listesi
  const rows=[];
  const add=(code,name,cat,unit,min=0)=>rows.push({id:uid(),code,name,category:cat,unit,minLevel:min});
  // PVC boru (PN10/PN16 yaygın çaplar, metre)
  ["20","25","32","40","50","63","75","90","110"].forEach(d=>{
    add(`PVC-B-${d}`,`PVC Boru Ø${d} mm (6 m)`, "Mekanik Tesisat","Metre",0);
    add(`PVC-D-${d}`,`PVC Dirsek 90° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PVC-T-${d}`,`PVC Te Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PVC-M-${d}`,`PVC Muaf Ø${d} mm`, "Mekanik Tesisat","Adet",0);
  });
  // PVC redüksiyon / adaptör
  [["32","25"],["40","32"],["50","40"],["63","50"],["75","63"],["90","75"],["110","90"]].forEach(([a,b])=>{
    add(`PVC-R-${a}-${b}`,`PVC Redüksiyon Ø${a}→Ø${b} mm`, "Mekanik Tesisat","Adet",0);
  });
  // PPRC boru & fittings
  ["20","25","32","40","50","63","75"].forEach(d=>{
    add(`PPR-B-${d}`,`PPRC Boru Ø${d} mm PN20`, "Mekanik Tesisat","Metre",0);
    add(`PPR-D90-${d}`,`PPRC Dirsek 90° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-D45-${d}`,`PPRC Dirsek 45° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-T-${d}`,`PPRC Te Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-K-${d}`,`PPRC Kaplin (Manson) Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-BF-${d}`,`PPRC Dişi Adaptör Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-BM-${d}`,`PPRC Erkek Adaptör Ø${d} mm`, "Mekanik Tesisat","Adet",0);
  });
  [["25","20"],["32","25"],["40","32"],["50","40"],["63","50"]].forEach(([a,b])=>{
    add(`PPR-R-${a}-${b}`,`PPRC Redüksiyon Ø${a}→Ø${b} mm`, "Mekanik Tesisat","Adet",0);
  });
  // Yaygın ek malzemeler
  add("KELEP-25","Boru Kelepçesi Ø25","Mekanik Tesisat","Adet",0);
  add("KELEP-32","Boru Kelepçesi Ø32","Mekanik Tesisat","Adet",0);
  add("TEFLON","Teflon Bant","Sarf Malzeme","Adet",0);
  add("SILIKON","Silikon Kartuş","Sarf Malzeme","Adet",0);
  return rows;
}

  return (products||[]).map(p=>({

  }));
}

function handleDbClean(){ handleDbReset("ops"); }
function handleDbReset(kind){
  if(kind==="ops" && !confirm("Talepler, PO, GRN, fatura, ödeme, hareketler silinecek. Cari/ürün/kullanıcı kalır. Emin misiniz?")) return;
  if(kind==="ops") state._allowEmptyWrite=true;
  if(kind==="cari" && !confirm("Tüm cari firmalar silinecek. Emin misiniz?")) return;
  if(kind==="users" && !confirm("Admin dışındaki tüm kullanıcılar silinecek. Emin misiniz?")) return;
  if(kind==="wo" && !confirm("Tüm iş emirleri ve WO malzeme tüketimleri silinecek. Emin misiniz?")) return;
  if(kind==="mech" && !confirm("Ürün kartları mekanik katalog ile değişecek, STOKLAR 0 olacak. Emin misiniz?")) return;
  if(kind==="mech") state._allowEmptyWrite=true;
  if(kind==="full"){
    if(!confirm("KOMPLE SIFIRLA: her şey silinir. Emin misiniz?")) return;
    const word=prompt('Onay için SIFIRLA yazın:');
    if(word!=="SIFIRLA"){ showToast("İptal — SIFIRLA yazılmadı.","amber"); return; }
    state._allowEmptyWrite=true;
  }

  if(kind==="users"){
    const adminOnly=(state.users||[]).filter(u=>u.role==="admin");
    const keep=adminOnly.length?adminOnly:seedUsers();
    saveUsers(keep);
    showToast("Kullanıcılar sıfırlandı (admin korundu).");
    return;
  }

  mutateData(cur=>{
    if(kind==="ops"){
      const next={...seedData(), company:cur.company, suppliers:cur.suppliers, products:cur.products, equipment:cur.equipment};
      next.stock=zeroStockFromProducts(cur.products);
      next.audit.push(pushAudit("DB Ops Temizlik","Admin"));
      showToast("İşlem verileri temizlendi."); return next;
    }
    if(kind==="cari"){
      cur.suppliers=[];
      cur.audit.push(pushAudit("Cari Sıfırlandı","Admin"));
      showToast("Cariler silindi."); return cur;
    }
    if(kind==="wo"){
      cur.workOrders=[]; cur.consumptions=[];
      cur.audit.push(pushAudit("İş Emirleri Sıfırlandı","Admin"));
      showToast("İş emirleri silindi."); return cur;
    }
    if(kind==="mech"){
      const products=standardMechanicalCatalog();
      cur.products=products;
      cur.stock=zeroStockFromProducts(products);
      cur.audit.push(pushAudit("Mekanik Katalog Yüklendi", products.length+" kalem · stok 0"));
      showToast(`Katalog yüklendi (${products.length} kalem), stok 0.`); return cur;
    }
    if(kind==="full"){
      const products=standardMechanicalCatalog();
      const next={...seedData(), products, stock:zeroStockFromProducts(products), company:cur.company||seedData().company};
      next.audit.push(pushAudit("Komple DB Sıfırlama","Admin"));
      showToast("Komple sıfırlandı + mekanik katalog."); return next;
    }
    return cur;
  });
  if(kind==="full"){
    const adminOnly=(state.users||[]).filter(u=>u.role==="admin");
    saveUsers(adminOnly.length?adminOnly:seedUsers());
  }
  setTimeout(()=>{ state._allowEmptyWrite=false; }, 800);
}

/** Katalogda yoksa ürün kartı oluştur; varsa id döner. cur üzerinde çalışır. */
function ensureProductInCatalog(cur, name, unit, category){
  const nm=String(name||"").trim();
  if(!nm) return null;
  if(!cur.products) cur.products=[];
  const hit=cur.products.find(p=>foldTR(p.name)===foldTR(nm));
  if(hit) return hit;
  const un=unit||"Adet";
  const cat=category||"Diğer";
  const n=(cur.counters&&cur.counters.product)||(cur.products.length+1);
  if(!cur.counters) cur.counters={};
  cur.counters.product=(Number(cur.counters.product)||n)+1;
  const code="URN-"+String(cur.counters.product).padStart(4,"0");
  const row={ id:uid(), code, name:nm, category:cat, unit:un, minLevel:0, autoFrom:"talep-veya-cikis", at:nowISO() };
  cur.products=[row, ...cur.products];
  return row;
}
function renameProductEverywhere(cur, productId, newName, opts){
  const p=(cur.products||[]).find(x=>x.id===productId);
  if(!p) return {ok:false, msg:"Ürün yok"};
  const oldName=p.name;
  const nm=String(newName||"").trim();
  if(!nm) return {ok:false, msg:"Ad boş"};
  if(foldTR(nm)===foldTR(oldName) && nm===oldName){
    // sadece diğer alanlar
    return {ok:true, oldName, newName:nm, renamed:false};
  }
  const clash=(cur.products||[]).find(x=>x.id!==productId && foldTR(x.name)===foldTR(nm));
  if(clash) return {ok:false, msg:"Bu isimde başka kart var: "+clash.code};
  p.name=nm;
  if(opts){
    if(opts.category!=null) p.category=opts.category;
    if(opts.unit!=null) p.unit=opts.unit;
    if(opts.code!=null && opts.code) p.code=opts.code;
    if(opts.minLevel!=null) p.minLevel=Number(opts.minLevel)||0;
  }
  // Stok satırlarını güncelle
  (cur.stock||[]).forEach(s=>{
    if(foldTR(s.item)===foldTR(oldName)) s.item=nm;
  });
  // Açık talepler / PO / GRN isimleri (tarihsel tutarlılık — eşleşen ad)
  (cur.requests||[]).forEach(r=>{
    if(r.productId===productId || foldTR(r.item)===foldTR(oldName)){ r.item=nm; r.productId=productId; }
  });
  (cur.purchaseOrders||[]).forEach(po=>{
    if(po.productId===productId || foldTR(po.item)===foldTR(oldName)){ po.item=nm; if(po.productId) po.productId=productId; }
  });
  (cur.goodsReceipts||[]).forEach(g=>{
    if(foldTR(g.item)===foldTR(oldName)) g.item=nm;
  });
  (cur.fieldLogs||[]).forEach(f=>{
    if(foldTR(f.item)===foldTR(oldName)) f.item=nm;
  });
  (cur.movements||[]).forEach(m=>{
    if(foldTR(m.item)===foldTR(oldName)) m.item=nm;
  });
  (cur.consumptions||[]).forEach(c=>{
    if(foldTR(c.item)===foldTR(oldName)) c.item=nm;
  });
  return {ok:true, oldName, newName:nm, renamed:true};
}

function handleProductFormSubmit(){
  const editId=document.getElementById("product-form")?.dataset?.id||"";
  const code=document.getElementById("pf-code").value.trim(), name=document.getElementById("pf-name").value.trim();
  if(!name){ showToast("Ürün adı zorunlu.","red"); return; }
  if(!editId && !code){ showToast("Kod ve ad zorunlu.","red"); return; }
  const category=document.getElementById("pf-category")?.value||"Diğer";
  const unit=document.getElementById("pf-unit")?.value||"Adet";
  const minLevel=Number(document.getElementById("pf-min")?.value)||0;
  mutateData(cur=>{
    if(editId){
      const res=renameProductEverywhere(cur, editId, name, { code:code||undefined, category, unit, minLevel });
      if(!res.ok){ showToast(res.msg,"red"); return cur; }
      // code/category/unit/min already applied in rename when opts given; ensure code if only rename path skipped
      const p=(cur.products||[]).find(x=>x.id===editId);
      if(p){
        if(code) p.code=code;
        p.category=category; p.unit=unit; p.minLevel=minLevel;
      }
      cur.audit.push(pushAudit(res.renamed?"Ürün Yeniden Adlandırıldı":"Ürün Güncellendi",
        (res.renamed?(res.oldName+" → "+res.newName):name)+(code?" · "+code:"")));
      state.modal=null;
      showToast(res.renamed?"Ad güncellendi (stok & talepler de).":"Ürün güncellendi.");
      return cur;
    }
    const clash=(cur.products||[]).find(x=>foldTR(x.name)===foldTR(name) || (code && foldTR(x.code)===foldTR(code)));
    if(clash){ showToast("Aynı ad veya kod zaten var: "+clash.code,"red"); return cur; }
    cur.products=[{id:uid(),code,name,category,unit,minLevel}, ...(cur.products||[])];
    cur.audit.push(pushAudit("Ürün Eklendi",code+" · "+name));
    state.modal=null; showToast("Eklendi."); return cur;
  });
}

function handleEqProgressSave(eqId){
  if(!roleCan("wo_take")&&!roleCan("equipment")&&!["yonetici","admin"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  const nums=[...document.querySelectorAll('.imalat-num[data-eq="'+eqId+'"]')];
  const names=[...document.querySelectorAll('.imalat-name[data-eq="'+eqId+'"]')];
  if(!nums.length && !names.length){ showToast("Kalem yok.","red"); return; }
  mutateData(cur=>{
    const eq0=(cur.equipment||[]).find(x=>x.id===eqId);
    if(!eq0) return cur;
    // Ham progress — align etmeden oku (id→eski ad)
    const raw=eq0.progress && typeof eq0.progress==="object" ? eq0.progress : {};
    const idToOld={};
    Object.keys(raw).forEach(cat=>{
      (Array.isArray(raw[cat])?raw[cat]:[]).forEach(it=>{
        if(it && it.id) idToOld[it.id]={ cat, name:String(it.name||"") };
      });
    });
    // Form + mevcut şablon birleşimi (gizli kalemler formda yoksa düşmesin)
    const tpl=getImalatTemplates(cur);
    const byCat={};
    names.forEach(inp=>{
      const cat=inp.dataset.cat;
      const nm=(inp.value||"").trim();
      if(!cat||!nm) return;
      if(!byCat[cat]) byCat[cat]=[];
      if(!byCat[cat].includes(nm)) byCat[cat].push(nm);
    });
    Object.keys(byCat).forEach(cat=>{
      const prev=Array.isArray(tpl[cat])?tpl[cat]:[];
      const merged=[...byCat[cat]];
      prev.forEach(n=>{ if(!merged.includes(n)) merged.push(n); });
      tpl[cat]=merged;
    });
    IMALAT_CAT_ORDER.forEach(cat=>{
      if(!Array.isArray(tpl[cat]) || !tpl[cat].length) tpl[cat]=[...(IMALAT_TEMPLATES_DEFAULT[cat]||[])];
    });

    // Yeniden adlandırma listesi
    const renames=[];
    names.forEach(inp=>{
      const itemId=inp.dataset.item, cat=inp.dataset.cat;
      const nm=(inp.value||"").trim();
      if(!nm || !idToOld[itemId]) return;
      if(idToOld[itemId].name!==nm) renames.push({ cat: idToOld[itemId].cat||cat, oldName:idToOld[itemId].name, newName:nm });
    });

    setImalatTemplatesOn(cur, tpl);

    cur.equipment=(cur.equipment||[]).map(e=>{
      const bina=isBinaEq(e) || e.unitType==="Bina" || e.id===eqId;
      if(!bina) return e;
      // Ham kopya
      let prog={};
      if(e.progress && typeof e.progress==="object"){
        Object.keys(e.progress).forEach(cat=>{
          prog[cat]=(Array.isArray(e.progress[cat])?e.progress[cat]:[]).map(it=>({...it}));
        });
      }
      // Rename (tüm binalarda eski ad → yeni ad)
      renames.forEach(r=>{
        if(!prog[r.cat]) return;
        prog[r.cat]=prog[r.cat].map(it=>String(it.name)===r.oldName?{...it, name:r.newName}:it);
      });
      // Global şablona hizala (yüzdeler eşleşen isimde kalır)
      prog=alignProgressToTemplate(prog, tpl);
      // Bu binanın yüzdeleri formdan
      if(e.id===eqId){
        nums.forEach(inp=>{
          const cat=inp.dataset.cat, itemId=inp.dataset.item;
          const v=Math.max(0, Math.min(100, Number(inp.value)||0));
          const newN=(names.find(n=>n.dataset.item===itemId)?.value||"").trim()
            || idToOld[itemId]?.name;
          if(prog[cat] && newN){
            prog[cat]=prog[cat].map(it=>String(it.name)===newN?{...it, pct:v}:it);
          }
        });
      }
      return {...e, unitType:e.unitType||"Bina", progress:prog};
    });

    renames.forEach(r=>renameWorkPackageKalem(cur, r.cat, r.oldName, r.newName));
    cur._wpTplFp=null;
    ensureWorkPackagesFromTemplates(cur, true);
    const eq=cur.equipment.find(x=>x.id===eqId);
    cur.audit.push(pushAudit("İmalat global", (eq?.code||eqId)+" · kalem "+Object.values(tpl).flat().length+" · rename "+renames.length));
    state.modal=null;
    state._mapFp=null;
    showToast("Kalemler tüm binalara işlendi"+(renames.length?" ("+renames.length+" ad)":"")+".");
    return cur;
  });
}

function handleEqKalemDel(eqId, cat, itemId){
  if(!roleCan("wo_take")&&!roleCan("equipment")&&!["yonetici","admin"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  if(!confirm("Bu iş kalemi TÜM binalardan silinsin mi?")) return;
  mutateData(cur=>{
    const eq0=(cur.equipment||[]).find(x=>x.id===eqId);
    // Ham progress'ten ad bul
    let delName=null;
    const raw=eq0&&eq0.progress?eq0.progress:{};
    (Array.isArray(raw[cat])?raw[cat]:[]).forEach(it=>{ if(it&&it.id===itemId) delName=String(it.name||""); });
    if(!delName){
      // fallback aligned
      const prog0=ensureEqProgress({...(eq0||{}), unitType:"Bina"})||{};
      const hit=(prog0[cat]||[]).find(it=>it.id===itemId);
      delName=hit?String(hit.name||""):null;
    }
    if(!delName){ showToast("Kalem bulunamadı.","red"); return cur; }
    const tpl=getImalatTemplates(cur);
    if(tpl[cat]) tpl[cat]=(tpl[cat]||[]).filter(n=>n!==delName);
    setImalatTemplatesOn(cur, tpl);
    cur.equipment=(cur.equipment||[]).map(e=>{
      if(!(isBinaEq(e) || e.unitType==="Bina")) return e;
      return {...e, unitType:e.unitType||"Bina", progress:alignProgressToTemplate(e.progress||{}, tpl)};
    });
    (cur.workPackages||[]).forEach(w=>{
      if(foldTR(w.imalatCat||"")===foldTR(cat) && (foldTR(w.imalatItem||"")===foldTR(delName) || foldTR(w.name||"")===foldTR(delName))){
        if(w.autoFrom==="imalat" && !w.subId) w.active=false;
        else { w.note=(w.note?w.note+" · ":"")+"Şablondan kaldırıldı"; }
      }
    });
    ensureWorkPackagesFromTemplates(cur);
    cur.audit.push(pushAudit("İmalat kalemi −", delName+" · "+cat+" · tüm binalar"));
    state.modal={type:"eq-progress", id:eqId};
    state._mapFp=null;
    showToast("Silindi (tüm binalar): "+delName);
    return cur;
  });
}

function handleEqFormSubmit(){
  if(!roleCan("equipment")){ showToast("Ekipman yetkiniz yok.","red"); return; }

  const subType=document.getElementById("eq-type").value.trim();
  const numOrNull=(v)=>{ const n=Number(v); return (v===""||v==null||!Number.isFinite(n))?null:n; };
  const fnoteInline=(document.getElementById("eq-fnote-inline")?.value||"").trim();
  const payload={
    code, name,
    location:document.getElementById("eq-location").value.trim(),
    unitType,
    type: unitType,

      const row={id:uid(),...payload, createdAt:nowISO()};

function handleStockUnitSave(id){
  if(!["admin","depo","yonetici"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }

  if(!unit){ showToast("Birim seçin veya yazın.","amber"); return; }
  const itemHint=state.modal?.item||"";

    if(foldTR(prev)===foldTR(unit)){ showToast("Birim zaten aynı.","amber"); state.modal=null; return cur; }

    // Aynı isim + yeni birimde satır var mı → birleştir önerisi
    const twin=(cur.stock||[]).find(s=>s!==st && foldTR(s.item)===foldTR(st.item) && foldTR(s.unit||"")===foldTR(unit));
    if(twin){
      if(!confirm(`«${st.item}» için «${unit}» biriminde zaten ${twin.qty} var.\nMiktarları birleştirip tek satır mı yapalım?`)){
        // yine de sadece bu satırın birimini değiştir
      } else {
        twin.qty=(Number(twin.qty)||0)+(Number(st.qty)||0);
        cur.stock=cur.stock.filter(s=>s!==st);
        cur.products=(cur.products||[]).map(p=>foldTR(p.name)===foldTR(twin.item)?{...p, unit:unit}:p);
        cur.movements.push({id:uid(),at:nowISO(),type:"Birim+Birleşim",item:twin.item,qty:Number(st.qty)||0,unit:unit,ref:"UNIT",note:prev+" → "+unit,by:state.session.fullName});

        showToast("Birim düzeltildi ve satırlar birleştirildi");
        return cur;
      }
    }

    st.unit=unit;
    if(!st.id) st.id=uid();
    cur.products=(cur.products||[]).map(p=>foldTR(p.name)===foldTR(st.item)?{...p, unit:unit}:p);
    cur.movements.push({id:uid(),at:nowISO(),type:"Birim Düzeltme",item:st.item,qty:0,unit:unit,ref:"UNIT",note:prev+" → "+unit,by:state.session.fullName});
    cur.audit.push(pushAudit("Stok Birim", st.item+" · "+prev+" → "+unit));
    state.modal=null;
    showToast("Birim güncellendi: "+unit);
    return cur;
  });

function parseCoord(v){
  if(v==null||v==="") return null;
  const n=Number(String(v).trim().replace(",","."));
  return Number.isFinite(n) ? n : null;
}
/** Leaflet / GPS her zaman [enlem, boylam] = [latitude, longitude] */
function normalizeLatLng(lat,lng){
  let a=Number(lat), b=Number(lng);
  if(!Number.isFinite(a)||!Number.isFinite(b)) return null;
  // Yanlışlıkla ters yazılmışsa düzelt (enlem asla ±90 dışı olamaz)
  if(Math.abs(a)>90 && Math.abs(b)<=90){ const t=a; a=b; b=t; }
  if(a<-90||a>90||b<-180||b>180) return null;
  // (0,0) okyanus — geçersiz say
  if(Math.abs(a)<1e-6 && Math.abs(b)<1e-6) return null;
  return { lat:a, lng:b };
}
function setLatLngInputs(lat,lng){
  const norm=normalizeLatLng(lat,lng);
  if(!norm){ showToast("Geçersiz koordinat.","red"); return false; }
  const latEl=document.getElementById("eq-lat")||document.getElementById("wo-lat");
  const lngEl=document.getElementById("eq-lng")||document.getElementById("wo-lng");
  // Sıra kritik: enlem → lat alanı, boylam → lng alanı
  if(latEl){ latEl.value=norm.lat.toFixed(6); latEl.setAttribute("data-geo","lat"); }
  if(lngEl){ lngEl.value=norm.lng.toFixed(6); lngEl.setAttribute("data-geo","lng"); }
  applyPickerView(norm.lat, norm.lng);
  return true;
}
function applyPickerView(lat,lng){
  if(!_pickerMap) return;
  try{
    const ll=L.latLng(lat,lng); // Leaflet: (lat, lng) — asla ters değil
    if(_pickerMarker) _pickerMarker.setLatLng(ll);
    else _pickerMarker=L.marker(ll,{draggable:true}).addTo(_pickerMap);
    _pickerMap.setView(ll, Math.max(_pickerMap.getZoom()||16, 18), { animate:true });
  }catch(e){ console.warn(e); }
}
function fillGeoFromDevice(){
  const secure=window.isSecureContext || location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1";
  if(!secure){
    showToast("Konum için HTTPS gerekir. Haritada tıklayarak ince ayar yapın.","amber");
    return;
  }
  if(!navigator.geolocation){ showToast("Tarayıcı konum desteklemiyor. Haritadan tıklayın.","red"); return; }
  showToast("Hassas GPS alınıyor (birkaç sn)…","amber");

  // Eski izlemeyi durdur
  if(state._geoWatchId!=null){
    try{ navigator.geolocation.clearWatch(state._geoWatchId); }catch(e){}
    state._geoWatchId=null;
  }

  let best=null;
  let samples=0;
  const TARGET_ACC=25; // metre — hedef
  const ACCEPT_ACC=45; // kabul eşiği
  const MAX_WAIT_MS=18000;
  const started=Date.now();

  const applyBest=function(reason){
    if(state._geoWatchId!=null){
      try{ navigator.geolocation.clearWatch(state._geoWatchId); }catch(e){}
      state._geoWatchId=null;
    }
    if(!best){ showToast("Yeterince hassas konum alınamadı. Haritadan pin ile düzeltin.","amber"); return; }
    const norm=normalizeLatLng(best.lat, best.lng);
    if(!norm){ showToast("Geçersiz koordinat.","red"); return; }
    if(Math.abs(norm.lng)<1 && Math.abs(norm.lat)<40){
      showToast("Konum hatalı görünüyor. Haritadan seçin.","red"); return;
    }
    setLatLngInputs(norm.lat, norm.lng);
    if(!_pickerMap) initGeoPickerMap();
    applyPickerView(norm.lat, norm.lng);
    // Yakın zoom — pin net görünsün
    try{ if(_pickerMap) _pickerMap.setView([norm.lat,norm.lng], 19, {animate:true}); }catch(e){}
    const accTxt=best.acc!=null?(" ±"+Math.round(best.acc)+" m"):"";
    showToast("Konum alındı"+accTxt+" · "+norm.lat.toFixed(6)+", "+norm.lng.toFixed(6)+(reason==="timeout"?" (en iyi örnek)":""));
  };

  const onSample=function(pos){
    samples++;
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;
    const acc=pos.coords.accuracy; // metre
    // Ağ konumu (çok kaba) reddet — genelde 100m+
    if(acc!=null && acc>250) return;
    if(!best || (acc!=null && (best.acc==null || acc<best.acc))){
      best={ lat, lng, acc };
    }
    // Hedef doğruluğa ulaştıysa hemen uygula
    if(acc!=null && acc<=TARGET_ACC){
      applyBest("ok");
      return;
    }
    // Yeterli örnek + kabul edilebilir doğruluk
    if(samples>=3 && acc!=null && acc<=ACCEPT_ACC){
      applyBest("ok");
      return;
    }
    if(Date.now()-started>MAX_WAIT_MS) applyBest("timeout");
  };

  const onErr=function(err){
    if(best){ applyBest("err-fallback"); return; }
    const code=err && err.code;
    let msg="Konum alınamadı.";
    if(code===1) msg="Konum izni reddedildi.";
    else if(code===2) msg="GPS kapalı veya sinyal yok.";
    else if(code===3) msg="Zaman aşımı — açık alanda deneyin veya haritadan seçin.";
    showToast(msg,"red");
    if(state._geoWatchId!=null){
      try{ navigator.geolocation.clearWatch(state._geoWatchId); }catch(e){}
      state._geoWatchId=null;
    }
  };

  // watchPosition: birkaç okuma alıp en düşük accuracy olanı seç
  try{
    state._geoWatchId=navigator.geolocation.watchPosition(onSample, onErr, {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    });
  }catch(e){
    navigator.geolocation.getCurrentPosition(onSample, onErr, {
      enableHighAccuracy:true, timeout:20000, maximumAge:0
    });
  }
  // Güvenlik zamanlayıcısı
  setTimeout(function(){
    if(state._geoWatchId!=null) applyBest("timeout");
  }, MAX_WAIT_MS+500);
}
let _pickerMap=null, _pickerMarker=null;
function lastEquipmentCoords(){
  const list=(state.data.equipment||[]).filter(e=>e.lat!=null&&e.lng!=null&&Number.isFinite(Number(e.lat))&&Number.isFinite(Number(e.lng)));
  if(!list.length) return null;
  // Son eklenen (dizinin sonu veya en yeni)
  const e=list[list.length-1];
  return normalizeLatLng(e.lat, e.lng);
}
function initGeoPickerMap(){
  const el=document.getElementById("eq-map-picker")||document.getElementById("wo-map-picker");
  if(!el || typeof L==="undefined") return;
  try{ if(_pickerMap){ _pickerMap.remove(); _pickerMap=null; _pickerMarker=null; } }catch(e){}
  const latEl=document.getElementById("eq-lat")||document.getElementById("wo-lat");
  const lngEl=document.getElementById("eq-lng")||document.getElementById("wo-lng");
  let lat=parseCoord(latEl?.value), lng=parseCoord(lngEl?.value);
  let norm=normalizeLatLng(lat,lng);
  // Yeni kayıtta konum yoksa: son tanımlanan ekipmanın yanında aç
  if(!norm){
    const last=lastEquipmentCoords();
    if(last){ norm=last; lat=last.lat; lng=last.lng; }
    else { lat=39.0; lng=35.2; }
  } else { lat=norm.lat; lng=norm.lng; }
  const zoom = norm ? 18 : 6;
  _pickerMap=L.map(el,{ zoomControl:true, minZoom:4, maxZoom:19 }).setView([lat,lng], zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{ maxZoom:19, attribution:"© OSM" }).addTo(_pickerMap);
  // Diğer ekipmanları soluk göster (referans)
  (state.data.equipment||[]).forEach(eq=>{
    const n=normalizeLatLng(eq.lat, eq.lng);
    if(!n) return;
    const isBina=/bina|building|blok|yapı|tesis|fabrika|ofis/i.test(String(eq.type||"")+" "+String(eq.name||""));
    const ref=isBina
      ? `<svg width="18" height="20" viewBox="0 0 28 30" xmlns="http://www.w3.org/2000/svg" opacity=".65"><path d="M14 2 L26 12 L26 28 L2 28 L2 12 Z" fill="#94A3B3" stroke="#64748B" stroke-width="1.5"/><rect x="11" y="18" width="6" height="10" fill="#64748B"/></svg>`
      : `<svg width="14" height="18" viewBox="0 0 22 28" xmlns="http://www.w3.org/2000/svg" opacity=".65"><path d="M11 0 C5 0 1 5 1 11 C1 18 11 28 11 28 S21 18 21 11 C21 5 17 0 11 0 Z" fill="#94A3B3" stroke="#64748B" stroke-width="1.5"/><circle cx="11" cy="11" r="3" fill="#E7EBF0"/></svg>`;
    const icon=L.divIcon({
      className:"",
      html:`<div style="line-height:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));">${ref}</div>`,
      iconSize: isBina?[18,20]:[14,18],
      iconAnchor: isBina?[9,20]:[7,18]
    });
    L.marker([n.lat,n.lng],{icon, interactive:false}).addTo(_pickerMap);
  });
  _pickerMarker=L.marker([lat,lng],{ draggable:true }).addTo(_pickerMap);
  _pickerMarker.on("dragend",()=>{
    const p=_pickerMarker.getLatLng();
    setLatLngInputs(p.lat, p.lng);
  });
  _pickerMap.on("click",e=>{
    const la=e.latlng.lat, lo=e.latlng.lng;
    _pickerMarker.setLatLng([la,lo]);
    setLatLngInputs(la, lo);
    showToast("Seçildi: "+la.toFixed(5)+", "+lo.toFixed(5));
  });
  setTimeout(()=>{ try{ _pickerMap.invalidateSize(); }catch(e){} }, 200);
}

function handleFieldOutSubmit(){
  let itemVal=document.getElementById("fo-item")?.value;
  // Serbest çıkış: kart veya elle ad
  const prodSel=document.getElementById("fo-product")?.value;
  const freeName=(document.getElementById("fo-item-name")?.value||"").trim();
  const freeUnit=document.getElementById("fo-item-unit")?.value||"Adet";
  if(prodSel && prodSel.includes("|")) itemVal=prodSel;
  else if(freeName) itemVal=freeName+"|"+freeUnit;
  const qty=Number(document.getElementById("fo-qty")?.value);
  const person=document.getElementById("fo-person")?.value.trim();
  const equipment=(document.getElementById("fo-equipment")?.value||"").trim()
    || (document.getElementById("fo-location")?.value||"").trim();
  if(!itemVal||!qty||qty<=0||!person||!equipment){ showToast("Malzeme, miktar, teslim alan ve ekipman zorunlu.","red"); return; }
  const [itemName,itemUnit]=itemVal.split("|"); let newLog=null;
  let deficit=false;
  // Onay dialogu mutate dışında (blokaj + çift render önle)
  {
    const st0=(state.data.stock||[]);
    let i0=st0.findIndex(s=>s.item.toLowerCase()===itemName.toLowerCase()&&s.unit===itemUnit);
    if(i0<0) i0=st0.findIndex(s=>foldTR(s.item)===foldTR(itemName));
    const have0=i0>=0?Number(st0[i0].qty):0;
    if(have0<qty){
      deficit=true;
      if(!confirm("Sistem stok: "+have0+" "+(itemUnit||"")+"\nÇıkış: "+qty+"\n\nEksik AÇIĞA yazılacak. Devam?")) return;
    }
  }
  mutateData(cur=>{
    if(!Array.isArray(cur.stock)) cur.stock=[];
    let idx=cur.stock.findIndex(s=>s.item.toLowerCase()===itemName.toLowerCase()&&s.unit===itemUnit);
    if(idx<0) idx=cur.stock.findIndex(s=>foldTR(s.item)===foldTR(itemName));
    if(idx>=0){
      cur.stock[idx].qty=Number(cur.stock[idx].qty)-qty;
    } else {
      cur.stock.push({id:uid(), item:itemName, unit:itemUnit||"Adet", qty:-qty, category:"", minLevel:0, provisional:true});
      deficit=true;
      idx=cur.stock.length-1;
    }
    const after=Number(cur.stock[idx].qty);
    if(after<0) deficit=true;
    ensureProductInCatalog(cur, itemName, itemUnit||"Adet", cur.stock[idx].category||"Diğer");
    newLog={id:uid(),item:itemName,unit:itemUnit||"Adet",qty,person,location:equipment,equipment,date:nowISO(),
      deficit:deficit, stockAfter:after, by:state.session.fullName};
    cur.fieldLogs=[newLog,...(cur.fieldLogs||[])];
    if((cur.fieldLogs||[]).length>500) cur.fieldLogs=cur.fieldLogs.slice(0,500);
    if((cur.movements||[]).length>2000) cur.movements=cur.movements.slice(-1500);
    cur.movements=cur.movements||[];
    cur.movements.push({
      id:uid(), at:nowISO(),
      type:deficit?"Saha Çıkış (açık)":"Saha Çıkış",
      item:itemName, qty:-qty, unit:itemUnit||"Adet",
      ref:equipment, location:equipment, equipment:equipment,
      person:person, by:state.session.fullName
    });
    if(deficit){
      cur.notifications=cur.notifications||[];
      cur.notifications.unshift({id:uid(),at:nowISO(),type:"stok",title:"Stok açığı",body:itemName+" · -"+qty+" · "+person,read:false});
    }
    cur.audit.push(pushAudit(deficit?"Saha Sevk (açık)":"Saha Sevk",itemName+" · "+qty+" · "+person+" → "+equipment));
    return cur;
  });
  state.modal=null;
  showToast(deficit?"Sevk edildi — stok açığı oluştu":"Sevk edildi.");
  // İrsaliye otomatik açılmaz — listeden 📄 ile basılır
}

document.addEventListener("keydown", e=>{
  if(!state.session) return;
  const tag=(e.target&&e.target.tagName)||"";
  const typing=/INPUT|TEXTAREA|SELECT/.test(tag);
  if((e.ctrlKey||e.metaKey) && (e.key==="k"||e.key==="K")){
    e.preventDefault();
    state.showCmd=!state.showCmd; state.cmdQuery=""; render();
    setTimeout(()=>{ const el=document.getElementById("cmd-input"); if(el) el.focus(); }, 30);
    return;
  }
  if(state.showCmd){
    if(e.key==="Escape"){ state.showCmd=false; state.cmdQuery=""; render(); return; }
    if(e.key==="Enter"){
      const first=document.querySelector(".cmd-item");
      if(first) first.click();
      return;
    }
  }
  if(e.key==="Escape" && state.modal){ state.modal=null; render(); }
});
