<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabri Altan İşletme Sistemleri</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#0B0E13; --surface:#171D26; --surface2:#0F141B; --surface3:#1F2733;
    --border:#2B3542; --border-strong:#3A4657;
    --text:#E7EBF0; --text-dim:#94A3B3; --text-mute:#5B6675;
    --amber:#E8A33D; --amber-hover:#F3B65A; --amber-text:#171208;
    --teal:#2DD4A6; --red:#F0554F; --blue:#4C8DFF; --violet:#9C8CF0; --green:#34D399;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); }
  body{ font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5; }
  .font-display{ font-family:'Space Grotesk',system-ui,sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:13px; }
  h1,h2,h3{ margin:0; }
  .input{ width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); outline:none; transition:.15s; }
  .input:focus{ border-color:#c98c2c; box-shadow:0 0 0 3px rgba(232,163,61,.15); }
  .input::placeholder{ color:var(--text-mute); }
  select.input{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2394A3B3'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:28px; }
  .field-label{ display:block; font-size:12px; font-weight:500; color:var(--text-dim); margin-bottom:5px; }
  .req{ color:var(--amber); }
  .btn{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px; border:1px solid transparent; transition:.15s; white-space:nowrap; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--amber); color:var(--amber-text); }
  .btn-primary:hover{ background:var(--amber-hover); }
  .btn-ghost{ background:var(--surface3); color:var(--text); border-color:var(--border); }
  .btn-ghost:hover{ background:#28323F; }
  .btn-danger{ background:rgba(240,85,79,.12); color:#FCA5A1; border-color:rgba(240,85,79,.35); }
  .btn-danger:hover{ background:rgba(240,85,79,.22); }
  .btn-teal{ background:rgba(45,212,166,.15); color:#6EE7C5; border-color:rgba(45,212,166,.4); }
  .btn-teal:hover{ background:rgba(45,212,166,.25); }
  .btn-icon{ padding:6px; border-radius:6px; background:var(--surface3); color:var(--text-dim); border:none; display:inline-flex; }
  .btn-icon:hover{ background:#28323F; color:var(--text); }
  .btn-icon.danger{ background:rgba(240,85,79,.1); color:#F0554F; }
  .btn-block{ width:100%; justify-content:center; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .badge{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid; }
  .badge.tone-slate{ background:rgba(148,163,179,.1); color:#C3CBD6; border-color:rgba(148,163,179,.3); }
  .badge.tone-amber{ background:rgba(232,163,61,.13); color:#F0B65E; border-color:rgba(232,163,61,.4); }
  .badge.tone-blue{ background:rgba(76,141,255,.13); color:#8CB2FF; border-color:rgba(76,141,255,.4); }
  .badge.tone-teal{ background:rgba(45,212,166,.13); color:#6EE7C5; border-color:rgba(45,212,166,.4); }
  .badge.tone-green{ background:rgba(52,211,153,.13); color:#6EE7B7; border-color:rgba(52,211,153,.4); }
  .badge.tone-red{ background:rgba(240,85,79,.13); color:#FCA5A1; border-color:rgba(240,85,79,.4); }
  .badge.tone-violet{ background:rgba(156,140,240,.13); color:#C1B5F5; border-color:rgba(156,140,240,.4); }
  /* ===== Flexbox layout shell ===== */
  #app{ min-height:100vh; display:flex; flex-direction:row; align-items:flex-start; }
  .sidebar{
    width:216px; flex:0 0 216px;
    position:sticky; top:0; height:100vh; max-height:100vh;
    border-right:1px solid #1D2430; background:#0E131A;
    display:flex; flex-direction:column;
    overflow:hidden; z-index:40;
  }
  .sidebar-head{ padding:16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #1D2430; }
  .logo-box{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(145deg,#F0B65E 0%,#C98C2C 55%,#8B6914 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(232,163,61,.35), inset 0 1px 0 rgba(255,255,255,.28);
    overflow:hidden;
  }
  .logo-box svg{ width:28px; height:28px; display:block; }
  .brand-logo-lg{
    width:88px; height:88px; border-radius:22px; margin:0 auto 12px;
    background:linear-gradient(145deg,#F0B65E 0%,#C98C2C 55%,#8B6914 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 32px rgba(232,163,61,.32), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .brand-logo-lg svg{ width:56px; height:56px; display:block; }
  .brand-tag{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); font-weight:600; margin-bottom:4px; }

  .sidebar-title{ font-size:13px; font-weight:600; }
  .sidebar-sub{ font-size:10px; color:var(--text-mute); }
  .nav{ flex:1 1 auto; padding:10px 8px; overflow-y:auto; min-height:0; }
  .nav-section{ display:none; }
  .nav-sec-btn{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    padding:5px 10px; margin:3px 0 0; border:none; border-radius:6px;
    background:transparent; color:var(--text-mute); font-size:10px; font-weight:600;
    text-transform:uppercase; letter-spacing:.05em; cursor:pointer; text-align:left;
  }
  .nav-sec-btn:hover{ background:#171D26; color:var(--text-dim); }
  .nav-sec-btn .chev{ font-size:9px; opacity:.65; transition:transform .12s ease; }
  .nav-sec-btn.open .chev{ transform:rotate(90deg); }
  .nav-sec-items.collapsed{ display:none; }

  .nav-item{ display:flex; align-items:center; gap:7px; width:100%; padding:6px 10px; border-radius:7px; border:none; background:none; color:var(--text-dim); font-size:12px; text-align:left; margin-bottom:0; position:relative; }
  .nav-item:hover{ background:#171D26; color:var(--text); }
  .nav-item.active{ background:rgba(232,163,61,.13); color:#F0B65E; font-weight:600; }
  .nav-item > span:nth-child(2){ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-badge{ position:absolute; right:10px; background:var(--red); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; min-width:18px; text-align:center; flex-shrink:0; }
  .sidebar-foot{ padding:12px; border-top:1px solid #1D2430; flex-shrink:0; }
  .user-chip{ display:flex; align-items:center; gap:8px; padding:0 4px; margin-bottom:8px; min-width:0; }
  .avatar{ width:32px; height:32px; border-radius:999px; background:var(--surface3); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--text-dim); flex-shrink:0; }
  .user-chip-name{ font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-chip-role{ font-size:10px; color:var(--text-mute); }
  main{ flex:1 1 auto; min-width:0; padding:16px 18px; max-width:1280px; overflow-x:hidden; }

  /* ===== Page headers / rows ===== */
  .page-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .page-head > div{ min-width:0; flex:1 1 160px; }
  .page-title{ font-size:20px; font-weight:600; margin:0; }
  .page-sub{ font-size:13px; color:var(--text-mute); margin:4px 0 0; }
  .page-actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex-shrink:0; }

  .stat-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .stat-grid > .card, .stat-grid > .stat-card{ flex:1 1 140px; min-width:0; }
  .stat-card{ display:flex; align-items:center; gap:10px; padding:12px; }
  .stat-icon{ width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
  .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-mute); }
  .stat-value{ font-size:20px; font-weight:600; }

  .table-responsive{ width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
  thead tr{ background:var(--surface2); text-align:left; }
  th{ padding:10px 14px; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-mute); font-weight:600; }
  td{ padding:10px 14px; border-top:1px solid #1D2430; }
  tr:hover td{ background:rgba(255,255,255,.015); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:flex-start; justify-content:center; z-index:100000; padding:12px; padding-top:max(12px, env(safe-area-inset-top)); overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .cmd-palette-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:12000; display:flex; align-items:flex-start; justify-content:center; padding:12vh 16px 16px; }
  .typeahead-wrap{ position:relative; }
  .typeahead-box{
    position:absolute; left:0; right:0; top:100%; z-index:50;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    max-height:220px; overflow-y:auto; margin-top:4px;
    box-shadow:0 12px 32px rgba(0,0,0,.35);
  }
  .typeahead-item{
    display:block; width:100%; text-align:left; padding:12px 14px;
    border:0; background:transparent; color:var(--text); font-size:14px; cursor:pointer;
    border-bottom:1px solid var(--border); min-height:44px;
  }
  .typeahead-item:last-child{ border-bottom:0; }
  .typeahead-item:hover, .typeahead-item.active{ background:var(--surface2); }
  .typeahead-item .ta-sub{ font-size:11px; color:var(--text-mute); margin-top:2px; }
  .cmd-palette{ width:100%; max-width:520px; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.45); overflow:hidden; }
  .cmd-palette input{ width:100%; border:0; background:transparent; color:var(--text); font-size:15px; padding:14px 16px; outline:none; border-bottom:1px solid var(--border); }
  .cmd-list{ max-height:320px; overflow-y:auto; padding:6px; }
  .cmd-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text-dim); }
  .cmd-item:hover, .cmd-item.active{ background:var(--surface2); color:var(--text); }
  .cmd-item kbd{ margin-left:auto; font-size:10px; color:var(--text-mute); background:var(--surface3); padding:2px 6px; border-radius:4px; }
  .insight-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .insight-chip{ flex:1 1 160px; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:12px; }
  .insight-chip .n{ font-size:18px; font-weight:700; font-family:ui-monospace,monospace; }
  .insight-chip.warn{ border-color:rgba(232,163,61,.4); background:rgba(232,163,61,.08); }
  .insight-chip.danger{ border-color:rgba(240,85,79,.4); background:rgba(240,85,79,.08); }
  .insight-chip.ok{ border-color:rgba(52,211,153,.35); background:rgba(52,211,153,.07); }
  .age-badge{ font-size:10px; padding:1px 6px; border-radius:999px; background:var(--surface3); color:var(--text-mute); }
  .age-badge.hot{ background:rgba(240,85,79,.15); color:var(--red); }
  .age-badge.warm{ background:rgba(232,163,61,.15); color:var(--amber); }
  .modal{ width:100%; max-width:580px; padding:18px; max-height:none; margin:8px 0 24px; overflow-y:visible; display:flex; flex-direction:column; gap:0; position:relative; z-index:100001; box-shadow:0 20px 60px rgba(0,0,0,.55); }
  .modal.wide{ max-width:760px; }
  .modal.xl{ max-width:min(960px,96vw); width:100%; }
  .rfq-col-sup{ width:100%; max-width:140px; padding:4px 6px; font-size:11px; margin-top:4px; }
  .modal-row{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 16px; padding:7px 0; border-top:1px solid #1D2430; }
  .modal-row:first-child{ border-top:none; }
  .modal-row .k{ font-size:12px; color:var(--text-mute); flex:0 1 auto; }
  .modal-row .v{ font-size:13px; text-align:right; flex:1 1 auto; min-width:0; word-break:break-word; }

  #toast-container{ position:fixed; bottom:20px; right:20px; z-index:11000; display:flex; flex-direction:column; align-items:flex-end; }
  .toast{ padding:11px 16px; border-radius:8px; font-size:13px; font-weight:600; border:1px solid; box-shadow:0 8px 24px rgba(0,0,0,.35); margin-top:10px; transition:opacity .3s; max-width:min(360px,92vw); }
  .toast.green{ background:rgba(52,211,153,.13); border-color:rgba(52,211,153,.4); color:#6EE7B7; }
  .toast.red{ background:rgba(240,85,79,.13); border-color:rgba(240,85,79,.4); color:#FCA5A1; }
  .toast.amber{ background:rgba(232,163,61,.13); border-color:rgba(232,163,61,.4); color:#F0B65E; }

  .list-item{ padding:14px 16px; cursor:pointer; transition:background .12s; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .list-item:hover{ background:rgba(255,255,255,.02); }
  .filters-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .search-wrap{ position:relative; flex:1 1 160px; min-width:0; max-width:320px; }
  .search-wrap .input{ padding-left:34px; }
  .search-wrap .ic{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-mute); font-size:13px; }
  .empty{ text-align:center; padding:36px; color:var(--text-mute); font-size:13px; }
  .login-wrap{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
  .login-box{ width:100%; max-width:380px; }

  /* Flex utilities */
  .flex{ display:flex; }
  .flex-col{ display:flex; flex-direction:column; }
  .flex-wrap-gap{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .wo-card{
    padding:8px 10px; margin-bottom:6px; overflow:hidden;
  }
  .wo-card-inner{
    display:flex; flex-direction:column; gap:6px;
  }
  .wo-card-top{
    display:flex; flex-direction:column; gap:6px; width:100%; min-width:0;
  }
  .wo-card-body{
    min-width:0; width:100%; cursor:pointer;
    display:flex; flex-direction:column; gap:2px;
  }
  .wo-card-title{
    font-size:13.5px; font-weight:600; margin:0;
    line-height:1.3; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .wo-card-meta{
    font-size:11px; color:var(--text-mute); margin:0;
    line-height:1.35; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;
  }
  .wo-card-actions-top{
    display:flex; flex-wrap:wrap; gap:4px; align-items:center;
    width:100%;
  }
  .wo-card-actions-top .btn{
    padding:5px 9px; font-size:11px; border-radius:6px; white-space:nowrap; min-height:28px;
    line-height:1.1;
  }
  .wo-card-actions-top .btn-pct{
    border-color:var(--teal); color:var(--teal); font-weight:600; margin-left:auto;
  }
  .wo-chip-row{
    display:flex; gap:5px; flex-wrap:nowrap; margin-bottom:1px; align-items:center;
    width:100%;
  }
  .wo-chip-row .badge{ font-size:9px; padding:1px 6px; line-height:15px; }
  .wo-chip-row .mono{ font-size:11px; }
  .wo-sec-tabs{
    display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 10px; align-items:center;
  }
  .wo-sec-tab{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600;
    border:1px solid var(--border); background:var(--surface2); color:var(--text-dim);
    cursor:pointer;
  }
  .wo-sec-tab.active{
    background:rgba(232,163,61,.14); border-color:rgba(232,163,61,.45); color:var(--amber);
  }
  .wo-sec-tab .cnt{
    font-size:10px; font-weight:700; padding:1px 7px; border-radius:999px;
    background:var(--surface3); color:var(--text-mute);
  }
  .wo-sec-tab.active .cnt{ background:rgba(232,163,61,.25); color:var(--amber); }
  .wo-chip-row .btn-pct{
    margin-left:auto;
    padding:2px 8px; font-size:11px; min-height:24px;
    border:1px solid var(--teal); color:var(--teal); font-weight:600;
    border-radius:999px; background:rgba(45,212,191,.08);
  }
  .cat-scroll{ display:flex; flex-wrap:nowrap; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; margin-bottom:8px; }
  .cat-scroll .btn{ flex:0 0 auto; }

  .flex-between{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
  .flex-1{ flex:1 1 auto; min-width:0; }
  .flex-none{ flex:none; }

  .timeline{ border-left:2px solid var(--border); margin-left:8px; padding-left:16px; }
  .timeline-item{ position:relative; margin-bottom:14px; }
  .timeline-item::before{ content:""; position:absolute; left:-21px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--amber); border:2px solid var(--bg); }
  .kpi-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .kpi-row > *{ flex:1 1 160px; min-width:0; }
  .section-title{ font-size:12px; font-weight:600; margin:10px 0 6px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px; }
  .alert-box{ padding:12px 14px; border-radius:8px; font-size:12px; margin-bottom:12px; border:1px solid; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .alert-box.warn{ background:rgba(232,163,61,.08); border-color:rgba(232,163,61,.35); color:#F0B65E; }
  .alert-box.danger{ background:rgba(240,85,79,.08); border-color:rgba(240,85,79,.35); color:#FCA5A1; }
  .alert-box.info{ background:rgba(76,141,255,.08); border-color:rgba(76,141,255,.35); color:#8CB2FF; }
  .alert-box.ok{ background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.35); color:#6EE7B7; }
  .preview-box{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px; margin-top:10px; }
  .preview-row{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px; font-size:13px; padding:4px 0; }
  .preview-row.total{ border-top:1px solid var(--border); margin-top:6px; padding-top:8px; font-weight:700; font-size:15px; }
  .chk{ width:16px; height:16px; accent-color:var(--amber); }
  .eq-map-icon, .wo-map-icon{ background:transparent !important; border:none !important; margin:0 !important; }
  .leaflet-div-icon.eq-map-icon, .leaflet-div-icon.wo-map-icon{ background:transparent !important; border:none !important; }
  .eq-pin-wrap{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    width:52px; min-height:40px; height:auto; line-height:1; pointer-events:none;
    transform-origin:50% 100%; margin:0; box-sizing:border-box;
  }
  .eq-pin-bina{
    width:16px; height:20px;
    border:1.5px solid rgba(11,14,19,.8);
    border-radius:2px 2px 1px 1px;
    opacity:.9;
    position:relative;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    background:
      linear-gradient(180deg, rgba(255,255,255,.22) 0%, transparent 40%),
      var(--pin-c, #64748B);
  }
  .eq-pin-bina::before{
    content:""; position:absolute; left:3px; top:3px; width:3px; height:3px;
    background:rgba(11,14,19,.35);
    box-shadow:5px 0 0 rgba(11,14,19,.35), 0 5px 0 rgba(11,14,19,.35), 5px 5px 0 rgba(11,14,19,.35);

/* ========================================================================

   ======================================================================== */

const ROLES = {

const UNITS = ["Adet","Kutu","Paket","Kg","Litre","Metre","Set","Ton","m²","m³"];
const CATEGORIES = ["Ofis Malzemesi","Hammadde","Yedek Parça","Temizlik","Elektronik","Sarf Malzeme","Mekanik Tesisat","İnşaat","İhrazat","İş Güvenliği","Diğer"];

const WO_TYPES = [
  "İnşaat İşleri","Mekanik İşler","Elektrik İşleri","Alt Yapı İşleri","Etüt İşleri","Diğer"
];
const WO_CAT_FILTERS = ["Tümü", ...WO_TYPES];
const EQ_UNIT_TYPES = ["Bina","Makine","Hat / Hat Kesiti","Saha / Açık Alan","Diğer"];
const IMALAT_CAT_ORDER = ["İnşaat","Mekanik","Elektrik","Alt Yapı","Etüt"];
const IMALAT_TEMPLATES_DEFAULT = {
  "İnşaat": [
    "Kazı / Hafriyat","Temel / Radye","Kalıp / Demir","Beton","Duvar / Örgü",
    "Sıva","Şap","Çatı / Kaplama","Cephe","Doğrama / Pencere","Boya / Bitirme","Genel İnşaat"
  ],
  "Mekanik": [
    "Isıtma tesisatı","Soğutma / Klima","Sıhhi tesisat","Yangın tesisatı",
    "Havalandırma","Pompa / Hidrofor","Kazan / Boyler","Doğalgaz","Genel Mekanik",
    "Kazan Bacası Montajı","Su Deposu Montajı","Güneş Enerji Sistemleri Montajı",
    "Armatör Montajı","Test ve Devreye Alma"
  ],
  "Elektrik": [
    "Güç panosu / Dağıtım","Aydınlatma","Topraklama","Kablo çekimi",
    "Jeneratör","Zayıf akım","Genel Elektrik"
  ],
  "Alt Yapı": [
    "Yağmur hattı","Kanalizasyon","İçme suyu","Drenaj",
    "Yol / Platform","Altyapı kazı","Genel Alt Yapı"
  ],
  "Etüt": [
    "Röleve","Zemin etüdü","Proje kontrol","Ölçüm / Kot","Genel Etüt"
  ]
};
/** Geriye uyumluluk */
const IMALAT_TEMPLATES = IMALAT_TEMPLATES_DEFAULT;

function cloneImalatTemplates(src){
  const s=src||IMALAT_TEMPLATES_DEFAULT;
  const out={};
  Object.keys(s).forEach(cat=>{ out[cat]=[...(s[cat]||[])].map(String); });
  return out;
}
/** Firma geneli iş kalemi şablonu — tüm binalar aynı kalem listesini kullanır */
function getImalatTemplates(fromData){
  const d=fromData||state.data||{};
  let t;
  if(d.imalatTemplates && typeof d.imalatTemplates==="object"){
    t=cloneImalatTemplates(d.imalatTemplates);
  } else {
    t=cloneImalatTemplates(IMALAT_TEMPLATES_DEFAULT);
  }
  // Eksik disiplinleri varsayılandan ekle (mevcut kalemleri bozma)
  IMALAT_CAT_ORDER.forEach(cat=>{
    if(!Array.isArray(t[cat]) || !t[cat].length){
      t[cat]=[...(IMALAT_TEMPLATES_DEFAULT[cat]||[])];
    }
  });
  return t;
}
function orderedImalatCats(progOrTpl){
  const keys=progOrTpl?Object.keys(progOrTpl):[];
  const ordered=[...IMALAT_CAT_ORDER.filter(c=>keys.includes(c)||true)];
  // unique keep order then extras
  const seen=new Set();
  const out=[];
  IMALAT_CAT_ORDER.forEach(c=>{ if(!seen.has(c)){ seen.add(c); out.push(c); } });
  keys.forEach(c=>{ if(!seen.has(c)){ seen.add(c); out.push(c); } });
  return out;
}
function catLabelImalat(cat){
  const m={"İnşaat":"🏗️ İnşaat","Mekanik":"⚙️ Mekanik","Elektrik":"⚡ Elektrik","Alt Yapı":"🚰 Alt Yapı","Etüt":"📐 Etüt"};
  return m[cat]||("📋 "+cat);
}
function setImalatTemplatesOn(cur, tpl){
  cur.imalatTemplates=cloneImalatTemplates(tpl);
  return cur.imalatTemplates;
}
function isBinaEq(eq){
  if(!eq) return false;
  return eq.unitType==="Bina" || /bina/i.test(String(eq.type||"")+" "+String(eq.name||""));
}
/** Şablona göre binanın progress yapısını hizala (yüzdeler korunur) */
function alignProgressToTemplate(prog, tpl){
  tpl=tpl||getImalatTemplates();
  prog=prog && typeof prog==="object" ? {...prog} : {};
  // Montaj → Mekanik
  if(Array.isArray(prog["Montaj"]) && prog["Montaj"].length){
    if(!Array.isArray(prog["Mekanik"])) prog["Mekanik"]=[];
    const have=new Set(prog["Mekanik"].map(it=>String(it.name||"")));
    prog["Montaj"].forEach(it=>{
      if(!have.has(String(it.name||""))) prog["Mekanik"].push(it);
      else {
        const tgt=prog["Mekanik"].find(x=>x.name===it.name);
        if(tgt && Number(it.pct)>Number(tgt.pct)) tgt.pct=it.pct;
      }
    });
    delete prog["Montaj"];
  }
  const next={};
  Object.keys(tpl).forEach(cat=>{
    const names=tpl[cat]||[];
    const oldList=Array.isArray(prog[cat])?prog[cat]:[];

}
/** Raporlar için Excel (.xlsx) — satır/sütun tablosu */
function downloadBlobFile(blob, fname){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=fname;
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 1500);
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}
function exportToXLSX(filename, sheetName, headers, rows){
  const fname=(filename||"liste")+"_"+new Date().toISOString().slice(0,10)+".xlsx";
  const data=[headers, ...(rows||[]).map(r=>{
    if(Array.isArray(r)) return r.map(c=>c==null?"":c);
    return (headers||[]).map(h=>r[h]==null?"":r[h]);
  })];
  if(typeof XLSX==="undefined"){
    showToast("Excel yok, CSV indiriliyor.","amber");
    exportToCSV(filename, headers, rows);
    return;
  }
  try{
    const ws=XLSX.utils.aoa_to_sheet(data);
    ws["!cols"]=(headers||[]).map((h,i)=>{
      let max=String(h||"").length;
      data.forEach(row=>{ const len=String(row[i]==null?"":row[i]).length; if(len>max) max=len; });
      return { wch: Math.min(Math.max(max+2, 10), 48) };
    });
    ws["!freeze"]={ xSplit:0, ySplit:1, topLeftCell:"A2", activePane:"bottomLeft", state:"frozen" };
    const wb=XLSX.utils.book_new();
    const safeName=String(sheetName||"Rapor").slice(0,31).replace(/[\\/?*\[\]]/g,"");
    XLSX.utils.book_append_sheet(wb, ws, safeName||"Rapor");
    // iOS / mobil: writeFile bazen sessizce başarısız — blob ile zorla
    try{
      const out=XLSX.write(wb,{ bookType:"xlsx", type:"array" });
      const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      if(downloadBlobFile(blob, fname)){ showToast("Excel indirildi: "+fname); return; }
    }catch(e1){ console.warn(e1); }
    XLSX.writeFile(wb, fname);
    showToast("Excel indirildi: "+fname);
  }catch(e){
    console.error(e);
    showToast("Excel hatası, CSV deneniyor.","amber");
    exportToCSV(filename, headers, rows);
  }
}

        const db=ev.target.result;

      };
      req.onsuccess=function(ev){
        try{

async function persistDataOnce(d){
  if(!d) return;
  if(dataIsEmpty(d) && !state._allowEmptyWrite){
    console.warn("persistData: boş yazım engellendi");
    return;
  }
  d.meta=d.meta||{};
  d.meta.savedAt=nowISO();
  d.meta.richness=dataRichness(d);
  d.meta.clientId=state._clientId||(state._clientId=Math.random().toString(36).slice(2));
  const payload=JSON.stringify(d);
  if(!window.storage || !window.storage.set){
    throw new Error("Depolama hazır değil");
  }
  // Koruma: sunucudaki veri belirgin daha doluysa ezme
  if(!state._allowEmptyWrite){
    try{
      const r=await window.storage.get(DATA_KEY);
      if(r && r.value){
        let remote=null;
        try{ remote=JSON.parse(r.value); }catch(pe){ remote=null; }
        if(remote && !dataIsEmpty(remote)){
          const rN=dataRichness(remote);
          const nN=d.meta.richness;
          // Sadece felaket senaryosu (boşa yakın yazım)
          if(rN>100 && nN < rN*0.25){
            throw new Error("Koruma: sunucu daha dolu ("+rN+" > "+nN+") — yazım iptal");
          }
        }
      }
    }catch(e){
      if(e && e.message && e.message.indexOf("Koruma:")===0) throw e;
      // okuma hatası yazımı engellemesin
    }
  }
  await window.storage.set(DATA_KEY, payload);
  try{ saveLocalBackup(d); }catch(e){}
  try{ await maybeServerSnapshot(payload, d.meta.richness); }catch(e){}
  state._lastPersistAt=Date.now();
  state._lastPersistRichness=d.meta.richness;
}
/** 3 denemeli anında sunucu yazımı */
async function persistData(d){
  if(!d) return;
  setPersistStatus("Kaydediliyor…","amber"); showSavingOverlay(true);
  let lastErr=null;
  for(let i=0;i<3;i++){
    try{
      await persistDataOnce(d);
      setPersistStatus("✓ Kaydedildi","green");
      state._persistFailCount=0;
      // 2 sn sonra durum satırını sadeleştir
      clearTimeout(state._persistStatusTimer);
      state._persistStatusTimer=setTimeout(()=>{ setPersistStatus("",""); }, 2000);
      return;
    }catch(err){
      lastErr=err;
      console.error("persist try "+(i+1), err);
      await new Promise(r=>setTimeout(r, 120*(i+1)));
    }
  }
  state._persistFailCount=(state._persistFailCount||0)+1;
  setPersistStatus("Sunucu yazılamadı","red");
  showSavingOverlay(false);
  throw lastErr||new Error("persist failed");
}
async function flushPersist(){
  clearTimeout(state._persistDebounce);
  state._persistDebounce=null;
  if(!state.data) return state._persistChain||Promise.resolve();
  if(!state._dirty && state._lastPersistAt && Date.now()-state._lastPersistAt<2000){
    return state._persistChain||Promise.resolve();
  }
  const snap=state.data;
  state._persistChain=(state._persistChain||Promise.resolve()).then(async()=>{
    try{
      if(snap && (!dataIsEmpty(snap) || state._allowEmptyWrite)){
        await persistData(state.data||snap);
        state._dirty=false;
      }
    }catch(pe){
      console.error("flushPersist", pe);
      // Başarısızda yerel yedeği eski/sunucu ile hizalama yok — dirty kalsın
    }
  });
  return state._persistChain;
}

    if(state._dirty && state.data && !dataIsEmpty(state.data)){

      }

    let d=null;

      d=remote;
    } else {
      // Sunucu boş veya yok → yerel yedek (acil)
      let bak=readLocalBackup();
      try{
        const idbBak=await idbReadBackup();
        if(idbBak && idbBak.data && !dataIsEmpty(idbBak.data)){
          const bN=bak&&bak.data?dataRichness(bak.data):0;
          const iN=dataRichness(idbBak.data);
          if(iN>=bN) bak=idbBak;
        }

        // Sunucuya geri yaz (kurtarma)

      } else {
        d=seedData();
        // İlk kurulum: gerçekten hiç kayıt yoksa seed yaz
        if(!fromStorage){
          try{ await persistData(d); }catch(e){}
        }
      }
    }

    d=normalizeData(d);
    // Yedek = sunucunun aynası (ezme yok, sadece mirror)
    if(!dataIsEmpty(d)){
      try{ saveLocalBackup(d); }catch(e){}
    }
    const snap=JSON.stringify({n:dataRichness(d), at:(d.meta&&d.meta.savedAt)||""});
    const same=state._dataSnap===snap && state.data && dataRichness(state.data)===dataRichness(d);
    state.data=d;
    state._dataSnap=snap;
    state.loading=false;

function lightNormalize(d){
  if(!d || typeof d!=="object") return seedData();
  DATA_ARRAYS.forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  if(!d.company) d.company=seedData().company;
  if(!d.counters) d.counters={...(seedData().counters||{})};
  if(!d.imalatTemplates || typeof d.imalatTemplates!=="object") d.imalatTemplates=cloneImalatTemplates(IMALAT_TEMPLATES_DEFAULT);
  if(!d.siteDays || typeof d.siteDays!=="object") d.siteDays={};
  if(!d.meta || typeof d.meta!=="object") d.meta={};

}
function cloneData(d){
  if(d==null) return d;
  try{
    if(typeof structuredClone==="function") return structuredClone(d);
  }catch(e){}
  return JSON.parse(JSON.stringify(d));
}
function trimHeavyArrays(d){
  if(!d) return d;
  // En YENİ kayıtları tut (push ile sona eklenenler)
  if(Array.isArray(d.audit) && d.audit.length>400) d.audit=d.audit.slice(-400);
  if(Array.isArray(d.notifications) && d.notifications.length>150) d.notifications=d.notifications.slice(-150);
  if(Array.isArray(d.messages) && d.messages.length>300) d.messages=d.messages.slice(-300);
  if(Array.isArray(d.movements) && d.movements.length>2000) d.movements=d.movements.slice(-2000);
  if(Array.isArray(d.fieldLogs) && d.fieldLogs.length>800) d.fieldLogs=d.fieldLogs.slice(-800);
  if(Array.isArray(d.campStays) && d.campStays.length>1500){
    const open=d.campStays.filter(s=>s.status==="Konaklayan"||s.status==="Rezerve");
    const closed=d.campStays.filter(s=>s.status!=="Konaklayan"&&s.status!=="Rezerve").slice(0,800);
    d.campStays=open.concat(closed);
  }
  return d;
}

function metaRev(d){

/** Diğer kullanıcıların kayıtlarını almak — kirli değilken */
async function softSyncFromServer(opts){
  opts=opts||{};
  if(state._mutateBusy || state._dirty) return false;
  if(state._softSyncing) return false;
  state._softSyncing=true;
  try{
    const remote=await fetchRemoteData();
    if(!remote || dataIsEmpty(remote)) return false;
    const rT=metaTime(remote), lT=metaTime(state.data);
    const rR=metaRev(remote), lR=metaRev(state.data);
    if(rT>lT+200 || rR>lR){
      const prevIds=new Set((state.data?.notifications||[]).map(n=>n.id));
      const prevUnread=unreadNotifCount();
      const d=normalizeData(remote);
      state.data=d;
      state._dataSnap=JSON.stringify({n:dataRichness(d), at:(d.meta&&d.meta.savedAt)||""});
      try{ saveLocalBackup(d); }catch(e){}
      // Yeni bildirimleri yakala
      const fresh=(d.notifications||[]).filter(n=>n.id && !prevIds.has(n.id) && !n.read && n.byUserId!==state.session?.id);
      fresh.slice(0,3).forEach(n=>announceNotifLocal(n));
      if(fresh.length>3) showToast("🔔 +"+(fresh.length-3)+" bildirim daha","blue");
      if(!opts.silent) setPersistStatus("Senkron ✓","green");
      if(!opts.noRender) render();
      // Badge pulse
      try{
        const badge=document.querySelector("[data-action='toggle-notif'] .nav-badge");
        if(badge && unreadNotifCount()>prevUnread){
          badge.style.transform="scale(1.25)";
          setTimeout(()=>{ try{ badge.style.transform=""; }catch(e){} }, 400);
        }
      }catch(e){}
      return true;
    }
  }catch(e){ console.warn("softSync", e); }
  finally{ state._softSyncing=false; }
  return false;
}
async function mutateData(fn){
  // Seri kuyruk + çok kullanıcılı: her işlemde sunucunun son hali alınır
  const run=async()=>{
    let next=null;
    state._mutateBusy=true;
    try{
      // 1) En güncel sunucu verisi (eşzamanlı depo/saha için kritik)
      let base=null;
      const remote=await fetchRemoteData();
      if(remote && !dataIsEmpty(remote)){
        const rT=metaTime(remote), lT=metaTime(state.data);
        const rR=metaRev(remote), lR=metaRev(state.data);
        // Sunucu daha yeni VEYA eşit rev → sunucu; aksi halde bellek (henüz yazılmamış)
        if(!state.data || dataIsEmpty(state.data) || rT>=lT-50 || rR>=lR){
          base=remote;
        } else {
          base=state.data;
        }
      } else if(state.data){
        base=state.data;
      }
      if(!base){
        const bak=typeof readLocalBackup==="function"?readLocalBackup():null;
        base=(bak&&bak.data)?bak.data:seedData();
      }
      let cur=null;
      try{ cur=cloneData(base); }catch(ce){ cur=JSON.parse(JSON.stringify(base)); }
      cur=normalizeData(cur);
      cur=lightNormalize(cur);
      if(!cur.counters || typeof cur.counters!=="object") cur.counters={};
      ["pr","po","gr","inv","pay","wo","eq","sale","sub","room","stay","product"].forEach(k=>{
        if(cur.counters[k]==null) cur.counters[k]=0;
      });
      if(!Array.isArray(cur.campRooms)) cur.campRooms=[];
      if(!Array.isArray(cur.campStays)) cur.campStays=[];
      if(!Array.isArray(cur.mapKmlLayers)) cur.mapKmlLayers=[];
      if(!Array.isArray(cur.campAssets)) cur.campAssets=[];
      if(!Array.isArray(cur.campFaults)) cur.campFaults=[];
      try{
        next=fn(cur);
      }catch(fnErr){
        console.error("mutate fn", fnErr);
        showToast("İşlem hatası: "+(fnErr&&fnErr.message?fnErr.message:"bilinmeyen"),"red");
        return;
      }
      if(next==null){ showToast("Kayıt iptal.","amber"); return; }
      if(dataIsEmpty(next) && state.data && !dataIsEmpty(state.data) && !state._allowEmptyWrite){
        showToast("Koruma: dolu veri boş kayıt ile silinmedi.","red");
        return;
      }
      if(state.data && !state._allowEmptyWrite){
        const before=dataRichness(base);
        const after=dataRichness(next);
        if(before>20 && after < before*0.30){
          showToast("Koruma: veri aşırı küçüldü — kayıt iptal.","red");
          return;
        }
      }
      next=trimHeavyArrays(next);
      next.meta=next.meta||{};
      next.meta.rev=(metaRev(base)||0)+1;
      next.meta.savedAt=nowISO();
      next.meta.richness=dataRichness(next);
      next.meta.clientId=state._clientId||(state._clientId=Math.random().toString(36).slice(2));

      // 2) Anında ekran (dinamizm) — sunucu arka planda
      state.data=next;
      state._dirty=true;
      render();
      setPersistStatus("Kaydediliyor…","amber");

      // 3) Sunucuya yaz (çakışmada 1 kez yeniden dene)
      let written=false;
      for(let attempt=0; attempt<2 && !written; attempt++){
        try{
          // Çakışma: yazmadan hemen önce biri yazdıysa onun üstüne kendi değişikliğimizi yeniden uygula
          if(attempt>0){
            const again=await fetchRemoteData();
            if(again && !dataIsEmpty(again) && metaRev(again)>=metaRev(next)){
              let cur2=normalizeData(cloneData(again));
              cur2=lightNormalize(cur2);
              const next2=fn(cur2);
              if(next2 && !dataIsEmpty(next2)){
                next=trimHeavyArrays(next2);
                next.meta=next.meta||{};
                next.meta.rev=(metaRev(again)||0)+1;
                next.meta.savedAt=nowISO();
                next.meta.richness=dataRichness(next);
                state.data=next;
                render();
              }
            }
          }
          await persistData(next);
          written=true;
          state._dirty=false;
          setPersistStatus("✓ Kaydedildi","green");
          showSavingOverlay(false);
          clearTimeout(state._persistStatusTimer);
          state._persistStatusTimer=setTimeout(()=>setPersistStatus("",""), 1800);
        }catch(pe){
          console.error("persist try", attempt, pe);
          if(attempt===1){
            state._dirty=true;
            showSavingOverlay(false);
            setPersistStatus("Kayıt başarısız","red");
            showToast("Sunucuya yazılamadı — bağlantıyı kontrol edin.","red");
          } else {
            await new Promise(r=>setTimeout(r, 200));
          }
        }
      }
    }catch(e){
      console.error(e);
      setPersistStatus("Kayıt hatası","red");
      showToast("Kayıt hatası: "+(e&&e.message?e.message:"bilinmeyen"),"red");
    }finally{
      state._mutateBusy=false;
    }
  };
  state._mutateChain=(state._mutateChain||Promise.resolve()).then(run, run);
  return state._mutateChain;
}

async function handleCampImportFile(file){
  if(!file) return;
  if(typeof XLSX==="undefined"){ showToast("Excel kütüphanesi yüklenemedi.","red"); return; }
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const sheet=wb.Sheets[wb.SheetNames[0]];
    const json=XLSX.utils.sheet_to_json(sheet,{defval:""});
    if(!json.length){ showToast("Dosya boş.","amber"); return; }
    const norm=s=>String(s||"").trim();
    const pick=(row, keys)=>{
      for(const k of Object.keys(row)){
        const fk=foldTR(k);
        if(keys.some(x=>fk.includes(foldTR(x)))) return norm(row[k]);
      }
      return "";
    };
    let added=0, updated=0, skipped=0;
    await mutateData(cur=>{
      if(!Array.isArray(cur.campRooms)) cur.campRooms=[];
      json.forEach(row=>{
        const block=pick(row,["blok","block","bina"])||"A";
        const floor=pick(row,["kat","floor"])||"1";
        const roomNo=pick(row,["oda no","oda","room","no","numara"]);
        if(!roomNo){ skipped++; return; }
        const cap=Math.min(10, Math.max(1, Number(pick(row,["kapasite","yatak","capacity","beds"]))||2));
        const cond=pick(row,["durum","condition","status"])||"Kullanıma hazır";
        const note=pick(row,["not","note","aciklama"]);
        const name=roomNo;
        const exist=cur.campRooms.find(r=>r.active!==false && String(r.name||"")===name && String(r.block||"")===block && String(r.floor||"")===floor);
        if(exist){
          exist.capacity=cap;
          exist.condition=cond;
          if(note) exist.note=note;
          updated++;
        } else {
          cur.campRooms.push({
            id:uid(), name, code:name, block, floor, capacity:cap,
            condition:cond, note, active:true, at:nowISO()
          });
          added++;
        }
      });
      cur.audit.push(pushAudit("Kamp Import", "eklenen "+added+" · güncellenen "+updated+" · atlanan "+skipped));
      showToast("Konaklama import: +"+added+" / güncelleme "+updated);
      return cur;
    });
  }catch(e){
    console.error(e);
    showToast("Import hatası: "+(e.message||e),"red");
  }
}

    const res=await fetch(SUPABASE_URL+"/rest/v1/app_storage?select=key,updated_at&or=(key.like."+DATA_KEY+"-snap-*,key.like."+DATA_KEY+"-day-*)&order=updated_at.desc",{

  }catch(e){
    console.error(e);
    showToast("Snapshot listesi alınamadı","red");
  }
}
async function restoreServerSnapshot(key){
  if(!key) return;
  if(!confirm("Sunucu snapshot geri yüklensin mi?\n"+key+"\n\nMevcut verinin üzerine yazılır.")) return;
  showToast("Yükleniyor…","amber");
  try{
    const r=await window.storage.get(key);
    if(!r || !r.value){ showToast("Snapshot okunamadı","red"); return; }
    let data=typeof r.value==="string"?JSON.parse(r.value):r.value;
    if(!data || dataIsEmpty(data)){ showToast("Snapshot boş","red"); return; }
    const n=dataRichness(data);
    state._allowEmptyWrite=true;
    try{
      await mutateData(cur=>{
        const d=normalizeData(JSON.parse(JSON.stringify(data)));
        d.audit=d.audit||[];
        d.audit.push(pushAudit("Sunucu Snapshot Geri Yükleme", key+" · "+n));
        showToast("Snapshot yüklendi ("+n+")");
        return d;
      });
    }finally{
      state._allowEmptyWrite=false;
    }
    state.modal=null;
  }catch(e){
    console.error(e);
    showToast("Geri yükleme hatası","red");
    state._allowEmptyWrite=false;
  }
}

async function pickBestLocalBackup(){
  let bak=readLocalBackup();
  try{
    const idb=await idbReadBackup();
    const bN=bak&&bak.data?dataRichness(bak.data):0;
    const iN=idb&&idb.data?dataRichness(idb.data):0;
    if(iN>bN) bak=idb;
  }catch(e){}
  return bak;
}
async function restoreFromBackup(){
  showToast("Yedek aranıyor…","amber");
  const bak=await pickBestLocalBackup();
  if(!bak || !bak.data || dataIsEmpty(bak.data)){
    showToast("Bu cihazda yerel yedek bulunamadı.","amber");
    return;
  }
  const bN=dataRichness(bak.data);
  const sN=state.data?dataRichness(state.data):0;
  if(!confirm("Yerel yedek geri yüklensin mi?\n\nYedek: "+(bak.at||"—")+" · doluluk "+bN+"\nŞu an: "+sN+"\n\nÜzerine yazılır ve sunucuya kaydedilir.")) return;
  state._allowEmptyWrite=true;
  try{
    await mutateData(cur=>{
      const d=normalizeData(JSON.parse(JSON.stringify(bak.data)));
      d.audit=d.audit||[];
      d.audit.push(pushAudit("Yedekten Geri Yükleme", (bak.at||"")+" · "+bN));
      state._emptyWithBackup=false;
      state._recoveryHint=null;
      showToast("Yedek geri yüklendi ("+bN+")");
      return d;
    });
  } finally {
    state._allowEmptyWrite=false;
  }
}
async function checkLocalBackupOffer(){
  try{
    const bak=await pickBestLocalBackup();
    if(!bak||!bak.data||dataIsEmpty(bak.data)) return;
    const bN=dataRichness(bak.data);
    const sN=state.data?dataRichness(state.data):0;

    }
  }catch(e){}
}

function daysOpen(iso){
  if(!iso) return 0;
  const t0=new Date(iso).getTime(); if(isNaN(t0)) return 0;
  return Math.max(0, Math.floor((Date.now()-t0)/86400000));
}

}

/** Türkçe/İngilizce karakter farkını yok say + kelime sırası bağımsız arama */
/** Excel TRNormalize eşleniği — TR karakter + küçük harf + noktalama temiz */
const _foldCache=new Map();
function foldTR(s){
  const raw=String(s||"");
  if(raw.length<64){
    const hit=_foldCache.get(raw);
    if(hit!==undefined) return hit;
  }
  const out=raw.toLocaleLowerCase("tr")
    .replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s")
    .replace(/ı/g,"i").replace(/İ/g,"i").replace(/i/g,"i")
    .replace(/ö/g,"o").replace(/ç/g,"c")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
  if(raw.length<64){
    if(_foldCache.size>800) _foldCache.clear();
    _foldCache.set(raw, out);
  }
  return out;
}
/** VBA: kelimelere böl, hepsi satırda geçsin (sıra bağımsız, boşluk destekli) */
function fuzzyMatch(haystack, query){
  const h=foldTR(haystack);
  const words=foldTR(query).split(" ").filter(Boolean);
  if(!words.length) return true;
  for(let i=0;i<words.length;i++){
    if(h.indexOf(words[i])<0) return false;
  }
  return true;
}

function catalogFilter(list, query, textFn, limit){
  limit=limit||20;
  const q=(query||"").trim();
  if(!q) return [];
  const scored=[];
  const n=foldTR(q);
  for(const it of list||[]){
    const text=textFn?textFn(it):String(it);
    if(!fuzzyMatch(text, q)) continue;
    const f=foldTR(text);
    let score=0;
    if(f===n) score=100;
    else if(f.startsWith(n)) score=90;
    else if(f.includes(n)) score=75;
    else score=50;
    // erken kelime eşleşmesi bonus
    const first=n.split(" ")[0];
    if(first && f.indexOf(first)===0) score+=5;
    scored.push({it, score, text});
  }
  scored.sort((a,b)=>b.score-a.score || a.text.localeCompare(b.text,"tr"));
  return scored.slice(0, limit).map(x=>x.it);
}
function updateTalepSuggest(){
  const box=document.getElementById("talep-suggest");
  const wrap=document.querySelector("#talep-item")?.closest(".typeahead-wrap");
  if(!wrap) return;
  let boxEl=box;
  if(!boxEl){
    boxEl=document.createElement("div");
    boxEl.className="typeahead-box";
    boxEl.id="talep-suggest";
    wrap.appendChild(boxEl);
  }
  const q=state.talepItemQuery||"";
  if(!q.trim() || state._talepPicked){
    boxEl.remove();
    state._talepHits=[];
    return;
  }
  const products=state.data.products||[];
  const hits=catalogFilter(products, q, p=>[p.code,p.name,p.category,p.unit].join(" "), 14);
  state._talepHits=hits;
  boxEl.style.display="block";
  if(!hits.length){
    boxEl.innerHTML='<div class="typeahead-item" style="cursor:default;color:var(--text-mute);">Katalogda yok — serbest yazım kaydedilir</div>';
    return;
  }
  boxEl.innerHTML=hits.map((p,i)=>
    `<button type="button" class="typeahead-item" data-action="talep-pick" data-idx="${i}">
      <div>${esc(p.name)}</div>
      <div class="ta-sub">${esc(p.code||"")} · ${esc(p.category||"")} · ${esc(p.unit||"")}</div>
    </button>`
  ).join("");
}
function applyTalepPick(idx){
  const p=(state._talepHits||[])[idx];
  if(!p) return;
  state.talepItemQuery=p.name;
  state._talepPicked=true;
  const item=document.getElementById("talep-item");
  const catEl=document.getElementById("talep-category");
  const unitEl=document.getElementById("talep-unit");
  if(item) item.value=p.name;
  if(catEl && p.category) catEl.value=p.category;
  if(unitEl && p.unit){
    let found=false;
    for(const o of unitEl.options){ if(o.value===p.unit){ found=true; break; } }
    if(!found){ const o=document.createElement("option"); o.value=p.unit; o.textContent=p.unit; unitEl.appendChild(o); }
    unitEl.value=p.unit;
  }
  document.getElementById("talep-suggest")?.remove();
  state._talepHits=[];
  document.getElementById("talep-qty")?.focus();
}

function countBadge(key){
  const d=state.data; if(!d) return 0;
  if(key==="onay") return d.requests.filter(r=>r.status==="Beklemede").length;
  if(key==="isEmirleri") return d.workOrders.filter(w=>!["Tamamlandı","İptal"].includes(w.status)).length;
  if(key==="satinalma") return d.requests.filter(r=>r.status==="Onaylandı").length;
  if(key==="stok") return d.purchaseOrders.filter(p=>p.status==="Sipariş Verildi"||p.status==="Kısmi Teslim").length;
  if(key==="muhasebe") return d.payments.filter(p=>p.status==="Ödeme Bekliyor").length;
  return 0;
}

function eqTechShort(eq){
  if(!eq) return "";
  const parts=[];
  if(eq.katSayisi!=null && eq.katSayisi!=="") parts.push(eq.katSayisi+"K");
  if(eq.daireSayisi!=null && eq.daireSayisi!=="") parts.push(eq.daireSayisi+"D");
  if(eq.odaSayisi!=null && eq.odaSayisi!=="") parts.push(eq.odaSayisi+"O");
  return parts.join(" · ");
}
function eqTechLine(eq){

  return bits.join(" · ");
}

function equipmentOpenStatus(eq){
  const open=(state.data.workOrders||[]).filter(w=>{
    if(["Tamamlandı","İptal"].includes(w.status)) return false;
    if(w.equipmentId && w.equipmentId===eq.id) return true;
    if(w.equipment && eq.name && w.equipment===eq.name) return true;
    return false;
  });
  if(!open.length) return { color:"#64748B", label:"Boş / iş yok", open:0, status:null };
  if(open.some(w=>w.status==="Malzeme Bekliyor")) return { color:"#E8A33D", label:"Malzeme bekliyor", open:open.length, status:"Malzeme Bekliyor" };
  if(open.some(w=>w.status==="Personel Bekliyor")) return { color:"#9C8CF0", label:"Personel bekliyor", open:open.length, status:"Personel Bekliyor" };
  if(open.some(w=>w.status==="Teknik Onay Bekliyor")) return { color:"#A78BFA", label:"Teknik onay bekliyor", open:open.length, status:"Teknik Onay Bekliyor" };
  if(open.some(w=>w.status==="Devam Ediyor")) return { color:"#2DD4A6", label:"İş devam ediyor", open:open.length, status:"Devam Ediyor" };
  return { color:"#4C8DFF", label:open[0].status||"Açık iş", open:open.length, status:open[0].status };
}
function isBuildingEq(eq){
  if(!eq) return false;
  if(eq.unitType==="Bina") return true;
  const s=String(eq.type||"")+" "+String(eq.name||"");
  return /bina|building|blok|yapı|tesis|fabrika|ofis|apartman|site|hangar|atölye|idari/i.test(s);
}
function woStatusPinColor(status){

    "Personel Bekliyor":"#C084FC",

function collectActiveWorkPins(catFilter){
  catFilter=catFilter||"Tümü";
  const pins=[];
  (state.data.workOrders||[]).forEach(w=>{
    if(["Tamamlandı","İptal","Teknik Tamamlandı"].includes(w.status)) return;
    if(catFilter!=="Tümü" && normalizeWOType(w.type)!==catFilter) return;
    const coords=typeof getCoordsForWO==="function"?getCoordsForWO(w):null;
    if(!coords) return;
    const n=normalizeLatLng(coords.lat, coords.lng);
    if(!n) return;
    pins.push({
      id:w.id,
      no:w.no,
      title:w.title||"",
      status:w.status||"Açık",
      type:w.type||"",
      priority:w.priority||"",
      assignee:w.assigneeName||((w.team||[])[0]&&(w.team||[])[0].name)||"",
      location:w.location||coords.label||"",
      equipment:w.equipment||"",
      lat:n.lat,
      lng:n.lng,
      color:woStatusPinColor(w.status)
    });
  });
  return pins;
}

function progressColor(pct){
  const p=Math.max(0, Math.min(100, Number(pct)||0));
  if(p>=90) return "#22C55E";
  if(p>=70) return "#84CC16";
  if(p>=50) return "#E8A33D";
  if(p>=25) return "#F97316";
  return "#EF4444";
}

function placeUserMarker(lat, lng, acc){
  if(!_dashMap || typeof L==="undefined") return;
  try{
    if(state._userMarker){ try{ _dashMap.removeLayer(state._userMarker); }catch(e){} }
    if(state._userAccCircle){ try{ _dashMap.removeLayer(state._userAccCircle); }catch(e){} }
    const ll=[Number(lat), Number(lng)];
    // Doğruluk halkası (metre)
    if(acc!=null && acc>0 && acc<500){
      state._userAccCircle=L.circle(ll,{
        radius:Math.max(8, Number(acc)),
        color:"#4C8DFF", weight:1, opacity:0.45,
        fillColor:"#4C8DFF", fillOpacity:0.12
      }).addTo(_dashMap);
    }
    state._userMarker=L.circleMarker(ll,{
      radius:7, color:"#fff", weight:2,
      fillColor:"#2563EB", fillOpacity:1
    }).addTo(_dashMap).bindPopup("Konumunuz"+(acc!=null?" · ±"+Math.round(acc)+" m":""));
    state._lastUserPos={ lat:Number(lat), lng:Number(lng), acc:acc!=null?Number(acc):null, at:Date.now() };
  }catch(e){ console.warn(e); }
}
function mapLocateMe(){
  if(!navigator.geolocation){ showToast("Konum desteklenmiyor","amber"); return; }
  if(state._locateWatchId!=null){
    try{ navigator.geolocation.clearWatch(state._locateWatchId); }catch(e){}
    state._locateWatchId=null;
  }
  showToast("GPS alınıyor…");
  let best=null, n=0;
  const done=function(){
    if(state._locateWatchId!=null){
      try{ navigator.geolocation.clearWatch(state._locateWatchId); }catch(e){}
      state._locateWatchId=null;
    }
    if(!best){ showToast("GPS alınamadı — açık alanda tekrar deneyin.","amber"); return; }
    const lat=best.lat, lng=best.lng, acc=best.acc;
    const zoom = (acc!=null && acc<=25) ? 19 : (acc!=null && acc<=50 ? 18 : 17);
    flyMapsTo(lat, lng, zoom);
    placeUserMarker(lat, lng, acc);
    showToast("GPS"+(acc!=null?" ±"+Math.round(acc)+" m":"")+" · ham konum (tutturma yok)");
  };
  state._locateWatchId=navigator.geolocation.watchPosition(pos=>{
    n++;
    const acc=pos.coords.accuracy;
    if(acc!=null && acc>200) return;
    const sample={ lat:pos.coords.latitude, lng:pos.coords.longitude, acc:acc };
    if(!best || (acc!=null && (best.acc==null || acc<best.acc))) best=sample;
    if(_dashMap && best) placeUserMarker(best.lat, best.lng, best.acc);
    if(acc!=null && acc<=20 && n>=2){ done(); return; }
    if(n>=5 && acc!=null && acc<=45){ done(); return; }
    if(n>=8){ done(); return; }
  }, err=>{
    if(best) done();
    else {
      let msg="Konum alınamadı.";
      if(err && err.code===1) msg="Konum izni yok.";
      else if(err && err.code===2) msg="GPS sinyali yok.";
      showToast(msg,"red");
    }
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  setTimeout(()=>{ if(state._locateWatchId!=null) done(); }, 14000);
}
function haversineM(lat1,lng1,lat2,lng2){
  const R=6371000, toR=Math.PI/180;
  const dLat=(lat2-lat1)*toR, dLng=(lng2-lng1)*toR;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*toR)*Math.cos(lat2*toR)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* ============================ KML KATMAN ============================ */
function kmlParseCoords(text){
  if(!text) return [];
  return String(text).trim().split(/\s+/).map(p=>{
    const parts=p.split(",");
    const lon=Number(parts[0]), lat=Number(parts[1]);
    if(!Number.isFinite(lat)||!Number.isFinite(lon)) return null;
    return [lat, lon];
  }).filter(Boolean);
}
function parseKmlLayerGroup(kmlText, style){
  style=style||{};
  const color=style.color||"#E8A33D";
  const group=L.layerGroup();
  let count=0;
  try{
    const doc=new DOMParser().parseFromString(kmlText, "text/xml");
    if(doc.querySelector("parsererror")) throw new Error("KML parse hatası");
    const marks=doc.getElementsByTagName("Placemark");
    for(let i=0;i<marks.length;i++){
      const pm=marks[i];
      const name=(pm.getElementsByTagName("name")[0]?.textContent||"").trim()||"KML";
      const desc=(pm.getElementsByTagName("description")[0]?.textContent||"").trim();
      const tip=`<b>${esc(name)}</b>${desc?`<br><span style="font-size:11px">${esc(desc.slice(0,120))}</span>`:""}`;
      // Point
      const pts=pm.getElementsByTagName("Point");
      for(let j=0;j<pts.length;j++){
        const c=kmlParseCoords(pts[j].getElementsByTagName("coordinates")[0]?.textContent||"");
        if(c[0]){
          L.circleMarker(c[0],{radius:5,color:color,weight:2,fillColor:color,fillOpacity:.75}).bindPopup(tip).addTo(group);
          count++;
        }
      }
      // LineString
      const lines=pm.getElementsByTagName("LineString");
      for(let j=0;j<lines.length;j++){
        const c=kmlParseCoords(lines[j].getElementsByTagName("coordinates")[0]?.textContent||"");
        if(c.length>=2){
          L.polyline(c,{color:color,weight:3,opacity:.85}).bindPopup(tip).addTo(group);
          count++;
        }
      }
      // Polygon
      const polys=pm.getElementsByTagName("Polygon");
      for(let j=0;j<polys.length;j++){
        const rings=polys[j].getElementsByTagName("LinearRing");
        const latlngs=[];
        for(let r=0;r<rings.length;r++){
          const c=kmlParseCoords(rings[r].getElementsByTagName("coordinates")[0]?.textContent||"");
          if(c.length>=3) latlngs.push(c);
        }
        if(latlngs.length){
          L.polygon(latlngs.length===1?latlngs[0]:latlngs,{color:color,weight:2,fillColor:color,fillOpacity:.2}).bindPopup(tip).addTo(group);
          count++;
        }
      }
    }
  }catch(e){ console.error("KML", e); showToast("KML okunamadı: "+(e.message||e),"red"); }
  group._kmlFeatureCount=count;
  return group;
}
function applyKmlLayersToMap(map){
  if(!map || typeof L==="undefined") return;
  try{ if(state._kmlLayerGroup){ map.removeLayer(state._kmlLayerGroup); } }catch(e){}
  state._kmlLayerGroup=null;
  if(state.mapKmlOff) return;
  const layers=(state.data.mapKmlLayers||[]).filter(l=>l.visible!==false && l.kml);
  if(!layers.length) return;
  const root=L.layerGroup();
  const colors=["#E8A33D","#2DD4A6","#4C8DFF","#9C8CF0","#F0554F","#F0B65E"];
  layers.forEach((l,i)=>{
    const g=parseKmlLayerGroup(l.kml, {color:colors[i%colors.length]});
    g.addTo(root);
  });
  root.addTo(map);
  state._kmlLayerGroup=root;
}

  }
  let prevCenter=null, prevZoom=null;

      prevCenter=_dashMap.getCenter();
      prevZoom=_dashMap.getZoom();
      _dashMap.remove(); _dashMap=null;
    }
  }catch(e){}
  state._mapFp=fp;

    const n=normalizeLatLng(e.lat,e.lng); if(!n) return false;

      return false;
    });

    }).addTo(_dashMap);

      maxZoom:19, opacity:0.85, attribution:""
    }).addTo(_dashMap);
  } else {
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom:19, maxNativeZoom:19, attribution:"&copy; OpenStreetMap"
    }).addTo(_dashMap);
  }
  const bounds=[];
  let totalOpenJobs=0;
  eqs.forEach(eq=>{
    const n=normalizeLatLng(eq.lat, eq.lng); if(!n) return;
    const st=equipmentOpenStatus(eq);
    const c=st.color;
    const openList=openWOsForEquipment(eq);
    // kategori filtresi: bu blokta filtrelenmiş açık iş yoksa ve filtre aktifse iş sayısını filtreye göre

    const jobCount=jobs.length;
    totalOpenJobs+=jobCount;
    const codeLabel=String(eq.code||eq.name||"EQ").slice(0,8);
    // Tek pin / blok — iş sayısı rozeti
    const showTech=!!state.mapShowTech && (eq.mapLabelTech!==false);
    const tech=showTech?eqTechShort(eq):"";
    const noteTxt=(eq.fieldNote||"").trim();
    const showNote=!!state.mapShowNotes && !!noteTxt;
    const noteShort=noteTxt.length>36?noteTxt.slice(0,34)+"…":noteTxt;
    const html=`<div class="eq-pin-wrap" title="${esc((eq.code||"")+" · "+(eq.name||"")+" · "+jobCount+" iş"+(tech?" · "+tech:"")+(noteTxt?" · "+noteTxt:""))}">
        <div class="eq-pin-bina-wrap">
          <div class="eq-pin-bina" style="--pin-c:${c};background-color:${c};"></div>
          <span class="eq-pin-count ${jobCount?"":"zero"}">${jobCount}</span>
        </div>
        <div class="eq-pin-label">${esc(codeLabel)}</div>
        ${tech?`<div class="eq-pin-tech">${esc(tech)}</div>`:""}
        ${showNote?`<div class="eq-pin-note">${esc(noteShort)}</div>`:""}
      </div>`;
    // Bina pini — not açıkken yükseklik artar
    const iconH = (tech?52:40) + (showNote?22:0);
    const icon=L.divIcon({
      className:"eq-map-icon",
      html,
      iconSize:[52, iconH],
      iconAnchor:[26, 22],
      popupAnchor:[0, -24]
    });
    const m=L.marker([n.lat, n.lng],{ icon, keyboard:false, riseOnHover:true }).addTo(_dashMap);
    const isBinaMap=eq.unitType==="Bina" || /bina/i.test(String(eq.type||"")+" "+String(eq.name||""));
    const pctMap=isBinaMap?overallProgress(ensureEqProgress(eq)):null;
    const openHtml=jobs.length
      ? `<div class="map-pop-jobs">
          <div style="font-size:10px;font-weight:700;margin-bottom:4px;color:#E8A33D;">İşler · ${jobs.length}</div>
          ${jobs.map(w=>`<div style="margin:0 0 4px;padding:4px 6px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid #334155;">
            <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
              <span style="color:${woStatusPinColor(w.status)};">●</span>
              <button type="button" data-action="select-wo" data-id="${w.id}" style="background:none;border:0;color:#4C8DFF;cursor:pointer;padding:0;font-size:11px;font-weight:600;">${esc(w.no)}</button>
              <span style="font-size:9px;color:#94A3B3;">${esc(w.status)}</span>
            </div>
            <div style="color:#E7EBF0;font-size:11px;line-height:1.25;">${esc((w.title||"—").slice(0,36))}</div>
          </div>`).join("")}
        </div>`
      : `<div style="margin-top:4px;font-size:10px;color:#64748B;">Açık iş yok</div>`;
    const techPop=eqTechLine(eq);
    const popup=`<div>
      <strong style="font-size:12px;">${esc(eq.code||"")} · ${esc((eq.name||"").slice(0,22))}</strong><br>
      ${techPop?`<span style="font-size:10px;color:#94A3B3">${esc(techPop)}</span><br>`:""}
      <span style="font-size:10px;color:#94A3B3">${pctMap!=null?`%${pctMap} · `:""}<b style="color:${c}">${jobCount} iş</b></span>
      ${noteTxt?`<div style="margin-top:6px;padding:5px 7px;border-radius:6px;background:rgba(232,163,61,.15);border:1px solid rgba(232,163,61,.35);font-size:11px;color:#FDE68A;line-height:1.3;">📝 ${esc(noteTxt.slice(0,120))}${noteTxt.length>120?"…":""}</div>`:""}
      ${openHtml}
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">
        <button type="button" data-action="map-wo-new" data-id="${eq.id}" style="padding:4px 8px;border-radius:6px;border:0;background:#E8A33D;color:#171208;font-weight:600;cursor:pointer;font-size:10px;">🔧 İş</button>
        <button type="button" data-action="eq-field-note" data-id="${eq.id}" style="padding:4px 8px;border-radius:6px;border:1px solid #E8A33D;background:rgba(232,163,61,.12);color:#E8A33D;font-weight:600;cursor:pointer;font-size:10px;">📝 Not</button>
        ${isBinaMap?`<button type="button" data-action="eq-progress" data-id="${eq.id}" style="padding:4px 8px;border-radius:6px;border:1px solid #2DD4BF;background:rgba(45,212,191,.12);color:#2DD4BF;font-weight:600;cursor:pointer;font-size:10px;">🏗 %</button>`:""}
        <a href="${routeUrlGoogle(n.lat,n.lng)}" target="_blank" rel="noopener" style="padding:4px 8px;border-radius:6px;border:1px solid #4C8DFF;color:#4C8DFF;font-size:10px;text-decoration:none;">🚗</a>
      </div>
    </div>`;
    const mobilePop=window.innerWidth<=960;
    m.bindPopup(popup, {
      maxWidth: mobilePop ? 200 : 260,
      minWidth: 120,
      maxHeight: mobilePop ? 150 : 220,
      autoPan: true,
      autoPanPadding: mobilePop ? [12, 12] : [24, 24],
      autoPanPaddingTopLeft: mobilePop ? [8, 8] : [20, 20],
      autoPanPaddingBottomRight: mobilePop ? [8, 48] : [20, 40],
      keepInView: true,
      closeButton: true,
      className: "map-eq-popup"
    });
    let holdTimer=null;
    const startHold=()=>{ holdTimer=setTimeout(()=>{ openWOFromEquipment(eq.id); }, 550); };
    const clearHold=()=>{ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } };
    m.on("contextmenu", e=>{ if(e.originalEvent) e.originalEvent.preventDefault(); openWOFromEquipment(eq.id); });
    m.on("mousedown", startHold);
    m.on("mouseup", clearHold);
    m.on("mouseout", clearHold);
    m.on("touchstart", startHold);
    m.on("touchend", clearHold);
    m.on("touchmove", clearHold);
    bounds.push([n.lat, n.lng]);
  });

  try{ _dashMap.invalidateSize({animate:false, pan:false}); }catch(e){}
  if(prevCenter && prevZoom!=null && Number.isFinite(prevZoom)){
    _dashMap.setView([prevCenter.lat, prevCenter.lng], prevZoom, {animate:false});
  } else if(bounds.length>=1){
    const b=L.latLngBounds(bounds);
    const mobile = window.innerWidth <= 960;
    _dashMap.fitBounds(b.pad(mobile?0.35:0.15), {
      maxZoom: mobile ? 14 : 16,
      padding: mobile ? [36,36] : [32,32],
      animate:false
    });
  } else {
    const mobile = window.innerWidth <= 960;
    _dashMap.setView([39.0, 35.2], mobile ? 5 : 6);
  }
  const h=document.getElementById("dash-map-hint");
  if(h){
    if(eqs.length){
      h.textContent = `${eqs.length} blok · ${totalOpenJobs} açık iş · pin=kayıtlı koordinat · Konum aç=GPS`;
    } else {
      h.textContent = "Koordinatlı blok yok — Ekipman kartına konum ekleyin.";
    }
  }
  // KML proje katmanları
  try{ applyKmlLayersToMap(_dashMap); }catch(e){ console.error(e); }
  // Önceki kullanıcı konumu varsa geri koy
  if(state._lastUserPos && Number.isFinite(state._lastUserPos.lat)){
    placeUserMarker(state._lastUserPos.lat, state._lastUserPos.lng, state._lastUserPos.acc);
  }
  setTimeout(()=>{
    try{ _dashMap.invalidateSize({animate:false, pan:false}); }catch(e){}
    if(prevCenter && prevZoom!=null){
      try{ _dashMap.setView([prevCenter.lat, prevCenter.lng], prevZoom, {animate:false}); }catch(e){}
    }
  }, 80);
  setTimeout(()=>initImalatMap(force), 50);
}

/* ============================ SAP PM · İŞ EMİRLERİ ============================ */

function initImalatMap(force){
  const el=document.getElementById("dash-map-imalat");
  if(!el || typeof L==="undefined") return;
  // Önceki view korunabilsin
  let prevCenter=null, prevZoom=null;
  try{
    if(window._dashMapImalat){
      prevCenter=window._dashMapImalat.getCenter();
      prevZoom=window._dashMapImalat.getZoom();
      window._dashMapImalat.remove();
      window._dashMapImalat=null;
    }
  }catch(e){}
  const kalem=state.mapIsKalemi||"Tümü";
  const eqs=(state.data.equipment||[]).filter(e=>{
    if(!normalizeLatLng(e.lat,e.lng)) return false;
    // İmalat haritası: öncelik binalar; yoksa tüm koordinatlılar
    return true;
  });
  const center = prevCenter ? [prevCenter.lat, prevCenter.lng]
    : (eqs.length ? [Number(eqs[0].lat), Number(eqs[0].lng)] : [39.0, 35.2]);
  const mobile = window.innerWidth <= 960;
  const map = L.map(el, { zoomControl:true, attributionControl:false, minZoom:4, maxZoom:19 })
    .setView(center, prevZoom||(eqs.length?(mobile?14:15):6));
  window._dashMapImalat=map;
  const basemap=state.mapBasemap||"street";
  if(basemap==="sat"){
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom:19}).addTo(map);
  } else {
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19}).addTo(map);
  }
  const bounds=[];
  eqs.forEach(eq=>{
    const n=normalizeLatLng(eq.lat, eq.lng); if(!n) return;
    const isBina=eq.unitType==="Bina" || /bina/i.test(String(eq.type||"")+" "+String(eq.name||""));
    // Bina değilse de montaj kalemi tutulabilsin — progress yoksa oluşturma sadece bina
    let pct=null, stLabel="—";
    if(isBina){
      pct=packagePct(eq, kalem==="Tümü"?null:kalem, state.mapIsKalemCat);
      stLabel=packageStatusLabel(pct);
    }
    const c = pct!=null ? progressColor(pct) : "#64748B";
    const codeLabel=String(eq.code||eq.name||"EQ").slice(0,8);
    // Teknik etiket — aktif işler haritası ile aynı mantık
    const showTech=!!state.mapShowTech && (eq.mapLabelTech!==false);
    const tech=showTech?eqTechShort(eq):"";
    const techPop=eqTechLine(eq);
    const html=`<div class="eq-pin-wrap" title="${esc((eq.code||"")+" · "+(eq.name||"")+" · "+(kalem==="Tümü"?"Genel":kalem)+" · %"+(pct!=null?pct:"—")+(tech?" · "+tech:""))}">
        <div class="eq-pin-bina-wrap">
          <div class="eq-pin-bina" style="--pin-c:${c};background-color:${c};"></div>
        </div>
        <div class="eq-pin-label">${esc(codeLabel)}${pct!=null?" %"+pct:""}</div>
        ${tech?`<div class="eq-pin-tech">${esc(tech)}</div>`:""}
      </div>`;
    const ih=tech?52:38;
    const icon=L.divIcon({
      className:"eq-map-icon",
      html,
      iconSize:[52, tech?52:40],
      iconAnchor:[26, 22],
      popupAnchor:[0, -(ih-8)]
    });
    const m=L.marker([n.lat,n.lng],{icon}).addTo(map);
    const kalemLine = (!kalem || kalem==="Tümü")
      ? `Genel imalat: <strong style="color:${c}">%${pct!=null?pct:"—"}</strong>`
      : kalem==="__CAT__"
        ? `${esc(state.mapIsKalemCat||"Kategori")} ort.: <strong style="color:${c}">%${pct!=null?pct:"—"}</strong> · ${esc(stLabel)}`
        : `${esc(kalem)}: <strong style="color:${c}">%${pct!=null?pct:"—"}</strong> · ${esc(stLabel)}`;
    const popup=`<div>
      <strong style="font-size:12px;">${esc(eq.code||"")} · ${esc((eq.name||"").slice(0,24))}</strong><br>
      ${techPop?`<span style="font-size:10px;color:#94A3B3">${esc(techPop)}</span><br>`:""}
      <span style="font-size:12px;">${kalemLine}</span><br>
      ${isBina?`<button type="button" data-action="eq-progress" data-id="${eq.id}" style="margin-top:6px;padding:6px 10px;border-radius:6px;border:0;background:${c};color:#111;font-weight:600;cursor:pointer;font-size:12px;">🏗 İmalat / kalem güncelle</button>`:""}
    </div>`;
    const mobilePop=window.innerWidth<=960;
    m.bindPopup(popup, {
      maxWidth: mobilePop ? 200 : 260,
      minWidth: 120,
      autoPan: true,
      keepInView: true,
      className: "map-eq-popup"
    });
    bounds.push([n.lat,n.lng]);
  });
  if(!prevZoom && bounds.length){ try{ map.fitBounds(bounds, {padding: window.innerWidth<=960?[36,36]:[28,28], maxZoom: window.innerWidth<=960?14:16}); }catch(e){} }
  setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 100);
}

function renderIsEmirleri(){
  /* SAHA EKİBİ — sadece: İşi Al / Bitir */
  let list=[...state.data.workOrders];
  if(state.woQuery.trim()){
    list=list.filter(w=>fuzzyMatch([w.no,w.title,w.equipment,w.location,w.type,w.status,w.subName,w.assigneeName].join(" "), state.woQuery));
  }
  // Saha: önce benim açık işlerim, sonra alınabilir işler, en sonda bitenler
  const me=state.session.id;
  // Tamamlananlar ekranda yok — sadece raporlarda
  const open=list.filter(w=>!["Tamamlandı","İptal","Teknik Tamamlandı","Teknik Onay Bekliyor"].includes(w.status));
  const techPending=list.filter(w=>w.status==="Teknik Onay Bekliyor");
  const canTech=["admin","yonetici"].includes(state.session.role);
  const mine=open.filter(w=>(w.team||[]).some(t=>t.id===me)||w.assigneeId===me);
  const available=open.filter(w=>!mine.includes(w));
  const canCreate=roleCan("wo_create");
  const canField=roleCan("wo_take");

  function card(w, mode){
    const team=w.team||[];
    const coords=getCoordsForWO(w);
    const linkedEq = w.equipmentId ? (state.data.equipment||[]).find(e=>e.id===w.equipmentId)
      : (state.data.equipment||[]).find(e=>e.name && w.equipment && e.name===w.equipment);
    const isBina=linkedEq && (linkedEq.unitType==="Bina" || /bina/i.test(String(linkedEq.type||"")));
    const pct=isBina?overallProgress(ensureEqProgress(linkedEq)):null;

    // Sağ üst: ana aksiyonlar + imalat %
    let top="";
    if(canField && mode==="available"){
      top=`<button class="btn btn-primary" data-action="wo-take" data-id="${w.id}">✋ Al</button>`;
    }
    if(canField && mode==="mine"){
      if(w.status==="Malzeme Bekliyor" || w.status==="Personel Bekliyor"){
        top=`<button class="btn btn-teal" data-action="wo-advance" data-id="${w.id}" data-to="Devam Ediyor">▶ Devam</button>
          <button class="btn btn-primary" data-action="wo-complete" data-id="${w.id}">✅ Bitir</button>
          <button class="btn btn-danger" data-action="wo-leave" data-id="${w.id}">↩ Bırak</button>`;
      } else {
        top=`<button class="btn btn-primary" data-action="wo-complete" data-id="${w.id}">✅ Bitir</button>
          <button class="btn btn-danger" data-action="wo-leave" data-id="${w.id}">↩ Bırak</button>`;
      }
    }
    if(mode==="tech" && canTech){
      top=`<button class="btn btn-primary" data-action="wo-tech-complete" data-id="${w.id}">✓ Onayla</button>
        <button class="btn btn-danger" data-action="wo-tech-complete" data-id="${w.id}" title="Modalda geri çevirebilirsiniz">↩ İncele</button>`;
    }
    // İkincil aksiyonlar (kompakt)
    let more="";
    if(canField && mode==="mine" && !["Malzeme Bekliyor","Personel Bekliyor"].includes(w.status)){
      more+=`<button class="btn btn-ghost" style="border-color:var(--amber);color:var(--amber);" data-action="wo-wait-material" data-id="${w.id}">📦</button>`;
      more+=`<button class="btn btn-ghost" style="border-color:var(--violet);color:#C1B5F5;" data-action="wo-wait-crew" data-id="${w.id}">👥</button>`;
      more+=`<button class="btn btn-ghost" data-action="wo-crew-set" data-id="${w.id}" title="Ekip">👷${esc(w.crewCount||team.length||1)}</button>`;
    }
    if(coords) more+=`<button class="btn btn-teal" data-action="wo-route" data-id="${w.id}" title="Rota">🚗</button>`;
    more+=`<button class="btn btn-ghost" data-action="wo-photo" data-id="${w.id}" title="Foto">📷</button>`;
    more+=`<button class="btn btn-ghost" data-action="open-chat" data-entity="wo" data-id="${w.id}" data-label="${esc(w.no)}" title="Sohbet">💬</button>`;
    more+=`<button class="btn btn-teal" data-action="wo-wa-request" data-id="${w.id}" title="WhatsApp talep (formen)">WA talep</button>`;
    more+=`<button class="btn btn-ghost" data-action="contact-edit" data-entity="wo" data-id="${w.id}" title="Muhatap değiştir">👤</button>`;
    if(w.contactPhone){
      more+=contactWaButton(w.contactPhone, w.contactName, buildWoContactMessage(w), "padding:4px 8px;font-size:11px;text-decoration:none;");
    }
    more+=`<button class="btn btn-teal" style="padding:4px 8px;font-size:11px;" data-action="wo-sub-wa" data-id="${w.id}" title="Taşeron muhattabına WhatsApp">WA taşeron</button>`;
    if(["admin","yonetici"].includes(state.session.role) && !["Tamamlandı","İptal"].includes(w.status)){
      const techLbl=w.status==="Teknik Onay Bekliyor"?"Teknik onayla":"✓T";
      more+=`<button class="btn ${w.status==="Teknik Onay Bekliyor"?"btn-primary":"btn-ghost"}" style="${w.status==="Teknik Onay Bekliyor"?"":"border-color:var(--violet);color:#C1B5F5;"}padding:4px 8px;font-size:11px;" data-action="wo-tech-complete" data-id="${w.id}" title="Teknik onay / kapat">${techLbl}</button>`;
    }
    if(more) top = (top||"") + more;
    const pctBtn = isBina
      ? `<button type="button" class="btn btn-ghost btn-pct" data-action="eq-progress" data-id="${linkedEq.id}" title="İnşaat / mekanik imalat">🏗 %${pct}</button>`
      : "";

    return `<div class="card wo-card">
      <div class="wo-card-inner">
        <div class="wo-card-top">
          <div class="wo-chip-row">
            <span class="mono" style="color:var(--amber);">${esc(w.no)}</span>
            ${badge(w.status)}${w.priority==="Acil"?badge("Acil","red"):""}${coords?badge("📍","teal"):""}${ageBadge(w.createdAt||w.openedAt)}
            ${pctBtn}
          </div>
          <div class="wo-card-body" data-action="select-wo" data-id="${w.id}">
            <p class="wo-card-title">${esc(w.title)}</p>
            <p class="wo-card-meta">${w.type?`${esc(w.type)} · `:""}${w.equipment?`⚙️ ${esc(w.equipment)}`:""}${w.subName?` · 👷 ${esc(w.subName)}`:""}${w.location?` · ${esc(w.location)}`:""}${(w.crewCount||team.length)?` · 👥 ${esc(w.crewCount||team.length)}`:""}</p>
          </div>
          ${top?`<div class="wo-card-actions-top">${top}</div>`:""}
        </div>
      </div>
    </div>`;
  }

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px;">
      <div>
        <h1 class="page-title font-display">Saha İşlerim</h1>
        <p class="page-sub">Akış: <strong>İşi Al</strong> → çalış → <strong>Bitir</strong> → <strong>Teknik Onay</strong> (üst yönetici kapatır).</p>
      </div>
      <div class="flex-wrap-gap">
        <button class="btn btn-ghost" data-action="nav" data-tab="isAkisi">🗂️ İş Akışı Tahtası</button>
        ${canCreate?`<button class="btn btn-primary" data-action="wo-new">➕ Yeni İş Emri</button>`:""}
      </div>
    </div>
    <div class="filters-row">
      <div class="search-wrap"><span class="ic">🔍</span><input class="input" id="wo-search" placeholder="Ara…" value="${esc(state.woQuery)}"></div>
    </div>

    <div class="wo-sec-tabs">
      <button type="button" class="wo-sec-tab ${(state.woSecTab||"mine")==="mine"?"active":""}" data-action="wo-sec-tab" data-tab="mine">
        👷 Üzerimdeki İşler <span class="cnt">${mine.length}</span>
      </button>
      <button type="button" class="wo-sec-tab ${(state.woSecTab||"mine")==="available"?"active":""}" data-action="wo-sec-tab" data-tab="available">
        📋 Alınabilir İşler <span class="cnt">${available.length}</span>
      </button>
      ${canTech?`<button type="button" class="wo-sec-tab ${(state.woSecTab||"mine")==="tech"?"active":""}" data-action="wo-sec-tab" data-tab="tech">
        ✓ Teknik Onay <span class="cnt">${techPending.length}</span>
      </button>`:""}
    </div>
    ${(state.woSecTab||"mine")==="tech" && canTech ? (
      techPending.length===0
        ? `<div class="card empty" style="margin-bottom:16px;">Teknik onay bekleyen iş yok.</div>`
        : techPending.map(w=>card(w,"tech")).join("")
    ) : (state.woSecTab||"mine")==="mine" ? (
      mine.length===0
        ? `<div class="card empty" style="margin-bottom:16px;">Üzerinizde açık iş yok. Alınabilir sekmesinden iş alın.</div>`
        : mine.map(w=>card(w,"mine")).join("")
    ) : `
    <div class="cat-scroll">
      ${["Tümü",...WO_TYPES].map(c=>`<button type="button" class="btn ${state.woCatFilter===c?'btn-primary':'btn-ghost'}" style="padding:5px 10px;font-size:11px;" data-action="wo-cat-filter" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
    </div>
    ${(()=>{
      const filt=state.woCatFilter||"Tümü";
      const list=filt==="Tümü"?available:available.filter(w=>normalizeWOType(w.type)===filt);
      if(!available.length) return `<div class="card empty" style="margin-bottom:16px;">Alınabilir iş yok.</div>`;
      if(!list.length) return `<div class="card empty" style="margin-bottom:16px;">Bu kategoride alınabilir iş yok.</div>`;
      const order=WO_TYPES;
      const groups={};
      list.forEach(w=>{ const k=normalizeWOType(w.type); if(!groups[k]) groups[k]=[]; groups[k].push(w); });
      const keys=[...order.filter(k=>groups[k]), ...Object.keys(groups).filter(k=>!order.includes(k))];
      return keys.map(k=>`
        <div style="margin:12px 0 6px;font-size:12px;font-weight:600;color:var(--amber);display:flex;align-items:center;gap:8px;">
          <span>${esc(k)}</span>
          <span class="badge tone-slate">${groups[k].length}</span>
        </div>
        ${groups[k].map(w=>card(w,"available")).join("")}
      `).join("");
