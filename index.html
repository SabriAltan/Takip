function handleEqProgressSave(eqId){
  if(!roleCan("wo_take")&&!roleCan("equipment")&&!["yonetici","admin"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  const nums=[...document.querySelectorAll('.imalat-num[data-eq="'+eqId+'"]')];
  const names=[...document.querySelectorAll('.imalat-name[data-eq="'+eqId+'"]')];
  if(!nums.length && !names.length){ showToast("Kalem yok.","red"); return; }
  mutateData(cur=>{
    const eq0=(cur.equipment||[]).find(x=>x.id===eqId);
    if(!eq0) return cur;
    // Ham progress — align etmeden oku (id→eski ad)
    const raw=eq0.progress && typeof eq0.progress==="object" ? eq0.progress : {};
    const idToOld={};
    Object.keys(raw).forEach(cat=>{
      (Array.isArray(raw[cat])?raw[cat]:[]).forEach(it=>{
        if(it && it.id) idToOld[it.id]={ cat, name:String(it.name||"") };
      });
    });
    // Form sırasına göre yeni global şablon
    const tpl=getImalatTemplates(cur);
    const byCat={};
    names.forEach(inp=>{
      const cat=inp.dataset.cat;
      const nm=(inp.value||"").trim();
      if(!cat||!nm) return;
      if(!byCat[cat]) byCat[cat]=[];
      if(!byCat[cat].includes(nm)) byCat[cat].push(nm);
    });
    // Formda kategori yoksa mevcut şablonu koru
    Object.keys(byCat).forEach(cat=>{ tpl[cat]=byCat[cat]; });
    if(!tpl["İnşaat"]) tpl["İnşaat"]=[...IMALAT_TEMPLATES_DEFAULT["İnşaat"]];
    if(!tpl["Mekanik"]) tpl["Mekanik"]=[...IMALAT_TEMPLATES_DEFAULT["Mekanik"]];

    // Yeniden adlandırma listesi
    const renames=[];
    names.forEach(inp=>{
      const itemId=inp.dataset.item, cat=inp.dataset.cat;
      const nm=(inp.value||"").trim();
      if(!nm || !idToOld[itemId]) return;
      if(idToOld[itemId].name!==nm) renames.push({ cat: idToOld[itemId].cat||cat, oldName:idToOld[itemId].name, newName:nm });
    });

    setImalatTemplatesOn(cur, tpl);

    cur.equipment=(cur.equipment||[]).map(e=>{
      const bina=isBinaEq(e) || e.unitType==="Bina" || e.id===eqId;
      if(!bina) return e;
      // Ham kopya
      let prog={};
      if(e.progress && typeof e.progress==="object"){
        Object.keys(e.progress).forEach(cat=>{
          prog[cat]=(Array.isArray(e.progress[cat])?e.progress[cat]:[]).map(it=>({...it}));
        });
      }
      // Rename (tüm binalarda eski ad → yeni ad)
      renames.forEach(r=>{
        if(!prog[r.cat]) return;
        prog[r.cat]=prog[r.cat].map(it=>String(it.name)===r.oldName?{...it, name:r.newName}:it);
      });
      // Global şablona hizala (yüzdeler eşleşen isimde kalır)
      prog=alignProgressToTemplate(prog, tpl);
      // Bu binanın yüzdeleri formdan
      if(e.id===eqId){
        nums.forEach(inp=>{
          const cat=inp.dataset.cat, itemId=inp.dataset.item;
          const v=Math.max(0, Math.min(100, Number(inp.value)||0));
          const newN=(names.find(n=>n.dataset.item===itemId)?.value||"").trim()
            || idToOld[itemId]?.name;
          if(prog[cat] && newN){
            prog[cat]=prog[cat].map(it=>String(it.name)===newN?{...it, pct:v}:it);
          }
        });
      }
      return {...e, unitType:e.unitType||"Bina", progress:prog};
    });

    const eq=cur.equipment.find(x=>x.id===eqId);
    cur.audit.push(pushAudit("İmalat global", (eq?.code||eqId)+" · kalem "+Object.values(tpl).flat().length+" · rename "+renames.length));
    state.modal=null;
    state._mapFp=null;
    showToast("Kalemler tüm binalara işlendi"+(renames.length?" ("+renames.length+" ad)":"")+".");
    return cur;
  });
}
function handleEqKalemAdd(eqId, catFromBtn){
  if(!roleCan("wo_take")&&!roleCan("equipment")&&!["yonetici","admin"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  let cat=catFromBtn||"";
  let name="";
  if(cat){
    name=(document.getElementById("new-kalem-"+cat)?.value||"").trim();
  } else {
    cat=(document.getElementById("extra-kalem-cat")?.value||"İnşaat").trim();
    name=(document.getElementById("extra-kalem-name")?.value||"").trim();
  }
  if(!name){ showToast("Kalem adı yazın.","red"); return; }
  if(!cat) cat="İnşaat";
  mutateData(cur=>{
    const tpl=getImalatTemplates(cur);
    if(!Array.isArray(tpl[cat])) tpl[cat]=[];
    if(tpl[cat].some(n=>foldTR(n)===foldTR(name))){ showToast("Bu kalem zaten var.","amber"); return cur; }
    tpl[cat]=[...tpl[cat], name];
    setImalatTemplatesOn(cur, tpl);
    cur.equipment=(cur.equipment||[]).map(e=>{
      if(!(isBinaEq(e) || e.unitType==="Bina")) return e;
      return {...e, unitType:e.unitType||"Bina", progress:alignProgressToTemplate(e.progress||{}, tpl)};
    });
    cur.audit.push(pushAudit("İmalat kalemi +", name+" · "+cat+" · tüm binalar"));
    state.modal={type:"eq-progress", id:eqId};
    state._mapFp=null;
    showToast("Eklendi (tüm binalar): "+name);
    return cur;
  });
}
function handleEqKalemDel(eqId, cat, itemId){
  if(!roleCan("wo_take")&&!roleCan("equipment")&&!["yonetici","admin"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  if(!confirm("Bu iş kalemi TÜM binalardan silinsin mi?")) return;
  mutateData(cur=>{
    const eq0=(cur.equipment||[]).find(x=>x.id===eqId);
    // Ham progress'ten ad bul
    let delName=null;
    const raw=eq0&&eq0.progress?eq0.progress:{};
    (Array.isArray(raw[cat])?raw[cat]:[]).forEach(it=>{ if(it&&it.id===itemId) delName=String(it.name||""); });
    if(!delName){
      // fallback aligned
      const prog0=ensureEqProgress({...(eq0||{}), unitType:"Bina"})||{};
      const hit=(prog0[cat]||[]).find(it=>it.id===itemId);
      delName=hit?String(hit.name||""):null;
    }
    if(!delName){ showToast("Kalem bulunamadı.","red"); return cur; }
    const tpl=getImalatTemplates(cur);
    if(tpl[cat]) tpl[cat]=(tpl[cat]||[]).filter(n=>n!==delName);
    setImalatTemplatesOn(cur, tpl);
    cur.equipment=(cur.equipment||[]).map(e=>{
      if(!(isBinaEq(e) || e.unitType==="Bina")) return e;
      return {...e, unitType:e.unitType||"Bina", progress:alignProgressToTemplate(e.progress||{}, tpl)};
    });
    cur.audit.push(pushAudit("İmalat kalemi −", delName+" · "+cat+" · tüm binalar"));
    state.modal={type:"eq-progress", id:eqId};
    state._mapFp=null;
    showToast("Silindi (tüm binalar): "+delName);
    return cur;
  });
}
function exportImalatReport(){
  const rows=collectImalatReportRows();
  if(!rows.length){ showToast("Raporlanacak bina/imalat yok.","amber"); return; }
  const byEq={};
  rows.forEach(r=>{
    const k=r.code+"|"+r.name;
    if(!byEq[k]) byEq[k]={ code:r.code, name:r.name, location:r.location, overall:r.overall, cats:{} };
    byEq[k].cats[r.cat]=r.catAvg;
  });
  const summary=Object.values(byEq).map(e=>[
    e.code, e.name, e.location, e.overall,
    e.cats["İnşaat"]!=null?e.cats["İnşaat"]:"",
    e.cats["Mekanik"]!=null?e.cats["Mekanik"]:""
  ]);
  exportReportWorkbook("imalat_gerceklesme_raporu", [
    { name:"Ozet", headers:["Kod","Blok / Bina","Lokasyon","Genel %","İnşaat %","Mekanik %"], rows:summary },
    { name:"Kalem Detay", headers:["Kod","Blok","Lokasyon","Kategori","İş Kalemi","Gerçekleşme %","Kategori Ort.","Genel %"],
      rows:rows.map(r=>[r.code,r.name,r.location,r.cat,r.item,r.pct,r.catAvg,r.overall]) }
  ]);
}
function handleEqFormSubmit(){
  if(!roleCan("equipment")){ showToast("Ekipman yetkiniz yok.","red"); return; }
  const code=document.getElementById("eq-code").value.trim(), name=document.getElementById("eq-name").value.trim();
  if(!code||!name){ showToast("Kod ve ad zorunlu.","red"); return; }
  const editId=document.getElementById("eq-form")?.dataset?.id||"";
  const norm=normalizeLatLng(parseCoord(document.getElementById("eq-lat")?.value), parseCoord(document.getElementById("eq-lng")?.value));
  const unitType=document.getElementById("eq-unit-type")?.value||"Diğer";
  const subType=document.getElementById("eq-type").value.trim();
  const payload={
    code, name,
    location:document.getElementById("eq-location").value.trim(),
    unitType,
    type: unitType,
    subType: subType||"",
    lat: norm?norm.lat:null, lng: norm?norm.lng:null
  };
  mutateData(cur=>{
    if(editId){
      cur.equipment=(cur.equipment||[]).map(e=>{
        if(e.id!==editId) return e;
        const next={...e,...payload};
        if(unitType==="Bina") next.progress=ensureEqProgress({...next, unitType:"Bina"})||defaultImalatProgress();
        return next;
      });
      cur.audit.push(pushAudit("Ekipman Güncellendi",code+" · "+name+" · "+unitType));
      showToast("Ekipman güncellendi.");
    } else {
      const row={id:uid(),...payload};
      if(unitType==="Bina") row.progress=defaultImalatProgress();
      cur.equipment=[...(cur.equipment||[]),row];
      cur.audit.push(pushAudit("Ekipman Eklendi",code+" · "+name+" · "+unitType));
      showToast("Eklendi.");
    }
    state.modal=null; return cur;
  });
}
function handleStockMinSave(id){
  if(!["admin","depo","yonetici"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  const min=Number(document.getElementById("sm-min")?.value);
  if(!Number.isFinite(min)||min<0){ showToast("Geçerli min stok girin.","red"); return; }
  const itemHint=state.modal?.item||"";
  const unitHint=state.modal?.unit||"";
  mutateData(cur=>{
    const match=s=> (id && s.id===id) || (itemHint && s.item===itemHint && (!unitHint||s.unit===unitHint));
    cur.stock=(cur.stock||[]).map(s=>match(s)?{...s,id:s.id||uid(),minLevel:min}:s);
    const st=cur.stock.find(match);
    if(st){
      cur.products=(cur.products||[]).map(p=>p.name.toLowerCase()===String(st.item).toLowerCase()?{...p,minLevel:min}:p);
    }
    cur.audit.push(pushAudit("Min Stok Güncellendi",(st?.item||id||itemHint)+" → "+min));
    state.modal=null; showToast("Min stok güncellendi."); return cur;
  });
}
function handleStockDeficitSave(id, mode){
  if(!["admin","yonetici"].includes(state.session?.role) && state.session?.role!=="depo"){
    // depo sayım girebilir; onay asıl yönetici — pratikte depo+yonetici
  }
  if(!["admin","yonetici","depo"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  const itemHint=state.modal?.item||"";
  const unitHint=state.modal?.unit||"";
  const note=(document.getElementById("sd-note")?.value||"").trim();
  mutateData(cur=>{
    const match=s=> (id && s.id===id) || (itemHint && s.item===itemHint && (!unitHint||s.unit===unitHint));
    const st=(cur.stock||[]).find(match);
    if(!st){ showToast("Satır yok.","red"); return cur; }
    const prev=Number(st.qty)||0;
    let next;
    if(mode==="zero"){
      next = prev<0 ? 0 : prev;
    } else {
      next=Number(document.getElementById("sd-qty")?.value);
      if(!Number.isFinite(next)){ showToast("Geçerli miktar.","red"); return cur; }
    }
    const delta=next-prev;
    st.qty=next;
    st.provisional=false;
    cur.movements.push({id:uid(),at:nowISO(),type:"Stok Düzeltme",item:st.item,qty:delta,unit:st.unit,ref:"AÇIK",note:note||("önceki "+prev),by:state.session.fullName});
    cur.audit.push(pushAudit("Stok Açığı Kapatıldı", st.item+" · "+prev+" → "+next+(note?" · "+note:"")));
    state.modal=null;
    showToast("Stok güncellendi: "+next+" "+(st.unit||""));
    return cur;
  });
}
function handleStockUnitSave(id){
  if(!["admin","depo","yonetici"].includes(state.session?.role)){ showToast("Yetkiniz yok.","red"); return; }
  const sel=document.getElementById("su-unit-sel")?.value||"";
  let unit=sel==="__custom__" ? (document.getElementById("su-unit-custom")?.value||"").trim() : sel.trim();
  if(!unit){ showToast("Birim seçin veya yazın.","amber"); return; }
  const itemHint=state.modal?.item||"";
  const oldUnit=state.modal?.unit||"";
  mutateData(cur=>{
    const match=s=> (id && s.id===id) || (itemHint && s.item===itemHint && (!oldUnit||s.unit===oldUnit));
    const st=(cur.stock||[]).find(match);
    if(!st){ showToast("Stok satırı yok.","red"); return cur; }
    const prev=st.unit||"";
    if(foldTR(prev)===foldTR(unit)){ showToast("Birim zaten aynı.","amber"); state.modal=null; return cur; }

    // Aynı isim + yeni birimde satır var mı → birleştir önerisi
    const twin=(cur.stock||[]).find(s=>s!==st && foldTR(s.item)===foldTR(st.item) && foldTR(s.unit||"")===foldTR(unit));
    if(twin){
      if(!confirm(`«${st.item}» için «${unit}» biriminde zaten ${twin.qty} var.\nMiktarları birleştirip tek satır mı yapalım?`)){
        // yine de sadece bu satırın birimini değiştir
      } else {
        twin.qty=(Number(twin.qty)||0)+(Number(st.qty)||0);
        cur.stock=cur.stock.filter(s=>s!==st);
        cur.products=(cur.products||[]).map(p=>foldTR(p.name)===foldTR(twin.item)?{...p, unit:unit}:p);
        cur.movements.push({id:uid(),at:nowISO(),type:"Birim+Birleşim",item:twin.item,qty:Number(st.qty)||0,unit:unit,ref:"UNIT",note:prev+" → "+unit,by:state.session.fullName});
        cur.audit.push(pushAudit("Stok Birim", st.item+" · "+prev+" → "+unit+" (birleştirildi)"));
        state.modal=null;
        showToast("Birim düzeltildi ve satırlar birleştirildi");
        return cur;
      }
    }

    st.unit=unit;
    if(!st.id) st.id=uid();
    cur.products=(cur.products||[]).map(p=>foldTR(p.name)===foldTR(st.item)?{...p, unit:unit}:p);
    cur.movements.push({id:uid(),at:nowISO(),type:"Birim Düzeltme",item:st.item,qty:0,unit:unit,ref:"UNIT",note:prev+" → "+unit,by:state.session.fullName});
    cur.audit.push(pushAudit("Stok Birim", st.item+" · "+prev+" → "+unit));
    state.modal=null;
    showToast("Birim güncellendi: "+unit);
    return cur;
  });
}
function getCoordsForWO(w){
  if(!w) return null;
  if(w.lat!=null && w.lng!=null && Number.isFinite(Number(w.lat)) && Number.isFinite(Number(w.lng))){
    return { lat:Number(w.lat), lng:Number(w.lng), label:w.location||w.equipment||w.title||w.no };
  }
  const eq = w.equipmentId
    ? (state.data.equipment||[]).find(e=>e.id===w.equipmentId)
    : (state.data.equipment||[]).find(e=>e.name && w.equipment && e.name===w.equipment);
  if(eq && eq.lat!=null && eq.lng!=null && Number.isFinite(Number(eq.lat)) && Number.isFinite(Number(eq.lng))){
    return { lat:Number(eq.lat), lng:Number(eq.lng), label:eq.name||w.location||w.title };
  }
  return null;
}
function routeUrlGoogle(lat,lng){ return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`; }
function routeUrlApple(lat,lng){ return `https://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`; }
function routeUrlOSM(lat,lng){ return `https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=;${lat}%2C${lng}#map=15/${lat}/${lng}`; }
function mapUrlPin(lat,lng){ return `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=17/${lat}/${lng}`; }
function renderRouteButtons(lat,lng,extraClass=""){

  return `<div class="flex-wrap-gap ${extraClass}" style="margin-top:8px;">
    <a class="btn btn-primary" style="padding:8px 12px;font-size:12px;text-decoration:none;" href="${routeUrlGoogle(lat,lng)}" target="_blank" rel="noopener">🚗 Google Rota</a>
    <a class="btn btn-teal" style="padding:8px 12px;font-size:12px;text-decoration:none;" href="${routeUrlApple(lat,lng)}" target="_blank" rel="noopener">🍎 Apple Rota</a>
    <a class="btn btn-ghost" style="padding:8px 12px;font-size:12px;text-decoration:none;" href="${routeUrlOSM(lat,lng)}" target="_blank" rel="noopener">🗺 OSM Rota</a>
    <a class="btn btn-ghost" style="padding:8px 12px;font-size:12px;text-decoration:none;" href="${mapUrlPin(lat,lng)}" target="_blank" rel="noopener">📍 Haritada Aç</a>
  </div>`;
}
function parseCoord(v){
  if(v==null||v==="") return null;
  const n=Number(String(v).trim().replace(",","."));
  return Number.isFinite(n) ? n : null;
}
/** Leaflet / GPS her zaman [enlem, boylam] = [latitude, longitude] */
function normalizeLatLng(lat,lng){
  let a=Number(lat), b=Number(lng);
  if(!Number.isFinite(a)||!Number.isFinite(b)) return null;
  // Yanlışlıkla ters yazılmışsa düzelt (enlem asla ±90 dışı olamaz)
  if(Math.abs(a)>90 && Math.abs(b)<=90){ const t=a; a=b; b=t; }
  if(a<-90||a>90||b<-180||b>180) return null;
  // (0,0) okyanus — geçersiz say
  if(Math.abs(a)<1e-6 && Math.abs(b)<1e-6) return null;
  return { lat:a, lng:b };
}
function setLatLngInputs(lat,lng){
  const norm=normalizeLatLng(lat,lng);
  if(!norm){ showToast("Geçersiz koordinat.","red"); return false; }
  const latEl=document.getElementById("eq-lat")||document.getElementById("wo-lat");
  const lngEl=document.getElementById("eq-lng")||document.getElementById("wo-lng");
  // Sıra kritik: enlem → lat alanı, boylam → lng alanı
  if(latEl){ latEl.value=norm.lat.toFixed(6); latEl.setAttribute("data-geo","lat"); }

function applyPickerView(lat,lng){
  if(!_pickerMap) return;
  try{
    const ll=L.latLng(lat,lng); // Leaflet: (lat, lng) — asla ters değil
    if(_pickerMarker) _pickerMarker.setLatLng(ll);
    else _pickerMarker=L.marker(ll,{draggable:true}).addTo(_pickerMap);
    _pickerMap.setView(ll, Math.max(_pickerMap.getZoom()||16, 18), { animate:true });
  }catch(e){ console.warn(e); }
}
function fillGeoFromDevice(){
  const secure=window.isSecureContext || location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1";
  if(!secure){
    showToast("Konum için HTTPS gerekir. Haritada tıklayarak ince ayar yapın.","amber");
    return;
  }
  if(!navigator.geolocation){ showToast("Tarayıcı konum desteklemiyor. Haritadan tıklayın.","red"); return; }
  showToast("Hassas GPS alınıyor (birkaç sn)…","amber");

  // Eski izlemeyi durdur
  if(state._geoWatchId!=null){
    try{ navigator.geolocation.clearWatch(state._geoWatchId); }catch(e){}
    state._geoWatchId=null;
  }

  let best=null;
  let samples=0;
  const TARGET_ACC=25; // metre — hedef
  const ACCEPT_ACC=45; // kabul eşiği
  const MAX_WAIT_MS=18000;
  const started=Date.now();

  const applyBest=function(reason){
    if(state._geoWatchId!=null){
      try{ navigator.geolocation.clearWatch(state._geoWatchId); }catch(e){}
      state._geoWatchId=null;
    }
    if(!best){ showToast("Yeterince hassas konum alınamadı. Haritadan pin ile düzeltin.","amber"); return; }
    const norm=normalizeLatLng(best.lat, best.lng);
    if(!norm){ showToast("Geçersiz koordinat.","red"); return; }
    if(Math.abs(norm.lng)<1 && Math.abs(norm.lat)<40){
      showToast("Konum hatalı görünüyor. Haritadan seçin.","red"); return;
    }
    setLatLngInputs(norm.lat, norm.lng);
    if(!_pickerMap) initGeoPickerMap();
    applyPickerView(norm.lat, norm.lng);
    // Yakın zoom — pin net görünsün
    try{ if(_pickerMap) _pickerMap.setView([norm.lat,norm.lng], 19, {animate:true}); }catch(e){}
    const accTxt=best.acc!=null?(" ±"+Math.round(best.acc)+" m"):"";
    showToast("Konum alındı"+accTxt+" · "+norm.lat.toFixed(6)+", "+norm.lng.toFixed(6)+(reason==="timeout"?" (en iyi örnek)":""));
  };

  const onSample=function(pos){
    samples++;
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;
    const acc=pos.coords.accuracy; // metre
    // Ağ konumu (çok kaba) reddet — genelde 100m+
    if(acc!=null && acc>250) return;
    if(!best || (acc!=null && (best.acc==null || acc<best.acc))){
      best={ lat, lng, acc };
    }
    // Hedef doğruluğa ulaştıysa hemen uygula
    if(acc!=null && acc<=TARGET_ACC){
      applyBest("ok");
      return;
    }
    // Yeterli örnek + kabul edilebilir doğruluk
    if(samples>=3 && acc!=null && acc<=ACCEPT_ACC){
      applyBest("ok");
      return;
    }
    if(Date.now()-started>MAX_WAIT_MS) applyBest("timeout");
  };

  const onErr=function(err){
    if(best){ applyBest("err-fallback"); return; }
    const code=err && err.code;
    let msg="Konum alınamadı.";
    if(code===1) msg="Konum izni reddedildi.";
    else if(code===2) msg="GPS kapalı veya sinyal yok.";
    else if(code===3) msg="Zaman aşımı — açık alanda deneyin veya haritadan seçin.";
    showToast(msg,"red");
    if(state._geoWatchId!=null){
      try{ navigator.geolocation.clearWatch(state._geoWatchId); }catch(e){}
      state._geoWatchId=null;
    }
  };

  // watchPosition: birkaç okuma alıp en düşük accuracy olanı seç
  try{
    state._geoWatchId=navigator.geolocation.watchPosition(onSample, onErr, {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    });
  }catch(e){
    navigator.geolocation.getCurrentPosition(onSample, onErr, {
      enableHighAccuracy:true, timeout:20000, maximumAge:0
    });
  }
  // Güvenlik zamanlayıcısı
  setTimeout(function(){
    if(state._geoWatchId!=null) applyBest("timeout");
  }, MAX_WAIT_MS+500);
}
let _pickerMap=null, _pickerMarker=null;
function lastEquipmentCoords(){
  const list=(state.data.equipment||[]).filter(e=>e.lat!=null&&e.lng!=null&&Number.isFinite(Number(e.lat))&&Number.isFinite(Number(e.lng)));
  if(!list.length) return null;
  // Son eklenen (dizinin sonu veya en yeni)
  const e=list[list.length-1];
  return normalizeLatLng(e.lat, e.lng);
}
function initGeoPickerMap(){
  const el=document.getElementById("eq-map-picker")||document.getElementById("wo-map-picker");
  if(!el || typeof L==="undefined") return;
  try{ if(_pickerMap){ _pickerMap.remove(); _pickerMap=null; _pickerMarker=null; } }catch(e){}
  const latEl=document.getElementById("eq-lat")||document.getElementById("wo-lat");
  const lngEl=document.getElementById("eq-lng")||document.getElementById("wo-lng");
  let lat=parseCoord(latEl?.value), lng=parseCoord(lngEl?.value);
  let norm=normalizeLatLng(lat,lng);
  // Yeni kayıtta konum yoksa: son tanımlanan ekipmanın yanında aç
  if(!norm){
    const last=lastEquipmentCoords();
    if(last){ norm=last; lat=last.lat; lng=last.lng; }
    else { lat=39.0; lng=35.2; }
  } else { lat=norm.lat; lng=norm.lng; }
  const zoom = norm ? 18 : 6;
  _pickerMap=L.map(el,{ zoomControl:true, minZoom:4, maxZoom:19 }).setView([lat,lng], zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{ maxZoom:19, attribution:"© OSM" }).addTo(_pickerMap);
  // Diğer ekipmanları soluk göster (referans)
  (state.data.equipment||[]).forEach(eq=>{
    const n=normalizeLatLng(eq.lat, eq.lng);
    if(!n) return;
    const isBina=/bina|building|blok|yapı|tesis|fabrika|ofis/i.test(String(eq.type||"")+" "+String(eq.name||""));
    const ref=isBina
      ? `<svg width="18" height="20" viewBox="0 0 28 30" xmlns="http://www.w3.org/2000/svg" opacity=".65"><path d="M14 2 L26 12 L26 28 L2 28 L2 12 Z" fill="#94A3B3" stroke="#64748B" stroke-width="1.5"/><rect x="11" y="18" width="6" height="10" fill="#64748B"/></svg>`
      : `<svg width="14" height="18" viewBox="0 0 22 28" xmlns="http://www.w3.org/2000/svg" opacity=".65"><path d="M11 0 C5 0 1 5 1 11 C1 18 11 28 11 28 S21 18 21 11 C21 5 17 0 11 0 Z" fill="#94A3B3" stroke="#64748B" stroke-width="1.5"/><circle cx="11" cy="11" r="3" fill="#E7EBF0"/></svg>`;
    const icon=L.divIcon({
      className:"",
      html:`<div style="line-height:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));">${ref}</div>`,
      iconSize: isBina?[18,20]:[14,18],
      iconAnchor: isBina?[9,20]:[7,18]
    });
    L.marker([n.lat,n.lng],{icon, interactive:false}).addTo(_pickerMap);
  });
  _pickerMarker=L.marker([lat,lng],{ draggable:true }).addTo(_pickerMap);
  _pickerMarker.on("dragend",()=>{
    const p=_pickerMarker.getLatLng();
    setLatLngInputs(p.lat, p.lng);
  });
  _pickerMap.on("click",e=>{
    const la=e.latlng.lat, lo=e.latlng.lng;
    _pickerMarker.setLatLng([la,lo]);
    setLatLngInputs(la, lo);
    showToast("Seçildi: "+la.toFixed(5)+", "+lo.toFixed(5));
  });
  setTimeout(()=>{ try{ _pickerMap.invalidateSize(); }catch(e){} }, 200);
}

function handleFieldOutSubmit(){
  let itemVal=document.getElementById("fo-item")?.value;
  // Serbest çıkış: kart veya elle ad
  const prodSel=document.getElementById("fo-product")?.value;
  const freeName=(document.getElementById("fo-item-name")?.value||"").trim();
  const freeUnit=document.getElementById("fo-item-unit")?.value||"Adet";
  if(prodSel && prodSel.includes("|")) itemVal=prodSel;
  else if(freeName) itemVal=freeName+"|"+freeUnit;
  const qty=Number(document.getElementById("fo-qty")?.value);
  const person=document.getElementById("fo-person")?.value.trim();
  const equipment=(document.getElementById("fo-equipment")?.value||"").trim()
    || (document.getElementById("fo-location")?.value||"").trim();
  if(!itemVal||!qty||qty<=0||!person||!equipment){ showToast("Malzeme, miktar, teslim alan ve ekipman zorunlu.","red"); return; }
  const [itemName,itemUnit]=itemVal.split("|"); let newLog=null;
  let deficit=false;
  mutateData(cur=>{
    let stock=[...cur.stock];
    let idx=stock.findIndex(s=>s.item.toLowerCase()===itemName.toLowerCase()&&s.unit===itemUnit);
    // birim esnek eşleşme
    if(idx<0) idx=stock.findIndex(s=>foldTR(s.item)===foldTR(itemName));
    const have=idx>=0?Number(stock[idx].qty):0;
    if(have<qty){
      deficit=true;
      if(!confirm(`Sistem stok: ${have} ${itemUnit||""}\nÇıkış: ${qty}\n\nEksik kısım AÇIĞA yazılacak (stok eksiye düşebilir).\nYönetici sonra «Açığı kapat» ile stok ekler.\n\nDevam?`)) return cur;
    }
    if(idx>=0){
      stock[idx]={...stock[idx], qty:Number(stock[idx].qty)-qty};
    } else {
      // stokta yok — yeni satır eksi ile
      stock.push({id:uid(), item:itemName, unit:itemUnit||"Adet", qty:-qty, category:"", minLevel:0, provisional:true});
      deficit=true;
    }
    const after=idx>=0?Number(stock[idx].qty):-qty;
    newLog={id:uid(),item:itemName,unit:itemUnit||"Adet",qty,person,location:equipment,equipment,date:nowISO(),
      deficit: deficit||after<0, stockAfter:after, by:state.session.fullName};
    cur.stock=stock; cur.fieldLogs=[newLog,...(cur.fieldLogs||[])];
    cur.movements.push({id:uid(),at:nowISO(),type:deficit?"Saha Çıkış (açık)":"Saha Çıkış",item:itemName,qty:-qty,unit:itemUnit||"Adet",ref:equipment,by:state.session.fullName});
    if(deficit){
      cur.notifications=(cur.notifications||[]);
      cur.notifications.unshift({id:uid(),at:nowISO(),type:"stok",title:"Stok açığı",body:itemName+" · -"+qty+" · "+person,read:false});
    }
    cur.audit.push(pushAudit(deficit?"Saha Sevk (açık)":"Saha Sevk",itemName+" · "+qty+" · "+person+" → "+equipment));
    return cur;
  });
  if(newLog){ generateFieldDeliveryPDF(newLog); state.modal=null; showToast(deficit?"Sevk edildi — stok açığı oluştu (yönetici kapatır)":"Sevk edildi."); }
}

function downloadMaterialTemplate(){
  const headers=["Kod","Ürün","Kategori","Birim","Miktar","Min"];
  const rows=[
    ["PVC-B-32","PVC Boru Ø32 mm (6 m)","Mekanik Tesisat","Metre",0,0],
    ["PVC-D-32","PVC Dirsek 90° Ø32 mm","Mekanik Tesisat","Adet",0,0],
    ["PPR-B-25","PPRC Boru Ø25 mm PN20","Mekanik Tesisat","Metre",0,0],
    ["PPR-D90-25","PPRC Dirsek 90° Ø25 mm","Mekanik Tesisat","Adet",0,0],
    ["","","","","",""],
    ["ÖRNEK","Kendi listenizi bu satırların altına yapıştırın","Mekanik Tesisat","Adet",0,0]
  ];
  if(typeof XLSX!=="undefined"){
    const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
    ws["!cols"]=[{wch:14},{wch:36},{wch:18},{wch:10},{wch:10},{wch:8}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"MalzemeListesi");
    XLSX.writeFile(wb,"Malzeme_Import_Sablon.xlsx");
    showToast("Şablon indirildi. Listeyi yapıştırıp İçe Aktar ile yükleyin.");
  } else {
    exportToCSV("Malzeme_Import_Sablon", headers, rows);
    showToast("CSV şablon indirildi.");
  }
}
function handleStockImportFile(file){
  if(!file) return;
  if(!roleCan("stock_out") && state.session.role!=="admin"){ showToast("Yetkiniz yok.","red"); return; }
  const name=(file.name||"").toLowerCase();
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      let rows=[];
      if(name.endsWith(".csv")){
        const text=String(ev.target.result||"");
        const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<2){ showToast("CSV boş veya başlıksız.","red"); return; }
        const sep=lines[0].includes(";")&&!lines[0].includes(",") ? ";" : ",";
        const headers=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,""));
          const obj={}; headers.forEach((h,j)=>obj[h]=cols[j]||"");
          rows.push(obj);
        }
      } else {
        if(typeof XLSX==="undefined"){ showToast("Excel kütüphanesi yüklenemedi. CSV deneyin.","red"); return; }
        const data=new Uint8Array(ev.target.result);
        const wb=XLSX.read(data,{type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
      }
      applyStockImportRows(rows);
    }catch(err){
      console.error(err);
      showToast("Dosya okunamadı: "+(err.message||"hata"),"red");
    }
  };
  if(name.endsWith(".csv")) reader.readAsText(file,"utf-8");
  else reader.readAsArrayBuffer(file);
}
function pickField(row, keys){
  const entries=Object.entries(row);
  for(const k of keys){
    const found=entries.find(([h])=>String(h).toLowerCase().trim()===k || String(h).toLowerCase().includes(k));
    if(found && found[1]!=="" && found[1]!=null) return String(found[1]).trim();
  }
  return "";
}
function applyStockImportRows(rows){
  if(!rows||!rows.length){ showToast("Satır bulunamadı.","red"); return; }
  let updated=0, added=0;
  mutateData(cur=>{
    let stock=[...cur.stock];
    let products=[...cur.products];
    rows.forEach(row=>{
      const item=pickField(row,["ürün","urun","malzeme","item","name","ad","ürün adı","urun adi"]);
      const qtyRaw=pickField(row,["miktar","qty","stok","quantity","adet"]);
      const unit=pickField(row,["birim","unit"])||"Adet";
      const category=pickField(row,["kategori","category","grup"])||"Diğer";
      const code=pickField(row,["kod","code","sku"]);
      const minRaw=pickField(row,["min","minimum","min stok","minlevel"]);
      if(!item) return;
      const qty=Number(String(qtyRaw).replace(",","."))||0;
      const minLevel=Number(String(minRaw).replace(",","."))||0;
      const sIdx=stock.findIndex(s=>s.item.toLowerCase()===item.toLowerCase() && String(s.unit).toLowerCase()===unit.toLowerCase());
      if(sIdx>=0){ stock[sIdx]={...stock[sIdx], qty, category, minLevel: minLevel||stock[sIdx].minLevel||0}; updated++; }
      else { stock.push({id:uid(), item, category, unit, qty, minLevel}); added++; }
      if(code || !products.some(p=>p.name.toLowerCase()===item.toLowerCase())){
        if(!products.some(p=>p.name.toLowerCase()===item.toLowerCase())){
          products.push({id:uid(), code:code||("IMP-"+String(products.length+1).padStart(4,"0")), name:item, category, unit, minLevel});
        }
      }
    });
    cur.stock=stock;
    cur.products=products;
    cur.movements.push({id:uid(),at:nowISO(),type:"Excel Import",item:"Toplu stok",qty:updated+added,unit:"satır",ref:fileNameSafe(),by:state.session.fullName});
    cur.audit.push(pushAudit("Stok Import", `+${added} yeni · ${updated} güncellendi`));
    showToast(`Stok aktarıldı: ${added} yeni, ${updated} güncellendi.`);
    return cur;
  });
}
function fileNameSafe(){ return "import_"+new Date().toISOString().slice(0,10); }
