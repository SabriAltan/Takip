<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabri Altan İşletme Sistemleri</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#0B0E13; --surface:#171D26; --surface2:#0F141B; --surface3:#1F2733;
    --border:#2B3542; --border-strong:#3A4657;
    --text:#E7EBF0; --text-dim:#94A3B3; --text-mute:#5B6675;
    --amber:#E8A33D; --amber-hover:#F3B65A; --amber-text:#171208;
    --teal:#2DD4A6; --red:#F0554F; --blue:#4C8DFF; --violet:#9C8CF0; --green:#34D399;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); }
  body{ font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5; }
  .font-display{ font-family:'Space Grotesk',system-ui,sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:13px; }
  h1,h2,h3{ margin:0; }
  .input{ width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); outline:none; transition:.15s; }
  .input:focus{ border-color:#c98c2c; box-shadow:0 0 0 3px rgba(232,163,61,.15); }
  .input::placeholder{ color:var(--text-mute); }
  select.input{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2394A3B3'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:28px; }
  .field-label{ display:block; font-size:12px; font-weight:500; color:var(--text-dim); margin-bottom:5px; }
  .req{ color:var(--amber); }
  .btn{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px; border:1px solid transparent; transition:.15s; white-space:nowrap; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--amber); color:var(--amber-text); }
  .btn-primary:hover{ background:var(--amber-hover); }
  .btn-ghost{ background:var(--surface3); color:var(--text); border-color:var(--border); }
  .btn-ghost:hover{ background:#28323F; }
  .btn-danger{ background:rgba(240,85,79,.12); color:#FCA5A1; border-color:rgba(240,85,79,.35); }
  .btn-danger:hover{ background:rgba(240,85,79,.22); }
  .btn-teal{ background:rgba(45,212,166,.15); color:#6EE7C5; border-color:rgba(45,212,166,.4); }
  .btn-teal:hover{ background:rgba(45,212,166,.25); }
  .btn-icon{ padding:6px; border-radius:6px; background:var(--surface3); color:var(--text-dim); border:none; display:inline-flex; }
  .btn-icon:hover{ background:#28323F; color:var(--text); }
  .btn-icon.danger{ background:rgba(240,85,79,.1); color:#F0554F; }
  .btn-block{ width:100%; justify-content:center; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .badge{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid; }
  .badge.tone-slate{ background:rgba(148,163,179,.1); color:#C3CBD6; border-color:rgba(148,163,179,.3); }
  .badge.tone-amber{ background:rgba(232,163,61,.13); color:#F0B65E; border-color:rgba(232,163,61,.4); }
  .badge.tone-blue{ background:rgba(76,141,255,.13); color:#8CB2FF; border-color:rgba(76,141,255,.4); }
  .badge.tone-teal{ background:rgba(45,212,166,.13); color:#6EE7C5; border-color:rgba(45,212,166,.4); }
  .badge.tone-green{ background:rgba(52,211,153,.13); color:#6EE7B7; border-color:rgba(52,211,153,.4); }
  .badge.tone-red{ background:rgba(240,85,79,.13); color:#FCA5A1; border-color:rgba(240,85,79,.4); }
  .badge.tone-violet{ background:rgba(156,140,240,.13); color:#C1B5F5; border-color:rgba(156,140,240,.4); }
  /* ===== Flexbox layout shell ===== */
  #app{ min-height:100vh; display:flex; flex-direction:row; align-items:flex-start; }
  .sidebar{
    width:216px; flex:0 0 216px;
    position:sticky; top:0; height:100vh; max-height:100vh;
    border-right:1px solid #1D2430; background:#0E131A;
    display:flex; flex-direction:column;
    overflow:hidden; z-index:40;
  }
  .sidebar-head{ padding:16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #1D2430; }
  .logo-box{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(145deg,#F0B65E 0%,#C98C2C 55%,#8B6914 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(232,163,61,.35), inset 0 1px 0 rgba(255,255,255,.28);
    overflow:hidden;
  }
  .logo-box svg{ width:28px; height:28px; display:block; }
  .brand-logo-lg{
    width:88px; height:88px; border-radius:22px; margin:0 auto 12px;
    background:linear-gradient(145deg,#F0B65E 0%,#C98C2C 55%,#8B6914 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 32px rgba(232,163,61,.32), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .brand-logo-lg svg{ width:56px; height:56px; display:block; }
  .brand-tag{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); font-weight:600; margin-bottom:4px; }

  .sidebar-title{ font-size:13px; font-weight:600; }
  .sidebar-sub{ font-size:10px; color:var(--text-mute); }
  .nav{ flex:1 1 auto; padding:10px 8px; overflow-y:auto; min-height:0; }
  .nav-section{ display:none; }
  .nav-sec-btn{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    padding:5px 10px; margin:3px 0 0; border:none; border-radius:6px;
    background:transparent; color:var(--text-mute); font-size:10px; font-weight:600;
    text-transform:uppercase; letter-spacing:.05em; cursor:pointer; text-align:left;
  }
  .nav-sec-btn:hover{ background:#171D26; color:var(--text-dim); }
  .nav-sec-btn .chev{ font-size:9px; opacity:.65; transition:transform .12s ease; }
  .nav-sec-btn.open .chev{ transform:rotate(90deg); }
  .nav-sec-items.collapsed{ display:none; }

  .nav-item{ display:flex; align-items:center; gap:7px; width:100%; padding:6px 10px; border-radius:7px; border:none; background:none; color:var(--text-dim); font-size:12px; text-align:left; margin-bottom:0; position:relative; }
  .nav-item:hover{ background:#171D26; color:var(--text); }
  .nav-item.active{ background:rgba(232,163,61,.13); color:#F0B65E; font-weight:600; }
  .nav-item > span:nth-child(2){ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-badge{ position:absolute; right:10px; background:var(--red); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; min-width:18px; text-align:center; flex-shrink:0; }
  .sidebar-foot{ padding:12px; border-top:1px solid #1D2430; flex-shrink:0; }
  .user-chip{ display:flex; align-items:center; gap:8px; padding:0 4px; margin-bottom:8px; min-width:0; }
  .avatar{ width:32px; height:32px; border-radius:999px; background:var(--surface3); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--text-dim); flex-shrink:0; }
  .user-chip-name{ font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-chip-role{ font-size:10px; color:var(--text-mute); }
  main{ flex:1 1 auto; min-width:0; padding:16px 18px; max-width:1280px; overflow-x:hidden; }

  /* ===== Page headers / rows ===== */
  .page-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .page-head > div{ min-width:0; flex:1 1 160px; }
  .page-title{ font-size:20px; font-weight:600; margin:0; }
  .page-sub{ font-size:13px; color:var(--text-mute); margin:4px 0 0; }
  .page-actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex-shrink:0; }

  .stat-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .stat-grid > .card, .stat-grid > .stat-card{ flex:1 1 140px; min-width:0; }
  .stat-card{ display:flex; align-items:center; gap:10px; padding:12px; }
  .stat-icon{ width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
  .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-mute); }
  .stat-value{ font-size:20px; font-weight:600; }

  .table-responsive{ width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
  thead tr{ background:var(--surface2); text-align:left; }
  th{ padding:10px 14px; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-mute); font-weight:600; }
  td{ padding:10px 14px; border-top:1px solid #1D2430; }
  tr:hover td{ background:rgba(255,255,255,.015); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; z-index:10000; padding:16px; }
  .cmd-palette-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:12000; display:flex; align-items:flex-start; justify-content:center; padding:12vh 16px 16px; }
  .typeahead-wrap{ position:relative; }
  .typeahead-box{
    position:absolute; left:0; right:0; top:100%; z-index:50;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    max-height:220px; overflow-y:auto; margin-top:4px;
    box-shadow:0 12px 32px rgba(0,0,0,.35);
  }
  .typeahead-item{
    display:block; width:100%; text-align:left; padding:12px 14px;
    border:0; background:transparent; color:var(--text); font-size:14px; cursor:pointer;
    border-bottom:1px solid var(--border); min-height:44px;
  }
  .typeahead-item:last-child{ border-bottom:0; }
  .typeahead-item:hover, .typeahead-item.active{ background:var(--surface2); }
  .typeahead-item .ta-sub{ font-size:11px; color:var(--text-mute); margin-top:2px; }
  .cmd-palette{ width:100%; max-width:520px; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.45); overflow:hidden; }
  .cmd-palette input{ width:100%; border:0; background:transparent; color:var(--text); font-size:15px; padding:14px 16px; outline:none; border-bottom:1px solid var(--border); }
  .cmd-list{ max-height:320px; overflow-y:auto; padding:6px; }
  .cmd-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text-dim); }
  .cmd-item:hover, .cmd-item.active{ background:var(--surface2); color:var(--text); }
  .cmd-item kbd{ margin-left:auto; font-size:10px; color:var(--text-mute); background:var(--surface3); padding:2px 6px; border-radius:4px; }
  .insight-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .insight-chip{ flex:1 1 160px; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:12px; }
  .insight-chip .n{ font-size:18px; font-weight:700; font-family:ui-monospace,monospace; }
  .insight-chip.warn{ border-color:rgba(232,163,61,.4); background:rgba(232,163,61,.08); }
  .insight-chip.danger{ border-color:rgba(240,85,79,.4); background:rgba(240,85,79,.08); }
  .insight-chip.ok{ border-color:rgba(52,211,153,.35); background:rgba(52,211,153,.07); }
  .age-badge{ font-size:10px; padding:1px 6px; border-radius:999px; background:var(--surface3); color:var(--text-mute); }
  .age-badge.hot{ background:rgba(240,85,79,.15); color:var(--red); }
  .age-badge.warm{ background:rgba(232,163,61,.15); color:var(--amber); }
  .modal{ width:100%; max-width:580px; padding:22px; max-height:88vh; overflow-y:auto; display:flex; flex-direction:column; gap:0; position:relative; z-index:10001; box-shadow:0 20px 60px rgba(0,0,0,.55); }
  .modal.wide{ max-width:760px; }
  .modal.xl{ max-width:min(960px,96vw); width:100%; }
  .rfq-col-sup{ width:100%; max-width:140px; padding:4px 6px; font-size:11px; margin-top:4px; }
  .modal-row{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 16px; padding:7px 0; border-top:1px solid #1D2430; }
  .modal-row:first-child{ border-top:none; }
  .modal-row .k{ font-size:12px; color:var(--text-mute); flex:0 1 auto; }
  .modal-row .v{ font-size:13px; text-align:right; flex:1 1 auto; min-width:0; word-break:break-word; }

  #toast-container{ position:fixed; bottom:20px; right:20px; z-index:11000; display:flex; flex-direction:column; align-items:flex-end; }
  .toast{ padding:11px 16px; border-radius:8px; font-size:13px; font-weight:600; border:1px solid; box-shadow:0 8px 24px rgba(0,0,0,.35); margin-top:10px; transition:opacity .3s; max-width:min(360px,92vw); }
  .toast.green{ background:rgba(52,211,153,.13); border-color:rgba(52,211,153,.4); color:#6EE7B7; }
  .toast.red{ background:rgba(240,85,79,.13); border-color:rgba(240,85,79,.4); color:#FCA5A1; }
  .toast.amber{ background:rgba(232,163,61,.13); border-color:rgba(232,163,61,.4); color:#F0B65E; }

  .list-item{ padding:14px 16px; cursor:pointer; transition:background .12s; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .list-item:hover{ background:rgba(255,255,255,.02); }
  .filters-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .search-wrap{ position:relative; flex:1 1 160px; min-width:0; max-width:320px; }
  .search-wrap .input{ padding-left:34px; }
  .search-wrap .ic{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-mute); font-size:13px; }
  .empty{ text-align:center; padding:36px; color:var(--text-mute); font-size:13px; }
  .login-wrap{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
  .login-box{ width:100%; max-width:380px; }

  /* Flex utilities */
  .flex{ display:flex; }
  .flex-col{ display:flex; flex-direction:column; }
  .flex-wrap-gap{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .wo-card{
    padding:8px 10px; margin-bottom:6px; overflow:hidden;
  }
  .wo-card-inner{
    display:flex; flex-direction:column; gap:6px;
  }
  .wo-card-top{
    display:flex; flex-direction:column; gap:6px; width:100%; min-width:0;
  }
  .wo-card-body{
    min-width:0; width:100%; cursor:pointer;
    display:flex; flex-direction:column; gap:2px;
  }
  .wo-card-title{
    font-size:13.5px; font-weight:600; margin:0;
    line-height:1.3; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .wo-card-meta{
    font-size:11px; color:var(--text-mute); margin:0;
    line-height:1.35; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;
  }
  .wo-card-actions-top{
    display:flex; flex-wrap:wrap; gap:4px; align-items:center;
    width:100%;
  }
  .wo-card-actions-top .btn{
    padding:5px 9px; font-size:11px; border-radius:6px; white-space:nowrap; min-height:28px;
    line-height:1.1;
  }
  .wo-card-actions-top .btn-pct{
    border-color:var(--teal); color:var(--teal); font-weight:600; margin-left:auto;
  }
  .wo-chip-row{
    display:flex; gap:5px; flex-wrap:nowrap; margin-bottom:1px; align-items:center;
    width:100%;
  }
  .wo-chip-row .badge{ font-size:9px; padding:1px 6px; line-height:15px; }
  .wo-chip-row .mono{ font-size:11px; }
  .wo-sec-tabs{
    display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 10px; align-items:center;
  }
  .wo-sec-tab{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600;
    border:1px solid var(--border); background:var(--surface2); color:var(--text-dim);
    cursor:pointer;
  }
  .wo-sec-tab.active{
    background:rgba(232,163,61,.14); border-color:rgba(232,163,61,.45); color:var(--amber);
  }
  .wo-sec-tab .cnt{
    font-size:10px; font-weight:700; padding:1px 7px; border-radius:999px;
    background:var(--surface3); color:var(--text-mute);
  }
  .wo-sec-tab.active .cnt{ background:rgba(232,163,61,.25); color:var(--amber); }
  .wo-chip-row .btn-pct{
    margin-left:auto;
    padding:2px 8px; font-size:11px; min-height:24px;
    border:1px solid var(--teal); color:var(--teal); font-weight:600;
    border-radius:999px; background:rgba(45,212,191,.08);
  }
  .cat-scroll{ display:flex; flex-wrap:nowrap; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; margin-bottom:8px; }
  .cat-scroll .btn{ flex:0 0 auto; }

  .flex-between{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
  .flex-1{ flex:1 1 auto; min-width:0; }
  .flex-none{ flex:none; }

  .timeline{ border-left:2px solid var(--border); margin-left:8px; padding-left:16px; }
  .timeline-item{ position:relative; margin-bottom:14px; }
  .timeline-item::before{ content:""; position:absolute; left:-21px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--amber); border:2px solid var(--bg); }
  .kpi-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .kpi-row > *{ flex:1 1 160px; min-width:0; }
  .section-title{ font-size:12px; font-weight:600; margin:10px 0 6px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px; }
  .alert-box{ padding:12px 14px; border-radius:8px; font-size:12px; margin-bottom:12px; border:1px solid; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .alert-box.warn{ background:rgba(232,163,61,.08); border-color:rgba(232,163,61,.35); color:#F0B65E; }
  .alert-box.danger{ background:rgba(240,85,79,.08); border-color:rgba(240,85,79,.35); color:#FCA5A1; }
  .alert-box.info{ background:rgba(76,141,255,.08); border-color:rgba(76,141,255,.35); color:#8CB2FF; }
  .alert-box.ok{ background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.35); color:#6EE7B7; }
  .preview-box{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px; margin-top:10px; }
  .preview-row{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px; font-size:13px; padding:4px 0; }
  .preview-row.total{ border-top:1px solid var(--border); margin-top:6px; padding-top:8px; font-weight:700; font-size:15px; }
  .chk{ width:16px; height:16px; accent-color:var(--amber); }
  .eq-map-icon, .wo-map-icon{ background:transparent !important; border:none !important; margin:0 !important; }
  .leaflet-div-icon.eq-map-icon, .leaflet-div-icon.wo-map-icon{ background:transparent !important; border:none !important; }
  .eq-pin-wrap{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    width:40px; height:34px; line-height:1; pointer-events:none;
    transform-origin:50% 100%; margin:0 auto;
  }
  .eq-pin-bina{
    width:16px; height:20px;
    border:1px solid rgba(11,14,19,.75);
    border-radius:2px 2px 1px 1px;
    opacity:.82;
    position:relative;
    /* simetrik gölge — sola kaymayı önler */
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    background:
      linear-gradient(180deg, rgba(255,255,255,.2) 0%, transparent 40%),
      var(--pin-c, #64748B);
  }
  .eq-pin-bina::before{
    content:""; position:absolute; left:3px; top:3px; width:3px; height:3px;
    background:rgba(11,14,19,.35);
    box-shadow:5px 0 0 rgba(11,14,19,.35), 0 5px 0 rgba(11,14,19,.35), 5px 5px 0 rgba(11,14,19,.35);
  }
  .eq-pin-bina::after{
    content:""; position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:4px; height:5px; background:rgba(11,14,19,.45);
  }

<script>
/* ========================================================================
   KURUMSAL ERP PRO v3
   P2P + SAP PM (İş Emri) + RFQ/Teklif + 3-Way Match + Gelişmiş Kokpit
   ======================================================================== */

const ROLES = {
  admin:      { label:"Sistem Yöneticisi", color:"amber" },
  yonetici:   { label:"Üst Düzey Yönetici", color:"violet" },
  onaylayan:  { label:"Onay Yetkilisi",  color:"blue" },
  satinalma:  { label:"Satın Alma",      color:"teal" },
  depo:       { label:"Depo / Stok",     color:"green" },
  muhasebe:   { label:"Muhasebe / AP",   color:"green" },
  talep_eden: { label:"Talep Eden / Saha", color:"slate" },
};
const UNITS = ["Adet","Kutu","Paket","Kg","Litre","Metre","Set","Ton","m²","m³"];
const CATEGORIES = ["Ofis Malzemesi","Hammadde","Yedek Parça","Temizlik","Elektronik","Sarf Malzeme","Mekanik Tesisat","İnşaat","İş Güvenliği","Diğer"];
const PRIORITIES = ["Düşük","Normal","Yüksek","Acil"];
const PAY_METHODS = ["Banka Havale/EFT","Çek","Kredi Kartı","Nakit","Akreditif"];
/* İş emri kategorisi = disiplin (Montaj/Arıza vb. ayrı kategori değil) */
const WO_TYPES = [
  "İnşaat İşleri","Mekanik İşler","Elektrik İşleri","Alt Yapı İşleri","Etüt İşleri","Diğer"
];
const WO_CAT_FILTERS = ["Tümü", ...WO_TYPES];
const EQ_UNIT_TYPES = ["Bina","Makine","Hat / Hat Kesiti","Saha / Açık Alan","Diğer"];
const IMALAT_TEMPLATES_DEFAULT = {
  "İnşaat": [
    "Kazı / Hafriyat","Temel / Radye","Kalıp / Demir","Beton","Duvar / Örgü",
    "Sıva","Şap","Çatı / Kaplama","Cephe","Doğrama / Pencere","Boya / Bitirme","Genel İnşaat"
  ],
  "Mekanik": [
    "Isıtma tesisatı","Soğutma / Klima","Sıhhi tesisat","Yangın tesisatı",
    "Havalandırma","Pompa / Hidrofor","Kazan / Boyler","Doğalgaz","Genel Mekanik",
    "Kazan Bacası Montajı","Su Deposu Montajı","Güneş Enerji Sistemleri Montajı",
    "Armatör Montajı","Test ve Devreye Alma"
  ]
};
/** Geriye uyumluluk */
const IMALAT_TEMPLATES = IMALAT_TEMPLATES_DEFAULT;

function cloneImalatTemplates(src){
  const s=src||IMALAT_TEMPLATES_DEFAULT;
  const out={};
  Object.keys(s).forEach(cat=>{ out[cat]=[...(s[cat]||[])].map(String); });
  return out;
}
/** Firma geneli iş kalemi şablonu — tüm binalar aynı kalem listesini kullanır */
function getImalatTemplates(fromData){
  const d=fromData||state.data||{};
  if(d.imalatTemplates && typeof d.imalatTemplates==="object"){
    const t=cloneImalatTemplates(d.imalatTemplates);
    if(!t["İnşaat"]) t["İnşaat"]=[...IMALAT_TEMPLATES_DEFAULT["İnşaat"]];
    if(!t["Mekanik"]) t["Mekanik"]=[...IMALAT_TEMPLATES_DEFAULT["Mekanik"]];
    return t;
  }
  return cloneImalatTemplates(IMALAT_TEMPLATES_DEFAULT);
}
function setImalatTemplatesOn(cur, tpl){
  cur.imalatTemplates=cloneImalatTemplates(tpl);
  return cur.imalatTemplates;
}
function isBinaEq(eq){
  if(!eq) return false;
  return eq.unitType==="Bina" || /bina/i.test(String(eq.type||"")+" "+String(eq.name||""));
}
/** Şablona göre binanın progress yapısını hizala (yüzdeler korunur) */
function alignProgressToTemplate(prog, tpl){
  tpl=tpl||getImalatTemplates();
  prog=prog && typeof prog==="object" ? {...prog} : {};
  // Montaj → Mekanik
  if(Array.isArray(prog["Montaj"]) && prog["Montaj"].length){
    if(!Array.isArray(prog["Mekanik"])) prog["Mekanik"]=[];
    const have=new Set(prog["Mekanik"].map(it=>String(it.name||"")));
    prog["Montaj"].forEach(it=>{
      if(!have.has(String(it.name||""))) prog["Mekanik"].push(it);
      else {
        const tgt=prog["Mekanik"].find(x=>x.name===it.name);
        if(tgt && Number(it.pct)>Number(tgt.pct)) tgt.pct=it.pct;
      }
    });
    delete prog["Montaj"];
  }
  const next={};
  Object.keys(tpl).forEach(cat=>{
    const names=tpl[cat]||[];
    const oldList=Array.isArray(prog[cat])?prog[cat]:[];
    const byName={};
    oldList.forEach(it=>{ byName[String(it.name||"")]=it; });
    next[cat]=names.map(name=>{
      const prev=byName[name];
      if(prev) return {...prev, name, pct:Math.max(0, Math.min(100, Number(prev.pct)||0))};
      return { id:uid(), name, pct:0 };
    });
  });
  // Şablonda olmayan ekstra kategoriler (nadir) — yok sayılır; yapı global
  return next;
}
function allImalatKalemleri(){
  const out=[];
  const tpl=getImalatTemplates();
  Object.keys(tpl).forEach(cat=>{
    (tpl[cat]||[]).forEach(name=>out.push({ cat, name }));
  });
  return out;
}
function shortKalemLabel(name){
  return String(name||"")
    .replace(" Montajı","")
    .replace(" Sistemleri"," Sis.")
    .replace(" / ","/")
    .slice(0,22);
}
function defaultImalatProgress(){
  return alignProgressToTemplate({}, getImalatTemplates());
}
function ensureEqProgress(eq){
  if(!eq) return null;
  if(!isBinaEq(eq) && eq.unitType!=="Bina") return null;
  const tpl=getImalatTemplates();
  let prog=eq.progress;
  if(!prog || typeof prog!=="object") prog=defaultImalatProgress();
  return alignProgressToTemplate(prog, tpl);
}
/** Tüm binaların kalem yapısını global şablona çek */
function syncAllBuildingsImalat(cur, tpl){
  tpl=tpl||cur.imalatTemplates||getImalatTemplates();
  setImalatTemplatesOn(cur, tpl);
  cur.equipment=(cur.equipment||[]).map(e=>{
    if(!isBinaEq(e) && e.unitType!=="Bina") return e;
    const prog=alignProgressToTemplate(e.progress||{}, tpl);
    return {...e, unitType:e.unitType||"Bina", progress:prog};
  });
  return cur;
}

function catAvgProgress(items){
  if(!items||!items.length) return 0;
  return Math.round(items.reduce((s,it)=>s+(Number(it.pct)||0),0)/items.length);
}
function collectImalatReportRows(){
  const rows=[];
  (state.data.equipment||[]).forEach(eq=>{
    const isBina=eq.unitType==="Bina" || /bina/i.test(String(eq.type||"")+" "+String(eq.name||""));
    if(!isBina) return;
    const prog=ensureEqProgress({...eq, unitType:"Bina"});
    if(!prog) return;
    const ov=overallProgress(prog);
    Object.keys(prog).forEach(cat=>{
      (prog[cat]||[]).forEach(it=>{
        rows.push({
          code:eq.code||"",
          name:eq.name||"",
          location:eq.location||"",
          cat,
          item:it.name||"",
          pct:Math.round(Number(it.pct)||0),
          overall:ov,
          catAvg:catAvgProgress(prog[cat])
        });
      });
    });
  });
  return rows;
}
function findProgressItem(prog, itemName){
  if(!prog || !itemName) return null;
  for(const cat of Object.keys(prog)){
    const hit=(prog[cat]||[]).find(it=>String(it.name||"")===itemName);
    if(hit) return hit;
  }
  return null;
}
function packagePct(eq, itemName, catName){
  if(!eq) return null;
  const prog=ensureEqProgress({...eq, unitType: eq.unitType||"Bina"}) || (isBinaEq(eq)?defaultImalatProgress():null);
  if(!prog) return null;
  if(!itemName || itemName==="Tümü") return overallProgress(prog);
  if(itemName==="__CAT__" && catName && Array.isArray(prog[catName])){
    const arr=prog[catName];
    if(!arr.length) return 0;
    return Math.round(arr.reduce((s,it)=>s+(Number(it.pct)||0),0)/arr.length);
  }
  const it=findProgressItem(prog, itemName);
  return it!=null ? Math.round(Number(it.pct)||0) : null;
}
function packageStatusLabel(pct){
  if(pct==null) return "Tanımsız";
  if(pct>=100) return "Tamam";
  if(pct>=70) return "İleri";
  if(pct>=30) return "Devam";
  if(pct>0) return "Başladı";
  return "Başlamadı";
}
function overallProgress(prog){
  if(!prog) return 0;
  let sum=0, n=0;
  Object.keys(prog).forEach(cat=>{
    (prog[cat]||[]).forEach(it=>{ sum+=Number(it.pct)||0; n++; });
  });
  return n? Math.round(sum/n) : 0;
}

function normalizeWOType(t){
  const s=String(t||"").trim();
  if(WO_TYPES.includes(s)) return s;
  // Eski kayıtlar: arıza/montaj vb. → Diğer
  if(/inşaat|insaat/i.test(s)) return "İnşaat İşleri";
  if(/mekanik/i.test(s)) return "Mekanik İşler";
  if(/elektrik/i.test(s)) return "Elektrik İşleri";
  if(/alt\s*yapı|altyapı|alt yapi/i.test(s)) return "Alt Yapı İşleri";
  if(/etüt|etut/i.test(s)) return "Etüt İşleri";
  return "Diğer";
}
const WO_STATUSES = ["Açık","Üstlenildi","Malzeme Bekliyor","Personel Bekliyor","Devam Ediyor","Beklemede","Teknik Onay Bekliyor","Teknik Tamamlandı","Tamamlandı","İptal"];

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const nowISO = () => new Date().toISOString();
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}); }
function fmtTL(n){ return (Number(n)||0).toLocaleString("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2}); }
function esc(s){ if(s==null) return ""; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusTone(s){
  const m={"Beklemede":"blue","Onaylandı":"teal","Reddedildi":"red","PO Oluşturuldu":"amber","Sipariş Verildi":"amber","Kısmi Teslim":"violet","Teslim Alındı":"green","İade Edildi":"red","Fatura Onaylandı":"green","İade Faturası":"red","Ters Kayıt":"amber","İade":"red","Fiyat Uyuşmuyor":"red","Ödeme Bekliyor":"amber","Ödendi":"green","İptal":"red","Açık":"blue","Üstlenildi":"violet","Malzeme Bekliyor":"amber","Personel Bekliyor":"violet","Devam Ediyor":"teal","Teknik Onay Bekliyor":"violet","Teknik Tamamlandı":"violet","Tamamlandı":"green"};
  return m[s]||"slate";
}
function badge(t,tone){ return `<span class="badge tone-${tone||statusTone(t)}">${esc(t)}</span>`; }
/** Kurumsal monogram logo (SA) — SVG */
function brandLogoSVG(){
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="saG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FFF6E8"/><stop offset="100%" stop-color="#F5D59A"/>

    <rect x="14" y="38" width="6" height="6" rx="1" fill="#1A1208" opacity=".35"/>
    <path d="M38 14 C28 14 24 20 24 26 C24 31 28 34 36 36 L42 38 C48 40 50 43 50 47 C50 53 44 58 34 58 C26 58 20 55 18 50"
      fill="none" stroke="url(#saG)" stroke-width="5" stroke-linecap="round"/>
    <path d="M34 14 L48 14 L48 22" fill="none" stroke="url(#saG)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  </svg>`;

function exportToCSV(filename,headers,rows){
  const csv="\uFEFF"+headers.join(",")+"\n"+rows.map(e=>e.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename+"_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
/** Raporlar için Excel (.xlsx) — satır/sütun tablosu */
function downloadBlobFile(blob, fname){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=fname;
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 1500);
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}
function exportToXLSX(filename, sheetName, headers, rows){
  const fname=(filename||"liste")+"_"+new Date().toISOString().slice(0,10)+".xlsx";
  const data=[headers, ...(rows||[]).map(r=>{
    if(Array.isArray(r)) return r.map(c=>c==null?"":c);
    return (headers||[]).map(h=>r[h]==null?"":r[h]);
  })];
  if(typeof XLSX==="undefined"){
    showToast("Excel yok, CSV indiriliyor.","amber");
    exportToCSV(filename, headers, rows);
    return;
  }
  try{
    const ws=XLSX.utils.aoa_to_sheet(data);
    ws["!cols"]=(headers||[]).map((h,i)=>{
      let max=String(h||"").length;
      data.forEach(row=>{ const len=String(row[i]==null?"":row[i]).length; if(len>max) max=len; });
      return { wch: Math.min(Math.max(max+2, 10), 48) };
    });
    ws["!freeze"]={ xSplit:0, ySplit:1, topLeftCell:"A2", activePane:"bottomLeft", state:"frozen" };
    const wb=XLSX.utils.book_new();
    const safeName=String(sheetName||"Rapor").slice(0,31).replace(/[\\/?*\[\]]/g,"");
    XLSX.utils.book_append_sheet(wb, ws, safeName||"Rapor");
    // iOS / mobil: writeFile bazen sessizce başarısız — blob ile zorla
    try{
      const out=XLSX.write(wb,{ bookType:"xlsx", type:"array" });
      const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      if(downloadBlobFile(blob, fname)){ showToast("Excel indirildi: "+fname); return; }
    }catch(e1){ console.warn(e1); }
    XLSX.writeFile(wb, fname);
    showToast("Excel indirildi: "+fname);
  }catch(e){
    console.error(e);
    showToast("Excel hatası, CSV deneniyor.","amber");

}
function exportReportWorkbook(filename, sheets){
  if(typeof XLSX==="undefined"){
    showToast("Excel kütüphanesi yok.","red");
    return;
  }
  try{
    const wb=XLSX.utils.book_new();
    let any=false;
    (sheets||[]).forEach((sh,idx)=>{
      const data=[sh.headers||[], ...(sh.rows||[]).map(r=>Array.isArray(r)?r.map(c=>c==null?"":c):[])];
      const ws=XLSX.utils.aoa_to_sheet(data);
      ws["!cols"]=(sh.headers||[]).map((h,i)=>{
        let max=String(h||"").length;
        data.forEach(row=>{ const len=String(row[i]==null?"":row[i]).length; if(len>max) max=len; });
        return { wch: Math.min(Math.max(max+2, 10), 48) };
      });
      const name=String(sh.name||("Sayfa"+(idx+1))).slice(0,31).replace(/[\\/?*\[\]]/g,"");
      XLSX.utils.book_append_sheet(wb, ws, name||("Sayfa"+(idx+1)));
      any=true;
    });
    if(!any){ showToast("Dışa aktarılacak kayıt yok.","amber"); return; }
    const fname=(filename||"rapor")+"_"+new Date().toISOString().slice(0,10)+".xlsx";
    try{
      const out=XLSX.write(wb,{ bookType:"xlsx", type:"array" });
      const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      if(typeof downloadBlobFile==="function" && downloadBlobFile(blob, fname)){
        showToast("Excel indirildi: "+fname); return;
      }
    }catch(e1){ console.warn(e1); }
    XLSX.writeFile(wb, fname);
    showToast("Excel indirildi: "+fname);
  }catch(e){
    console.error(e);
    showToast("Excel oluşturulamadı.","red");
  }
}

const DATA_KEY="erp-data-v5";
const DATA_BACKUP_KEY="erp-data-v5-backup";
const DATA_ARRAYS=["products","suppliers","equipment","workOrders","consumptions","messages","notifications","requests","purchaseOrders","goodsReceipts","returnShipments","stock","movements","fieldLogs","invoices","payments","audit","sales","subcontractors","subcontractorDaily"];

function normalizeData(d){
  if(!d || typeof d!=="object") d=seedData();
  DATA_ARRAYS.forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  if(!d.company) d.company=seedData().company;
  if(!d.imalatTemplates || typeof d.imalatTemplates!=="object"){
    d.imalatTemplates=cloneImalatTemplates(IMALAT_TEMPLATES_DEFAULT);
  } else {
    d.imalatTemplates=cloneImalatTemplates(d.imalatTemplates);
    if(!d.imalatTemplates["İnşaat"]) d.imalatTemplates["İnşaat"]=[...IMALAT_TEMPLATES_DEFAULT["İnşaat"]];
    if(!d.imalatTemplates["Mekanik"]) d.imalatTemplates["Mekanik"]=[...IMALAT_TEMPLATES_DEFAULT["Mekanik"]];
  }
  if(!d.counters) d.counters={...seedData().counters};
  else d.counters={...seedData().counters, ...d.counters};
  if(!d.siteDays || typeof d.siteDays!=="object") d.siteDays={};
  d.workOrders=(d.workOrders||[]).map(w=>{
    if(w.status==="Teslimata Hazır") return {...w,status:"Devam Ediyor"};
    return w;
  });
  d.stock=(d.stock||[]).map(s=>s&&s.id?s:{...s,id:uid()});
  return d;
}
function dataIsEmpty(d){
  if(!d) return true;
  const n=(d.stock||[]).length+(d.products||[]).length+(d.suppliers||[]).length+(d.workOrders||[]).length+(d.requests||[]).length+(d.purchaseOrders||[]).length+(d.invoices||[]).length+(d.equipment||[]).length;
  return n===0;
}
function saveLocalBackup(d){
  try{
    if(!d || dataIsEmpty(d)) return;
    localStorage.setItem(DATA_BACKUP_KEY, JSON.stringify({ at:nowISO(), data:d }));
  }catch(e){}
}
function readLocalBackup(){
  try{
    const raw=localStorage.getItem(DATA_BACKUP_KEY);
    if(!raw) return null;
    const o=JSON.parse(raw);
    return o && o.data ? o : null;
  }catch(e){ return null; }
}
async function persistData(d){
  await window.storage.set(DATA_KEY, JSON.stringify(d));
  saveLocalBackup(d);
}
async function loadAll(){
  try{
    let u=null;
    try{ const r=await window.storage.get("users"); u=r?JSON.parse(r.value):null; }catch(e){}
    if(!u||!Array.isArray(u)||!u.length){ u=seedUsers(); try{ await window.storage.set("users",JSON.stringify(u)); }catch(e){} }
    state.users=u;
    let d=null;
    let fromStorage=false;
    try{
      const r2=await window.storage.get(DATA_KEY);
      if(r2 && r2.value){ d=JSON.parse(r2.value); fromStorage=true; }
    }catch(e){ console.error("erp load parse", e); }
    if(!d){
      if(state.data && !dataIsEmpty(state.data)) d=state.data;
      else {
        const bak=readLocalBackup();
        if(bak && bak.data && !dataIsEmpty(bak.data)){
          d=bak.data;
          state._recoveryHint="Yerel yedekten yüklendi ("+(bak.at||"")+")";
          try{ await persistData(normalizeData(JSON.parse(JSON.stringify(d)))); }catch(e){}
        } else {
          d=seedData();
          if(!fromStorage){ try{ await persistData(d); }catch(e){} }
        }
      }
    } else if(dataIsEmpty(d)){
      const bak=readLocalBackup();
      if(bak && bak.data && !dataIsEmpty(bak.data)){
        state._emptyWithBackup=true;
        state._backupAt=bak.at;
      }
    }
    d=normalizeData(d);
    if(!dataIsEmpty(d)) saveLocalBackup(d);
    const snap=JSON.stringify(d);
    const same=state._dataSnap===snap;
    state.data=d;
    state._dataSnap=snap;
    state.loading=false;
    if(!state.session){
      const rest=tryRestoreSession();
      if(rest){ state.session=rest; state.tab=state.tab||"dashboard"; }
    } else {
      const fresh=(state.users||[]).find(u=>u.id===state.session.id);
      if(fresh) state.session={...fresh};
      else { state.session=null; clearRememberedSession(); }
    }
    if(same && state.session && !state.loading) return;
    render();
  }catch(e){
    console.error(e);
    if(!state.data) state.data=seedData();
    if(!state.users) state.users=seedUsers();
    state.loading=false;
    showToast("Veri yüklenirken hata — mevcut oturum korundu.","amber");
    render();
  }
}

async function mutateData(fn){
  let next=null;
  try{
    let cur=null;
    try{
      const r=await window.storage.get(DATA_KEY);
      if(r && r.value){
        try{ cur=JSON.parse(r.value); }
        catch(pe){ console.error("mutate parse", pe); cur=null; }
      }
    }catch(e){ console.error("mutate read", e); }
    // Depo boş/hatalıysa bellekteki dolu veriyi kullan
    if(!cur || (typeof dataIsEmpty==="function" && dataIsEmpty(cur))){
      if(state.data && !dataIsEmpty(state.data)) cur=JSON.parse(JSON.stringify(state.data));
      else {
        const bak=typeof readLocalBackup==="function"?readLocalBackup():null;
        if(bak && bak.data && !dataIsEmpty(bak.data)) cur=JSON.parse(JSON.stringify(bak.data));
        else cur=seedData();
      }
    }
    cur=normalizeData(cur);
    try{
      next=fn(cur);
    }catch(fnErr){
      console.error("mutate fn", fnErr);
      showToast("İşlem hatası: "+(fnErr&&fnErr.message?fnErr.message:"bilinmeyen"),"red");
      return;
    }
    if(next==null){ showToast("Kayıt iptal.","amber"); return; }
    if(dataIsEmpty(next) && state.data && !dataIsEmpty(state.data) && !state._allowEmptyWrite){
      showToast("Koruma: dolu veri boş kayıt ile silinmedi.","red");
      return;
    }
    // Önce belleği güncelle — kullanıcı kaybı olmasın
    state.data=next;
    state._dataSnap=JSON.stringify(next);
    state._mapFp=null;
    try{
      await persistData(next);
    }catch(pe){
      console.error("persist", pe);
      try{ if(typeof saveLocalBackup==="function") saveLocalBackup(next); }catch(e2){}
      showToast("Sunucuya yazılamadı; kayıt bu oturumda duruyor. Bağlantıyı kontrol edin.","amber");
      render();
      return;
    }
    render();
  }catch(e){
    console.error(e);
    if(next){
      state.data=next;
      try{ if(typeof saveLocalBackup==="function") saveLocalBackup(next); }catch(e2){}
    }
    showToast("Kayıt hatası: "+(e&&e.message?e.message:"bilinmeyen"),"red");
    render();
  }
}
function restoreFromBackup(){
  const bak=readLocalBackup();
  if(!bak || !bak.data){ showToast("Yedek bulunamadı.","amber"); return; }
  if(!confirm("Yedek geri yüklensin mi?\nTarih: "+(bak.at||"—")+"\nMevcut verinin üzerine yazılır.")) return;
  state._allowEmptyWrite=true;
  mutateData(cur=>{
    const d=normalizeData(JSON.parse(JSON.stringify(bak.data)));
    d.audit=d.audit||[];
    d.audit.push(pushAudit("Yedekten Geri Yükleme", bak.at||""));
    state._emptyWithBackup=false;
    state._recoveryHint=null;
    showToast("Yedek geri yüklendi");
    return d;
  });
  setTimeout(()=>{ state._allowEmptyWrite=false; }, 800);
}

function daysOpen(iso){
  if(!iso) return 0;
  const t0=new Date(iso).getTime(); if(isNaN(t0)) return 0;
  return Math.max(0, Math.floor((Date.now()-t0)/86400000));
}
function ageBadge(iso){
  const d=daysOpen(iso);
  const cls=d>=7?"hot":d>=3?"warm":"";
  return `<span class="age-badge ${cls}" title="Açılıştan beri">${d}g</span>`;
}

/** Türkçe/İngilizce karakter farkını yok say + kelime sırası bağımsız arama */
/** Excel TRNormalize eşleniği — TR karakter + küçük harf + noktalama temiz */
function foldTR(s){
  return String(s||"").toLocaleLowerCase("tr")
    .replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s")
    .replace(/ı/g,"i").replace(/İ/g,"i").replace(/i/g,"i")
    .replace(/ö/g,"o").replace(/ç/g,"c")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
}
/** VBA: kelimelere böl, hepsi satırda geçsin (sıra bağımsız, boşluk destekli) */
function fuzzyMatch(haystack, query){
  const h=foldTR(haystack);
  const words=foldTR(query).split(" ").filter(Boolean);
  if(!words.length) return true;
  for(let i=0;i<words.length;i++){
    if(h.indexOf(words[i])<0) return false;
  }
  return true;
}

function catalogFilter(list, query, textFn, limit){
  limit=limit||20;
  const q=(query||"").trim();
  if(!q) return [];
  const scored=[];
  const n=foldTR(q);
  for(const it of list||[]){
    const text=textFn?textFn(it):String(it);
    if(!fuzzyMatch(text, q)) continue;
    const f=foldTR(text);
    let score=0;
    if(f===n) score=100;
    else if(f.startsWith(n)) score=90;
    else if(f.includes(n)) score=75;
    else score=50;
    // erken kelime eşleşmesi bonus
    const first=n.split(" ")[0];
    if(first && f.indexOf(first)===0) score+=5;
    scored.push({it, score, text});
  }
  scored.sort((a,b)=>b.score-a.score || a.text.localeCompare(b.text,"tr"));
  return scored.slice(0, limit).map(x=>x.it);
}
function updateTalepSuggest(){
  const box=document.getElementById("talep-suggest");
  const wrap=document.querySelector("#talep-item")?.closest(".typeahead-wrap");
  if(!wrap) return;
  let boxEl=box;
  if(!boxEl){
    boxEl=document.createElement("div");
    boxEl.className="typeahead-box";
    boxEl.id="talep-suggest";
    wrap.appendChild(boxEl);
  }
  const q=state.talepItemQuery||"";
  if(!q.trim() || state._talepPicked){
    boxEl.remove();
    state._talepHits=[];
    return;
  }
  const products=state.data.products||[];
  const hits=catalogFilter(products, q, p=>[p.code,p.name,p.category,p.unit].join(" "), 14);
  state._talepHits=hits;
  boxEl.style.display="block";
  if(!hits.length){
    boxEl.innerHTML='<div class="typeahead-item" style="cursor:default;color:var(--text-mute);">Katalogda yok — serbest yazım kaydedilir</div>';
    return;
  }
  boxEl.innerHTML=hits.map((p,i)=>
    `<button type="button" class="typeahead-item" data-action="talep-pick" data-idx="${i}">
      <div>${esc(p.name)}</div>
      <div class="ta-sub">${esc(p.code||"")} · ${esc(p.category||"")} · ${esc(p.unit||"")}</div>
    </button>`
  ).join("");
}
function applyTalepPick(idx){
  const p=(state._talepHits||[])[idx];
  if(!p) return;
  state.talepItemQuery=p.name;
  state._talepPicked=true;
  const item=document.getElementById("talep-item");
  const catEl=document.getElementById("talep-category");
  const unitEl=document.getElementById("talep-unit");
  if(item) item.value=p.name;
  if(catEl && p.category) catEl.value=p.category;
  if(unitEl && p.unit){
    let found=false;
    for(const o of unitEl.options){ if(o.value===p.unit){ found=true; break; } }
    if(!found){ const o=document.createElement("option"); o.value=p.unit; o.textContent=p.unit; unitEl.appendChild(o); }
    unitEl.value=p.unit;
  }
  document.getElementById("talep-suggest")?.remove();
  state._talepHits=[];
  document.getElementById("talep-qty")?.focus();
}

function countBadge(key){
  const d=state.data; if(!d) return 0;
  if(key==="onay") return d.requests.filter(r=>r.status==="Beklemede").length;
  if(key==="isEmirleri") return d.workOrders.filter(w=>!["Tamamlandı","İptal"].includes(w.status)).length;
  if(key==="satinalma") return d.requests.filter(r=>r.status==="Onaylandı").length;
  if(key==="stok") return d.purchaseOrders.filter(p=>p.status==="Sipariş Verildi"||p.status==="Kısmi Teslim").length;
  if(key==="muhasebe") return d.payments.filter(p=>p.status==="Ödeme Bekliyor").length;
  return 0;
}

function equipmentOpenStatus(eq){
  const open=(state.data.workOrders||[]).filter(w=>{
    if(["Tamamlandı","İptal"].includes(w.status)) return false;
    if(w.equipmentId && w.equipmentId===eq.id) return true;
    if(w.equipment && eq.name && w.equipment===eq.name) return true;
    return false;
  });
  if(!open.length) return { color:"#64748B", label:"Boş / iş yok", open:0, status:null };
  if(open.some(w=>w.status==="Malzeme Bekliyor")) return { color:"#E8A33D", label:"Malzeme bekliyor", open:open.length, status:"Malzeme Bekliyor" };
  if(open.some(w=>w.status==="Personel Bekliyor")) return { color:"#9C8CF0", label:"Personel bekliyor", open:open.length, status:"Personel Bekliyor" };
  if(open.some(w=>w.status==="Teknik Onay Bekliyor")) return { color:"#A78BFA", label:"Teknik onay bekliyor", open:open.length, status:"Teknik Onay Bekliyor" };
  if(open.some(w=>w.status==="Devam Ediyor")) return { color:"#2DD4A6", label:"İş devam ediyor", open:open.length, status:"Devam Ediyor" };
  return { color:"#4C8DFF", label:open[0].status||"Açık iş", open:open.length, status:open[0].status };
}
function isBuildingEq(eq){
  if(!eq) return false;
  if(eq.unitType==="Bina") return true;
  const s=String(eq.type||"")+" "+String(eq.name||"");
  return /bina|building|blok|yapı|tesis|fabrika|ofis|apartman|site|hangar|atölye|idari/i.test(s);
}
function woStatusPinColor(status){
  const m={
    "Açık":"#4C8DFF",
    "Üstlenildi":"#9C8CF0",
    "Malzeme Bekliyor":"#E8A33D",
    "Personel Bekliyor":"#C084FC",
    "Devam Ediyor":"#2DD4A6",
    "Beklemede":"#94A3B8",
    "Teknik Onay Bekliyor":"#A78BFA",
    "Teknik Tamamlandı":"#38BDF8"
  };
  return m[status]||"#4C8DFF";
}
function collectActiveWorkPins(catFilter){
  catFilter=catFilter||"Tümü";
  const pins=[];
  (state.data.workOrders||[]).forEach(w=>{
    if(["Tamamlandı","İptal","Teknik Tamamlandı"].includes(w.status)) return;
    if(catFilter!=="Tümü" && normalizeWOType(w.type)!==catFilter) return;
    const coords=typeof getCoordsForWO==="function"?getCoordsForWO(w):null;
    if(!coords) return;
    const n=normalizeLatLng(coords.lat, coords.lng);
    if(!n) return;
    pins.push({
      id:w.id,
      no:w.no,
      title:w.title||"",
      status:w.status||"Açık",
      type:w.type||"",
      priority:w.priority||"",
      assignee:w.assigneeName||((w.team||[])[0]&&(w.team||[])[0].name)||"",
      location:w.location||coords.label||"",
      equipment:w.equipment||"",
      lat:n.lat,
      lng:n.lng,
      color:woStatusPinColor(w.status)
    });
  });
  return pins;
}
function openWOsForEquipment(eq){
  if(!eq) return [];
  return (state.data.workOrders||[]).filter(w=>{
    if(["Tamamlandı","İptal"].includes(w.status)) return false;
    if(w.equipmentId && w.equipmentId===eq.id) return true;
    if(w.equipment && eq.name && w.equipment===eq.name) return true;
    return false;
  });
}
function openWOFromEquipment(eqId){
  if(!roleCan("wo_create")){ showToast("İş emri açma yetkiniz yok.","red"); return; }
  try{ if(_dashMap) _dashMap.closePopup(); }catch(e){}
  state.modal={type:"wo-form", prefillEquipmentId:eqId};
  render();
}

let _dashMap=null;
function eqMapFingerprint(){
  const tpl=state.data&&state.data.imalatTemplates?JSON.stringify(state.data.imalatTemplates):"";
  const imalatKey=(state.mapIsKalemi||"Tümü")+"|"+(state.mapIsKalemCat||"");
  const progKey=(state.data.equipment||[]).filter(isBinaEq).map(e=>{
    const p=e.progress||{};
    return e.id+":"+Object.keys(p).map(c=>(p[c]||[]).map(it=>it.name+":"+(it.pct||0)).join(",")).join(";");
  }).join("|");
  return (state.mapBasemap||"street")+"|"+(state.mapCatFilter||"Tümü")+"|"+imalatKey+"|"+tpl.length
    +"|"+(state.data.equipment||[]).map(e=>[e.id,e.lat,e.lng,e.type,e.name,e.unitType].join(":")).join("|")
    +"#"+progKey
    +"#"+(state.data.workOrders||[]).filter(w=>!["Tamamlandı","İptal"].includes(w.status)).map(w=>w.id+":"+w.status+":"+(w.type||"")+":"+(w.equipmentId||w.equipment||"")).join("|");
}
function progressColor(pct){
  const p=Math.max(0, Math.min(100, Number(pct)||0));
  if(p>=90) return "#22C55E";
  if(p>=70) return "#84CC16";
  if(p>=50) return "#E8A33D";
  if(p>=25) return "#F97316";
  return "#EF4444";
}
function flyMapsTo(lat, lng, zoom){
  zoom=zoom||17;
  try{ if(_dashMap) _dashMap.setView([lat,lng], zoom, {animate:true}); }catch(e){}
  try{ if(window._dashMapImalat) window._dashMapImalat.setView([lat,lng], zoom, {animate:true}); }catch(e){}
}
function mapLocateMe(){
  if(!navigator.geolocation){ showToast("Konum desteklenmiyor","amber"); return; }
  showToast("Hassas konum alınıyor…");
  let best=null, n=0;
  const wid=navigator.geolocation.watchPosition(pos=>{
    n++;
    const acc=pos.coords.accuracy;
    if(acc!=null && acc>300) return;
    if(!best || (acc!=null && acc<best.acc)) best={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:acc};
    if((acc!=null && acc<=30) || n>=4){
      try{ navigator.geolocation.clearWatch(wid); }catch(e){}
      if(!best) return;
      flyMapsTo(best.lat, best.lng, 18);
      if(_dashMap && typeof L!=="undefined"){
        try{
          if(state._userMarker) _dashMap.removeLayer(state._userMarker);
          state._userMarker=L.circleMarker([best.lat,best.lng],{radius:8,color:"#4C8DFF",fillColor:"#4C8DFF",fillOpacity:0.7,weight:2}).addTo(_dashMap)
            .bindPopup("Konumunuz"+(best.acc!=null?" ±"+Math.round(best.acc)+"m":""));
        }catch(e){}
      }
      showToast("Konuma yaklaşıldı"+(best.acc!=null?" (±"+Math.round(best.acc)+" m)":""));
    }
  }, ()=>showToast("Konum alınamadı","red"), {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  setTimeout(()=>{ try{ navigator.geolocation.clearWatch(wid); }catch(e){} }, 12000);
}
function initDashboardMap(force){
  const el=document.getElementById("dash-map");

    if(h && typeof L==="undefined") h.textContent="Harita kütüphanesi yüklenemedi (çevrimdışı olabilir).";
    return;
  }
  const fp=eqMapFingerprint();
  // Aynı veri + harita ayaktaysa yeniden çizme (sürekli yenilemeyi kes)
  if(!force && _dashMap && state._mapFp===fp && el.querySelector(".leaflet-container")){
    try{ _dashMap.invalidateSize(); }catch(e){}
    // İş kalemi filtresi ana fingerprint dışında kalsa bile imalat haritasını yenile

    return;
  }
  try{ if(_dashMap){ _dashMap.remove(); _dashMap=null; } }catch(e){}

    const n=normalizeLatLng(e.lat,e.lng); if(!n) return false;

      if(["Tamamlandı","İptal"].includes(w.status)) return false;
      if(normalizeWOType(w.type)!==catFilter) return false;
      if(w.equipmentId && w.equipmentId===e.id) return true;
      if(w.equipment && e.name && w.equipment===e.name) return true;
      return false;
    });
  });
  const center = eqs.length ? [Number(eqs[0].lat), Number(eqs[0].lng)] : [39.0, 35.2];
  const mobile = window.innerWidth <= 960;
  _dashMap = L.map(el, {
    zoomControl:true, attributionControl:!mobile,
    minZoom:4, maxZoom:19
  }).setView(center, eqs.length?(mobile?13:15):6);
  const basemap=state.mapBasemap||"street";
  if(basemap==="sat"){
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom:19, attribution:"Esri / Maxar"
    }).addTo(_dashMap);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {
      maxZoom:19, opacity:0.85, attribution:""
    }).addTo(_dashMap);
  } else {
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom:19, maxNativeZoom:19, attribution:"&copy; OpenStreetMap"
    }).addTo(_dashMap);
  }
  const bounds=[];
  let totalOpenJobs=0;
  eqs.forEach(eq=>{
    const n=normalizeLatLng(eq.lat, eq.lng); if(!n) return;
    const st=equipmentOpenStatus(eq);
    const c=st.color;
    const openList=openWOsForEquipment(eq);
    // kategori filtresi: bu blokta filtrelenmiş açık iş yoksa ve filtre aktifse iş sayısını filtreye göre
    const catFilter=state.mapCatFilter||"Tümü";
    const jobs=catFilter==="Tümü"?openList:openList.filter(w=>normalizeWOType(w.type)===catFilter);
    const jobCount=jobs.length;
    totalOpenJobs+=jobCount;
    const codeLabel=String(eq.code||eq.name||"EQ").slice(0,8);
    // Tek pin / blok — iş sayısı rozeti
    const html=`<div class="eq-pin-wrap" title="${esc((eq.code||"")+" · "+(eq.name||"")+" · "+jobCount+" iş")}">
        <div class="eq-pin-bina-wrap">
          <div class="eq-pin-bina" style="--pin-c:${c};background-color:${c};"></div>
          <span class="eq-pin-count ${jobCount?"":"zero"}">${jobCount}</span>
        </div>
        <div class="eq-pin-label">${esc(codeLabel)}</div>
      </div>`;
    const icon=L.divIcon({
      className:"eq-map-icon",
      html,
      iconSize:[44, 36],
      iconAnchor:[8, 34],
      popupAnchor:[14, -30]
    });
    // Bloğun doğu-kuzey kenarı (uygun taraf) — merkezin hafif sağ-üstünde
    const lat=n.lat + 0.00004;
    const lng=n.lng + 0.00006;
    const m=L.marker([lat,lng],{ icon }).addTo(_dashMap);
    const isBinaMap=eq.unitType==="Bina" || /bina/i.test(String(eq.type||"")+" "+String(eq.name||""));
    const pctMap=isBinaMap?overallProgress(ensureEqProgress(eq)):null;
    const openHtml=jobs.length
      ? `<div class="map-pop-jobs">
          <div style="font-size:10px;font-weight:700;margin-bottom:4px;color:#E8A33D;">İşler · ${jobs.length}</div>
          ${jobs.map(w=>`<div style="margin:0 0 4px;padding:4px 6px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid #334155;">
            <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
              <span style="color:${woStatusPinColor(w.status)};">●</span>
              <button type="button" data-action="select-wo" data-id="${w.id}" style="background:none;border:0;color:#4C8DFF;cursor:pointer;padding:0;font-size:11px;font-weight:600;">${esc(w.no)}</button>
              <span style="font-size:9px;color:#94A3B3;">${esc(w.status)}</span>
            </div>
            <div style="color:#E7EBF0;font-size:11px;line-height:1.25;">${esc((w.title||"—").slice(0,36))}</div>
          </div>`).join("")}
        </div>`
      : `<div style="margin-top:4px;font-size:10px;color:#64748B;">Açık iş yok</div>`;
    const popup=`<div>
      <strong style="font-size:12px;">${esc(eq.code||"")} · ${esc((eq.name||"").slice(0,22))}</strong><br>
      <span style="font-size:10px;color:#94A3B3">${pctMap!=null?`%${pctMap} · `:""}<b style="color:${c}">${jobCount} iş</b></span>
      ${openHtml}
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">
        <button type="button" data-action="map-wo-new" data-id="${eq.id}" style="padding:4px 8px;border-radius:6px;border:0;background:#E8A33D;color:#171208;font-weight:600;cursor:pointer;font-size:10px;">🔧 İş</button>
        ${isBinaMap?`<button type="button" data-action="eq-progress" data-id="${eq.id}" style="padding:4px 8px;border-radius:6px;border:1px solid #2DD4BF;background:rgba(45,212,191,.12);color:#2DD4BF;font-weight:600;cursor:pointer;font-size:10px;">🏗 %</button>`:""}
        <a href="${routeUrlGoogle(n.lat,n.lng)}" target="_blank" rel="noopener" style="padding:4px 8px;border-radius:6px;border:1px solid #4C8DFF;color:#4C8DFF;font-size:10px;text-decoration:none;">🚗</a>

    const mobilePop=window.innerWidth<=960;
    m.bindPopup(popup, {

    m.on("contextmenu", e=>{ if(e.originalEvent) e.originalEvent.preventDefault(); openWOFromEquipment(eq.id); });
    m.on("mousedown", startHold);

    m.on("touchstart", startHold);
    m.on("touchend", clearHold);
    m.on("touchmove", clearHold);
    bounds.push([n.lat, n.lng]);

  if(bounds.length>=1){

function initImalatMap(force){
  const el=document.getElementById("dash-map-imalat");
  if(!el || typeof L==="undefined") return;
  // Önceki view korunabilsin
  let prevCenter=null, prevZoom=null;
  try{
    if(window._dashMapImalat){
      prevCenter=window._dashMapImalat.getCenter();
      prevZoom=window._dashMapImalat.getZoom();
      window._dashMapImalat.remove();
      window._dashMapImalat=null;
    }
  }catch(e){}
  const kalem=state.mapIsKalemi||"Tümü";
  const eqs=(state.data.equipment||[]).filter(e=>{
    if(!normalizeLatLng(e.lat,e.lng)) return false;
    // İmalat haritası: öncelik binalar; yoksa tüm koordinatlılar
    return true;
  });
  const center = prevCenter ? [prevCenter.lat, prevCenter.lng]
    : (eqs.length ? [Number(eqs[0].lat), Number(eqs[0].lng)] : [39.0, 35.2]);
  const mobile = window.innerWidth <= 960;
  const map = L.map(el, { zoomControl:true, attributionControl:false, minZoom:4, maxZoom:19 })
    .setView(center, prevZoom||(eqs.length?(mobile?14:15):6));
  window._dashMapImalat=map;
  const basemap=state.mapBasemap||"street";
  if(basemap==="sat"){
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom:19}).addTo(map);
  } else {
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19}).addTo(map);
  }
  const bounds=[];
  eqs.forEach(eq=>{
    const n=normalizeLatLng(eq.lat, eq.lng); if(!n) return;
    const isBina=eq.unitType==="Bina" || /bina/i.test(String(eq.type||"")+" "+String(eq.name||""));
    // Bina değilse de montaj kalemi tutulabilsin — progress yoksa oluşturma sadece bina
    let pct=null, stLabel="—";
    if(isBina){
      pct=packagePct(eq, kalem==="Tümü"?null:kalem, state.mapIsKalemCat);
      stLabel=packageStatusLabel(pct);
    }
    const c = pct!=null ? progressColor(pct) : "#64748B";
    const codeLabel=String(eq.code||eq.name||"EQ").slice(0,8);
    const html=`<div class="eq-pin-wrap" title="${esc((eq.code||"")+" · "+(kalem==="Tümü"?"Genel":kalem)+" · %"+ (pct!=null?pct:"—"))}">
        <div class="eq-pin-bina" style="--pin-c:${c};background-color:${c};"></div>
        <div class="eq-pin-label">${esc(codeLabel)}${pct!=null?" %"+pct:""}</div>
      </div>`;
    const icon=L.divIcon({ className:"eq-map-icon", html, iconSize:[40,34], iconAnchor:[20,34], popupAnchor:[0,-30] });
    const m=L.marker([n.lat,n.lng],{icon}).addTo(map);
    const kalemLine = (!kalem || kalem==="Tümü")
      ? `Genel imalat: <strong style="color:${c}">%${pct!=null?pct:"—"}</strong>`
      : kalem==="__CAT__"
        ? `${esc(state.mapIsKalemCat||"Kategori")} ort.: <strong style="color:${c}">%${pct!=null?pct:"—"}</strong> · ${esc(stLabel)}`
        : `${esc(kalem)}: <strong style="color:${c}">%${pct!=null?pct:"—"}</strong> · ${esc(stLabel)}`;
    const popup=`<strong>${esc(eq.code||"")} · ${esc(eq.name)}</strong><br>
      <span style="font-size:12px;">${kalemLine}</span><br>
      ${isBina?`<button type="button" data-action="eq-progress" data-id="${eq.id}" style="margin-top:6px;padding:6px 10px;border-radius:6px;border:0;background:${c};color:#111;font-weight:600;cursor:pointer;font-size:12px;">🏗 İmalat / kalem güncelle</button>`:""}`;
    m.bindPopup(popup);
    bounds.push([n.lat,n.lng]);
  });
  if(!prevZoom && bounds.length){ try{ map.fitBounds(bounds, {padding: window.innerWidth<=960?[36,36]:[28,28], maxZoom: window.innerWidth<=960?14:16}); }catch(e){} }
  setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 100);
}

function renderIsEmirleri(){
  /* SAHA EKİBİ — sadece: İşi Al / Bitir */
  let list=[...state.data.workOrders];
  if(state.woQuery.trim()){
    list=list.filter(w=>fuzzyMatch([w.no,w.title,w.equipment,w.location,w.type,w.status].join(" "), state.woQuery));
  }
  // Saha: önce benim açık işlerim, sonra alınabilir işler, en sonda bitenler
  const me=state.session.id;
  // Tamamlananlar ekranda yok — sadece raporlarda
  const open=list.filter(w=>!["Tamamlandı","İptal","Teknik Tamamlandı","Teknik Onay Bekliyor"].includes(w.status));

    const isBina=linkedEq && (linkedEq.unitType==="Bina" || /bina/i.test(String(linkedEq.type||"")));
    const pct=isBina?overallProgress(ensureEqProgress(linkedEq)):null;

    // Sağ üst: ana aksiyonlar + imalat %

      top=`<button class="btn btn-primary" data-action="wo-take" data-id="${w.id}">✋ Al</button>`;

    // İkincil aksiyonlar (kompakt)

      more+=`<button class="btn btn-ghost" style="border-color:var(--amber);color:var(--amber);" data-action="wo-wait-material" data-id="${w.id}">📦</button>`;

    <div class="cat-scroll">
      ${["Tümü",...WO_TYPES].map(c=>`<button type="button" class="btn ${state.woCatFilter===c?'btn-primary':'btn-ghost'}" style="padding:5px 10px;font-size:11px;" data-action="wo-cat-filter" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}

  const cols=[
    { key:"Açık", label:"Açık", tone:"blue" },
    { key:"active", label:"Üzerinde Çalışılıyor", match:s=>["Üstlenildi","Devam Ediyor","Beklemede"].includes(s), tone:"violet" },
    { key:"Malzeme Bekliyor", label:"Malzeme Bekliyor", tone:"amber" },

    { key:"Teknik Onay Bekliyor", label:"Teknik Onay", tone:"violet" },

  function confChecks(w){
    const team=(w.team||[]).length;
    const cons=(state.data.consumptions||[]).filter(c=>c.workOrderId===w.id).length;
    const prs=state.data.requests.filter(r=>r.workOrderId===w.id);

    const msgs=getMessages("wo",w.id).length;
    const checks=[
      { ok:!!w.assigneeName, t:"Üstlenen atandı" },
      { ok:team>=1, t:`Ekip: ${team} kişi` },
      { ok:cons>0||prs.length===0, t:cons>0?`Malzeme tüketildi (${cons})`:(prs.length?"Malzeme / PR bekleniyor":"Malzeme gerekmedi") },
      { ok:prs.length===0||prs.every(r=>!["Beklemede"].includes(r.status)), t:prs.length?`PR: ${prs.length} (bekleyen ${prs.filter(r=>r.status==="Beklemede").length})`:"PR yok" },
      { ok:!!w.completionNote||w.status!=="Tamamlandı", t:w.completionNote?"İş teyidi yazıldı":"İş teyidi (bitiş notu)" },
      { ok:msgs>0, t:msgs?`Diyalog: ${msgs} mesaj`:"Diyalog yok" },

      </div>
      <div class="flex-wrap-gap">
        <button class="btn btn-ghost" data-action="nav" data-tab="isEmirleri">🔧 Saha İşlerim</button>

    <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;">
      ${cols.map(col=>{
        const items=colItems(col);
        return `<div style="min-width:260px;max-width:300px;flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;">

            <span style="font-size:12px;font-weight:600;">${esc(col.label)}</span>
            <span class="badge tone-${col.tone}">${items.length}</span>
          </div>
          ${items.length===0?`<div style="font-size:12px;color:var(--text-mute);padding:12px;text-align:center;">Boş</div>`:
            items.slice(0,40).map(w=>{
              const checks=confChecks(w);
              const okN=checks.filter(c=>c.ok).length;
              return `<div class="card" style="padding:12px;margin-bottom:8px;cursor:pointer;" data-action="select-wo" data-id="${w.id}">
                <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;">
                  <span class="mono" style="font-size:10px;color:var(--amber);">${esc(w.no)}</span>
                  ${badge(w.status)}
                </div>
                <div style="font-size:13px;font-weight:600;margin-bottom:4px;">${esc(w.title)}</div>
                <div style="font-size:11px;color:var(--text-mute);margin-bottom:8px;">
                  ${w.type?esc(w.type)+" · ":""}${w.equipment?esc(w.equipment)+" · ":""}${w.machine?("🚜 "+esc(w.machine)+" · "):""}${w.assigneeName?("👷 "+esc(w.assigneeName)): "Üstlenen yok"}
                  ${(w.team||[]).length?` · 👥 ${(w.team||[]).length}`:""}
                </div>
                <div style="font-size:11px;margin-bottom:8px;">
                  <div style="color:var(--text-mute);margin-bottom:4px;">Teyit ${okN}/${checks.length}</div>
                  ${checks.map(c=>`<div style="color:${c.ok?"var(--green)":"var(--text-mute)"};"> ${c.ok?"✓":"○"} ${esc(c.t)}</div>`).join("")}
                </div>

                  ${!["Tamamlandı","İptal"].includes(w.status)?`
                    <button class="btn btn-ghost" style="padding:4px 8px;font-size:11px;" data-action="wo-advance" data-id="${w.id}" data-to="Devam Ediyor">Devam</button>
                    <button class="btn btn-ghost" style="padding:4px 8px;font-size:11px;" data-action="wo-advance" data-id="${w.id}" data-to="Malzeme Bekliyor">Malzeme</button>
                    <button class="btn btn-ghost" style="padding:4px 8px;font-size:11px;" data-action="wo-advance" data-id="${w.id}" data-to="Personel Bekliyor">Personel</button>
                    <button class="btn btn-primary" style="padding:4px 8px;font-size:11px;" data-action="wo-complete" data-id="${w.id}">Bitir</button>
                  `:""}
                  <button class="btn btn-ghost" style="padding:4px 8px;font-size:11px;" data-action="open-chat" data-entity="wo" data-id="${w.id}" data-label="${esc(w.no)}">💬</button>
                </div>
              </div>`;
            }).join("")}
        </div>`;
      }).join("")}
    </div>
  `;
}

function handleCreateWO(){
  const title=document.getElementById("wo-title")?.value.trim();
  if(!title){ showToast("Başlık zorunlu.","red"); return; }
  mutateData(cur=>{
    const c=(cur.counters.wo||0)+1;
    const no="WO-"+String(c).padStart(5,"0");
    const eqId=document.getElementById("wo-equipment")?.value||"";
    const eq=cur.equipment.find(e=>e.id===eqId);
    const machine=document.getElementById("wo-machine")?.value.trim()||"";
    const machinePlate=document.getElementById("wo-machine-plate")?.value.trim()||"";
    const wo={
      id:uid(), no, title,
      type:normalizeWOType(document.getElementById("wo-type").value),
      priority:document.getElementById("wo-priority").value,
      equipment:eq?eq.name:"", equipmentId:eqId||null,
      location:document.getElementById("wo-location")?.value.trim()||(eq?.location||""),
      machine, machinePlate,
      lat: eq && Number.isFinite(Number(eq.lat)) ? Number(eq.lat) : null,
      lng: eq && Number.isFinite(Number(eq.lng)) ? Number(eq.lng) : null,
      description:document.getElementById("wo-desc")?.value.trim()||"",
      requester:state.session.id, requesterName:state.session.fullName,
      assigneeId:null, assigneeName:null,
      team:[],
      ...(function(){ const c=resolveContactFromSelect("wo-contact"); return c||{}; })(),
      status:"Açık", createdAt:nowISO(),
      history:[{at:nowISO(),by:state.session.fullName,action:"İş emri açıldı"+(eq&&eq.lat?` · konum ${eq.lat},${eq.lng}`:"")+(machine?` · makine ${machine}`:"")+(document.getElementById("wo-contact")?.selectedOptions?.[0]?.dataset?.name?` · muhatap ${document.getElementById("wo-contact").selectedOptions[0].dataset.name}`:"")}]
    };
    cur.counters.wo=c;
    cur.workOrders=[wo,...cur.workOrders];
    cur.audit.push(pushAudit("İş Emri Açıldı", no+" · "+title+" · "+wo.type));
    pushNotif(cur,{
      type:"wo_open",
      title:"Yeni iş emri: "+no,
      body:title+(machine?" · 🚜 "+machine:"")+" · "+(wo.type||""),
      refType:"wo", refId:wo.id
    });
    // Otomatik diyalog sistem mesajı
    cur.messages=[...(cur.messages||[]),{
      id:uid(), entityType:"wo", entityId:wo.id, label:no,
      user:"Sistem", userId:"system", role:"system",
      text:"İş emri açıldı: "+title+(machine?"\nİş makinesi: "+machine+(machinePlate?" ("+machinePlate+")":""):""),
      at:nowISO()
    }];
    state.modal=null;
    showToast(no+" oluşturuldu — bildirim gönderildi.");
    return cur;
  });
}

/* ---- İş emri fotoğrafları: ana ERP verisinden ayrı, 7 gün TTL, sıkıştırılmış ---- */
const WO_PHOTO_KEY="erp-wo-photos-v1";
const WO_PHOTO_TTL_MS=7*24*60*60*1000;
function loadWoPhotos(){
  try{ return JSON.parse(localStorage.getItem(WO_PHOTO_KEY)||"{}"); }catch(e){ return {}; }
}
function saveWoPhotos(obj){
  try{ localStorage.setItem(WO_PHOTO_KEY, JSON.stringify(obj)); }catch(e){ showToast("Foto alanı dolu; eski kayıtlar temizleniyor.","amber"); pruneWoPhotos(true); try{ localStorage.setItem(WO_PHOTO_KEY, JSON.stringify(obj)); }catch(e2){ showToast("Foto kaydedilemedi.","red"); } }
}
function pruneWoPhotos(aggressive){
  const now=Date.now();
  const all=loadWoPhotos();
  Object.keys(all).forEach(woId=>{
    all[woId]=(all[woId]||[]).filter(p=>{
      const age=now-(p.at||0);
      if(age>WO_PHOTO_TTL_MS) return false;
      return true;
    }).map(p=>{
      // 3 günden eski → ekstra küçült (pixel düşür)
      if(aggressive || (now-(p.at||0)>3*24*60*60*1000 && !p.shrunk)){
        return {...p, data:p.thumb||p.data, shrunk:true};
      }
      return p;
    });
    if(!all[woId].length) delete all[woId];
  });
  try{ localStorage.setItem(WO_PHOTO_KEY, JSON.stringify(all)); }catch(e){}

function compressImageFile(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("okunamadı"));
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1, maxW/img.width);
        const w=Math.max(1, Math.round(img.width*scale));
        const h=Math.max(1, Math.round(img.height*scale));
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const data=canvas.toDataURL("image/jpeg", quality);
        // thumb
        const tw=Math.min(120,w), th=Math.round(h*(tw/w));
        const c2=document.createElement("canvas"); c2.width=tw; c2.height=th;
        c2.getContext("2d").drawImage(img,0,0,tw,th);
        const thumb=c2.toDataURL("image/jpeg", 0.45);
        resolve({ data, thumb, w, h });
      };
      img.onerror=()=>reject(new Error("görsel hata"));
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function addWoPhoto(woId, file){
  if(!file || !file.type.startsWith("image/")){ showToast("Sadece resim.","red"); return; }
  try{
    const {data,thumb}=await compressImageFile(file, 720, 0.52);
    const all=pruneWoPhotos(false);
    const list=all[woId]||[];
    if(list.length>=8){ showToast("En fazla 8 foto (7 gün saklanır).","amber"); return; }
    list.push({ id:uid(), at:Date.now(), by:state.session.fullName, data, thumb, shrunk:false });
    all[woId]=list;
    saveWoPhotos(all);
    showToast("Foto eklendi (7 gün, sıkıştırılmış).");
    render();
  }catch(e){ showToast("Foto işlenemedi.","red"); }
}

function handleWOTake(id){
  if(!id){ showToast("İş emri bulunamadı.","red"); return; }
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0){ showToast("İş emri bulunamadı.","red"); return cur; }
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal","Teknik Tamamlandı"].includes(w.status)){ showToast("Kapalı / teknik tamamlanmış işe katılınamaz.","red"); return cur; }
    const team=[...(w.team||[])];
    if(team.some(t=>t.id===state.session.id)){ showToast("Zaten ekipsiniz.","amber"); return cur; }
    team.push({ id:state.session.id, name:state.session.fullName, joinedAt:nowISO() });
    const isFirst=!w.assigneeId;
    // Saha: İşi Al = üzerine al ve çalışmaya başla
    let nextStatus=w.status;
    if(["Açık","Üstlenildi"].includes(w.status||"") || !w.status) nextStatus="Devam Ediyor";
    cur.workOrders[idx]={
      ...w,
      team,
      status: nextStatus,
      assigneeId: w.assigneeId || state.session.id,
      assigneeName: w.assigneeName || state.session.fullName,
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:isFirst?`İşi aldı → ${nextStatus}`:`Ekibe katıldı (${team.length} kişi)`}]
    };
    cur.audit.push(pushAudit("İşi Aldı", cur.workOrders[idx].no+" · "+state.session.fullName+" · ekip "+team.length));
    showToast(isFirst ? "İş alındı — bitince Bitir deyin." : `Ekibe katıldınız (${team.length} kişi)`);
    return cur;
  });
}

function handleWOLeave(id){
  if(!id) return;
  if(!confirm("İşi bırakmak istediğinize emin misiniz? Üzerinizdeki işlerden düşer.")) return;
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0){ showToast("İş emri bulunamadı.","red"); return cur; }
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal"].includes(w.status)){ showToast("Kapalı iş bırakılamaz.","red"); return cur; }
    const me=state.session.id;
    let team=(w.team||[]).filter(t=>t.id!==me);
    let assigneeId=w.assigneeId, assigneeName=w.assigneeName;
    if(assigneeId===me){
      if(team.length){
        assigneeId=team[0].id;
        assigneeName=team[0].name;
      } else {
        assigneeId=null;
        assigneeName=null;
      }
    }
    let status=w.status;
    // Kimse kalmadıysa alınabilir hale getir
    if(!team.length && !assigneeId){
      if(["Devam Ediyor","Üstlenildi","Malzeme Bekliyor","Personel Bekliyor"].includes(status)){
        status="Açık";
      }
    }
    cur.workOrders[idx]={
      ...w, team, assigneeId, assigneeName, status,
      crewCount: w.crewCount ? Math.max(team.length||0, Number(w.crewCount)-1||0) : (team.length||undefined),
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"İşi bıraktı"+(team.length?` · kalan ekip ${team.length}`:" · iş tekrar alınabilir")}]
    };
    cur.audit.push(pushAudit("İşi Bıraktı", cur.workOrders[idx].no+" · "+state.session.fullName));
    showToast("İş bırakıldı.");
    return cur;
  });
}

    const ans=prompt("Gerekli / mevcut ekip kişi sayısı:", "2");
    if(ans===null) return;
    crewCount=Math.max(1, parseInt(ans,10)||1);
  }
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0) return cur;
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal"].includes(w.status)){ showToast("Kapalı iş emri.","red"); return cur; }
    const team=[...(w.team||[])];
    if(!team.some(t=>t.id===state.session.id)){
      team.push({ id:state.session.id, name:state.session.fullName, joinedAt:nowISO() });
    }
    const patch={
      ...w,
      team,
      status: toStatus,
      assigneeId: w.assigneeId || state.session.id,
      assigneeName: w.assigneeName || state.session.fullName,
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:`Durum: ${w.status} → ${toStatus}`+(crewCount?` · ekip ${crewCount}`:"")}]

function handleWOTechComplete(id){
  if(!["admin","yonetici"].includes(state.session?.role)){ showToast("Sadece üst düzey yönetici teknik kapatabilir.","red"); return; }
  const note=(document.getElementById("tech-note")?.value||"").trim();
  const updates=[];
  document.querySelectorAll(".tech-imalat.imalat-num").forEach(el=>{
    const itemId=el.dataset.item;
    const cat=el.dataset.cat;
    const v=Math.max(0, Math.min(100, Number(el.value)||0));
    if(itemId && cat) updates.push({itemId, cat, pct:v});
  });
  mutateData(cur=>{
    const w=cur.workOrders.find(x=>x.id===id); if(!w) return cur;
    cur.workOrders=cur.workOrders.map(x=>{
      if(x.id!==id) return x;
      return {...x,
        status:"Tamamlandı",
        techCompletedAt:nowISO(),
        techCompletedBy:state.session.fullName,
        completedAt:nowISO(),
        completedBy:state.session.fullName,
        techNote:note,
        techItems:updates,
        history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"Teknik onay ile kapatıldı"+(note?": "+note.slice(0,60):"")}]
      };
    });
    let eq=null;
    if(w.equipmentId) eq=cur.equipment.find(e=>e.id===w.equipmentId);
    if(!eq && w.equipment) eq=cur.equipment.find(e=>e.name===w.equipment);
    if(eq && isBuildingEq(eq)){
      eq={...eq};
      eq.progress=ensureEqProgress(eq)||defaultImalatProgress();
      updates.forEach(u=>{
        const arr=eq.progress[u.cat]||[];
        const it=arr.find(x=>x.id===u.itemId);
        if(it) it.pct=u.pct;
      });
      cur.equipment=cur.equipment.map(e=>e.id===eq.id?eq:e);
    }
    cur.audit.push(pushAudit("Teknik Onay / Kapatma", (w.no||id)+" · "+(note||"").slice(0,40)));
    state.modal=null;
    showToast("İş teknik onayla kapatıldı (Tamamlandı).");
    return cur;
  });
}

function handleWOConsume(){
  const woId=document.getElementById("cons-wo")?.value;
  const itemVal=document.getElementById("cons-item")?.value;
  const qty=Number(document.getElementById("cons-qty")?.value);
  if(!woId||!itemVal||!qty||qty<=0){ showToast("Tüm alanları doldurun.","red"); return; }
  const [itemName,itemUnit]=itemVal.split("|");
  mutateData(cur=>{
    const wo=cur.workOrders.find(w=>w.id===woId);
    if(!wo) return cur;
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===itemName.toLowerCase()&&s.unit===itemUnit);
    if(idx<0||Number(stock[idx].qty)<qty){ showToast("Yetersiz stok!","red"); return cur; }
    stock[idx]={...stock[idx], qty:Number(stock[idx].qty)-qty};
    const cons={ id:uid(), workOrderId:wo.id, workOrderNo:wo.no, equipment:wo.equipment||"", equipmentId:wo.equipmentId||null,
      item:itemName, unit:itemUnit, qty, by:state.session.fullName, at:nowISO() };
    cur.stock=stock;
    cur.consumptions=[cons,...(cur.consumptions||[])];
    cur.movements.push({id:uid(),at:nowISO(),type:"WO Tüketim",item:itemName,qty:-qty,unit:itemUnit,ref:wo.no+(wo.equipment?" / "+wo.equipment:""),by:state.session.fullName});
    cur.workOrders=cur.workOrders.map(w=>{
      if(w.id!==woId) return w;
      // Malzeme alınca: Açık/Üstlenildi/Malzeme Bekliyor → Devam Ediyor
      let st=w.status;
      if(["Açık","Üstlenildi","Malzeme Bekliyor","Personel Bekliyor"].includes(st)) st="Devam Ediyor";
      return {...w, status:st, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"Malzeme: "+itemName+" × "+qty+" "+itemUnit+" → "+st}]};
    });
    cur.audit.push(pushAudit("WO Malzeme", wo.no+" · "+itemName+" × "+qty));
    // Minimal irsaliye
    generateMinimalDeliveryNote({ item:itemName, qty, unit:itemUnit, person:state.session.fullName, location:wo.equipment||wo.location||wo.no, date:nowISO(), ref:wo.no });
    state.modal=null;
    showToast("Malzeme ekipmana işlendi, stok düşüldü.");
    return cur;
  });
}
