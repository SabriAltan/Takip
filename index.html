function handleEqProgressSave(eqId){
  if(!roleCan("wo_take")&&!roleCan("equipment")&&state.session.role!=="yonetici"){ showToast("Yetkiniz yok.","red"); return; }
  const nums=[...document.querySelectorAll(".imalat-num[data-eq=\""+eqId+"\"]")];
  if(!nums.length){ showToast("Kalem yok.","red"); return; }
  mutateData(cur=>{
    cur.equipment=(cur.equipment||[]).map(e=>{
      if(e.id!==eqId) return e;
      const prog=ensureEqProgress({...e, unitType:"Bina"})||defaultImalatProgress();
      nums.forEach(inp=>{
        const cat=inp.dataset.cat, itemId=inp.dataset.item;
        const v=Math.max(0, Math.min(100, Number(inp.value)||0));
        if(prog[cat]) prog[cat]=prog[cat].map(it=>it.id===itemId?{...it,pct:v}:it);
      });
      return {...e, unitType:e.unitType||"Bina", progress:prog};
    });
    const eq=cur.equipment.find(x=>x.id===eqId);
    cur.audit.push(pushAudit("Bina İmalat", (eq?.code||eqId)+" · %"+overallProgress(eq?.progress)));
    state.modal=null; showToast("İmalat yüzdeleri kaydedildi."); return cur;
  });
}
function handleEqFormSubmit(){
  if(!roleCan("equipment")){ showToast("Ekipman yetkiniz yok.","red"); return; }
  const code=document.getElementById("eq-code").value.trim(), name=document.getElementById("eq-name").value.trim();
  if(!code||!name){ showToast("Kod ve ad zorunlu.","red"); return; }
  const editId=document.getElementById("eq-form")?.dataset?.id||"";
  const norm=normalizeLatLng(parseCoord(document.getElementById("eq-lat")?.value), parseCoord(document.getElementById("eq-lng")?.value));
  const unitType=document.getElementById("eq-unit-type")?.value||"Diğer";
  const subType=document.getElementById("eq-type").value.trim();
  const payload={
    code, name,
    location:document.getElementById("eq-location").value.trim(),
    unitType,
    type: unitType,
    subType: subType||"",
    lat: norm?norm.lat:null, lng: norm?norm.lng:null
  };
  mutateData(cur=>{
    if(editId){
      cur.equipment=(cur.equipment||[]).map(e=>{
        if(e.id!==editId) return e;
        const next={...e,...payload};

    return { lat:Number(w.lat), lng:Number(w.lng), label:w.location||w.equipment||w.title||w.no };

function parseCoord(v){
  if(v==null||v==="") return null;
  const n=Number(String(v).trim().replace(",","."));
  return Number.isFinite(n) ? n : null;
}
/** Leaflet / GPS her zaman [enlem, boylam] = [latitude, longitude] */
function normalizeLatLng(lat,lng){
  let a=Number(lat), b=Number(lng);
  if(!Number.isFinite(a)||!Number.isFinite(b)) return null;
  // Yanlışlıkla ters yazılmışsa düzelt (enlem asla ±90 dışı olamaz)
  if(Math.abs(a)>90 && Math.abs(b)<=90){ const t=a; a=b; b=t; }
  if(a<-90||a>90||b<-180||b>180) return null;
  // (0,0) okyanus — geçersiz say
  if(Math.abs(a)<1e-6 && Math.abs(b)<1e-6) return null;
  return { lat:a, lng:b };
}
function setLatLngInputs(lat,lng){
  const norm=normalizeLatLng(lat,lng);
  if(!norm){ showToast("Geçersiz koordinat.","red"); return false; }
  const latEl=document.getElementById("eq-lat")||document.getElementById("wo-lat");
  const lngEl=document.getElementById("eq-lng")||document.getElementById("wo-lng");
  // Sıra kritik: enlem → lat alanı, boylam → lng alanı
  if(latEl){ latEl.value=norm.lat.toFixed(6); latEl.setAttribute("data-geo","lat"); }
  if(lngEl){ lngEl.value=norm.lng.toFixed(6); lngEl.setAttribute("data-geo","lng"); }
  applyPickerView(norm.lat, norm.lng);
  return true;
}
function applyPickerView(lat,lng){
  if(!_pickerMap) return;
  try{
    const ll=L.latLng(lat,lng); // Leaflet: (lat, lng) — asla ters değil
    if(_pickerMarker) _pickerMarker.setLatLng(ll);
    else _pickerMarker=L.marker(ll,{draggable:true}).addTo(_pickerMap);
    _pickerMap.setView(ll, Math.max(_pickerMap.getZoom()||14, 16), { animate:true });
  }catch(e){ console.warn(e); }
}
function fillGeoFromDevice(){
  const secure=window.isSecureContext || location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1";
  if(!secure){
    showToast("Konum için HTTPS veya localhost gerekir. Haritada Hatay’a yakınlaştırıp tıklayın.","amber");
    return;
  }
  if(!navigator.geolocation){ showToast("Tarayıcı konum desteklemiyor. Haritadan tıklayın.","red"); return; }
  showToast("GPS konumu alınıyor…","amber");

  const onOk=function(pos){
    // Geolocation API: coords.latitude = enlem, coords.longitude = boylam
    const latitude=pos.coords.latitude;
    const longitude=pos.coords.longitude;
    const norm=normalizeLatLng(latitude, longitude);
    if(!norm){
      showToast("Cihaz geçersiz koordinat verdi. Haritadan seçin.","red");
      return;
    }
    // Boylam ~0 veya Afrika bandı gibi bariz hataları reddet (Hatay ~36.2, 36.1)
    if(Math.abs(norm.lng)<1 && Math.abs(norm.lat)<40){
      showToast("Konum hatalı (Afrika/okyanus). İzni kontrol edip tekrar deneyin veya haritadan seçin.","red");
      return;
    }
    setLatLngInputs(norm.lat, norm.lng);
    if(!_pickerMap) initGeoPickerMap();
    applyPickerView(norm.lat, norm.lng);
    showToast("Konum alındı: enlem "+norm.lat.toFixed(5)+" · boylam "+norm.lng.toFixed(5));
  };
  const onErr=function(err){
    const code=err && err.code;
    let msg="Konum alınamadı.";
    if(code===1) msg="Konum izni reddedildi. Tarayıcı / telefon konum iznini açın.";
    else if(code===2) msg="Konum bilgisi yok. GPS açın veya haritadan tıklayın.";
    else if(code===3) msg="Zaman aşımı. Açık alanda tekrar deneyin veya haritadan seçin.";
    showToast(msg,"red");
  };
  // Önce yüksek doğruluk (GPS), olmazsa ağ konumu
  navigator.geolocation.getCurrentPosition(onOk, function(err){
    navigator.geolocation.getCurrentPosition(onOk, onErr, {
      enableHighAccuracy:false, timeout:12000, maximumAge:60000
    });
  }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}
let _pickerMap=null, _pickerMarker=null;
function lastEquipmentCoords(){
  const list=(state.data.equipment||[]).filter(e=>e.lat!=null&&e.lng!=null&&Number.isFinite(Number(e.lat))&&Number.isFinite(Number(e.lng)));
  if(!list.length) return null;
  // Son eklenen (dizinin sonu veya en yeni)
  const e=list[list.length-1];
  return normalizeLatLng(e.lat, e.lng);
}
function initGeoPickerMap(){
  const el=document.getElementById("eq-map-picker")||document.getElementById("wo-map-picker");
  if(!el || typeof L==="undefined") return;
  try{ if(_pickerMap){ _pickerMap.remove(); _pickerMap=null; _pickerMarker=null; } }catch(e){}
  const latEl=document.getElementById("eq-lat")||document.getElementById("wo-lat");
  const lngEl=document.getElementById("eq-lng")||document.getElementById("wo-lng");
  let lat=parseCoord(latEl?.value), lng=parseCoord(lngEl?.value);
  let norm=normalizeLatLng(lat,lng);
  // Yeni kayıtta konum yoksa: son tanımlanan ekipmanın yanında aç
  if(!norm){
    const last=lastEquipmentCoords();
    if(last){ norm=last; lat=last.lat; lng=last.lng; }
    else { lat=39.0; lng=35.2; }
  } else { lat=norm.lat; lng=norm.lng; }
  const zoom = norm ? 16 : 6;
  _pickerMap=L.map(el,{ zoomControl:true, minZoom:4, maxZoom:19 }).setView([lat,lng], zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{ maxZoom:19, attribution:"© OSM" }).addTo(_pickerMap);
  // Diğer ekipmanları soluk göster (referans)
  (state.data.equipment||[]).forEach(eq=>{
    const n=normalizeLatLng(eq.lat, eq.lng);
    if(!n) return;
    const isBina=/bina|building|blok|yapı|tesis|fabrika|ofis/i.test(String(eq.type||"")+" "+String(eq.name||""));
    const ref=isBina
      ? `<svg width="18" height="20" viewBox="0 0 28 30" xmlns="http://www.w3.org/2000/svg" opacity=".65"><path d="M14 2 L26 12 L26 28 L2 28 L2 12 Z" fill="#94A3B3" stroke="#64748B" stroke-width="1.5"/><rect x="11" y="18" width="6" height="10" fill="#64748B"/></svg>`
      : `<svg width="14" height="18" viewBox="0 0 22 28" xmlns="http://www.w3.org/2000/svg" opacity=".65"><path d="M11 0 C5 0 1 5 1 11 C1 18 11 28 11 28 S21 18 21 11 C21 5 17 0 11 0 Z" fill="#94A3B3" stroke="#64748B" stroke-width="1.5"/><circle cx="11" cy="11" r="3" fill="#E7EBF0"/></svg>`;
    const icon=L.divIcon({
      className:"",
      html:`<div style="line-height:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));">${ref}</div>`,
      iconSize: isBina?[18,20]:[14,18],
      iconAnchor: isBina?[9,20]:[7,18]
    });
    L.marker([n.lat,n.lng],{icon, interactive:false}).addTo(_pickerMap);
  });
  _pickerMarker=L.marker([lat,lng],{ draggable:true }).addTo(_pickerMap);
  _pickerMarker.on("dragend",()=>{
    const p=_pickerMarker.getLatLng();
    setLatLngInputs(p.lat, p.lng);
  });
  _pickerMap.on("click",e=>{
    const la=e.latlng.lat, lo=e.latlng.lng;
    _pickerMarker.setLatLng([la,lo]);
    setLatLngInputs(la, lo);
    showToast("Seçildi: "+la.toFixed(5)+", "+lo.toFixed(5));
  });
  setTimeout(()=>{ try{ _pickerMap.invalidateSize(); }catch(e){} }, 200);
}

function handleFieldOutSubmit(){
  const itemVal=document.getElementById("fo-item")?.value, qty=Number(document.getElementById("fo-qty")?.value);
  const person=document.getElementById("fo-person")?.value.trim();
  const equipment=(document.getElementById("fo-equipment")?.value||"").trim()
    || (document.getElementById("fo-location")?.value||"").trim();
  if(!itemVal||!qty||qty<=0||!person||!equipment){ showToast("Miktar, teslim alan ve ekipman zorunlu.","red"); return; }
  const [itemName,itemUnit]=itemVal.split("|"); let newLog=null;
  mutateData(cur=>{
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===itemName.toLowerCase()&&s.unit===itemUnit);
    if(idx<0||Number(stock[idx].qty)<qty){ showToast("Yetersiz stok!","red"); return cur; }
    stock[idx]={...stock[idx],qty:Number(stock[idx].qty)-qty};
    newLog={id:uid(),item:itemName,unit:itemUnit,qty,person,location:equipment,equipment,date:nowISO()};
    cur.stock=stock; cur.fieldLogs=[newLog,...(cur.fieldLogs||[])];
    cur.movements.push({id:uid(),at:nowISO(),type:"Saha Çıkış",item:itemName,qty:-qty,unit:itemUnit,ref:equipment,by:state.session.fullName});
    cur.audit.push(pushAudit("Saha Sevk",itemName+" · "+qty+" · "+person+" → "+equipment));
    return cur;
  });
  if(newLog) generateFieldDeliveryPDF(newLog);
  state.modal=null; showToast("Sevk edildi.");
}
function handleSaleFormSubmit(){
  if(!roleCan("sale")){ showToast("Yetkiniz yok.","red"); return; }
  const customer=document.getElementById("sale-customer")?.value.trim();
  const desc=document.getElementById("sale-desc")?.value.trim();
  const amount=Number(document.getElementById("sale-amount")?.value);
  const date=document.getElementById("sale-date")?.value||nowISO().slice(0,10);
  const note=document.getElementById("sale-note")?.value.trim()||"";
  if(!customer||!desc||!(amount>0)){ showToast("Müşteri, açıklama ve tutar zorunlu.","red"); return; }
  mutateData(cur=>{
    const c=(cur.counters.sale||0)+1; cur.counters.sale=c;
    const no="SAT-"+String(c).padStart(5,"0");
    cur.sales=[{id:uid(),no,customer,desc,amount,date,note,by:state.session.fullName,at:nowISO()},...(cur.sales||[])];
    cur.audit.push(pushAudit("Satış",no+" · "+customer+" · "+amount));
    state.modal=null; showToast("Satış kaydedildi."); return cur;
  });
}
function handleSaleDelete(id){
  if(!roleCan("sale")){ showToast("Yetkiniz yok.","red"); return; }

    </div>

    const sortMode=state.saSort||"name";
    list=[...list].sort((a,b)=>{
      if(sortMode==="name") return String(a.item||"").localeCompare(String(b.item||""),"tr");
      if(sortMode==="name-desc") return String(b.item||"").localeCompare(String(a.item||""),"tr");
      if(sortMode==="cat") return String(a.category||"").localeCompare(String(b.category||""),"tr");
      return new Date(b.createdAt||0)-new Date(a.createdAt||0);
    });
    exportToXLSX("satin_alma_onayli_talepler","Onayli Talepler",
      ["PR","Ürün","Kategori","Miktar","Birim","Öncelik","İş Emri","Talep Eden","Tarih","Not"],
      list.map(r=>[r.no,r.item,r.category||"",Number(r.qty)||0,r.unit||"",r.priority||"",r.workOrderNo||"",r.requesterName||"",r.createdAt||"",r.note||""]));
  }
  else if(action==="export-talepler"){
    exportToXLSX("PR","Talepler",["PR","Ürün","Miktar","Birim","Kategori","WO","Talep Eden","Durum","Tarih"],
      state.data.requests.map(r=>[r.no,r.item,Number(r.qty)||0,r.unit,r.category,r.workOrderNo||"",r.requesterName,r.status,r.createdAt||""]));
  }
  else if(action==="export-stok"){
    exportToXLSX("stok","Stok",["Ürün","Kategori","Miktar","Birim","Min"],
      state.data.stock.map(s=>[s.item,s.category||"",Number(s.qty)||0,s.unit||"",Number(s.minLevel)||0]));
  }
  else if(action==="export-muhasebe"){
    exportToXLSX("faturalar","Faturalar",["Tarih","Fatura","PO","PR","Ürün","Cari","KDV","Toplam"],
      state.data.invoices.filter(i=>i.status==="Onaylandı").map(i=>[i.date,i.no,i.poNo||"",i.requestNo||"",i.item,i.supplier,Number(i.kdv)||0,Number(i.total)||0]));
  }
  else if(action==="db-clean"){ if(!roleCan("settings")){ showToast("Sadece admin.","red"); return; } handleDbClean(); }
  else if(action==="db-reset-ops"){ if(!roleCan("settings")){ showToast("Sadece admin.","red"); return; } handleDbReset("ops"); }
  else if(action==="db-reset-cari"){ if(!roleCan("settings")){ showToast("Sadece admin.","red"); return; } handleDbReset("cari"); }
  else if(action==="db-reset-users"){ if(!roleCan("settings")){ showToast("Sadece admin.","red"); return; } handleDbReset("users"); }
  else if(action==="db-reset-wo"){ if(!roleCan("settings")){ showToast("Sadece admin.","red"); return; } handleDbReset("wo"); }
  else if(action==="db-seed-mech"){ if(!roleCan("settings")){ showToast("Sadece admin.","red"); return; } handleDbReset("mech"); }
  else if(action==="db-reset-full"){ if(!roleCan("settings")){ showToast("Sadece admin.","red"); return; } handleDbReset("full"); }
  else if(action==="map-wo-new"){
    openWOFromEquipment(id);
  }
  else if(action==="wo-cat-filter"){
    state.woCatFilter=t.dataset.cat||"Tümü";
    render();
  }
  else if(action==="map-cat-filter"){
    state.mapCatFilter=t.dataset.cat||"Tümü";
    state._mapFp=null;
    render();
  }
  else if(action==="map-basemap"){
    state.mapBasemap=t.dataset.mode||"street";
    state._mapFp=null;
    render();
  }
  else if(action==="fo-quick"){
    if(!roleCan("stock_out")){ showToast("Depo yetkiniz yok.","red"); return; }
    const item=t.dataset.item||"", unit=t.dataset.unit||"";
    if(!item){ showToast("Ürün yok.","red"); return; }
    state.modal={type:"fo-quick", item, unit, maxQty:t.dataset.qty};
    render();
  }
  else if(action==="sale-new"){ if(!roleCan("sale")){ showToast("Yetkiniz yok.","red"); return; } state.modal={type:"sale-form"}; render(); }
  else if(action==="sale-delete"){ handleSaleDelete(id); }
  else if(action==="field-out-modal"){ showToast("Listeden ürünün yanındaki Çık butonunu kullanın.","amber"); }
  else if(action==="rfq-generate"){ if(!roleCan("po_create")){ showToast("Satın alma yetkiniz yok.","red"); return; } generateRFQ(); }
  else if(action==="stock-import-click"){ document.getElementById("stock-import-file")?.click(); }
  else if(action==="stock-template"){ downloadMaterialTemplate(); }
  else if(action==="talep-import-click"){ document.getElementById("talep-import-file")?.click(); }
  else if(action==="talep-template"){ downloadTalepTemplate(); }
  else if(action==="toggle-notif"){ state.showNotifPanel=!state.showNotifPanel; if(state.showNotifPanel) requestNotifPermission(); render(); }
  else if(action==="notif-read-all"){
    mutateData(cur=>{
      cur.notifications=(cur.notifications||[]).map(n=>({...n,read:true}));
      showToast("Bildirimler okundu.");
      return cur;
    });
  }
});

    const num=document.querySelector('.imalat-num[data-item="'+id+'"]');

  }
  if(e.target.classList&&e.target.classList.contains("imalat-num")){
    const id=e.target.dataset.item;
    const rng=document.querySelector('.imalat-range[data-item="'+id+'"]');
    if(rng) rng.value=e.target.value;
  }

  if(e.target.id==="talep-search"){ state.talepQuery=e.target.value; state._pendingFocus={id:"talep-search",pos:e.target.selectionStart}; render(); }
  if(e.target.id==="wo-search"){ state.woQuery=e.target.value; state._pendingFocus={id:"wo-search",pos:e.target.selectionStart}; render(); }
  if(e.target.id==="fo-search"){
    state.foQuery=e.target.value;
    state._pendingFocus={id:"fo-search",pos:e.target.selectionStart};
    render();
  }
  if(e.target.id==="stock-search"){
    state.stockQuery=e.target.value;
    state._pendingFocus={id:"stock-search",pos:e.target.selectionStart};
    render();
  }
  if(e.target.classList.contains("inv-preview-input")){

  }

});
document.addEventListener("change",e=>{
  if(e.target.id==="fo-select-native"){
    const key=e.target.value||"";
    if(key) applyFieldOutSelect(key);
    return;
  }
  if(e.target.id==="stock-import-file"){ handleStockImportFile(e.target.files?.[0]); e.target.value=""; }
  if(e.target.id==="talep-import-file"){ handleTalepImportFile(e.target.files?.[0]); e.target.value=""; }
  if(e.target.id==="wo-photo-input"){
    const f=e.target.files?.[0];
    const woId=e.target.dataset.wo;
    if(f&&woId) addWoPhoto(woId, f);
    e.target.value="";
  }
  if(e.target.id==="talep-status-filter"){ state.talepStatusFilter=e.target.value; render(); }
  if(e.target.id==="wo-status-filter"){ state.woStatusFilter=e.target.value; render(); }
  if(e.target.id==="sa-sort"){ state.saSort=e.target.value||"name"; render(); }
  if(e.target.id==="sa-cat"){ state.saCatFilter=e.target.value||"Tümü"; render(); }
  if(e.target.id==="talep-product"&&e.target.value){
    const p=state.data.products.find(x=>x.id===e.target.value);
    if(p){ document.getElementById("talep-item").value=p.name; document.getElementById("talep-category").value=p.category; document.getElementById("talep-unit").value=p.unit; }
  }
  if(e.target.classList.contains("inv-preview-input")){
    const poId=e.target.dataset.poid;
    const fromDisc=e.target.dataset.disc||null;
    if(poId) updateInvoicePreview(poId, fromDisc);
  }
});

/* ============================ STOK EXCEL / CSV IMPORT ============================ */
function downloadMaterialTemplate(){
  const headers=["Kod","Ürün","Kategori","Birim","Miktar","Min"];
  const rows=[
    ["PVC-B-32","PVC Boru Ø32 mm (6 m)","Mekanik Tesisat","Metre",0,0],
    ["PVC-D-32","PVC Dirsek 90° Ø32 mm","Mekanik Tesisat","Adet",0,0],
    ["PPR-B-25","PPRC Boru Ø25 mm PN20","Mekanik Tesisat","Metre",0,0],
    ["PPR-D90-25","PPRC Dirsek 90° Ø25 mm","Mekanik Tesisat","Adet",0,0],
    ["","","","","",""],
    ["ÖRNEK","Kendi listenizi bu satırların altına yapıştırın","Mekanik Tesisat","Adet",0,0]
  ];
  if(typeof XLSX!=="undefined"){
    const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
    ws["!cols"]=[{wch:14},{wch:36},{wch:18},{wch:10},{wch:10},{wch:8}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"MalzemeListesi");
    XLSX.writeFile(wb,"Malzeme_Import_Sablon.xlsx");
    showToast("Şablon indirildi. Listeyi yapıştırıp İçe Aktar ile yükleyin.");
  } else {
    exportToCSV("Malzeme_Import_Sablon", headers, rows);
    showToast("CSV şablon indirildi.");
  }
}
function handleStockImportFile(file){
  if(!file) return;
  if(!roleCan("stock_out") && state.session.role!=="admin"){ showToast("Yetkiniz yok.","red"); return; }
  const name=(file.name||"").toLowerCase();
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      let rows=[];
      if(name.endsWith(".csv")){
        const text=String(ev.target.result||"");
        const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<2){ showToast("CSV boş veya başlıksız.","red"); return; }
        const sep=lines[0].includes(";")&&!lines[0].includes(",") ? ";" : ",";
        const headers=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,""));
          const obj={}; headers.forEach((h,j)=>obj[h]=cols[j]||"");
          rows.push(obj);
        }
      } else {
        if(typeof XLSX==="undefined"){ showToast("Excel kütüphanesi yüklenemedi. CSV deneyin.","red"); return; }
        const data=new Uint8Array(ev.target.result);
        const wb=XLSX.read(data,{type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
      }
      applyStockImportRows(rows);
    }catch(err){
      console.error(err);
      showToast("Dosya okunamadı: "+(err.message||"hata"),"red");
    }
  };
  if(name.endsWith(".csv")) reader.readAsText(file,"utf-8");
  else reader.readAsArrayBuffer(file);
}
function pickField(row, keys){
  const entries=Object.entries(row);
  for(const k of keys){
    const found=entries.find(([h])=>String(h).toLowerCase().trim()===k || String(h).toLowerCase().includes(k));
    if(found && found[1]!=="" && found[1]!=null) return String(found[1]).trim();
  }
  return "";
}
function applyStockImportRows(rows){
  if(!rows||!rows.length){ showToast("Satır bulunamadı.","red"); return; }
  let updated=0, added=0;
  mutateData(cur=>{
    let stock=[...cur.stock];
    let products=[...cur.products];
    rows.forEach(row=>{
      const item=pickField(row,["ürün","urun","malzeme","item","name","ad","ürün adı","urun adi"]);
      const qtyRaw=pickField(row,["miktar","qty","stok","quantity","adet"]);
      const unit=pickField(row,["birim","unit"])||"Adet";
      const category=pickField(row,["kategori","category","grup"])||"Diğer";
      const code=pickField(row,["kod","code","sku"]);
      const minRaw=pickField(row,["min","minimum","min stok","minlevel"]);
      if(!item) return;
      const qty=Number(String(qtyRaw).replace(",","."))||0;
      const minLevel=Number(String(minRaw).replace(",","."))||0;
      const sIdx=stock.findIndex(s=>s.item.toLowerCase()===item.toLowerCase() && String(s.unit).toLowerCase()===unit.toLowerCase());
      if(sIdx>=0){ stock[sIdx]={...stock[sIdx], qty, category, minLevel: minLevel||stock[sIdx].minLevel||0}; updated++; }
      else { stock.push({id:uid(), item, category, unit, qty, minLevel}); added++; }
      if(code || !products.some(p=>p.name.toLowerCase()===item.toLowerCase())){
        if(!products.some(p=>p.name.toLowerCase()===item.toLowerCase())){
          products.push({id:uid(), code:code||("IMP-"+String(products.length+1).padStart(4,"0")), name:item, category, unit, minLevel});
        }
      }
    });
    cur.stock=stock;
    cur.products=products;
    cur.movements.push({id:uid(),at:nowISO(),type:"Excel Import",item:"Toplu stok",qty:updated+added,unit:"satır",ref:fileNameSafe(),by:state.session.fullName});
    cur.audit.push(pushAudit("Stok Import", `+${added} yeni · ${updated} güncellendi`));
    showToast(`Stok aktarıldı: ${added} yeni, ${updated} güncellendi.`);
    return cur;
  });
}
function fileNameSafe(){ return "import_"+new Date().toISOString().slice(0,10); }
