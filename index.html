<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurumsal ERP · Talep, Satın Alma, Stok, Cari & Muhasebe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#0B0E13; --surface:#171D26; --surface2:#0F141B; --surface3:#1F2733;
    --border:#2B3542; --border-strong:#3A4657;
    --text:#E7EBF0; --text-dim:#94A3B3; --text-mute:#5B6675;
    --amber:#E8A33D; --amber-hover:#F3B65A; --amber-text:#171208;
    --teal:#2DD4A6; --red:#F0554F; --blue:#4C8DFF; --violet:#9C8CF0; --green:#34D399;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); }
  body{ font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5; }
  .font-display{ font-family:'Space Grotesk',system-ui,sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:13px; }
  h1,h2,h3{ margin:0; }
  a{ color:inherit; }

  .input{ width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); outline:none; transition:.15s; }
  .input:focus{ border-color:#c98c2c; box-shadow:0 0 0 3px rgba(232,163,61,.15); }
  .input::placeholder{ color:var(--text-mute); }
  select.input{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2394A3B3'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:28px; }

  .field-label{ display:block; font-size:12px; font-weight:500; color:var(--text-dim); margin-bottom:5px; }
  .req{ color:var(--amber); }

  .btn{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px; border:1px solid transparent; transition:.15s; white-space:nowrap; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--amber); color:var(--amber-text); }
  .btn-primary:hover{ background:var(--amber-hover); }
  .btn-ghost{ background:var(--surface3); color:var(--text); border-color:var(--border); }
  .btn-ghost:hover{ background:#28323F; }
  .btn-danger{ background:rgba(240,85,79,.12); color:#FCA5A1; border-color:rgba(240,85,79,.35); }
  .btn-danger:hover{ background:rgba(240,85,79,.22); }
  .btn-icon{ padding:6px; border-radius:6px; background:var(--surface3); color:var(--text-dim); border:none; display:inline-flex; }
  .btn-icon:hover{ background:#28323F; color:var(--text); }
  .btn-icon.danger{ background:rgba(240,85,79,.1); color:#F0554F; }
  .btn-icon.danger:hover{ background:rgba(240,85,79,.2); }
  .btn-icon.green{ background:rgba(52,211,153,.1); color:#34D399; }
  .btn-icon.green:hover{ background:rgba(52,211,153,.2); }
  .btn-block{ width:100%; justify-content:center; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .badge{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid; }
  .badge.tone-slate{ background:rgba(148,163,179,.1); color:#C3CBD6; border-color:rgba(148,163,179,.3); }
  .badge.tone-amber{ background:rgba(232,163,61,.13); color:#F0B65E; border-color:rgba(232,163,61,.4); }
  .badge.tone-blue{ background:rgba(76,141,255,.13); color:#8CB2FF; border-color:rgba(76,141,255,.4); }
  .badge.tone-teal{ background:rgba(45,212,166,.13); color:#6EE7C5; border-color:rgba(45,212,166,.4); }
  .badge.tone-green{ background:rgba(52,211,153,.13); color:#6EE7B7; border-color:rgba(52,211,153,.4); }
  .badge.tone-red{ background:rgba(240,85,79,.13); color:#FCA5A1; border-color:rgba(240,85,79,.4); }
  .badge.tone-violet{ background:rgba(156,140,240,.13); color:#C1B5F5; border-color:rgba(156,140,240,.4); }

  #app{ min-height:100vh; display:flex; }
  .sidebar{ width:224px; flex-shrink:0; min-height:100vh; border-right:1px solid #1D2430; background:#0E131A; display:flex; flex-direction:column; }
  .sidebar-head{ padding:16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #1D2430; }
  .logo-box{ width:32px; height:32px; border-radius:8px; background:var(--amber); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; }
  .sidebar-title{ font-size:13px; font-weight:600; color:var(--text); }
  .sidebar-sub{ font-size:10px; color:var(--text-mute); }
  .nav{ flex:1; padding:12px 8px; overflow-y:auto; }
  .nav-item{ display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border-radius:8px; border:none; background:none; color:var(--text-dim); font-size:13px; text-align:left; margin-bottom:2px; }
  .nav-item:hover{ background:#171D26; color:var(--text); }
  .nav-item.active{ background:rgba(232,163,61,.13); color:#F0B65E; font-weight:600; }
  .sidebar-foot{ padding:12px; border-top:1px solid #1D2430; }
  .user-chip{ display:flex; align-items:center; gap:8px; padding:0 4px; margin-bottom:8px; }
  .avatar{ width:32px; height:32px; border-radius:999px; background:var(--surface3); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--text-dim); flex-shrink:0; }
  .user-chip-name{ font-size:12px; font-weight:500; color:var(--text); }
  .user-chip-role{ font-size:10px; color:var(--text-mute); }

  main{ flex:1; min-width:0; padding:28px; max-width:1120px; overflow-x: hidden; }
  .page-title{ font-size:24px; font-weight:600; color:var(--text); }
  .page-sub{ font-size:13px; color:var(--text-mute); margin:4px 0 20px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .stat-card{ display:flex; align-items:center; gap:12px; padding:16px; }
  .stat-icon{ width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
  .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-mute); }
  .stat-value{ font-size:20px; font-weight:600; }

  .table-responsive { width: 100%; overflow-x: auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width: 600px; }
  thead tr{ background:var(--surface2); text-align:left; }
  th{ padding:10px 14px; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-mute); font-weight:600; }
  td{ padding:10px 14px; border-top:1px solid #1D2430; }
  tr:hover td{ background:rgba(255,255,255,.01); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal{ width:100%; max-width:440px; padding:20px; max-height:85vh; overflow-y:auto; }
  .modal-row{ display:flex; justify-content:space-between; gap:16px; padding:6px 0; border-top:1px solid #1D2430; }
  .modal-row:first-child{ border-top:none; }
  .modal-row .k{ font-size:12px; color:var(--text-mute); flex-shrink:0; }
  .modal-row .v{ font-size:13px; color:var(--text); text-align:right; }

  #toast-container{ position:fixed; bottom:20px; right:20px; z-index:100; }
  .toast{ padding:10px 16px; border-radius:8px; font-size:13px; font-weight:600; border:1px solid; box-shadow:0 8px 24px rgba(0,0,0,.35); margin-top:10px;}
  .toast.green{ background:rgba(52,211,153,.13); border-color:rgba(52,211,153,.4); color:#6EE7B7; }
  .toast.red{ background:rgba(240,85,79,.13); border-color:rgba(240,85,79,.4); color:#FCA5A1; }
  .toast.amber{ background:rgba(232,163,61,.13); border-color:rgba(232,163,61,.4); color:#F0B65E; }

  .list-item{ padding:14px 16px; cursor:pointer; }
  .filters-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .search-wrap{ position:relative; flex-grow: 1; max-width: 300px; }
  .search-wrap .input{ padding-left:32px; }
  .search-wrap .ic{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-mute); font-size:13px; }
  .empty{ text-align:center; padding:32px; color:var(--text-mute); font-size:13px; }
  .login-wrap{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
  .login-box{ width:100%; max-width:360px; }
  .flex-wrap-gap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  @media (max-width:800px){
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
    .sidebar{ width:64px; }
    .sidebar-title,.sidebar-sub,.nav-item span:not(:first-child),.user-chip-name,.user-chip-role{ display:none; }
    main{ padding:16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>
    
<script>
/* ============================ DATA / HELPERS ============================ */

const ROLES = {
  admin:      { label: "Yönetici",       color: "amber" },
  onaylayan:  { label: "Onay Yetkilisi", color: "blue" },
  satinalma:  { label: "Satın Alma",     color: "teal" },
  depo:       { label: "Depo Sorumlusu", color: "violet" },
  muhasebe:   { label: "Muhasebe",       color: "green" },
  talep_eden: { label: "Talep Eden",     color: "slate" },
};
const UNITS = ["Adet", "Kutu", "Paket", "Kg", "Litre", "Metre", "Set"];
const CATEGORIES = ["Ofis Malzemesi", "Hammadde", "Yedek Parça", "Temizlik", "Elektronik", "Sarf Malzeme", "Diğer"];

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const nowISO = () => new Date().toISOString();
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"}) + " " +
         d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
}
function fmtTL(n){
  const v = Number(n)||0;
  return v.toLocaleString("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2});
}
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function statusTone(status){
  if (status.includes("Reddedildi") || status.includes("İade") || status.includes("Uyuşmuyor")) return "red";
  return { "Beklemede":"blue","Onaylandı":"teal","Sipariş Verildi":"amber","Teslim Alındı":"green","Fatura Onaylandı":"slate" }[status] || "slate";
}
function badge(text, tone){ return `<span class="badge tone-${tone}">${esc(text)}</span>`; }

function seedUsers(){
  return [{ id:uid(), username:"admin", password:"admin123", fullName:"Sistem Yöneticisi", role:"admin", active:true, createdAt:nowISO() }];
}
function seedData(){ return { requests:[], stock:[], transactions:[], suppliers:[], fieldLogs:[], reqCounter:0 }; }

/* ============================ STATE ============================ */

let state = {
  users:null, data:null, session:null, loading:true, tab:"dashboard",
  modal:null,
  talepQuery:"", talepStatusFilter:"Tümü",
  loginError:"",
};
let _pendingFocus = null;

/* ============================ STORAGE ============================ */

async function loadAll(){
  try{
    let u = null;
    try{ const r = await window.storage.get("users", true); u = r ? JSON.parse(r.value) : null; }catch(e){ u = null; }
    if(!u || !Array.isArray(u) || u.length===0){
      u = seedUsers();
      try{ await window.storage.set("users", JSON.stringify(u), true); }catch(e){}
    }
    state.users = u;

    let d = null;
    try{ const r2 = await window.storage.get("workflow-data", true); d = r2 ? JSON.parse(r2.value) : null; }catch(e){ d = null; }
    if(!d){ d = seedData(); try{ await window.storage.set("workflow-data", JSON.stringify(d), true); }catch(e){} }
    if(!d.suppliers) d.suppliers = [];
    if(!d.fieldLogs) d.fieldLogs = [];
    state.data = d;
  }catch(e){
    state.users = seedUsers();
    state.data = seedData();
  }
  state.loading = false;
  render();
}

setInterval(() => {
  if (state.session && !state.modal && !document.activeElement.classList.contains('input')) {
    loadAll();
  }
}, 5000);

async function mutateData(mutationFn){
  try {
    const r2 = await window.storage.get("workflow-data", true); 
    let current = r2 ? JSON.parse(r2.value) : seedData();
    if(!current.suppliers) current.suppliers = [];
    if(!current.fieldLogs) current.fieldLogs = [];
    let next = mutationFn(current);
    await window.storage.set("workflow-data", JSON.stringify(next), true);
    state.data = next;
    render();
  } catch (e) {
    showToast("İşlem kaydedilirken bir hata oluştu.", "red");
  }
}

async function saveUsers(next){
  state.users = next;
  try{ await window.storage.set("users", JSON.stringify(next), true); }
  catch(e){ showToast("Kullanıcı verisi kaydedilemedi.", "red"); }
  render();
}

function showToast(msg, tone){
  tone = tone || "green";
  const c = document.getElementById("toast-container");
  const t = document.createElement("div");
  t.className = `toast ${tone}`;
  t.innerHTML = esc(msg);
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; setTimeout(()=>t.remove(), 300); }, 3000);
}

function render(){
  const app = document.getElementById("app");
  if(state.loading || !state.users || !state.data){
    app.innerHTML = renderLoginScreen(true);
    return;
  }
  if(!state.session){
    app.innerHTML = renderLoginScreen(false);
    restoreFocus();
    return;
  }
  app.innerHTML = renderShell();
  restoreFocus();
}

function restoreFocus(){
  if(!_pendingFocus) return;
  const el = document.getElementById(_pendingFocus.id);
  if(el){
    el.focus();
    if(typeof _pendingFocus.pos === "number" && el.setSelectionRange){
      try{ el.setSelectionRange(_pendingFocus.pos, _pendingFocus.pos); }catch(e){}
    }
  }
  _pendingFocus = null;
}

function renderLoginScreen(loading){
  if(loading){
    return `<div class="login-wrap"><div class="login-box"><div class="card" style="padding:24px;text-align:center;color:var(--text-mute);">Sistem yükleniyor…</div></div></div>`;
  }
  return `<div class="login-wrap"><div class="login-box">
    <div style="margin-bottom:16px; text-align:center;">
      <div style="font-size:32px;">📦</div>
      <h1 class="font-display" style="font-size:17px;font-weight:600;">Kurumsal ERP Sistemi</h1>
    </div>
    <div class="card" style="padding:20px;">
      <form id="login-form">
        <div style="margin-bottom:12px;">
          <span class="field-label">Kullanıcı adı <span class="req">*</span></span>
          <input class="input" id="login-username" name="username" autocomplete="username" autofocus>
        </div>
        <div style="margin-bottom:12px;">
          <span class="field-label">Şifre <span class="req">*</span></span>
          <input class="input" type="password" id="login-password" name="password" autocomplete="current-password">
        </div>
        <div id="login-error-box">${state.loginError ? `<div style="color:var(--red);font-size:12px;margin-bottom:8px;">${esc(state.loginError)}</div>` : ""}</div>
        <button type="submit" class="btn btn-primary btn-block">Giriş yap →</button>
      </form>
    </div>
  </div></div>`;
}

function handleLogin(){
  const uname = document.getElementById("login-username").value.trim();
  const pass = document.getElementById("login-password").value;
  const u = state.users.find(x => x.username.toLowerCase() === uname.toLowerCase());
  if(!u || u.password !== pass){
    document.getElementById("login-error-box").innerHTML = `<div style="color:var(--red);font-size:12px;margin-bottom:8px;">Kullanıcı adı veya şifre hatalı.</div>`;
    return;
  }
  if(!u.active){
    document.getElementById("login-error-box").innerHTML = `<div style="color:var(--red);font-size:12px;margin-bottom:8px;">Bu hesap devre dışı bırakılmış.</div>`;
    return;
  }
  state.loginError = "";
  state.session = u;
  state.tab = "dashboard";
  render();
}

/* ============================ SHELL & NAV ============================ */

const NAV = [
  { key:"dashboard", label:"Panel", icon:"📊", roles:["admin","onaylayan","satinalma","depo","muhasebe","talep_eden"] },
  { key:"yeniTalep", label:"Yeni Talep", icon:"➕", roles:["admin","onaylayan","satinalma","depo","talep_eden"] },
  { key:"talepler", label:"Talepler", icon:"📋", roles:["admin","onaylayan","satinalma","depo","muhasebe","talep_eden"] },
  { key:"onay", label:"Onay Bekleyenler", icon:"✅", roles:["admin","onaylayan"] },
  { key:"satinalma", label:"Satın Alma", icon:"🛒", roles:["admin","satinalma"] },
  { key:"cariler", label:"Cari Firmalar", icon:"🏢", roles:["admin","satinalma","muhasebe"] },
  { key:"stok", label:"Stok & Saha", icon:"🏬", roles:["admin","depo","satinalma","onaylayan"] },
  { key:"muhasebe", label:"Muhasebe & Fatura", icon:"📈", roles:["admin","muhasebe"] },
  { key:"kullanicilar", label:"Kullanıcılar", icon:"👥", roles:["admin"] },
  { key:"ayarlar", label:"Sistem & Temizlik", icon:"⚙️", roles:["admin"] },
];

function renderShell(){
  const role = state.session.role;
  const tabs = NAV.filter(n => n.roles.includes(role));
  const initials = state.session.fullName.split(" ").map(s=>s[0]).slice(0,2).join("").toUpperCase();

  let content = "";
  if(state.tab === "dashboard") content = renderDashboard();
  else if(state.tab === "yeniTalep") content = renderYeniTalep();
  else if(state.tab === "talepler") content = renderTalepler();
  else if(state.tab === "onay") content = renderOnay();
  else if(state.tab === "satinalma") content = renderSatinAlma();
  else if(state.tab === "cariler") content = renderCariler();
  else if(state.tab === "stok") content = renderStok();
  else if(state.tab === "muhasebe") content = renderMuhasebe();
  else if(state.tab === "kullanicilar") content = renderKullanicilar();
  else if(state.tab === "ayarlar") content = renderAyarlar();

  return `
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="logo-box">📦</div>
        <div>
          <div class="sidebar-title font-display">Kurumsal ERP</div>
          <div class="sidebar-sub">Profesyonel Modül</div>
        </div>
      </div>
      <nav class="nav">
        ${tabs.map(n => `
          <button class="nav-item ${state.tab===n.key?'active':''}" data-action="nav" data-tab="${n.key}">
            <span>${n.icon}</span><span>${esc(n.label)}</span>
          </button>
        `).join("")}
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="avatar">${esc(initials)}</div>
          <div>
            <div class="user-chip-name">${esc(state.session.fullName)}</div>
            <div class="user-chip-role">${esc(ROLES[state.session.role]?.label||"")}</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-block" data-action="logout">↩ Çıkış yap</button>
      </div>
    </aside>
    <main>${content}</main>
    ${state.modal ? renderModal() : ""}
  `;
}

/* ============================ DASHBOARD ============================ */

function renderDashboard(){
  const { requests, stock, transactions, suppliers, fieldLogs } = state.data;
  const pending = requests.filter(r=>r.status==="Beklemede").length;
  const approved = requests.filter(r=>r.status==="Onaylandı").length;
  const ordered = requests.filter(r=>r.status==="Sipariş Verildi").length;
  const totalSpend = transactions.reduce((s,t)=>s+(Number(t.total)||0),0);

  return `
    <h1 class="page-title font-display">Hoş Geldiniz, ${esc(state.session.fullName.split(" ")[0])}</h1>
    <p class="page-sub">Genel ERP göstergeleri ve istatistikler.</p>

    <div class="stat-grid">
      <div class="card stat-card"><div class="stat-icon" style="background:rgba(76,141,255,.1);">⏱</div><div><div class="stat-label">Onay Bekleyen</div><div class="stat-value mono">${pending}</div></div></div>
      <div class="card stat-card"><div class="stat-icon" style="background:rgba(45,212,166,.1);">✅</div><div><div class="stat-label">Onaylandı</div><div class="stat-value mono">${approved}</div></div></div>
      <div class="card stat-card"><div class="stat-icon" style="background:rgba(232,163,61,.1);">🚚</div><div><div class="stat-label">Siparişte</div><div class="stat-value mono">${ordered}</div></div></div>
      <div class="card stat-card"><div class="stat-icon" style="background:rgba(52,211,153,.1);">📈</div><div><div class="stat-label">Toplam Harcama</div><div class="stat-value mono" style="font-size:16px;">${fmtTL(totalSpend)}</div></div></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:16px;">
      <div class="card" style="padding:16px;">
        <h2 style="font-size:13px;font-weight:600;margin-bottom:12px;">Kayıtlı Cari Firma Sayısı</h2>
        <div class="mono" style="font-size:24px; font-weight:700; color:var(--amber); margin-bottom:8px;">${suppliers.length} Firma</div>
        <p style="font-size:12px; color:var(--text-mute);">Vergi dairesi ve vergi no doğrulamalı entegre cari kartları.</p>

function handleNewTalep(){
  const item = document.getElementById("talep-item").value.trim();
  const qty = document.getElementById("talep-qty").value;
  if(!item || !qty || Number(qty)<=0){ showToast("Ürün adı ve geçerli miktar girin.","red"); return; }
  
  mutateData(currentData => {
    const counter = (currentData.reqCounter||0)+1;
    const req = {
      id:uid(), no:"TLP-"+String(counter).padStart(4,"0"),
      item, category:document.getElementById("talep-category").value,
      qty:Number(qty), unit:document.getElementById("talep-unit").value,
      priority:document.getElementById("talep-priority").value,
      note:document.getElementById("talep-note").value.trim(),
      requester:state.session.id, requesterName:state.session.fullName,
      createdAt:nowISO(), status:"Beklemede",
    };
    state.tab = "talepler";
    showToast(`${req.no} numaralı talep oluşturuldu.`);
    return { ...currentData, requests:[req, ...currentData.requests], reqCounter:counter };
  });
}

function handleReceiveOrder(id){
  const irsaliyeNo = document.getElementById("deliver-irs-"+id).value.trim();
  if(!irsaliyeNo){ showToast("İrsaliye numarası zorunludur.","red"); return; }

  mutateData(currentData => {
    const r = currentData.requests.find(x=>x.id===id);
    let stock = [...currentData.stock];
    const idx = stock.findIndex(s=>s.item.toLowerCase()===r.item.toLowerCase() && s.unit===r.unit);
    if(idx>=0) stock[idx] = { ...stock[idx], qty:Number(stock[idx].qty)+Number(r.qty) };
    else stock.push({ id:uid(), item:r.item, category:r.category, unit:r.unit, qty:Number(r.qty), minLevel:0 });

    return {
      ...currentData, stock,
      requests: currentData.requests.map(x=>x.id===id ? { ...x, status:"Teslim Alındı", irsaliyeNo } : x)
    };
  });
  showToast("Ürün teslim alındı ve stoğa eklendi.");
}

function handleReturnOrder(id){
  const reason = document.getElementById("return-reason-"+id).value.trim();
  if(!reason){ showToast("Lütfen iade gerekçesini yazın.","red"); return; }

  mutateData(currentData => ({
    ...currentData,
    requests: currentData.requests.map(x=>x.id===id ? { ...x, status:"İade Edildi", returnReason:reason } : x)
  }));
  showToast("Ürün iade edildi olarak işaretlendi.", "red");
}

        <thead><tr><th>Tarih</th><th>Talep No</th><th>Ürün</th><th>Cari Firma</th><th>KDV</th><th style="text-align:right;">Toplam Tutar</th></tr></thead>
        <tbody>
          ${transactions.length===0 ? `<tr><td colspan="6" class="empty">Henüz muhasebe kaydı yok.</td></tr>` : transactions.map(t=>`
            <tr>
              <td style="color:var(--text-mute);">${fmtDate(t.date)}</td>

function handleProcessInvoice(id){
  const totalInput = document.getElementById("inv-total-"+id).value;
  const kdvRate = document.getElementById("inv-kdv-"+id).value;
  if(!totalInput || Number(totalInput)<=0){ showToast("Geçerli bir fatura tutarı girin.","red"); return; }

  const invoiceTotal = Number(totalInput);

  mutateData(currentData => {
    const r = currentData.requests.find(x=>x.id===id);
    const expectedBase = Number(r.qty) * Number(r.unitPrice);
    const expectedWithKdv = expectedBase * (1 + Number(kdvRate)/100);
    
    // Tolerans payı %2 (küsurat farkları için)
    const diff = Math.abs(invoiceTotal - expectedWithKdv);
    const isMatch = diff <= (expectedWithKdv * 0.02);

    let newStatus = isMatch ? "Fatura Onaylandı" : "Fiyat Uyuşmuyor";
    let transactions = [...currentData.transactions];

    if(isMatch){
      transactions.push({
        id: uid(), requestNo: r.no, item: r.item, qty: r.qty,
        supplier: r.supplier, kdv: kdvRate, total: invoiceTotal, date: nowISO()
      });
      showToast("Fatura onaylandı ve muhasebeye işlendi.");
    } else {
      showToast(`Uyarı: Fatura tutarı (${fmtTL(invoiceTotal)}), teklif hesaplamasıyla (${fmtTL(expectedWithKdv)}) uyuşmuyor!`, "red");
    }

    return {
      ...currentData,
      transactions,
      requests: currentData.requests.map(x=>x.id===id ? { ...x, status: newStatus, invoiceTotal } : x)
    };
  });
}

function handleUserFormSubmit(){
  const fullName = document.getElementById("uf-name").value.trim();

  const role = document.getElementById("uf-role").value;

  const nextUsers = [...state.users, { id:uid(), fullName, username, password, role, active:true, createdAt:nowISO() }];

function handleUserDelete(id){
  if(!confirm("Bu kullanıcıyı silmek istediğinize emin misiniz?")) return;
  const nextUsers = state.users.filter(u => u.id !== id);
  saveUsers(nextUsers);
  showToast("Kullanıcı silindi.");
}

function handleFieldOutSubmit(){
  const itemVal = document.getElementById("fo-item").value;
  const qty = document.getElementById("fo-qty").value;
  const person = document.getElementById("fo-person").value.trim();
  const location = document.getElementById("fo-location").value.trim();

  if(!itemVal || !qty || Number(qty)<=0 || !person || !location){
    showToast("Lütfen tüm alanları eksiksiz ve geçerli doldurun.", "red");
    return;
  }

  const [itemName, itemUnit] = itemVal.split("|");

  mutateData(currentData => {
    let stock = [...currentData.stock];
    const idx = stock.findIndex(s=>s.item.toLowerCase()===itemName.toLowerCase() && s.unit===itemUnit);
    if(idx<0 || Number(stock[idx].qty) < Number(qty)){
      showToast("Yetersiz stok!", "red");
      return currentData;
    }

    stock[idx] = { ...stock[idx], qty: Number(stock[idx].qty) - Number(qty) };

    const newLog = {
      id: uid(), item: itemName, unit: itemUnit, qty: Number(qty),
      person, location, date: nowISO()
    };

    showToast("Malzeme sahaya başarıyla sevk edildi ve stoktan düşüldü.");
    return {
      ...currentData,
      stock,
      fieldLogs: [newLog, ...(currentData.fieldLogs||[])]
    };
  });
  state.modal = null;
}

/* ============================ EVENT DELEGATION ============================ */

document.addEventListener("submit", (e)=>{
  if(e.target.id === "login-form"){ e.preventDefault(); handleLogin(); }
  else if(e.target.id === "new-talep-form"){ e.preventDefault(); handleNewTalep(); }
  else if(e.target.id === "cari-form"){ e.preventDefault(); handleCariFormSubmit(); }
  else if(e.target.id === "user-form"){ e.preventDefault(); handleUserFormSubmit(); }
  else if(e.target.id === "field-out-form"){ e.preventDefault(); handleFieldOutSubmit(); }
});

document.addEventListener("click", (e)=>{
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;

  if(action === "nav"){ state.tab = t.dataset.tab; state.modal=null; render(); }
  else if(action === "logout"){ state.session = null; render(); }
  else if(action === "select-request"){ state.modal = { type:"request-detail", id }; render(); }
  else if(action === "close-modal"){ state.modal = null; render(); }
  else if(action === "overlay-close"){ if(e.target === t){ state.modal = null; render(); } }
  else if(action === "onay-approve"){ handleOnayDecide(id,"approve"); }
  else if(action === "onay-reject"){ handleOnayDecide(id,"reject"); }
  else if(action === "order-place"){ handlePlaceOrder(id); }
  else if(action === "order-receive"){ handleReceiveOrder(id); }
  else if(action === "order-return"){ handleReturnOrder(id); }
  else if(action === "invoice-process"){ handleProcessInvoice(id); }
  else if(action === "cari-new"){ state.modal = { type:"cari-form" }; render(); }
  else if(action === "cari-delete"){ handleCariDelete(id); }
  else if(action === "user-new"){ state.modal = { type:"user-form" }; render(); }
  else if(action === "user-delete"){ handleUserDelete(id); }
  else if(action === "field-out-modal"){ state.modal = { type:"field-out" }; render(); }
  else if(action === "db-clean"){ handleDbClean(); }
});

document.addEventListener("input", (e)=>{
  if(e.target.id === "talep-search"){
    state.talepQuery = e.target.value;
    _pendingFocus = { id:"talep-search", pos:e.target.selectionStart };
    render();
  }
});

document.addEventListener("change", (e)=>{
  if(e.target.id === "talep-status-filter"){
    state.talepStatusFilter = e.target.value;
    render();
  }
});
