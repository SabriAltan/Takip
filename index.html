<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabri Altan İşletme Sistemleri</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#0B0E13; --surface:#171D26; --surface2:#0F141B; --surface3:#1F2733;
    --border:#2B3542; --border-strong:#3A4657;
    --text:#E7EBF0; --text-dim:#94A3B3; --text-mute:#5B6675;
    --amber:#E8A33D; --amber-hover:#F3B65A; --amber-text:#171208;
    --teal:#2DD4A6; --red:#F0554F; --blue:#4C8DFF; --violet:#9C8CF0; --green:#34D399;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); }
  body{ font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5; }
  .font-display{ font-family:'Space Grotesk',system-ui,sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:13px; }
  h1,h2,h3{ margin:0; }
  .input{ width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); outline:none; transition:.15s; }
  .input:focus{ border-color:#c98c2c; box-shadow:0 0 0 3px rgba(232,163,61,.15); }
  .input::placeholder{ color:var(--text-mute); }
  select.input{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2394A3B3'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:28px; }
  .field-label{ display:block; font-size:12px; font-weight:500; color:var(--text-dim); margin-bottom:5px; }
  .req{ color:var(--amber); }
  .btn{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px; border:1px solid transparent; transition:.15s; white-space:nowrap; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--amber); color:var(--amber-text); }
  .btn-primary:hover{ background:var(--amber-hover); }
  .btn-ghost{ background:var(--surface3); color:var(--text); border-color:var(--border); }
  .btn-ghost:hover{ background:#28323F; }
  .btn-danger{ background:rgba(240,85,79,.12); color:#FCA5A1; border-color:rgba(240,85,79,.35); }
  .btn-danger:hover{ background:rgba(240,85,79,.22); }
  .btn-teal{ background:rgba(45,212,166,.15); color:#6EE7C5; border-color:rgba(45,212,166,.4); }
  .btn-teal:hover{ background:rgba(45,212,166,.25); }
  .btn-icon{ padding:6px; border-radius:6px; background:var(--surface3); color:var(--text-dim); border:none; display:inline-flex; }
  .btn-icon:hover{ background:#28323F; color:var(--text); }
  .btn-icon.danger{ background:rgba(240,85,79,.1); color:#F0554F; }
  .btn-block{ width:100%; justify-content:center; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .badge{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid; }
  .badge.tone-slate{ background:rgba(148,163,179,.1); color:#C3CBD6; border-color:rgba(148,163,179,.3); }
  .badge.tone-amber{ background:rgba(232,163,61,.13); color:#F0B65E; border-color:rgba(232,163,61,.4); }
  .badge.tone-blue{ background:rgba(76,141,255,.13); color:#8CB2FF; border-color:rgba(76,141,255,.4); }
  .badge.tone-teal{ background:rgba(45,212,166,.13); color:#6EE7C5; border-color:rgba(45,212,166,.4); }
  .badge.tone-green{ background:rgba(52,211,153,.13); color:#6EE7B7; border-color:rgba(52,211,153,.4); }
  .badge.tone-red{ background:rgba(240,85,79,.13); color:#FCA5A1; border-color:rgba(240,85,79,.4); }
  .badge.tone-violet{ background:rgba(156,140,240,.13); color:#C1B5F5; border-color:rgba(156,140,240,.4); }
  /* ===== Flexbox layout shell ===== */
  #app{ min-height:100vh; display:flex; flex-direction:row; align-items:flex-start; }
  .sidebar{
    width:248px; flex:0 0 248px;
    position:sticky; top:0; height:100vh; max-height:100vh;
    border-right:1px solid #1D2430; background:#0E131A;
    display:flex; flex-direction:column;
    overflow:hidden; z-index:40;
  }
  .sidebar-head{ padding:16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #1D2430; }
  .logo-box{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(145deg,#F0B65E 0%,#C98C2C 55%,#8B6914 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(232,163,61,.35), inset 0 1px 0 rgba(255,255,255,.28);
    overflow:hidden;
  }
  .logo-box svg{ width:28px; height:28px; display:block; }
  .brand-logo-lg{
    width:88px; height:88px; border-radius:22px; margin:0 auto 12px;
    background:linear-gradient(145deg,#F0B65E 0%,#C98C2C 55%,#8B6914 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 32px rgba(232,163,61,.32), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .brand-logo-lg svg{ width:56px; height:56px; display:block; }
  .brand-tag{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); font-weight:600; margin-bottom:4px; }

  .sidebar-title{ font-size:13px; font-weight:600; }
  .sidebar-sub{ font-size:10px; color:var(--text-mute); }
  .nav{ flex:1 1 auto; padding:10px 8px; overflow-y:auto; min-height:0; }
  .nav-section{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-mute); padding:10px 12px 4px; }
  .nav-item{ display:flex; align-items:center; gap:8px; width:100%; padding:7px 10px; border-radius:8px; border:none; background:none; color:var(--text-dim); font-size:12.5px; text-align:left; margin-bottom:1px; position:relative; }
  .nav-item:hover{ background:#171D26; color:var(--text); }
  .nav-item.active{ background:rgba(232,163,61,.13); color:#F0B65E; font-weight:600; }
  .nav-item > span:nth-child(2){ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-badge{ position:absolute; right:10px; background:var(--red); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; min-width:18px; text-align:center; flex-shrink:0; }
  .sidebar-foot{ padding:12px; border-top:1px solid #1D2430; flex-shrink:0; }
  .user-chip{ display:flex; align-items:center; gap:8px; padding:0 4px; margin-bottom:8px; min-width:0; }
  .avatar{ width:32px; height:32px; border-radius:999px; background:var(--surface3); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--text-dim); flex-shrink:0; }
  .user-chip-name{ font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-chip-role{ font-size:10px; color:var(--text-mute); }
  main{ flex:1 1 auto; min-width:0; padding:16px 18px; max-width:1280px; overflow-x:hidden; }

  /* ===== Page headers / rows ===== */
  .page-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .page-head > div{ min-width:0; flex:1 1 160px; }
  .page-title{ font-size:20px; font-weight:600; margin:0; }
  .page-sub{ font-size:13px; color:var(--text-mute); margin:4px 0 0; }
  .page-actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex-shrink:0; }

  .stat-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .stat-grid > .card, .stat-grid > .stat-card{ flex:1 1 140px; min-width:0; }
  .stat-card{ display:flex; align-items:center; gap:10px; padding:12px; }
  .stat-icon{ width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
  .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-mute); }
  .stat-value{ font-size:20px; font-weight:600; }

  .table-responsive{ width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
  thead tr{ background:var(--surface2); text-align:left; }
  th{ padding:10px 14px; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-mute); font-weight:600; }
  td{ padding:10px 14px; border-top:1px solid #1D2430; }
  tr:hover td{ background:rgba(255,255,255,.015); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; z-index:10000; padding:16px; }
  .modal{ width:100%; max-width:580px; padding:22px; max-height:88vh; overflow-y:auto; display:flex; flex-direction:column; gap:0; position:relative; z-index:10001; box-shadow:0 20px 60px rgba(0,0,0,.55); }
  .modal.wide{ max-width:760px; }
  .modal-row{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 16px; padding:7px 0; border-top:1px solid #1D2430; }
  .modal-row:first-child{ border-top:none; }
  .modal-row .k{ font-size:12px; color:var(--text-mute); flex:0 1 auto; }
  .modal-row .v{ font-size:13px; text-align:right; flex:1 1 auto; min-width:0; word-break:break-word; }

  #toast-container{ position:fixed; bottom:20px; right:20px; z-index:11000; display:flex; flex-direction:column; align-items:flex-end; }
  .toast{ padding:11px 16px; border-radius:8px; font-size:13px; font-weight:600; border:1px solid; box-shadow:0 8px 24px rgba(0,0,0,.35); margin-top:10px; transition:opacity .3s; max-width:min(360px,92vw); }
  .toast.green{ background:rgba(52,211,153,.13); border-color:rgba(52,211,153,.4); color:#6EE7B7; }
  .toast.red{ background:rgba(240,85,79,.13); border-color:rgba(240,85,79,.4); color:#FCA5A1; }
  .toast.amber{ background:rgba(232,163,61,.13); border-color:rgba(232,163,61,.4); color:#F0B65E; }

  .list-item{ padding:14px 16px; cursor:pointer; transition:background .12s; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .list-item:hover{ background:rgba(255,255,255,.02); }
  .filters-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .search-wrap{ position:relative; flex:1 1 160px; min-width:0; max-width:320px; }
  .search-wrap .input{ padding-left:34px; }
  .search-wrap .ic{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-mute); font-size:13px; }
  .empty{ text-align:center; padding:36px; color:var(--text-mute); font-size:13px; }
  .login-wrap{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
  .login-box{ width:100%; max-width:380px; }

  /* Flex utilities */
  .flex{ display:flex; }
  .flex-col{ display:flex; flex-direction:column; }
  .flex-wrap-gap{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .wo-card{ padding:12px; margin-bottom:8px; overflow:hidden; }
  .wo-card-inner{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .wo-card-body{ min-width:0; flex:1 1 160px; cursor:pointer; }
  .wo-card-title{ font-size:15px; font-weight:600; margin:0; word-break:break-word; }
  .wo-card-meta{ font-size:12px; color:var(--text-mute); margin:6px 0 0; line-height:1.45; word-break:break-word; }
  .wo-card-actions{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; flex:0 1 auto; max-width:100%; }
  .wo-card-actions .btn{ flex:0 1 auto; white-space:nowrap; }
  .wo-chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; align-items:center; }
  .cat-scroll{ display:flex; flex-wrap:nowrap; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; margin-bottom:8px; }
  .cat-scroll .btn{ flex:0 0 auto; }

  .flex-between{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
  .flex-1{ flex:1 1 auto; min-width:0; }
  .flex-none{ flex:none; }

  .timeline{ border-left:2px solid var(--border); margin-left:8px; padding-left:16px; }
  .timeline-item{ position:relative; margin-bottom:14px; }
  .timeline-item::before{ content:""; position:absolute; left:-21px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--amber); border:2px solid var(--bg); }
  .kpi-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .kpi-row > *{ flex:1 1 160px; min-width:0; }
  .section-title{ font-size:13px; font-weight:600; margin:22px 0 10px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }
  .alert-box{ padding:12px 14px; border-radius:8px; font-size:12px; margin-bottom:12px; border:1px solid; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .alert-box.warn{ background:rgba(232,163,61,.08); border-color:rgba(232,163,61,.35); color:#F0B65E; }
  .alert-box.danger{ background:rgba(240,85,79,.08); border-color:rgba(240,85,79,.35); color:#FCA5A1; }
  .alert-box.info{ background:rgba(76,141,255,.08); border-color:rgba(76,141,255,.35); color:#8CB2FF; }
  .alert-box.ok{ background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.35); color:#6EE7B7; }
  .preview-box{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px; margin-top:10px; }
  .preview-row{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px; font-size:13px; padding:4px 0; }
  .preview-row.total{ border-top:1px solid var(--border); margin-top:6px; padding-top:8px; font-weight:700; font-size:15px; }
  .funnel{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .funnel-step{ flex:1 1 90px; min-width:0; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .funnel-step .n{ font-size:20px; font-weight:700; font-family:'IBM Plex Mono',monospace; }
  .funnel-step .l{ font-size:10px; color:var(--text-mute); text-transform:uppercase; margin-top:2px; }
  .chk{ width:16px; height:16px; accent-color:var(--amber); }
  .eq-map-icon{ background:transparent !important; border:none !important; }
  .leaflet-div-icon.eq-map-icon{ background:transparent; border:none; }
  .eq-pin-wrap{ display:flex; flex-direction:column; align-items:center; line-height:1.05; pointer-events:none; transform-origin:bottom center; }
  .eq-pin-bina{
    width:18px; height:22px;
    border:1px solid rgba(11,14,19,.75);
    border-radius:2px 2px 1px 1px;
    opacity:.78;
    position:relative;
    /* hafif 3D: üst ve yan yüzey */
    box-shadow:
      3px -2px 0 0 color-mix(in srgb, var(--pin-c, #64748B) 70%, #000),
      0 2px 4px rgba(0,0,0,.35);
    background:
      linear-gradient(180deg, rgba(255,255,255,.22) 0%, transparent 35%),
      var(--pin-c, #64748B);
  }
  .eq-pin-bina::before{
    content:""; position:absolute; left:3px; top:4px; width:3px; height:3px;
    background:rgba(11,14,19,.4);
    box-shadow:6px 0 0 rgba(11,14,19,.4), 0 5px 0 rgba(11,14,19,.4), 6px 5px 0 rgba(11,14,19,.4);
  }
  .eq-pin-bina::after{
    content:""; position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:5px; height:6px; background:rgba(11,14,19,.5);
  }
  .eq-pin-label{
    margin-top:1px; max-width:52px; padding:0 3px; border-radius:3px;
    background:rgba(11,14,19,.68); color:#E7EBF0; font-size:8px; font-weight:700;
    letter-spacing:.02em; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    border:1px solid rgba(255,255,255,.1);
  }

  /* Stok / ürün satırları — Flexbox */
  .stock-list{ display:flex; flex-direction:column; gap:3px; margin-bottom:14px; }
  .stock-row{
    display:flex;
    flex-wrap:nowrap;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
    min-width:0;
  }
  .stock-row-name{
    flex:1 1 auto;
    min-width:0;
    font-size:12px;
    font-weight:600;
    line-height:1.25;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .stock-row-qty{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    font-weight:700;
    color:var(--amber);
    white-space:nowrap;
    text-align:right;
  }
  .stock-row-qty span{ font-size:11px; font-weight:500; opacity:.9; margin-left:3px; }
  .stock-row-cat{
    flex:0 0 auto;
    max-width:28%;
    font-size:10px;
    color:var(--text-mute);
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .stock-row .btn{ flex-shrink:0; }

  /* Form grid that collapses on mobile */
  .form-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .form-row > *{ flex:1 1 140px; min-width:0; }

  @media (max-width:960px){
    #app{ flex-direction:row; }
    .sidebar{ width:64px; flex:0 0 64px; position:sticky; top:0; height:100vh; }
    .sidebar-title,.sidebar-sub,.nav-item span:not(:first-child),.user-chip-name,.user-chip-role,.nav-section{ display:none; }
    .nav-badge{ right:4px; }
    main{ flex:1 1 auto; min-width:0; padding:12px; }
    .page-title{ font-size:18px; }
    .page-head{ gap:8px; }
    .stat-grid > .card, .stat-grid > .stat-card{ flex:1 1 calc(50% - 8px); }
    .kpi-row > *{ flex:1 1 calc(50% - 8px); }
    .funnel-step{ flex:1 1 calc(33.33% - 6px); }
    .stock-row{ gap:6px; padding:6px 8px; }
    .stock-row-name{ font-size:12px; }
    .stock-row-qty{ font-size:15px; }
    .stock-row-cat{ max-width:30%; font-size:9px; }
    .modal-overlay{ padding:10px; align-items:flex-start; }
    .modal{ max-width:100%; padding:16px; max-height:calc(100vh - 20px); }
    .filters-row .search-wrap{ flex:1 1 100%; max-width:none; }
    .card{ padding:12px; }
    table{ font-size:12px; min-width:480px; }
    th,td{ padding:8px 10px; }
    .btn{ padding:8px 12px; }
    .flex-wrap-gap .btn{ flex:1 1 auto; justify-content:center; }
    .wo-card{ padding:8px; margin-bottom:6px; border-radius:10px; }
    .wo-card-inner{ flex-direction:column; gap:6px; }
    .wo-card-body{ flex:1 1 auto; width:100%; }
    .wo-card-title{ font-size:13px; line-height:1.25; }
    .wo-card-meta{ font-size:10px; margin:3px 0 0; line-height:1.3; }
    .wo-chip-row{ gap:4px; margin-bottom:3px; }
    .wo-chip-row .badge{ font-size:9px; padding:1px 5px; }
    .wo-card-actions{
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:4px;
    }
    .wo-card-actions .btn{
      flex:none;
      width:100%;
      justify-content:center;
      padding:6px 4px;
      font-size:11px;
      border-radius:7px;
      min-height:32px;
    }
    .wo-card-actions .btn-primary{ grid-column: span 1; }
  }
  @media (max-width:480px){
    .wo-card{ padding:7px; margin-bottom:5px; }
    .wo-card-actions{ grid-template-columns:1fr 1fr 1fr; gap:3px; }
    .wo-card-actions .btn{ padding:5px 3px; font-size:10px; min-height:30px; }
    .page-sub{ font-size:11px; display:none; }

    .stat-grid > .card, .stat-grid > .stat-card{ flex:1 1 100%; }
    .funnel-step{ flex:1 1 calc(50% - 6px); }
    .stock-row-cat{ max-width:24%; }
  }
  .dash-map{ height:340px; }
  @media (max-width:960px){
    .dash-map{ height:240px !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>
<script>
/* ========================================================================
   KURUMSAL ERP PRO v3
   P2P + SAP PM (İş Emri) + RFQ/Teklif + 3-Way Match + Gelişmiş Kokpit
   ======================================================================== */

function defaultImalatProgress(){
  const out={};
  Object.keys(IMALAT_TEMPLATES).forEach(cat=>{
    out[cat]=IMALAT_TEMPLATES[cat].map(name=>({ id:uid(), name, pct:0 }));
  });
  return out;
}
function ensureEqProgress(eq){
  if(!eq) return null;
  const isBina=eq.unitType==="Bina" || /bina/i.test(String(eq.type||""));
  if(!isBina) return null;
  let prog=eq.progress;
  if(!prog || typeof prog!=="object") prog=defaultImalatProgress();
  Object.keys(IMALAT_TEMPLATES).forEach(cat=>{
    if(!Array.isArray(prog[cat]) || !prog[cat].length){
      prog[cat]=IMALAT_TEMPLATES[cat].map(name=>({ id:uid(), name, pct:0 }));
    }
  });
  return prog;
}
function overallProgress(prog){
  if(!prog) return 0;
  let sum=0, n=0;
  Object.keys(prog).forEach(cat=>{
    (prog[cat]||[]).forEach(it=>{ sum+=Number(it.pct)||0; n++; });
  });
  return n? Math.round(sum/n) : 0;
}

function normalizeWOType(t){
  const s=String(t||"").trim();
  if(WO_TYPES.includes(s)) return s;
  // Eski kayıtlar: arıza/montaj vb. → Diğer
  if(/inşaat|insaat/i.test(s)) return "İnşaat İşleri";
  if(/mekanik/i.test(s)) return "Mekanik İşler";
  if(/elektrik/i.test(s)) return "Elektrik İşleri";
  if(/alt\s*yapı|altyapı|alt yapi/i.test(s)) return "Alt Yapı İşleri";
  if(/etüt|etut/i.test(s)) return "Etüt İşleri";
  return "Diğer";
}

function exportToCSV(filename,headers,rows){
  const csv="\uFEFF"+headers.join(",")+"\n"+rows.map(e=>e.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename+"_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
/** Raporlar için Excel (.xlsx) — satır/sütun tablosu */
function exportToXLSX(filename, sheetName, headers, rows){
  if(typeof XLSX==="undefined"){
    showToast("Excel kütüphanesi yok, CSV indiriliyor.","amber");
    exportToCSV(filename, headers, rows);
    return;
  }
  const data=[headers, ...(rows||[]).map(r=>{
    // Satırı diziye sabitle
    if(Array.isArray(r)) return r.map(c=>c==null?"":c);
    return headers.map(h=>r[h]==null?"":r[h]);
  })];
  const ws=XLSX.utils.aoa_to_sheet(data);
  // Sütun genişlikleri (başlık + içerik)
  ws["!cols"]=headers.map((h,i)=>{
    let max=String(h||"").length;
    data.forEach(row=>{
      const v=row[i];
      const len=String(v==null?"":v).length;
      if(len>max) max=len;
    });
    return { wch: Math.min(Math.max(max+2, 10), 48) };
  });
  // Başlık satırını dondur
  ws["!freeze"]={ xSplit:0, ySplit:1, topLeftCell:"A2", activePane:"bottomLeft", state:"frozen" };
  const wb=XLSX.utils.book_new();
  const safeName=String(sheetName||"Rapor").slice(0,31).replace(/[\\/?*\[\]]/g,"");
  XLSX.utils.book_append_sheet(wb, ws, safeName||"Rapor");
  const fname=filename+"_"+new Date().toISOString().slice(0,10)+".xlsx";
  XLSX.writeFile(wb, fname);
  showToast("Excel indirildi: "+fname);
}
function exportReportWorkbook(filename, sheets){
  // sheets: [{ name, headers, rows }]
  if(typeof XLSX==="undefined"){
    showToast("Excel kütüphanesi yok.","red");
    return;
  }
  const wb=XLSX.utils.book_new();
  (sheets||[]).forEach((sh,idx)=>{
    const data=[sh.headers, ...(sh.rows||[]).map(r=>Array.isArray(r)?r.map(c=>c==null?"":c):[])];
    const ws=XLSX.utils.aoa_to_sheet(data);
    ws["!cols"]=(sh.headers||[]).map((h,i)=>{
      let max=String(h||"").length;
      data.forEach(row=>{ const len=String(row[i]==null?"":row[i]).length; if(len>max) max=len; });
      return { wch: Math.min(Math.max(max+2, 10), 48) };
    });
    const name=String(sh.name||("Sayfa"+(idx+1))).slice(0,31).replace(/[\\/?*\[\]]/g,"");
    XLSX.utils.book_append_sheet(wb, ws, name||("Sayfa"+(idx+1)));
  });
  const fname=filename+"_"+new Date().toISOString().slice(0,10)+".xlsx";
  XLSX.writeFile(wb, fname);
  showToast("Excel indirildi: "+fname);
}

async function loadAll(){
  try{
    let u=null;
    try{ const r=await window.storage.get("users"); u=r?JSON.parse(r.value):null; }catch(e){}
    if(!u||!Array.isArray(u)||!u.length){ u=seedUsers(); try{ await window.storage.set("users",JSON.stringify(u)); }catch(e){} }
    state.users=u;
    let d=null;
    try{ const r2=await window.storage.get("erp-data-v5"); d=r2?JSON.parse(r2.value):null; }catch(e){}
    if(!d){ d=seedData(); try{ await window.storage.set("erp-data-v5",JSON.stringify(d)); }catch(e){} }
    ["products","suppliers","equipment","workOrders","consumptions","messages","notifications","requests","purchaseOrders","goodsReceipts","stock","movements","fieldLogs","invoices","payments","audit","sales"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
    if(!d.company) d.company=seedData().company;
    if(!d.counters) d.counters=seedData().counters;
    // Eski "Teslimata Hazır" → Devam Ediyor
    d.workOrders=(d.workOrders||[]).map(w=>w.status==="Teslimata Hazır"?{...w,status:"Devam Ediyor"}:w);
    d.stock=(d.stock||[]).map(s=>s&&s.id?s:{...s,id:uid()});
    const snap=JSON.stringify(d);
    const same=state._dataSnap===snap;
    state.data=d;
    state._dataSnap=snap;
    state.loading=false;
    if(!state.session){
      const rest=tryRestoreSession();
      if(rest){ state.session=rest; state.tab=state.tab||"dashboard"; }
    } else {
      // oturumdaki kullanıcı güncel mi
      const fresh=(state.users||[]).find(u=>u.id===state.session.id);
      if(fresh) state.session={...fresh};
      else { state.session=null; clearRememberedSession(); }
    }
    // Veri değişmediyse ve harita zaten duruyorsa tam yenileme yapma
    if(same && state.session && !state.loading) return;
    render();
  }catch(e){ state.users=seedUsers(); state.data=seedData(); state.loading=false; render(); }
}
setInterval(()=>{
  if(state.session && !state.modal && !(document.activeElement&&document.activeElement.classList.contains('input')))

async function mutateData(fn){
  try{
    const r=await window.storage.get("erp-data-v5");
    let cur=r?JSON.parse(r.value):seedData();
    ["products","suppliers","equipment","workOrders","consumptions","messages","notifications","requests","purchaseOrders","goodsReceipts","stock","movements","fieldLogs","invoices","payments","audit"].forEach(k=>{ if(!Array.isArray(cur[k])) cur[k]=[]; });
    if(!cur.company) cur.company=seedData().company;
    if(!cur.counters) cur.counters=seedData().counters;
    const next=fn(cur);
    await window.storage.set("erp-data-v5",JSON.stringify(next));
    state.data=next; state._dataSnap=JSON.stringify(next); state._mapFp=null; render();
  }catch(e){ showToast("Kayıt hatası.","red"); console.error(e); }
}

function restoreFocus(){
  if(!state._pendingFocus) return;
  const el=document.getElementById(state._pendingFocus.id);
  if(el){ el.focus(); if(typeof state._pendingFocus.pos==="number"&&el.setSelectionRange) try{ el.setSelectionRange(state._pendingFocus.pos,state._pendingFocus.pos);}catch(e){} }
  state._pendingFocus=null;
}
const SESSION_KEY="sa-erp-session-v1";
function clearRememberedSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function saveRememberedSession(userId){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ userId, at:Date.now() })); }catch(e){}
}
function tryRestoreSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o||!o.userId) return null;
    if(Date.now()-(o.at||0) > 30*24*60*60*1000){ clearRememberedSession(); return null; }
    const u=(state.users||[]).find(x=>x.id===o.userId && x.active);
    return u||null;
  }catch(e){ return null; }
}

function handleLogin(){
  const uname=document.getElementById("login-username").value.trim();
  const pass=document.getElementById("login-password").value;
  const remember=!!document.getElementById("login-remember")?.checked;
  const u=state.users.find(x=>x.username.toLowerCase()===uname.toLowerCase());
  if(!u||u.password!==pass){ document.getElementById("login-error-box").innerHTML=`<div style="color:var(--red);font-size:12px;margin-bottom:8px;">Kullanıcı adı veya şifre hatalı.</div>`; return; }
  if(!u.active){ document.getElementById("login-error-box").innerHTML=`<div style="color:var(--red);font-size:12px;margin-bottom:8px;">Hesap pasif.</div>`; return; }
  state.loginError=""; state.session=u; state.tab="dashboard";
  try{ localStorage.setItem("sa-erp-last-user", u.username); }catch(e){}
  if(remember) saveRememberedSession(u.id); else clearRememberedSession();
  requestNotifPermission();
  render();
}
function handlePasswordChange(){
  const cur=document.getElementById("pw-cur")?.value||"";
  const n1=document.getElementById("pw-new")?.value||"";
  const n2=document.getElementById("pw-new2")?.value||"";
  if(!cur||!n1||!n2){ showToast("Tüm alanları doldurun.","red"); return; }
  if(n1.length<4){ showToast("Yeni şifre en az 4 karakter.","red"); return; }
  if(n1!==n2){ showToast("Yeni şifreler eşleşmiyor.","red"); return; }
  const me=state.users.find(u=>u.id===state.session.id);
  if(!me||me.password!==cur){ showToast("Mevcut şifre hatalı.","red"); return; }
  const next=state.users.map(u=>u.id===me.id?{...u,password:n1}:u);
  saveUsers(next);
  state.session={...state.session, password:n1};
  if(localStorage.getItem(SESSION_KEY)) saveRememberedSession(me.id);
  state.modal=null;
  showToast("Şifre güncellendi.");
}

  if(r==="yonetici"){
    if(action==="users" || action==="settings") return false;
    return true;
  }
  const map={
    wo_take:["talep_eden","depo"],
    wo_create:["talep_eden","depo","satinalma"],

  };
  return (map[action]||[]).includes(r);
}
/** Türkçe/İngilizce karakter farkını yok say + kelime sırası bağımsız arama */
function foldTR(s){
  return String(s||"").toLocaleLowerCase("tr")
    .replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s")
    .replace(/ı/g,"i").replace(/İ/g,"i").replace(/i/g,"i")
    .replace(/ö/g,"o").replace(/ç/g,"c")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
}
function fuzzyMatch(haystack, query){
  const h=foldTR(haystack);
  const n=foldTR(query);
  if(!n) return true;
  if(h.includes(n)) return true;
  const words=n.split(" ").filter(Boolean);
  if(!words.length) return true;
  // Tüm kelimeler metinde geçsin (sıra bağımsız) — "boru pvc 32" = "PVC Boru Ø32"
  if(words.every(w=>h.includes(w))) return true;
  // Ters birleşik
  if(h.includes(words.slice().reverse().join(" "))) return true;
  return false;
}

function countBadge(key){
  const d=state.data; if(!d) return 0;
  if(key==="onay") return d.requests.filter(r=>r.status==="Beklemede").length;
  if(key==="isEmirleri") return d.workOrders.filter(w=>!["Tamamlandı","İptal"].includes(w.status)).length;
  if(key==="satinalma") return d.requests.filter(r=>r.status==="Onaylandı").length;
  if(key==="stok") return d.purchaseOrders.filter(p=>p.status==="Sipariş Verildi"||p.status==="Kısmi Teslim").length;
  if(key==="muhasebe") return d.payments.filter(p=>p.status==="Ödeme Bekliyor").length;
  return 0;
}

function equipmentOpenStatus(eq){
  const open=(state.data.workOrders||[]).filter(w=>{
    if(["Tamamlandı","İptal"].includes(w.status)) return false;
    if(w.equipmentId && w.equipmentId===eq.id) return true;
    if(w.equipment && eq.name && w.equipment===eq.name) return true;
    return false;
  });
  if(!open.length) return { color:"#64748B", label:"Boş / iş yok", open:0, status:null };
  if(open.some(w=>w.status==="Malzeme Bekliyor")) return { color:"#E8A33D", label:"Malzeme bekliyor", open:open.length, status:"Malzeme Bekliyor" };
  if(open.some(w=>w.status==="Personel Bekliyor")) return { color:"#9C8CF0", label:"Personel bekliyor", open:open.length, status:"Personel Bekliyor" };
  if(open.some(w=>w.status==="Devam Ediyor")) return { color:"#2DD4A6", label:"İş devam ediyor", open:open.length, status:"Devam Ediyor" };
  return { color:"#4C8DFF", label:open[0].status||"Açık iş", open:open.length, status:open[0].status };
}
function isBuildingEq(eq){
  if(!eq) return false;
  if(eq.unitType==="Bina") return true;
  const s=String(eq.type||"")+" "+String(eq.name||"");
  return /bina|building|blok|yapı|tesis|fabrika|ofis|apartman|site|hangar|atölye|idari/i.test(s);
}
function collectActiveWorkPins(){

    if(eq && eq.lat!=null && eq.lng!=null && eq.lat!=="" && eq.lng!==""){
      lat=Number(eq.lat); lng=Number(eq.lng); place=eq.name||"";

      pins.push({

        sub: (place?place+" · ":"")+(w.assigneeName||"Üstlenen yok")+" · "+(w.status||""),
        status: w.status
      });
    }
  });
  return pins;
}

let _dashMap=null;
function eqMapFingerprint(){

function initDashboardMap(force){
  const el=document.getElementById("dash-map");
  if(!el || typeof L==="undefined"){
    const h=document.getElementById("dash-map-hint");
    if(h && typeof L==="undefined") h.textContent="Harita kütüphanesi yüklenemedi (çevrimdışı olabilir).";
    return;
  }
  const fp=eqMapFingerprint();
  // Aynı veri + harita ayaktaysa yeniden çizme (sürekli yenilemeyi kes)
  if(!force && _dashMap && state._mapFp===fp && el.querySelector(".leaflet-container")){
    try{ _dashMap.invalidateSize(); }catch(e){}
    return;
  }
  try{ if(_dashMap){ _dashMap.remove(); _dashMap=null; } }catch(e){}
  state._mapFp=fp;
  const catFilter=state.mapCatFilter||"Tümü";
  const eqs=(state.data.equipment||[]).filter(e=>{
    const n=normalizeLatLng(e.lat,e.lng); if(!n) return false;
    if(catFilter==="Tümü") return true;
    // Bu kategoride açık işi olan ekipmanlar
    return (state.data.workOrders||[]).some(w=>{
      if(["Tamamlandı","İptal"].includes(w.status)) return false;
      if(normalizeWOType(w.type)!==catFilter) return false;
      if(w.equipmentId && w.equipmentId===e.id) return true;
      if(w.equipment && e.name && w.equipment===e.name) return true;
      return false;
    });
  });
  const center = eqs.length ? [Number(eqs[0].lat), Number(eqs[0].lng)] : [39.0, 35.2];
  const mobile = window.innerWidth <= 960;
  _dashMap = L.map(el, {
    zoomControl:true, attributionControl:!mobile,
    minZoom:4, maxZoom:19
  }).setView(center, eqs.length?(mobile?15:16):6);
  const basemap=state.mapBasemap||"street";
  if(basemap==="sat"){
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom:19, attribution:"Esri / Maxar"
    }).addTo(_dashMap);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {
      maxZoom:19, opacity:0.85, attribution:""
    }).addTo(_dashMap);
  } else {
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom:19, maxNativeZoom:19, attribution:"&copy; OpenStreetMap"
    }).addTo(_dashMap);
  }
  const bounds=[];
  eqs.forEach(eq=>{
    const n=normalizeLatLng(eq.lat, eq.lng); if(!n) return;
    const st=equipmentOpenStatus(eq);
    const c=st.color;
    const codeLabel=String(eq.code||eq.name||"EQ").slice(0,10);
    // Küçük 3D bina + kod; yakın noktalarda hafif ofset (çakışma ≤ ~%50)
    const html=`<div class="eq-pin-wrap" title="${esc((eq.code||"")+" · "+(eq.name||""))}">
        <div class="eq-pin-bina" style="--pin-c:${c};background-color:${c};"></div>
        <div class="eq-pin-label">${esc(codeLabel)}</div>
      </div>`;
    const icon=L.divIcon({
      className:"eq-map-icon",
      html,
      iconSize:[54, 36],
      iconAnchor:[27, 36],
      popupAnchor:[0, -32]
    });
    // Yakın ekipmanlar birbirinin üstüne tam binmesin diye küçük jitter
    let lat=n.lat, lng=n.lng;
    const seen=bounds.filter(([la,lo])=>Math.abs(la-lat)<0.00025 && Math.abs(lo-lng)<0.00025);
    if(seen.length){
      const k=seen.length;
      lat += 0.00008 * Math.cos(k*1.2);
      lng += 0.00008 * Math.sin(k*1.2);
    }
    const m=L.marker([lat,lng],{ icon }).addTo(_dashMap);
    const popup=`<strong>${esc(eq.code||"")} · ${esc(eq.name)}</strong><br>
      <span style="font-size:12px;color:#94A3B3">${esc(eq.type||"—")} · ${esc(st.label)}${st.open?` (${st.open} iş)`:""}</span><br>
      <button type="button" data-action="map-wo-new" data-id="${eq.id}" style="margin-top:6px;padding:6px 10px;border-radius:6px;border:0;background:#E8A33D;color:#171208;font-weight:600;cursor:pointer;font-size:12px;">🔧 İş emri aç</button>
      · <a href="${routeUrlGoogle(n.lat,n.lng)}" target="_blank" rel="noopener" style="color:#4C8DFF;font-size:12px;">🚗 Rota</a>`;
    m.bindPopup(popup);
    // Basılı tut / sağ tık → iş emri
    let holdTimer=null;
    const startHold=()=>{ holdTimer=setTimeout(()=>{ openWOFromEquipment(eq.id); }, 550); };
    const clearHold=()=>{ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } };
    m.on("contextmenu", e=>{ if(e.originalEvent) e.originalEvent.preventDefault(); openWOFromEquipment(eq.id); });
    m.on("mousedown", startHold);
    m.on("mouseup", clearHold);
    m.on("mouseout", clearHold);
    m.on("touchstart", startHold);
    m.on("touchend", clearHold);
    m.on("touchmove", clearHold);
    bounds.push([n.lat,n.lng]);
  });
  if(bounds.length>=1){
    const b=L.latLngBounds(bounds);
    const mobile = window.innerWidth <= 960;
    // Telefonda daha uzak ölçek (çok yakın zoom yok)
    _dashMap.fitBounds(b.pad(mobile?0.18:0.12), {
      maxZoom: mobile ? 16 : 17,
      padding: mobile ? [20,20] : [28,28],
      animate:false
    });
  }
  const h=document.getElementById("dash-map-hint");
  if(h) h.textContent = eqs.length
    ? `${eqs.length} ekipman · gri=iş yok · renk=açık iş · basılı tut = iş aç`
    : "Koordinatlı ekipman yok — Ekipman kartına konum ekleyin.";
  setTimeout(()=>{ try{ _dashMap.invalidateSize(); }catch(e){} }, 150);
}

/* ---- İş emri fotoğrafları: ana ERP verisinden ayrı, 7 gün TTL, sıkıştırılmış ---- */
const WO_PHOTO_KEY="erp-wo-photos-v1";
const WO_PHOTO_TTL_MS=7*24*60*60*1000;
function loadWoPhotos(){
  try{ return JSON.parse(localStorage.getItem(WO_PHOTO_KEY)||"{}"); }catch(e){ return {}; }
}
function saveWoPhotos(obj){
  try{ localStorage.setItem(WO_PHOTO_KEY, JSON.stringify(obj)); }catch(e){ showToast("Foto alanı dolu; eski kayıtlar temizleniyor.","amber"); pruneWoPhotos(true); try{ localStorage.setItem(WO_PHOTO_KEY, JSON.stringify(obj)); }catch(e2){ showToast("Foto kaydedilemedi.","red"); } }
}
function pruneWoPhotos(aggressive){
  const now=Date.now();
  const all=loadWoPhotos();
  Object.keys(all).forEach(woId=>{
    all[woId]=(all[woId]||[]).filter(p=>{
      const age=now-(p.at||0);
      if(age>WO_PHOTO_TTL_MS) return false;
      return true;
    }).map(p=>{
      // 3 günden eski → ekstra küçült (pixel düşür)
      if(aggressive || (now-(p.at||0)>3*24*60*60*1000 && !p.shrunk)){
        return {...p, data:p.thumb||p.data, shrunk:true};
      }
      return p;
    });
    if(!all[woId].length) delete all[woId];
  });
  try{ localStorage.setItem(WO_PHOTO_KEY, JSON.stringify(all)); }catch(e){}
  return all;
}
function getWoPhotos(woId){
  pruneWoPhotos(false);
  return (loadWoPhotos()[woId]||[]).slice(0,12);
}
function compressImageFile(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("okunamadı"));
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1, maxW/img.width);
        const w=Math.max(1, Math.round(img.width*scale));
        const h=Math.max(1, Math.round(img.height*scale));
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const data=canvas.toDataURL("image/jpeg", quality);
        // thumb
        const tw=Math.min(120,w), th=Math.round(h*(tw/w));
        const c2=document.createElement("canvas"); c2.width=tw; c2.height=th;
        c2.getContext("2d").drawImage(img,0,0,tw,th);
        const thumb=c2.toDataURL("image/jpeg", 0.45);
        resolve({ data, thumb, w, h });
      };
      img.onerror=()=>reject(new Error("görsel hata"));
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function addWoPhoto(woId, file){
  if(!file || !file.type.startsWith("image/")){ showToast("Sadece resim.","red"); return; }
  try{
    const {data,thumb}=await compressImageFile(file, 720, 0.52);
    const all=pruneWoPhotos(false);
    const list=all[woId]||[];
    if(list.length>=8){ showToast("En fazla 8 foto (7 gün saklanır).","amber"); return; }
    list.push({ id:uid(), at:Date.now(), by:state.session.fullName, data, thumb, shrunk:false });
    all[woId]=list;
    saveWoPhotos(all);
    showToast("Foto eklendi (7 gün, sıkıştırılmış).");
    render();
  }catch(e){ showToast("Foto işlenemedi.","red"); }
}
function removeWoPhoto(woId, photoId){
  const all=loadWoPhotos();
  all[woId]=(all[woId]||[]).filter(p=>p.id!==photoId);
  if(!all[woId].length) delete all[woId];
  saveWoPhotos(all);
  render();
}

function handleWOTake(id){
  if(!id){ showToast("İş emri bulunamadı.","red"); return; }
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0){ showToast("İş emri bulunamadı.","red"); return cur; }
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal"].includes(w.status)){ showToast("Kapalı iş emrine katılınamaz.","red"); return cur; }
    const team=[...(w.team||[])];
    if(team.some(t=>t.id===state.session.id)){ showToast("Zaten ekipsiniz.","amber"); return cur; }
    team.push({ id:state.session.id, name:state.session.fullName, joinedAt:nowISO() });
    const isFirst=!w.assigneeId;
    // Saha: İşi Al = üzerine al ve çalışmaya başla
    let nextStatus=w.status;
    if(["Açık","Üstlenildi"].includes(w.status||"") || !w.status) nextStatus="Devam Ediyor";
    cur.workOrders[idx]={
      ...w,
      team,
      status: nextStatus,
      assigneeId: w.assigneeId || state.session.id,
      assigneeName: w.assigneeName || state.session.fullName,
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:isFirst?`İşi aldı → ${nextStatus}`:`Ekibe katıldı (${team.length} kişi)`}]
    };
    cur.audit.push(pushAudit("İşi Aldı", cur.workOrders[idx].no+" · "+state.session.fullName+" · ekip "+team.length));
    showToast(isFirst ? "İş alındı — bitince Bitir deyin." : `Ekibe katıldınız (${team.length} kişi)`);
    return cur;
  });
}

function handleWOLeave(id){
  if(!id) return;
  if(!confirm("İşi bırakmak istediğinize emin misiniz? Üzerinizdeki işlerden düşer.")) return;
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0){ showToast("İş emri bulunamadı.","red"); return cur; }
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal"].includes(w.status)){ showToast("Kapalı iş bırakılamaz.","red"); return cur; }
    const me=state.session.id;
    let team=(w.team||[]).filter(t=>t.id!==me);
    let assigneeId=w.assigneeId, assigneeName=w.assigneeName;
    if(assigneeId===me){
      if(team.length){
        assigneeId=team[0].id;
        assigneeName=team[0].name;
      } else {
        assigneeId=null;
        assigneeName=null;
      }
    }
    let status=w.status;
    // Kimse kalmadıysa alınabilir hale getir
    if(!team.length && !assigneeId){
      if(["Devam Ediyor","Üstlenildi","Malzeme Bekliyor","Personel Bekliyor"].includes(status)){
        status="Açık";
      }
    }
    cur.workOrders[idx]={
      ...w, team, assigneeId, assigneeName, status,
      crewCount: w.crewCount ? Math.max(team.length||0, Number(w.crewCount)-1||0) : (team.length||undefined),
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"İşi bıraktı"+(team.length?` · kalan ekip ${team.length}`:" · iş tekrar alınabilir")}]
    };
    cur.audit.push(pushAudit("İşi Bıraktı", cur.workOrders[idx].no+" · "+state.session.fullName));
    showToast("İş bırakıldı.");
    return cur;
  });
}

function handleWOAdvance(id, toStatus){
  if(!id||!toStatus) return;
  if(!WO_STATUSES.includes(toStatus)){ showToast("Geçersiz durum.","red"); return; }
  let crewCount=null;
  if(toStatus==="Personel Bekliyor"){
    const ans=prompt("Gerekli / mevcut ekip kişi sayısı:", "2");
    if(ans===null) return;
    crewCount=Math.max(1, parseInt(ans,10)||1);
  }
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0) return cur;
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal"].includes(w.status)){ showToast("Kapalı iş emri.","red"); return cur; }
    const team=[...(w.team||[])];
    if(!team.some(t=>t.id===state.session.id)){
      team.push({ id:state.session.id, name:state.session.fullName, joinedAt:nowISO() });
    }
    const patch={
      ...w,
      team,
      status: toStatus,
      assigneeId: w.assigneeId || state.session.id,
      assigneeName: w.assigneeName || state.session.fullName,
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:`Durum: ${w.status} → ${toStatus}`+(crewCount?` · ekip ${crewCount}`:"")}]
    };
    if(crewCount!=null) patch.crewCount=crewCount;
    cur.workOrders[idx]=patch;
    cur.audit.push(pushAudit("WO Kademe", cur.workOrders[idx].no+" · "+w.status+" → "+toStatus));
    showToast(`Durum: ${toStatus}`);
    return cur;
  });
}
function handleWOCrewSet(id){
  const w=(state.data.workOrders||[]).find(x=>x.id===id);
  if(!w) return;
  const ans=prompt("Çalışan ekip kişi sayısı:", String(w.crewCount||(w.team||[]).length||1));
  if(ans===null) return;
  const n=Math.max(1, parseInt(ans,10)||1);
  mutateData(cur=>{
    cur.workOrders=cur.workOrders.map(x=>x.id!==id?x:{...x, crewCount:n, history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"Ekip sayısı: "+n}]});
    showToast("Ekip: "+n+" kişi");
    return cur;
  });
}

function handleWOComplete(id){
  const note=document.getElementById("wo-comp-note")?.value.trim();
  const hours=document.getElementById("wo-comp-hours")?.value;
  const crew=Number(document.getElementById("wo-comp-crew")?.value)||undefined;
  if(!note){ showToast("Yapılan iş açıklaması zorunlu.","red"); return; }
  mutateData(cur=>{
    cur.workOrders=cur.workOrders.map(w=>{
      if(w.id!==id) return w;
      return {...w, status:"Tamamlandı", completionNote:note, laborHours:Number(hours)||0, crewCount:crew||w.crewCount, completedAt:nowISO(), completedBy:state.session.fullName,
        history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"Tamamlandı: "+note.slice(0,80)}]};
    });
    const w=cur.workOrders.find(x=>x.id===id);
    cur.audit.push(pushAudit("İş Emri Kapatıldı", (w?.no||id)+" · "+note.slice(0,60)));

    showToast("İş emri kapatıldı.");

function handleWOConsume(){
  const woId=document.getElementById("cons-wo")?.value;
  const itemVal=document.getElementById("cons-item")?.value;
  const qty=Number(document.getElementById("cons-qty")?.value);
  if(!woId||!itemVal||!qty||qty<=0){ showToast("Tüm alanları doldurun.","red"); return; }
  const [itemName,itemUnit]=itemVal.split("|");
  mutateData(cur=>{
    const wo=cur.workOrders.find(w=>w.id===woId);
    if(!wo) return cur;
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===itemName.toLowerCase()&&s.unit===itemUnit);
    if(idx<0||Number(stock[idx].qty)<qty){ showToast("Yetersiz stok!","red"); return cur; }
    stock[idx]={...stock[idx], qty:Number(stock[idx].qty)-qty};
    const cons={ id:uid(), workOrderId:wo.id, workOrderNo:wo.no, equipment:wo.equipment||"", equipmentId:wo.equipmentId||null,
      item:itemName, unit:itemUnit, qty, by:state.session.fullName, at:nowISO() };
    cur.stock=stock;
    cur.consumptions=[cons,...(cur.consumptions||[])];
    cur.movements.push({id:uid(),at:nowISO(),type:"WO Tüketim",item:itemName,qty:-qty,unit:itemUnit,ref:wo.no+(wo.equipment?" / "+wo.equipment:""),by:state.session.fullName});
    cur.workOrders=cur.workOrders.map(w=>{
      if(w.id!==woId) return w;
      // Malzeme alınca: Açık/Üstlenildi/Malzeme Bekliyor → Devam Ediyor
      let st=w.status;
      if(["Açık","Üstlenildi","Malzeme Bekliyor","Personel Bekliyor"].includes(st)) st="Devam Ediyor";
      return {...w, status:st, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"Malzeme: "+itemName+" × "+qty+" "+itemUnit+" → "+st}]};
    });
    cur.audit.push(pushAudit("WO Malzeme", wo.no+" · "+itemName+" × "+qty));
    // Minimal irsaliye
    generateMinimalDeliveryNote({ item:itemName, qty, unit:itemUnit, person:state.session.fullName, location:wo.equipment||wo.location||wo.no, date:nowISO(), ref:wo.no });
    state.modal=null;
    showToast("Malzeme ekipmana işlendi, stok düşüldü.");
    return cur;
  });
}

function handleWOStatus(id){
  const next=prompt("Yeni durum:\n"+WO_STATUSES.join(" / "));
  if(!next||!WO_STATUSES.includes(next.trim())){ if(next!==null) showToast("Geçersiz durum.","red"); return; }
  mutateData(cur=>{
    cur.workOrders=cur.workOrders.map(w=>{
      if(w.id!==id) return w;
      return {...w, status:next.trim(), history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"Durum → "+next.trim()}]};
    });
    const w=cur.workOrders.find(x=>x.id===id);
    cur.audit.push(pushAudit("İş Emri Durum", (w?.no||id)+" → "+next.trim()));
    showToast("Durum güncellendi.");
    return cur;
  });
}

function handleChatSend(entityType, entityId, label){
  const text=document.getElementById("chat-text")?.value.trim();

  // Modal açık kalsın (mutateData render eder)
  state.modal={ type:"chat", entityType, entityId, label };
  mutateData(cur=>{
    cur.messages=[...(cur.messages||[]), {
      id:uid(), entityType, entityId, label:label||"",
      user:state.session.fullName, userId:state.session.id, role:state.session.role,
      text, at:nowISO()
    }];
    cur.notifications=[{
      id:uid(), type:"chat", title:"Yeni mesaj · "+(label||entityType),
      body:state.session.fullName+": "+text.slice(0,80),
      at:nowISO(), read:false, refType:entityType, refId:entityId,
      byUserId:state.session.id
    },...(cur.notifications||[])].slice(0,100);
    showToast("Mesaj gönderildi.");
    return cur;
  });

    const th=document.getElementById("chat-thread");
    if(th) th.scrollTop=th.scrollHeight;
    const ta=document.getElementById("chat-text");
    if(ta){ ta.focus(); }
  }, 80);

function pushNotif(cur, {type,title,body,refType,refId}){
  cur.notifications=[{
    id:uid(), type:type||"info", title, body:body||"",
    at:nowISO(), read:false, refType:refType||"", refId:refId||"",
    byUserId:state.session?.id||""
  },...(cur.notifications||[])].slice(0,100);
  // Tarayıcı bildirimi (izin varsa)
  try{
    if(typeof Notification!=="undefined" && Notification.permission==="granted"){
      new Notification(title,{ body:body||"", silent:false });
    }
  }catch(e){}
  return cur;
}
function requestNotifPermission(){
  try{
    if(typeof Notification!=="undefined" && Notification.permission==="default"){
      Notification.requestPermission();
    }
  }catch(e){}
}
function unreadNotifCount(){
  const uid=state.session?.id;
  return (state.data?.notifications||[]).filter(n=>!n.read && n.byUserId!==uid).length;
}

function handleNewTalep(){
  let item=document.getElementById("talep-item").value.trim();
  const productId=document.getElementById("talep-product")?.value||"";
  const qty=document.getElementById("talep-qty").value;
  let category=document.getElementById("talep-category").value;
  let unit=document.getElementById("talep-unit").value;
  const woId=document.getElementById("talep-wo")?.value||"";
  if(productId){ const p=state.data.products.find(x=>x.id===productId); if(p){ item=p.name; category=p.category; unit=p.unit; } }
  if(!item||!qty||Number(qty)<=0){ showToast("Ürün ve miktar zorunlu.","red"); return; }

  mutateData(cur=>{
    const counter=(cur.counters.pr||0)+1;
    const no="PR-"+String(counter).padStart(5,"0");
    const wo=woId?cur.workOrders.find(w=>w.id===woId):null;
    const req={
      id:uid(), no, item, category, unit, qty:Number(qty),
      priority:document.getElementById("talep-priority").value,
      needDate:document.getElementById("talep-needdate").value||null,
      note:document.getElementById("talep-note").value.trim(),
      productId:productId||null, workOrderId:woId||null, workOrderNo:wo?.no||null,
      requester:state.session.id, requesterName:state.session.fullName,
      createdAt:nowISO(), status:"Beklemede",
      history:[{at:nowISO(),by:state.session.fullName,action:"PR oluşturuldu"+(wo?" · "+wo.no:"")}]
    };
    cur.counters.pr=counter;
    cur.requests=[req,...cur.requests];
    if(wo){
      // PR bağlamak durumu zorunlu "Malzeme Bekliyor" yapmaz — sadece geçmişe not düşer
      cur.workOrders=cur.workOrders.map(w=>w.id===woId?{...w, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"PR bağlandı: "+no}]}:w);
    }
    cur.audit.push(pushAudit("PR Oluşturuldu", no+" · "+item+(wo?" · "+wo.no:"")));
    state.tab="talepler"; state.modal=null;
    showToast(no+" oluşturuldu.");
    return cur;
  });
}

function handleTalepImportFile(file){
  if(!file) return;
  if(!roleCan("pr_create")){ showToast("Talep oluşturma yetkiniz yok.","red"); return; }
  const name=(file.name||"").toLowerCase();
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      let rows=[];
      if(name.endsWith(".csv")){
        const text=String(ev.target.result||"");
        const lines=text.replace(/^\uFEFF/,"").split(/\\r?\\n/).filter(l=>l.trim());
        if(lines.length<2){ showToast("CSV boş.","red"); return; }
        const sep=lines[0].includes(";")&&!lines[0].includes(",") ? ";" : ",";
        const headers=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,""));
          const obj={}; headers.forEach((h,j)=>obj[h]=cols[j]||"");
          rows.push(obj);
        }
      } else {
        if(typeof XLSX==="undefined"){ showToast("Excel kütüphanesi yok.","red"); return; }
        const data=new Uint8Array(ev.target.result);
        const wb=XLSX.read(data,{type:"array"});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      }
      applyTalepImportRows(rows);
    }catch(err){
      console.error(err);
      showToast("Dosya okunamadı.","red");
    }
  };
  if(name.endsWith(".csv")) reader.readAsText(file,"utf-8");
  else reader.readAsArrayBuffer(file);
}
function applyTalepImportRows(rows){
  if(!rows||!rows.length){ showToast("Satır yok.","red"); return; }
  let added=0, skipped=0;
  mutateData(cur=>{
    let counter=cur.counters.pr||0;
    const newReqs=[];
    rows.forEach(row=>{
      const item=pickField(row,["ürün","urun","malzeme","item","name","ad","ürün adı","urun adi"]);
      const qtyRaw=pickField(row,["miktar","qty","quantity","adet"]);
      const unit=pickField(row,["birim","unit"])||"Adet";
      const category=pickField(row,["kategori","category","grup"])||"Diğer";
      let priority=pickField(row,["öncelik","oncelik","priority"])||"Normal";
      if(!["Acil","Normal","Düşük","Yüksek"].includes(priority)) priority="Normal";
      const needDate=pickField(row,["ihtiyaç tarihi","ihtiyac tarihi","needdate","need date","tarih"])||null;
      const note=pickField(row,["not","note","açıklama","aciklama"])||"";
      const woNo=pickField(row,["iş emri no","is emri no","wo","work order","workorderno"]);
      const qty=Number(String(qtyRaw).replace(",","."))||0;
      if(!item||qty<=0){ skipped++; return; }
      counter++;
      const no="PR-"+String(counter).padStart(5,"0");
      const wo=woNo?(cur.workOrders||[]).find(w=>String(w.no).toLowerCase()===String(woNo).toLowerCase()):null;
      const req={
        id:uid(), no, item, category, unit, qty,
        priority, needDate:needDate||null, note,
        productId:null, workOrderId:wo?.id||null, workOrderNo:wo?.no||null,
        requester:state.session.id, requesterName:state.session.fullName,
        createdAt:nowISO(), status:"Beklemede",
        history:[{at:nowISO(),by:state.session.fullName,action:"Toplu import ile oluşturuldu"}]
      };
      newReqs.push(req);
      if(wo){
        cur.workOrders=cur.workOrders.map(w=>w.id===wo.id?{...w, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"PR bağlandı (import): "+no}]}:w);
      }
      added++;
    });
    cur.counters.pr=counter;
    cur.requests=[...newReqs, ...cur.requests];
    cur.audit.push(pushAudit("PR Toplu Import", added+" talep · "+skipped+" atlandı"));
    showToast(added ? (`${added} talep oluşturuldu` + (skipped ? `, ${skipped} satır atlandı` : "")) : "Geçerli satır yok.", added ? "green" : "red");
    return cur;
  });
}

function handleOnayDecide(id,decision){
  const reason=decision==="reject"?prompt("Red gerekçesi:"):null;
  if(decision==="reject"&&(reason===null||!reason.trim())){ showToast("Gerekçe zorunlu.","red"); return; }
  mutateData(cur=>{
    cur.requests=cur.requests.map(r=>{
      if(r.id!==id) return r;
      return {...r, status:decision==="approve"?"Onaylandı":"Reddedildi", approverName:state.session.fullName,
        rejectReason:decision==="reject"?reason:undefined,
        history:[...(r.history||[]),{at:nowISO(),by:state.session.fullName,action:decision==="approve"?"Onaylandı":"Reddedildi: "+reason}]};
    });
    const r=cur.requests.find(x=>x.id===id);
    cur.audit.push(pushAudit(decision==="approve"?"PR Onaylandı":"PR Reddedildi", r?.no||id));
    return cur;
  });
  showToast(decision==="approve"?"Onaylandı.":"Reddedildi.", decision==="approve"?"green":"red");
}
function handlePrCancel(id){
  if(!id) return;
  const r=(state.data.requests||[]).find(x=>x.id===id);
  if(!r){ showToast("Talep bulunamadı.","red"); return; }
  if(["İptal","PO Oluşturuldu","Teslim Alındı"].includes(r.status)){
    showToast("Bu talep iptal edilemez ("+r.status+").","red"); return;
  }
  // satinalma / admin / onaylayan; talep eden sadece kendi beklemedekini
  const role=state.session.role;
  const can = role==="admin" || roleCan("po_create") || roleCan("pr_approve")
    || (role==="talep_eden" && r.requester===state.session.id && r.status==="Beklemede");
  if(!can){ showToast("İptal yetkiniz yok.","red"); return; }
  const reason=prompt("İptal gerekçesi:");
  if(reason===null) return;
  if(!String(reason).trim()){ showToast("Gerekçe zorunlu.","red"); return; }
  mutateData(cur=>{
    cur.requests=cur.requests.map(x=>{
      if(x.id!==id) return x;
      return {...x, status:"İptal", cancelReason:String(reason).trim(), cancelledBy:state.session.fullName, cancelledAt:nowISO(),
        history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"İptal: "+String(reason).trim()}]};
    });
    // RFQ seçiminden çıkar
    state.rfqSelected=(state.rfqSelected||[]).filter(x=>x!==id);
    const req=cur.requests.find(x=>x.id===id);
    cur.audit.push(pushAudit("PR İptal", (req?.no||id)+" · "+String(reason).trim().slice(0,80)));
    state.modal=null;
    showToast("Talep iptal edildi.","amber");
    return cur;
  });
}

function handleCreatePO(reqId){
  const supplier=document.getElementById("order-supplier-"+reqId)?.value;
  const price=Number(document.getElementById("order-price-"+reqId)?.value);
  const qty=Number(document.getElementById("order-qty-"+reqId)?.value);
  const eta=document.getElementById("order-eta-"+reqId)?.value;
  if(!supplier||!(price>0)){ showToast("Cari ve birim fiyat zorunlu.","red"); return; }
  if(!(qty>0)){ showToast("Geçerli miktar girin.","red"); return; }
  mutateData(cur=>{
    const r=cur.requests.find(x=>x.id===reqId);
    if(!r||r.status!=="Onaylandı") return cur;
    const counter=(cur.counters.po||0)+1;
    const poNo="PO-"+String(counter).padStart(5,"0");
    const po={ id:uid(), no:poNo, requestId:r.id, requestNo:r.no, workOrderNo:r.workOrderNo||null,
      item:r.item, qty, unit:r.unit, category:r.category, supplier, unitPrice:price,
      total:price*qty, eta:eta||null, status:"Sipariş Verildi", receivedQty:0,
      createdAt:nowISO(), createdBy:state.session.fullName };
    cur.counters.po=counter;
    cur.purchaseOrders=[po,...cur.purchaseOrders];
    cur.requests=cur.requests.map(x=>x.id===reqId?{...x, status:"PO Oluşturuldu", poNo, supplier, unitPrice:price, qty,
      history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"PO: "+poNo+" · "+qty+" × "+price}]}:x);
    cur.audit.push(pushAudit("PO Oluşturuldu", poNo+" · "+r.item+" · "+qty+" · "+supplier));
    showToast(poNo+" oluşturuldu.");
    return cur;
  });
}
function handlePOUpdate(poId){
  if(!roleCan("po_create")&&state.session.role!=="yonetici"){ showToast("Satın alma yetkiniz yok.","red"); return; }
  const qty=Number(document.getElementById("po-qty-"+poId)?.value);
  const price=Number(document.getElementById("po-price-"+poId)?.value);
  const eta=document.getElementById("po-eta-"+poId)?.value||null;
  if(!(qty>0)){ showToast("Geçerli miktar.","red"); return; }
  if(!(price>0)){ showToast("Geçerli birim fiyat.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId);
    if(!po) return cur;
    if(["Teslim Alındı","İade Edildi","İptal"].includes(po.status)){ showToast("Bu PO güncellenemez.","red"); return cur; }
    const recv=Number(po.receivedQty)||0;
    if(qty<recv){ showToast("Miktar teslim alınanın ("+recv+") altında olamaz.","red"); return cur; }
    cur.purchaseOrders=cur.purchaseOrders.map(x=>{
      if(x.id!==poId) return x;
      return {...x, qty, unitPrice:price, total:qty*price, eta,
        history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:`Güncellendi: ${qty} × ${price}`}]};
    });
    // Bağlı PR miktar/fiyat senkron (opsiyonel)
    if(po.requestId){
      cur.requests=cur.requests.map(r=>r.id!==po.requestId?r:{...r, qty, unitPrice:price,
        history:[...(r.history||[]),{at:nowISO(),by:state.session.fullName,action:"PO üzerinden miktar/fiyat güncellendi"}]});
    }
    cur.audit.push(pushAudit("PO Güncellendi", po.no+" · "+qty+" × "+price));
    showToast("PO güncellendi.");
    return cur;
  });
}

function findSupplierByName(name){
  const n=String(name||"").trim().toLowerCase();
  if(!n) return null;
  return (state.data.suppliers||[]).find(s=>String(s.name||"").trim().toLowerCase()===n) || null;
}
function waPhoneDigits(phone){
  let d=String(phone||"").replace(/\D/g,"");
  if(!d) return "";
  // TR: 05xx → 905xx · 5xx → 905xx · 90 already ok
  if(d.startsWith("0") && d.length===11) d="9"+d;
  else if(d.length===10 && d.startsWith("5")) d="90"+d;
  return d;
}
function whatsappLink(phone, text){
  const d=waPhoneDigits(phone);
  if(!d) return null;
  return "https://wa.me/"+d+"?text="+encodeURIComponent(text||"");
}

function handleGRReceive(poId){
  const irs=document.getElementById("gr-irs-"+poId)?.value.trim();
  const qty=Number(document.getElementById("gr-qty-"+poId)?.value);
  const note=document.getElementById("gr-note-"+poId)?.value.trim();
  if(!irs){ showToast("İrsaliye no zorunlu.","red"); return; }
  if(!qty||qty<=0){ showToast("Geçerli miktar.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    const ordered=Number(po.qty)||0;
    const prevRecv=Number(po.receivedQty)||0;
    const remaining=Math.max(0, ordered-prevRecv);
    if(qty>remaining+1e-9){ showToast(`Kalan miktar ${remaining} ${po.unit}. Daha fazla giremezsiniz.`,"red"); return cur; }

    const grC=(cur.counters.gr||0)+1; const grNo="GR-"+String(grC).padStart(5,"0"); cur.counters.gr=grC;
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===po.item.toLowerCase()&&s.unit===po.unit);
    const prod=cur.products.find(p=>p.name.toLowerCase()===po.item.toLowerCase());
    if(idx>=0) stock[idx]={...stock[idx],qty:Number(stock[idx].qty)+qty};
    else stock.push({id:uid(),item:po.item,category:po.category,unit:po.unit,qty,minLevel:prod?.minLevel||0});

    const newRecv=prevRecv+qty;
    const full=newRecv>=ordered-1e-9;
    const left=Math.max(0, ordered-newRecv);

    cur.movements.push({id:uid(),at:nowISO(),type:"GRN Giriş",item:po.item,qty,unit:po.unit,ref:grNo+" / "+po.no,by:state.session.fullName});
    cur.goodsReceipts.push({
      id:uid(), no:grNo, poId:po.id, poNo:po.no, requestNo:po.requestNo,
      item:po.item, qty, unit:po.unit, supplier:po.supplier, irsaliyeNo:irs, note,
      orderedQty:ordered, receivedTotal:newRecv, remaining:left,
      at:nowISO(), by:state.session.fullName
    });

    // İrsaliye girilince faturalanabilir hale gelir (kısmi veya tam)
    cur.purchaseOrders=cur.purchaseOrders.map(x=>{
      if(x.id!==poId) return x;
      return {
        ...x,
        status: full ? "Teslim Alındı" : "Kısmi Teslim",
        receivedQty: newRecv,
        remainingQty: left,
        lastIrsaliyeNo: irs,
        lastGrNo: grNo,
        invoiceEligible: true,
        uninvoicedQty: Math.max(0, newRecv - (Number(x.invoicedQty)||0))
      };
    });
    cur.requests=cur.requests.map(x=>x.id===po.requestId?{
      ...x,
      status: full ? "Teslim Alındı" : (x.status==="PO Oluşturuldu"||x.status==="Sipariş Verildi"||x.status==="Kısmi Teslim" ? "Kısmi Teslim" : x.status),
      irsaliyeNo: irs, grNo,
      receivedQty: newRecv, remainingQty: left,
      history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:`GRN ${grNo}: +${qty} · kalan ${left} ${po.unit} · ${po.no}`}]
    }:x);
    cur.stock=stock;
    cur.audit.push(pushAudit("GRN", `${grNo} · ${po.no} · +${qty} · kalan ${left}`));
    showToast(full ? `${grNo} tam teslim · fatura ekranına düştü` : `${grNo} kısmi · kalan ${left} ${po.unit} · fatura ekranına düştü`);
    return cur;
  });
}
function handleGRReturn(poId){
  const reason=document.getElementById("gr-note-"+poId)?.value.trim();
  if(!reason){ showToast("İade gerekçesi zorunlu.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    cur.purchaseOrders=cur.purchaseOrders.map(x=>x.id===poId?{...x,status:"İade Edildi",returnReason:reason}:x);
    cur.requests=cur.requests.map(x=>x.id===po.requestId?{...x,status:"İade Edildi",returnReason:reason,history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"İade: "+reason}]}:x);
    cur.audit.push(pushAudit("PO İade", po.no+" · "+reason));
    showToast("İade kaydedildi.","red"); return cur;
  });
}

function calculateSupplierBalance(name){
  const inv=state.data.invoices.filter(i=>i.supplier===name&&i.status==="Onaylandı").reduce((s,i)=>s+Number(i.total||0),0);
  const paid=state.data.payments.filter(p=>p.supplier===name&&p.status==="Ödendi").reduce((s,p)=>s+Number(p.amount||0),0);
  return {invTotal:inv,paidTotal:paid,balance:inv-paid};
}

function updateInvoicePreview(poId, fromDisc){
  const priceEl=document.getElementById("inv-price-"+poId);
  const kdvEl=document.getElementById("inv-kdv-"+poId);
  const totalEl=document.getElementById("inv-total-"+poId);
  const qtyEl=document.getElementById("inv-qty-"+poId);
  const discPctEl=document.getElementById("inv-disc-pct-"+poId);
  const discAmtEl=document.getElementById("inv-disc-amt-"+poId);
  if(!priceEl||!kdvEl) return;
  let qty=Number(qtyEl?.value);
  if(!(qty>0)) qty=Number(priceEl.dataset.qty)||0;
  if(qtyEl && priceEl.dataset.qty){
    const maxQ=Number(priceEl.dataset.qty)||0;
    if(qty>maxQ){ qty=maxQ; qtyEl.value=maxQ; }
  }
  const qtyLabel=document.getElementById("pv-qty-label-"+poId);
  if(qtyLabel) qtyLabel.textContent=String(qty);
  const price=Number(priceEl.value)||0;
  const kdv=Number(kdvEl.value)||0;
  const gross=qty*price;
  let discPct=Number(discPctEl?.value)||0;
  let discAmt=Number(discAmtEl?.value)||0;
  if(discPct<0) discPct=0; if(discPct>100) discPct=100;
  if(discAmt<0) discAmt=0;
  // Senkron: % girilince tutar, tutar girilince % (kaynak fromDisc)
  if(fromDisc==="pct" || (fromDisc!=="amt" && discPct>0)){
    discAmt=gross*(discPct/100);
    if(discAmtEl && document.activeElement!==discAmtEl) discAmtEl.value=discAmt?discAmt.toFixed(2):"0";
  } else if(fromDisc==="amt" || discAmt>0){
    if(gross>0) discPct=(discAmt/gross)*100;
    else discPct=0;
    if(discPctEl && document.activeElement!==discPctEl) discPctEl.value=discPct?discPct.toFixed(2):"0";
  }
  if(discAmt>gross) discAmt=gross;
  const base=Math.max(0, gross-discAmt);
  const kdvAmt=base*(kdv/100);
  const expected=base+kdvAmt;
  const grossEl=document.getElementById("pv-gross-"+poId);
  const discEl=document.getElementById("pv-disc-"+poId);
  const baseEl=document.getElementById("pv-base-"+poId);
  const kdvAmtEl=document.getElementById("pv-kdv-"+poId);
  const totEl=document.getElementById("pv-total-"+poId);
  const diffEl=document.getElementById("pv-diff-"+poId);
  if(grossEl) grossEl.textContent=fmtTL(gross);
  if(discEl) discEl.textContent=fmtTL(discAmt)+(discPct?` (%${discPct.toFixed(1)})`:"");
  if(baseEl) baseEl.textContent=fmtTL(base);
  if(kdvAmtEl) kdvAmtEl.textContent=fmtTL(kdvAmt);
  if(totEl) totEl.textContent=fmtTL(expected);
  if(totalEl && (!totalEl.value || totalEl.dataset.autofill==="1")){
    totalEl.value=expected.toFixed(2);
    totalEl.dataset.autofill="1";
  }
  if(diffEl && totalEl){
    const invTotal=Number(totalEl.value)||0;
    const diff=invTotal-expected;
    const tol=Math.max(expected*0.02,1);
    if(!invTotal){ diffEl.textContent="—"; diffEl.style.color=""; }
    else if(Math.abs(diff)<=tol){ diffEl.textContent="✓ Uyumlu ("+fmtTL(diff)+")"; diffEl.style.color="var(--green)"; }
    else { diffEl.textContent="⚠ Fark: "+fmtTL(diff); diffEl.style.color="var(--red)"; }
  }
}

function handleInvoiceMatch(poId){
  const invNo=document.getElementById("inv-no-"+poId)?.value.trim();
  const total=Number(document.getElementById("inv-total-"+poId)?.value);
  const kdv=document.getElementById("inv-kdv-"+poId)?.value;
  const unitPrice=Number(document.getElementById("inv-price-"+poId)?.value);
  let discPct=Number(document.getElementById("inv-disc-pct-"+poId)?.value)||0;
  let discAmt=Number(document.getElementById("inv-disc-amt-"+poId)?.value)||0;
  if(!invNo){ showToast("Fatura no zorunlu.","red"); return; }
  if(!total||total<=0){ showToast("Geçerli tutar girin.","red"); return; }

  const qtyInput=Number(document.getElementById("inv-qty-"+poId)?.value);
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    const price=unitPrice||Number(po.unitPrice);
    const maxBill=Math.max(0, (Number(po.receivedQty)||0) - (Number(po.invoicedQty)||0));
    let billQty=qtyInput>0 ? qtyInput : maxBill;
    if(billQty>maxBill) billQty=maxBill;
    if(billQty<=0){ showToast("Faturalanacak teslim miktarı yok.","red"); return cur; }
    const gross=price*billQty;
    if(discPct>0 && !(discAmt>0)) discAmt=gross*(discPct/100);
    if(discAmt>0 && !(discPct>0) && gross>0) discPct=(discAmt/gross)*100;
    if(discAmt>gross) discAmt=gross;
    const netBase=Math.max(0, gross-discAmt);
    const expectedWithKdv=netBase*(1+Number(kdv)/100);
    const diff=Math.abs(total-expectedWithKdv);
    const match=diff<=Math.max(expectedWithKdv*0.02,1);
    const invC=(cur.counters.inv||0)+1; const invId="INV-"+String(invC).padStart(5,"0"); cur.counters.inv=invC;
    const partial=billQty+1e-9 < maxBill;

    if(match){
      cur.invoices.push({id:uid(),no:invNo,systemNo:invId,poId:po.id,poNo:po.no,requestNo:po.requestNo,
        item:po.item,qty:billQty,unit:po.unit,supplier:po.supplier,kdv,total,unitPrice:price,
        discountPct:discPct, discountAmt:discAmt, netBase, gross,
        status:"Onaylandı",date:nowISO(),matchedBy:state.session.fullName, partial:!!partial});
      cur.payments.push({id:uid(),invoiceNo:invNo,requestNo:po.requestNo,poNo:po.no,supplier:po.supplier,
        amount:total,status:"Ödeme Bekliyor",date:nowISO()});
      cur.purchaseOrders=cur.purchaseOrders.map(x=>{
        if(x.id!==poId) return x;
        const invd=(Number(x.invoicedQty)||0)+billQty;
        return {...x, invoicedQty:invd, uninvoicedQty:Math.max(0,(Number(x.receivedQty)||0)-invd)};
      });
      cur.audit.push(pushAudit("3-Way Match OK", invNo+" · "+po.no+" · qty "+billQty+(partial?" (parçalı)":"")));
      showToast(partial ? "Parçalı fatura onaylandı. Kalan sonra faturalanır." : "Eşleşme başarılı. Ödeme listesine eklendi.");
    } else {
      cur.invoices.push({id:uid(),no:invNo,systemNo:invId,poId:po.id,poNo:po.no,requestNo:po.requestNo,
        item:po.item,qty:billQty,supplier:po.supplier,kdv,total,unitPrice:price,
        discountPct:discPct, discountAmt:discAmt, netBase, gross,
        status:"Fiyat Uyuşmuyor",date:nowISO(),expected:expectedWithKdv,note:"Tolerans dışı"});
      cur.audit.push(pushAudit("Fatura Uyuşmazlık", invNo+" · beklenen "+expectedWithKdv.toFixed(2)));
      showToast(`Uyuşmazlık: Fatura ${fmtTL(total)} ≠ Beklenen ${fmtTL(expectedWithKdv)}`,"red");
    }
    return cur;
  });
}
function handleInvoiceReject(poId){
  const reason=prompt("İptal gerekçesi:");
  if(reason===null||!reason.trim()){ showToast("Gerekçe zorunlu.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    cur.purchaseOrders=cur.purchaseOrders.map(x=>x.id===poId?{...x,status:"İptal",cancelReason:reason}:x);
    cur.requests=cur.requests.map(x=>x.id===po.requestId?{...x,status:"İptal",cancelReason:reason,history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"İptal: "+reason}]}:x);
    cur.audit.push(pushAudit("PO/Fatura İptal", po.no+" · "+reason));
    showToast("İptal edildi.","red"); return cur;
  });
}
function handleExecutePayment(payId){
  const method=document.getElementById("pay-method")?.value;
  const details=document.getElementById("pay-details")?.value.trim();
  if(!details){ showToast("IBAN / detay zorunlu.","red"); return; }
  let paid=null;
  mutateData(cur=>{
    cur.payments=cur.payments.map(p=>{
      if(p.id!==payId) return p;
      paid={...p,method,methodDetails:details,status:"Ödendi",paidDate:nowISO(),paidBy:state.session.fullName};
      return paid;
    });
    if(paid) cur.audit.push(pushAudit("Ödeme", paid.invoiceNo+" · "+fmtTL(paid.amount)));
    return cur;
  });
  if(paid) generatePaymentReceiptPDF(paid);
  state.modal=null; showToast("Ödeme tamamlandı.");
}

function standardMechanicalCatalog(){
  // Stok 0 — standart talep / ürün kartı listesi
  const rows=[];
  const add=(code,name,cat,unit,min=0)=>rows.push({id:uid(),code,name,category:cat,unit,minLevel:min});
  // PVC boru (PN10/PN16 yaygın çaplar, metre)
  ["20","25","32","40","50","63","75","90","110"].forEach(d=>{
    add(`PVC-B-${d}`,`PVC Boru Ø${d} mm (6 m)`, "Mekanik Tesisat","Metre",0);
    add(`PVC-D-${d}`,`PVC Dirsek 90° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PVC-T-${d}`,`PVC Te Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PVC-M-${d}`,`PVC Muaf Ø${d} mm`, "Mekanik Tesisat","Adet",0);
  });
  // PVC redüksiyon / adaptör
  [["32","25"],["40","32"],["50","40"],["63","50"],["75","63"],["90","75"],["110","90"]].forEach(([a,b])=>{
    add(`PVC-R-${a}-${b}`,`PVC Redüksiyon Ø${a}→Ø${b} mm`, "Mekanik Tesisat","Adet",0);
  });
  // PPRC boru & fittings
  ["20","25","32","40","50","63","75"].forEach(d=>{
    add(`PPR-B-${d}`,`PPRC Boru Ø${d} mm PN20`, "Mekanik Tesisat","Metre",0);
    add(`PPR-D90-${d}`,`PPRC Dirsek 90° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-D45-${d}`,`PPRC Dirsek 45° Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-T-${d}`,`PPRC Te Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-K-${d}`,`PPRC Kaplin (Manson) Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-BF-${d}`,`PPRC Dişi Adaptör Ø${d} mm`, "Mekanik Tesisat","Adet",0);
    add(`PPR-BM-${d}`,`PPRC Erkek Adaptör Ø${d} mm`, "Mekanik Tesisat","Adet",0);
  });
  [["25","20"],["32","25"],["40","32"],["50","40"],["63","50"]].forEach(([a,b])=>{
    add(`PPR-R-${a}-${b}`,`PPRC Redüksiyon Ø${a}→Ø${b} mm`, "Mekanik Tesisat","Adet",0);
  });
  // Yaygın ek malzemeler
  add("KELEP-25","Boru Kelepçesi Ø25","Mekanik Tesisat","Adet",0);
  add("KELEP-32","Boru Kelepçesi Ø32","Mekanik Tesisat","Adet",0);
  add("TEFLON","Teflon Bant","Sarf Malzeme","Adet",0);
  add("SILIKON","Silikon Kartuş","Sarf Malzeme","Adet",0);
  return rows;
}

function handleDbReset(kind){
  if(kind==="ops" && !confirm("Talepler, PO, GRN, fatura, ödeme, hareketler silinecek. Cari/ürün/kullanıcı kalır. Emin misiniz?")) return;
  if(kind==="cari" && !confirm("Tüm cari firmalar silinecek. Emin misiniz?")) return;
  if(kind==="users" && !confirm("Admin dışındaki tüm kullanıcılar silinecek. Emin misiniz?")) return;
  if(kind==="wo" && !confirm("Tüm iş emirleri ve WO malzeme tüketimleri silinecek. Emin misiniz?")) return;
  if(kind==="mech" && !confirm("Ürün kartları mekanik katalog ile değişecek, stoklar 0 olacak. Emin misiniz?")) return;
  if(kind==="full" && !confirm("KOMPLE SIFIRLA: her şey silinir, admin + mekanik katalog kalır. Son kez onaylıyor musunuz?")) return;

  if(kind==="users"){
    const adminOnly=(state.users||[]).filter(u=>u.role==="admin");
    const keep=adminOnly.length?adminOnly:seedUsers();
    saveUsers(keep);
    showToast("Kullanıcılar sıfırlandı (admin korundu).");
    return;
  }

  mutateData(cur=>{
    if(kind==="ops"){
      const next={...seedData(), company:cur.company, suppliers:cur.suppliers, products:cur.products, equipment:cur.equipment};
      next.stock=zeroStockFromProducts(cur.products);
      next.audit.push(pushAudit("DB Ops Temizlik","Admin"));
      showToast("İşlem verileri temizlendi."); return next;
    }
    if(kind==="cari"){
      cur.suppliers=[];
      cur.audit.push(pushAudit("Cari Sıfırlandı","Admin"));
      showToast("Cariler silindi."); return cur;
    }
    if(kind==="wo"){
      cur.workOrders=[]; cur.consumptions=[];
      cur.audit.push(pushAudit("İş Emirleri Sıfırlandı","Admin"));
      showToast("İş emirleri silindi."); return cur;
    }
    if(kind==="mech"){
      const products=standardMechanicalCatalog();
      cur.products=products;
      cur.stock=zeroStockFromProducts(products);
      cur.audit.push(pushAudit("Mekanik Katalog Yüklendi", products.length+" kalem · stok 0"));
      showToast(`Katalog yüklendi (${products.length} kalem), stok 0.`); return cur;
    }
    if(kind==="full"){
      const products=standardMechanicalCatalog();
      const next={...seedData(), products, stock:zeroStockFromProducts(products), company:cur.company||seedData().company};
      next.audit.push(pushAudit("Komple DB Sıfırlama","Admin"));
      showToast("Komple sıfırlandı + mekanik katalog."); return next;
    }
    return cur;
  });
  if(kind==="full"){
    const adminOnly=(state.users||[]).filter(u=>u.role==="admin");
    saveUsers(adminOnly.length?adminOnly:seedUsers());
  }
}
