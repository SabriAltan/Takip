/* ---- İş emri fotoğrafları: ana ERP verisinden ayrı, 7 gün TTL, sıkıştırılmış ---- */
const WO_PHOTO_KEY="erp-wo-photos-v1";
const WO_PHOTO_TTL_MS=7*24*60*60*1000;
function loadWoPhotos(){
  try{ return JSON.parse(localStorage.getItem(WO_PHOTO_KEY)||"{}"); }catch(e){ return {}; }
}
function saveWoPhotos(obj){
  try{ localStorage.setItem(WO_PHOTO_KEY, JSON.stringify(obj)); }catch(e){ showToast("Foto alanı dolu; eski kayıtlar temizleniyor.","amber"); pruneWoPhotos(true); try{ localStorage.setItem(WO_PHOTO_KEY, JSON.stringify(obj)); }catch(e2){ showToast("Foto kaydedilemedi.","red"); } }
}
function pruneWoPhotos(aggressive){
  const now=Date.now();
  const all=loadWoPhotos();
  Object.keys(all).forEach(woId=>{
    all[woId]=(all[woId]||[]).filter(p=>{
      const age=now-(p.at||0);
      if(age>WO_PHOTO_TTL_MS) return false;
      return true;
    }).map(p=>{
      // 3 günden eski → ekstra küçült (pixel düşür)
      if(aggressive || (now-(p.at||0)>3*24*60*60*1000 && !p.shrunk)){
        return {...p, data:p.thumb||p.data, shrunk:true};
      }
      return p;
    });
    if(!all[woId].length) delete all[woId];
  });
  try{ localStorage.setItem(WO_PHOTO_KEY, JSON.stringify(all)); }catch(e){}
  return all;
}
function getWoPhotos(woId){
  pruneWoPhotos(false);
  return (loadWoPhotos()[woId]||[]).slice(0,12);
}
function compressImageFile(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("okunamadı"));
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1, maxW/img.width);
        const w=Math.max(1, Math.round(img.width*scale));
        const h=Math.max(1, Math.round(img.height*scale));
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const data=canvas.toDataURL("image/jpeg", quality);
        // thumb
        const tw=Math.min(120,w), th=Math.round(h*(tw/w));
        const c2=document.createElement("canvas"); c2.width=tw; c2.height=th;
        c2.getContext("2d").drawImage(img,0,0,tw,th);
        const thumb=c2.toDataURL("image/jpeg", 0.45);
        resolve({ data, thumb, w, h });
      };
      img.onerror=()=>reject(new Error("görsel hata"));
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function addWoPhoto(woId, file){
  if(!file || !file.type.startsWith("image/")){ showToast("Sadece resim.","red"); return; }
  try{
    const {data,thumb}=await compressImageFile(file, 720, 0.52);
    const all=pruneWoPhotos(false);
    const list=all[woId]||[];
    if(list.length>=8){ showToast("En fazla 8 foto (7 gün saklanır).","amber"); return; }
    list.push({ id:uid(), at:Date.now(), by:state.session.fullName, data, thumb, shrunk:false });
    all[woId]=list;
    saveWoPhotos(all);
    showToast("Foto eklendi (7 gün, sıkıştırılmış).");
    render();
  }catch(e){ showToast("Foto işlenemedi.","red"); }
}
function removeWoPhoto(woId, photoId){
  const all=loadWoPhotos();
  all[woId]=(all[woId]||[]).filter(p=>p.id!==photoId);
  if(!all[woId].length) delete all[woId];
  saveWoPhotos(all);
  render();
}

function handleWOTake(id){
  if(!id){ showToast("İş emri bulunamadı.","red"); return; }
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0){ showToast("İş emri bulunamadı.","red"); return cur; }
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal","Teknik Tamamlandı"].includes(w.status)){ showToast("Kapalı / teknik tamamlanmış işe katılınamaz.","red"); return cur; }
    const team=[...(w.team||[])];
    if(team.some(t=>t.id===state.session.id)){ showToast("Zaten ekipsiniz.","amber"); return cur; }
    team.push({ id:state.session.id, name:state.session.fullName, joinedAt:nowISO() });
    const isFirst=!w.assigneeId;
    // Saha: İşi Al = üzerine al ve çalışmaya başla
    let nextStatus=w.status;
    if(["Açık","Üstlenildi"].includes(w.status||"") || !w.status) nextStatus="Devam Ediyor";
    cur.workOrders[idx]={
      ...w,
      team,
      status: nextStatus,
      assigneeId: w.assigneeId || state.session.id,
      assigneeName: w.assigneeName || state.session.fullName,
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:isFirst?`İşi aldı → ${nextStatus}`:`Ekibe katıldı (${team.length} kişi)`}]
    };
    cur.audit.push(pushAudit("İşi Aldı", cur.workOrders[idx].no+" · "+state.session.fullName+" · ekip "+team.length));
    showToast(isFirst ? "İş alındı — bitince Bitir deyin." : `Ekibe katıldınız (${team.length} kişi)`);
    return cur;
  });
}

function handleWOLeave(id){
  if(!id) return;
  if(!confirm("İşi bırakmak istediğinize emin misiniz? Üzerinizdeki işlerden düşer.")) return;
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0){ showToast("İş emri bulunamadı.","red"); return cur; }
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal"].includes(w.status)){ showToast("Kapalı iş bırakılamaz.","red"); return cur; }
    const me=state.session.id;
    let team=(w.team||[]).filter(t=>t.id!==me);
    let assigneeId=w.assigneeId, assigneeName=w.assigneeName;
    if(assigneeId===me){
      if(team.length){
        assigneeId=team[0].id;
        assigneeName=team[0].name;
      } else {
        assigneeId=null;
        assigneeName=null;
      }
    }
    let status=w.status;
    // Kimse kalmadıysa alınabilir hale getir
    if(!team.length && !assigneeId){
      if(["Devam Ediyor","Üstlenildi","Malzeme Bekliyor","Personel Bekliyor"].includes(status)){
        status="Açık";
      }
    }
    cur.workOrders[idx]={
      ...w, team, assigneeId, assigneeName, status,
      crewCount: w.crewCount ? Math.max(team.length||0, Number(w.crewCount)-1||0) : (team.length||undefined),
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"İşi bıraktı"+(team.length?` · kalan ekip ${team.length}`:" · iş tekrar alınabilir")}]
    };
    cur.audit.push(pushAudit("İşi Bıraktı", cur.workOrders[idx].no+" · "+state.session.fullName));
    showToast("İş bırakıldı.");
    return cur;
  });
}

function handleWOAdvance(id, toStatus){
  if(!id||!toStatus) return;
  if(!WO_STATUSES.includes(toStatus)){ showToast("Geçersiz durum.","red"); return; }
  let crewCount=null;
  if(toStatus==="Personel Bekliyor"){
    const ans=prompt("Gerekli / mevcut ekip kişi sayısı:", "2");
    if(ans===null) return;
    crewCount=Math.max(1, parseInt(ans,10)||1);
  }
  mutateData(cur=>{
    const idx=cur.workOrders.findIndex(w=>w.id===id);
    if(idx<0) return cur;
    const w=cur.workOrders[idx];
    if(["Tamamlandı","İptal"].includes(w.status)){ showToast("Kapalı iş emri.","red"); return cur; }
    const team=[...(w.team||[])];
    if(!team.some(t=>t.id===state.session.id)){
      team.push({ id:state.session.id, name:state.session.fullName, joinedAt:nowISO() });
    }
    const patch={
      ...w,
      team,
      status: toStatus,
      assigneeId: w.assigneeId || state.session.id,
      assigneeName: w.assigneeName || state.session.fullName,
      history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:`Durum: ${w.status} → ${toStatus}`+(crewCount?` · ekip ${crewCount}`:"")}]
    };
    if(crewCount!=null) patch.crewCount=crewCount;
    cur.workOrders[idx]=patch;
    cur.audit.push(pushAudit("WO Kademe", cur.workOrders[idx].no+" · "+w.status+" → "+toStatus));
    showToast(`Durum: ${toStatus}`);
    return cur;
  });
}
function handleWOCrewSet(id){
  const w=(state.data.workOrders||[]).find(x=>x.id===id);
  if(!w) return;
  const ans=prompt("Çalışan ekip kişi sayısı:", String(w.crewCount||(w.team||[]).length||1));
  if(ans===null) return;
  const n=Math.max(1, parseInt(ans,10)||1);
  mutateData(cur=>{
    cur.workOrders=cur.workOrders.map(x=>x.id!==id?x:{...x, crewCount:n, history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"Ekip sayısı: "+n}]});
    showToast("Ekip: "+n+" kişi");
    return cur;
  });
}

function handleWOTechComplete(id){
  if(!["admin","yonetici"].includes(state.session?.role)){ showToast("Sadece üst düzey yönetici teknik kapatabilir.","red"); return; }
  const note=(document.getElementById("tech-note")?.value||"").trim();
  const updates=[];
  document.querySelectorAll(".tech-imalat.imalat-num").forEach(el=>{
    const itemId=el.dataset.item;
    const cat=el.dataset.cat;
    const v=Math.max(0, Math.min(100, Number(el.value)||0));
    if(itemId && cat) updates.push({itemId, cat, pct:v});
  });
  mutateData(cur=>{
    const w=cur.workOrders.find(x=>x.id===id); if(!w) return cur;
    cur.workOrders=cur.workOrders.map(x=>{
      if(x.id!==id) return x;
      return {...x,
        status:"Tamamlandı",
        techCompletedAt:nowISO(),
        techCompletedBy:state.session.fullName,
        completedAt:nowISO(),
        completedBy:state.session.fullName,
        techNote:note,
        techItems:updates,
        history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"Teknik onay ile kapatıldı"+(note?": "+note.slice(0,60):"")}]
      };
    });
    let eq=null;
    if(w.equipmentId) eq=cur.equipment.find(e=>e.id===w.equipmentId);
    if(!eq && w.equipment) eq=cur.equipment.find(e=>e.name===w.equipment);
    if(eq && isBuildingEq(eq)){
      eq={...eq};
      eq.progress=ensureEqProgress(eq)||defaultImalatProgress();
      updates.forEach(u=>{
        const arr=eq.progress[u.cat]||[];
        const it=arr.find(x=>x.id===u.itemId);
        if(it) it.pct=u.pct;
      });
      cur.equipment=cur.equipment.map(e=>e.id===eq.id?eq:e);
    }
    cur.audit.push(pushAudit("Teknik Onay / Kapatma", (w.no||id)+" · "+(note||"").slice(0,40)));
    state.modal=null;
    showToast("İş teknik onayla kapatıldı (Tamamlandı).");
    return cur;
  });
}

function handleWOTechReject(id){
  if(!["admin","yonetici"].includes(state.session?.role)){ showToast("Sadece üst düzey yönetici geri çevirebilir.","red"); return; }
  const note=(document.getElementById("tech-note")?.value||"").trim();
  if(!note){ showToast("Geri çevirme için teknik not / gerekçe yazın.","red"); return; }
  if(!confirm("İş sahaya geri çevrilsin mi?\n\n"+note)) return;
  mutateData(cur=>{
    const w=cur.workOrders.find(x=>x.id===id); if(!w) return cur;
    // Sahaya iade: üstlenen varsa Devam Ediyor, yoksa Açık
    const hasTeam=(w.team&&w.team.length)||w.assigneeId;
    const backStatus=hasTeam?"Devam Ediyor":"Açık";
    cur.workOrders=cur.workOrders.map(x=>{
      if(x.id!==id) return x;
      return {...x,
        status:backStatus,
        techRejectedAt:nowISO(),
        techRejectedBy:state.session.fullName,
        techRejectNote:note,
        // saha bitişini temizleme — not geçmişte kalsın ama yeniden bitirmeleri için field flag
        fieldCompletedAt:null,
        history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"Teknik geri çevirme → "+backStatus+": "+note.slice(0,80)}]
      };
    });
    pushNotif(cur,{
      type:"wo_tech_reject",
      title:"İş geri çevrildi: "+(w.no||""),
      body:note.slice(0,120),
      refType:"wo", refId:id
    });
    cur.audit.push(pushAudit("Teknik Geri Çevirme", (w.no||id)+" · "+note.slice(0,50)));
    state.modal=null;
    showToast("İş sahaya geri çevrildi ("+backStatus+").");
    return cur;
  });
}

function handleWOConsume(){
  const woId=document.getElementById("cons-wo")?.value;
  const itemVal=document.getElementById("cons-item")?.value;
  const qty=Number(document.getElementById("cons-qty")?.value);
  if(!woId||!itemVal||!qty||qty<=0){ showToast("Tüm alanları doldurun.","red"); return; }
  const [itemName,itemUnit]=itemVal.split("|");
  mutateData(cur=>{
    const wo=cur.workOrders.find(w=>w.id===woId);
    if(!wo) return cur;
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===itemName.toLowerCase()&&s.unit===itemUnit);
    if(idx<0||Number(stock[idx].qty)<qty){ showToast("Yetersiz stok!","red"); return cur; }
    stock[idx]={...stock[idx], qty:Number(stock[idx].qty)-qty};
    const cons={ id:uid(), workOrderId:wo.id, workOrderNo:wo.no, equipment:wo.equipment||"", equipmentId:wo.equipmentId||null,
      item:itemName, unit:itemUnit, qty, by:state.session.fullName, at:nowISO() };
    cur.stock=stock;
    cur.consumptions=[cons,...(cur.consumptions||[])];
    cur.movements.push({id:uid(),at:nowISO(),type:"WO Tüketim",item:itemName,qty:-qty,unit:itemUnit,ref:wo.no+(wo.equipment?" / "+wo.equipment:""),by:state.session.fullName});
    cur.workOrders=cur.workOrders.map(w=>{
      if(w.id!==woId) return w;
      // Malzeme alınca: Açık/Üstlenildi/Malzeme Bekliyor → Devam Ediyor
      let st=w.status;
      if(["Açık","Üstlenildi","Malzeme Bekliyor","Personel Bekliyor"].includes(st)) st="Devam Ediyor";
      return {...w, status:st, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"Malzeme: "+itemName+" × "+qty+" "+itemUnit+" → "+st}]};
    });
    cur.audit.push(pushAudit("WO Malzeme", wo.no+" · "+itemName+" × "+qty));
    // Minimal irsaliye
    generateMinimalDeliveryNote({ item:itemName, qty, unit:itemUnit, person:state.session.fullName, location:wo.equipment||wo.location||wo.no, date:nowISO(), ref:wo.no });
    state.modal=null;
    showToast("Malzeme ekipmana işlendi, stok düşüldü.");
    return cur;
  });
}

function handleWOStatus(id){
  const next=prompt("Yeni durum:\n"+WO_STATUSES.join(" / "));
  if(!next||!WO_STATUSES.includes(next.trim())){ if(next!==null) showToast("Geçersiz durum.","red"); return; }
  mutateData(cur=>{
    cur.workOrders=cur.workOrders.map(w=>{
      if(w.id!==id) return w;
      return {...w, status:next.trim(), history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"Durum → "+next.trim()}]};
    });
    const w=cur.workOrders.find(x=>x.id===id);
    cur.audit.push(pushAudit("İş Emri Durum", (w?.no||id)+" → "+next.trim()));
    showToast("Durum güncellendi.");
    return cur;
  });
}

function playNotifBeep(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    if(!state._audioCtx) state._audioCtx=new Ctx();
    const ctx=state._audioCtx;
    if(ctx.state==="suspended") ctx.resume();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type="sine"; o.frequency.value=880;
    g.gain.value=0.04;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.18);
    o.stop(ctx.currentTime+0.2);
  }catch(e){}
}
function announceNotifLocal(n){
  if(!n) return;
  // Kendi oluşturduğum bildirimi localde gürültü yapma
  if(n.byUserId && state.session && n.byUserId===state.session.id) return;
  try{ showToast((n.title||"Bildirim")+(n.body?": "+String(n.body).slice(0,60):""), "blue"); }catch(e){}
  playNotifBeep();
  try{
    if(typeof Notification!=="undefined" && Notification.permission==="granted"){
      new Notification(n.title||"Bildirim",{ body:n.body||"", silent:false, tag:n.id||("n-"+Date.now()) });
    }
  }catch(e){}
}
function pushNotif(cur, {type,title,body,refType,refId,toRoles}){
  const n={
    id:uid(), type:type||"info", title, body:body||"",
    at:nowISO(), read:false, refType:refType||"", refId:refId||"",
    byUserId:state.session?.id||"", byName:state.session?.fullName||"",
    toRoles:Array.isArray(toRoles)?toRoles:null
  };
  cur.notifications=[n,...(cur.notifications||[])].slice(0,120);
  // Canlı his: toast + bip (diğer cihazlarda softSync ile gelecek)
  try{
    showToast("🔔 "+title, type==="danger"||type==="wo_open"?"amber":"green");
    playNotifBeep();
  }catch(e){}
  try{
    if(typeof Notification!=="undefined" && Notification.permission==="granted"){
      new Notification(title,{ body:body||"", silent:false, tag:n.id });
    }
  }catch(e){}
  return cur;
}
function requestNotifPermission(){
  try{
    if(typeof Notification!=="undefined" && Notification.permission==="default"){
      Notification.requestPermission();
    }
  }catch(e){}
}
function notifVisibleToMe(n){
  if(!n) return false;
  if(n.byUserId && state.session && n.byUserId===state.session.id) return true; // kendi listemde de görünür
  if(n.toRoles && n.toRoles.length){
    return n.toRoles.includes(state.session?.role);
  }
  return true;
}
function unreadNotifCount(){
  const uid=state.session?.id;
  return (state.data?.notifications||[]).filter(n=>!n.read && n.byUserId!==uid && notifVisibleToMe(n)).length;
}
function markNotifRead(id){
  if(!id) return;
  mutateData(cur=>{
    cur.notifications=(cur.notifications||[]).map(n=>n.id===id?{...n,read:true}:n);
    return cur;
  });
}

function eqOpenWoCount(eq){
  const id=eq&&eq.id;
  const code=foldTR(eq&&eq.code||"");
  const name=foldTR(eq&&eq.name||"");
  return (state.data.workOrders||[]).filter(w=>{
    if(["Tamamlandı","İptal","Teknik Tamam"].includes(w.status)) return false;
    if(w.equipmentId && id && w.equipmentId===id) return true;
    const ref=foldTR(w.equipment||"");
    return (code && ref===code) || (name && ref===name);
  }).length;
}

function handleNewTalep(){
  let item=document.getElementById("talep-item").value.trim();
  const qty=document.getElementById("talep-qty").value;
  let category=document.getElementById("talep-category").value;
  let unit=document.getElementById("talep-unit").value;
  const woId=document.getElementById("talep-wo")?.value||"";
  let productId=null;
  // Katalogdan birebir veya esnek eşleşme
  if(item){
    const products=state.data.products||[];
    let p=products.find(x=>foldTR(x.name)===foldTR(item));
    if(!p){
      const hits=catalogFilter(products, item, x=>[x.code,x.name,x.category].join(" "), 1);
      if(hits.length && foldTR(hits[0].name)===foldTR(item)) p=hits[0];
    }
    if(p){ item=p.name; category=p.category||category; unit=p.unit||unit; productId=p.id||null; }
  }
  if(!item||!qty||Number(qty)<=0){ showToast("Ürün ve miktar zorunlu.","red"); return; }
  state.talepItemQuery="";

  mutateData(cur=>{
    // Katalogda yoksa ürün kartı oluştur
    if(!productId){
      const prod=ensureProductInCatalog(cur, item, unit, category);
      if(prod){ productId=prod.id; item=prod.name; category=prod.category||category; unit=prod.unit||unit; }
    }
    const counter=(cur.counters.pr||0)+1;
    const no="PR-"+String(counter).padStart(5,"0");
    const wo=woId?cur.workOrders.find(w=>w.id===woId):null;
    const req={
      id:uid(), no, item, category, unit, qty:Number(qty),
      priority:document.getElementById("talep-priority")?.value||"Normal",
      needDate:document.getElementById("talep-needdate")?.value||null,
      note:(document.getElementById("talep-note")?.value||"").trim(),
      productId:productId||null, workOrderId:woId||null, workOrderNo:wo?.no||null,
      requester:state.session.id, requesterName:state.session.fullName,
      ...(resolveContactFromSelect("talep-contact")||{}),
      createdAt:nowISO(), status:"Beklemede",
      history:[{at:nowISO(),by:state.session.fullName,action:"PR oluşturuldu"+(wo?" · "+wo.no:"")}]
    };
    cur.counters.pr=counter;
    cur.requests=[req,...cur.requests];
    if(wo){
      // PR bağlamak durumu zorunlu "Malzeme Bekliyor" yapmaz — sadece geçmişe not düşer
      cur.workOrders=cur.workOrders.map(w=>w.id===woId?{...w, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"PR bağlandı: "+no}]}:w);
    }
    cur.audit.push(pushAudit("PR Oluşturuldu", no+" · "+item+(wo?" · "+wo.no:"")));
    state.tab="talepler"; state.modal=null;
    showToast(no+" oluşturuldu.");
    return cur;
  });
}

function handleTalepImportFile(file){
  if(!file) return;
  if(!roleCan("pr_create")){ showToast("Talep oluşturma yetkiniz yok.","red"); return; }
  const name=(file.name||"").toLowerCase();
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      let rows=[];
      if(name.endsWith(".csv")){
        const text=String(ev.target.result||"");
        const lines=text.replace(/^\uFEFF/,"").split(/\\r?\\n/).filter(l=>l.trim());
        if(lines.length<2){ showToast("CSV boş.","red"); return; }
        const sep=lines[0].includes(";")&&!lines[0].includes(",") ? ";" : ",";
        const headers=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
        for(let i=1;i<lines.length;i++){
          const cols=lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,""));
          const obj={}; headers.forEach((h,j)=>obj[h]=cols[j]||"");
          rows.push(obj);
        }
      } else {
        if(typeof XLSX==="undefined"){ showToast("Excel kütüphanesi yok.","red"); return; }
        const data=new Uint8Array(ev.target.result);
        const wb=XLSX.read(data,{type:"array"});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      }
      applyTalepImportRows(rows);
    }catch(err){
      console.error(err);
      showToast("Dosya okunamadı.","red");
    }
  };
  if(name.endsWith(".csv")) reader.readAsText(file,"utf-8");
  else reader.readAsArrayBuffer(file);
}
function applyTalepImportRows(rows){
  if(!rows||!rows.length){ showToast("Satır yok.","red"); return; }
  let added=0, skipped=0;
  mutateData(cur=>{
    let counter=cur.counters.pr||0;
    const newReqs=[];
    rows.forEach(row=>{
      const item=pickField(row,["ürün","urun","malzeme","item","name","ad","ürün adı","urun adi"]);
      const qtyRaw=pickField(row,["miktar","qty","quantity","adet"]);
      const unit=pickField(row,["birim","unit"])||"Adet";
      const category=pickField(row,["kategori","category","grup"])||"Diğer";
      let priority=pickField(row,["öncelik","oncelik","priority"])||"Normal";
      if(!["Acil","Normal","Düşük","Yüksek"].includes(priority)) priority="Normal";
      const needDate=pickField(row,["ihtiyaç tarihi","ihtiyac tarihi","needdate","need date","tarih"])||null;
      const note=pickField(row,["not","note","açıklama","aciklama"])||"";
      const woNo=pickField(row,["iş emri no","is emri no","wo","work order","workorderno"]);
      const qty=Number(String(qtyRaw).replace(",","."))||0;
      if(!item||qty<=0){ skipped++; return; }
      counter++;
      const no="PR-"+String(counter).padStart(5,"0");
      const wo=woNo?(cur.workOrders||[]).find(w=>String(w.no).toLowerCase()===String(woNo).toLowerCase()):null;
      const prod=ensureProductInCatalog(cur, item, unit, category);
      const req={
        id:uid(), no, item:prod?prod.name:item, category:prod?(prod.category||category):category, unit:prod?(prod.unit||unit):unit, qty,
        priority, needDate:needDate||null, note,
        productId:prod?prod.id:null, workOrderId:wo?.id||null, workOrderNo:wo?.no||null,
        requester:state.session.id, requesterName:state.session.fullName,
        createdAt:nowISO(), status:"Beklemede",
        history:[{at:nowISO(),by:state.session.fullName,action:"Toplu import ile oluşturuldu"}]
      };
      newReqs.push(req);
      if(wo){
        cur.workOrders=cur.workOrders.map(w=>w.id===wo.id?{...w, history:[...(w.history||[]),{at:nowISO(),by:state.session.fullName,action:"PR bağlandı (import): "+no}]}:w);
      }
      added++;
    });
    cur.counters.pr=counter;
    cur.requests=[...newReqs, ...cur.requests];
    cur.audit.push(pushAudit("PR Toplu Import", added+" talep · "+skipped+" atlandı"));
    showToast(added ? (`${added} talep oluşturuldu` + (skipped ? `, ${skipped} satır atlandı` : "")) : "Geçerli satır yok.", added ? "green" : "red");
    return cur;
  });
}

function handleOnayDecide(id,decision){
  const reason=decision==="reject"?prompt("Red gerekçesi:"):null;
  if(decision==="reject"&&(reason===null||!reason.trim())){ showToast("Gerekçe zorunlu.","red"); return; }
  mutateData(cur=>{
    cur.requests=cur.requests.map(r=>{
      if(r.id!==id) return r;
      return {...r, status:decision==="approve"?"Onaylandı":"Reddedildi", approverName:state.session.fullName,
        rejectReason:decision==="reject"?reason:undefined,
        history:[...(r.history||[]),{at:nowISO(),by:state.session.fullName,action:decision==="approve"?"Onaylandı":"Reddedildi: "+reason}]};
    });
    const r=cur.requests.find(x=>x.id===id);
    cur.audit.push(pushAudit(decision==="approve"?"PR Onaylandı":"PR Reddedildi", r?.no||id));
    if(r){
      pushNotif(cur,{ type:decision==="approve"?"pr_ok":"pr_no",
        title:(decision==="approve"?"Talep onaylandı: ":"Talep reddedildi: ")+(r.no||""),
        body:(r.item||"")+" · "+(r.qty||"")+" "+(r.unit||""),
        refType:"pr", refId:r.id, toRoles:["admin","yonetici","satinalma","talep_eden","depo"]});
    }
    return cur;
  });
  showToast(decision==="approve"?"Onaylandı.":"Reddedildi.", decision==="approve"?"green":"red");
}
function handlePrCancel(id){
  if(!id) return;
  const r=(state.data.requests||[]).find(x=>x.id===id);
  if(!r){ showToast("Talep bulunamadı.","red"); return; }
  if(["İptal","Teslim Alındı","Kısmi Teslim"].includes(r.status)){
    showToast("Bu talep iptal edilemez ("+r.status+").","red"); return;
  }
  // PO oluşmuşsa: teslim alınmamışsa PO da iptal edilir
  if(r.status==="PO Oluşturuldu" || r.status==="Sipariş Verildi"){
    const linked=(state.data.purchaseOrders||[]).find(p=>p.requestId===r.id || p.requestNo===r.no);
    if(linked && (Number(linked.receivedQty)||0)>0){
      showToast("Teslim alınmış sipariş iptal edilemez. Önce ters GRN yapın.","red"); return;
    }
  }
  // satinalma / admin / onaylayan; talep eden sadece kendi beklemedekini
  const role=state.session.role;
  const can = role==="admin" || roleCan("po_create") || roleCan("pr_approve")
    || (role==="talep_eden" && r.requester===state.session.id && r.status==="Beklemede");
  if(!can){ showToast("İptal yetkiniz yok.","red"); return; }
  const reason=prompt("İptal gerekçesi:");
  if(reason===null) return;
  if(!String(reason).trim()){ showToast("Gerekçe zorunlu.","red"); return; }
  mutateData(cur=>{
    const req0=(cur.requests||[]).find(x=>x.id===id);
    cur.requests=cur.requests.map(x=>{
      if(x.id!==id) return x;
      return {...x, status:"İptal", cancelReason:String(reason).trim(), cancelledBy:state.session.fullName, cancelledAt:nowISO(),
        history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"İptal: "+String(reason).trim()}]};
    });
    // Bağlı PO (teslim yoksa) iptal
    cur.purchaseOrders=(cur.purchaseOrders||[]).map(p=>{
      const link=req0 && (p.requestId===id || p.requestNo===req0.no);
      if(!link) return p;
      if((Number(p.receivedQty)||0)>0) return p;
      if(["İptal","Teslim Alındı","İade Edildi"].includes(p.status)) return p;
      return {...p, status:"İptal", cancelReason:String(reason).trim(), cancelledAt:nowISO(), cancelledBy:state.session.fullName};
    });
    state.rfqSelected=(state.rfqSelected||[]).filter(x=>x!==id);
    const req=cur.requests.find(x=>x.id===id);
    cur.audit.push(pushAudit("PR İptal", (req?.no||id)+" · "+String(reason).trim().slice(0,80)));
    state.modal=null;
    showToast("Talep"+(req0 && ["PO Oluşturuldu","Sipariş Verildi"].includes(req0.status)?" ve sipariş":"")+" iptal edildi.","amber");
    return cur;
  });
}

function handleCreatePO(reqId){
  const supplier=document.getElementById("order-supplier-"+reqId)?.value;
  const price=Number(document.getElementById("order-price-"+reqId)?.value);
  const qty=Number(document.getElementById("order-qty-"+reqId)?.value);
  const eta=document.getElementById("order-eta-"+reqId)?.value;
  if(!supplier||!(price>0)){ showToast("Cari ve birim fiyat zorunlu.","red"); return; }
  if(!(qty>0)){ showToast("Geçerli miktar girin.","red"); return; }
  mutateData(cur=>{
    const r=cur.requests.find(x=>x.id===reqId);
    if(!r||r.status!=="Onaylandı") return cur;
    const counter=(cur.counters.po||0)+1;
    const poNo="PO-"+String(counter).padStart(5,"0");
    const po={ id:uid(), no:poNo, requestId:r.id, requestNo:r.no, workOrderNo:r.workOrderNo||null,
      item:r.item, qty, unit:r.unit, category:r.category, supplier, unitPrice:price,
      total:price*qty, eta:eta||null, status:"Sipariş Verildi", receivedQty:0,
      createdAt:nowISO(), createdBy:state.session.fullName };
    cur.counters.po=counter;
    cur.purchaseOrders=[po,...cur.purchaseOrders];
    cur.requests=cur.requests.map(x=>x.id===reqId?{...x, status:"PO Oluşturuldu", poNo, supplier, unitPrice:price, qty,
      history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:"PO: "+poNo+" · "+qty+" × "+price}]}:x);
    cur.audit.push(pushAudit("PO Oluşturuldu", poNo+" · "+r.item+" · "+qty+" · "+supplier));
    pushNotif(cur,{ type:"po", title:"Sipariş oluşturuldu: "+poNo,
      body:(r.item||"")+" · "+qty+" · "+(supplier||""),
      refType:"po", refId:po.id, toRoles:["admin","yonetici","depo","satinalma"]});
    showToast(poNo+" oluşturuldu.");
    return cur;
  });
}
function handlePOUpdate(poId){
  if(!roleCan("po_create")&&state.session.role!=="yonetici"){ showToast("Satın alma yetkiniz yok.","red"); return; }
  const qty=Number(document.getElementById("po-qty-"+poId)?.value);
  const price=Number(document.getElementById("po-price-"+poId)?.value);
  const eta=document.getElementById("po-eta-"+poId)?.value||null;
  if(!(qty>0)){ showToast("Geçerli miktar.","red"); return; }
  if(!(price>0)){ showToast("Geçerli birim fiyat.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId);
    if(!po) return cur;
    if(["Teslim Alındı","İade Edildi","İptal"].includes(po.status)){ showToast("Bu PO güncellenemez.","red"); return cur; }
    const recv=Number(po.receivedQty)||0;
    if(qty<recv){ showToast("Miktar teslim alınanın ("+recv+") altında olamaz.","red"); return cur; }
    cur.purchaseOrders=cur.purchaseOrders.map(x=>{
      if(x.id!==poId) return x;
      return {...x, qty, unitPrice:price, total:qty*price, eta,
        history:[...(x.history||[]),{at:nowISO(),by:state.session.fullName,action:`Güncellendi: ${qty} × ${price}`}]};
    });
    // Bağlı PR miktar/fiyat senkron (opsiyonel)
    if(po.requestId){
      cur.requests=cur.requests.map(r=>r.id!==po.requestId?r:{...r, qty, unitPrice:price,
        history:[...(r.history||[]),{at:nowISO(),by:state.session.fullName,action:"PO üzerinden miktar/fiyat güncellendi"}]});
    }
    cur.audit.push(pushAudit("PO Güncellendi", po.no+" · "+qty+" × "+price));
    showToast("PO güncellendi.");
    return cur;
  });
}

function getRfqColSupplier(n){
  if(state.rfqColSup && state.rfqColSup[n]) return state.rfqColSup[n];

function getRfqCompareOffers(rid){
  const offers=[];
  for(let n=1;n<=3;n++){
    const priceEl=document.querySelector('.rfq-cmp[data-rid="'+rid+'"][data-n="'+n+'"]');
    const price=Number(priceEl&&priceEl.value);
    const supplier=getRfqColSupplier(n);
    if(price>0) offers.push({n, price, supplier});
  }
  return offers;
}
function updateRfqBestCell(rid){
  const offers=getRfqCompareOffers(rid);
  const bestEl=document.getElementById("rfq-best-"+rid);
  if(!bestEl) return;
  if(!offers.length){ bestEl.textContent="—"; return; }
  const best=offers.reduce((a,b)=>b.price<a.price?b:a);
  bestEl.textContent=fmtTL(best.price)+(best.supplier?(" · "+best.supplier):"");
  bestEl.style.color="var(--green)";
  bestEl.dataset.price=String(best.price);
  bestEl.dataset.supplier=best.supplier||"";
}
function handleRfqTakeBest(rid){
  const offers=getRfqCompareOffers(rid);
  if(!offers.length){ showToast("Önce cari ve fiyat girin.","amber"); return; }
  const best=offers.reduce((a,b)=>b.price<a.price?b:a);
  if(!best.supplier){ showToast("En iyi teklifte cari seçili olmalı.","amber"); return; }
  // PO form alanlarını doldur (satın alma listesi)
  state.modal=null;
  state.tab="satinalma";
  state.saQuery="";
  render();
  setTimeout(()=>{
    const priceEl=document.getElementById("order-price-"+rid);
    const supEl=document.getElementById("order-supplier-"+rid);
    const etaEl=document.getElementById("order-eta-"+rid);
    if(priceEl) priceEl.value=String(best.price);
    if(supEl){
      // option yoksa ekle
      let found=false;
      for(const o of supEl.options){ if(o.value===best.supplier){ found=true; break; } }
      if(!found){ const o=document.createElement("option"); o.value=best.supplier; o.textContent=best.supplier; supEl.appendChild(o); }
      supEl.value=best.supplier;
    }
    if(etaEl && !etaEl.value) etaEl.value=(new Date()).toISOString().slice(0,10);
    // satırı görünür kıl
    const row=priceEl&&priceEl.closest(".card");
    if(row){ row.style.outline="1px solid var(--teal)"; row.scrollIntoView({behavior:"smooth",block:"center"}); }
    showToast("Alındı: "+best.supplier+" · "+fmtTL(best.price));
  }, 80);
}

function findSupplierByName(name){
  const n=String(name||"").trim().toLowerCase();
  if(!n) return null;
  return (state.data.suppliers||[]).find(s=>String(s.name||"").trim().toLowerCase()===n) || null;
}
function waPhoneDigits(phone){
  let d=String(phone||"").replace(/\D/g,"");
  if(!d) return "";
  // TR: 05xx → 905xx · 5xx → 905xx · 90 already ok
  if(d.startsWith("0") && d.length===11) d="9"+d;
  else if(d.length===10 && d.startsWith("5")) d="90"+d;
  return d;
}
function buildWoWaMessage(w, opts){
  const {reqType, machines, mNote, laborN, lNote}=opts;
  const coords=getCoordsForWO(w);
  const where=[w.location, w.equipment].filter(Boolean).join(", ");
  let msg="Merhaba,\n\n";
  msg += "Şurada bir iş var: " + (w.title||"") + (w.no ? " ("+w.no+")" : "") + ".\n";
  if(w.type) msg += w.type + " işi.\n";
  if(where) msg += "Yer: " + where + ".\n";
  if(coords) msg += "Konum: https://maps.google.com/?q=" + coords.lat + "," + coords.lng + "\n";
  msg += "\n";
  if(reqType==="machine"||reqType==="both"){
    if(machines && machines.length){
      msg += "Makine lazım: " + machines.join(", ");
      if(mNote) msg += " — " + mNote;
      msg += ".\n";
    } else if(mNote){
      msg += "Makine lazım: " + mNote + ".\n";
    } else {
      msg += "İş makinesi desteği gerekiyor.\n";
    }
  }
  if(reqType==="labor"||reqType==="both"){
    const n=laborN||2;
    msg += n + " kişilik işçi lazım";
    if(lNote) msg += " (" + lNote + ")";
    msg += ".\n";
  }
  msg += "\nUygun olursa haber verir misin?\n" + (state.session.fullName||"");
  return msg;
}
function isMobileDevice(){
  return /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent||"")
    || (window.matchMedia && window.matchMedia("(max-width: 900px)").matches && "ontouchstart" in window);
}
function openWhatsApp(phone, text){
  const link=whatsappLink(phone, text);
  if(!link) return false;
  // Mobil: aynı sekmede → WhatsApp uygulaması + sohbet
  if(isMobileDevice()){
    window.location.href=link;
    return true;
  }
  const a=document.createElement("a");
  a.href=link;
  a.target="_blank";
  a.rel="noopener noreferrer";
  document.body.appendChild(a);
  a.click();
  a.remove();
  return true;
}
function handleWoWaSend(woId){
  const w=(state.data.workOrders||[]).find(x=>x.id===woId);
  if(!w) return;
  const co=state.data.company||{};
  const reqType=document.getElementById("wa-req-type")?.value||"machine";
  const to=document.getElementById("wa-to")?.value||"machine";
  const machines=[...document.querySelectorAll(".wa-machine:checked")].map(x=>x.value);
  const mNote=(document.getElementById("wa-machine-note")?.value||"").trim();
  const laborN=Number(document.getElementById("wa-labor-n")?.value)||0;
  const lNote=(document.getElementById("wa-labor-note")?.value||"").trim();
  const body=buildWoWaMessage(w,{reqType,machines,mNote,laborN,lNote});
  const targets=[];
  if(to==="labor"||to==="both") targets.push({phone:co.laborForeman?.phone});
  if(to==="machine"||to==="both") targets.push({phone:co.machineForeman?.phone});
  const ok=targets.filter(x=>x.phone);
  if(!ok.length){ showToast("Formen telefonu Ayarlar’da tanımlı değil.","amber"); return; }
  state.modal=null;
  render();
  setTimeout(()=>{

/** Depo vs İhrazat stok havuzu */
function stockPoolOf(s){ return (s && s.pool==="ihrazat") ? "ihrazat" : "depo"; }
function stockLocLabel(s){
  if(!s) return "";
  const parts=[s.warehouse, s.zone, s.shelf].map(x=>String(x||"").trim()).filter(Boolean);
  return parts.join(" · ");
}
function stockFindById(cur, id, item, unit){
  const list=cur.stock||[];
  if(id){
    let s=list.find(x=>x.id===id);
    if(s) return s;
  }
  return list.find(x=>foldTR(x.item)===foldTR(item||"") && foldTR(x.unit||"")===foldTR(unit||""));
}
function stockInPool(pool){
  return (state.data.stock||[]).filter(s=>stockPoolOf(s)===(pool||"depo"));
}
function findStockLine(cur, item, unit, pool){
  const p=pool||"depo";
  return (cur.stock||[]).find(s=>
    foldTR(s.item)===foldTR(item) &&
    foldTR(s.unit||"")===foldTR(unit||"") &&
    stockPoolOf(s)===p
  );
}
/** qtyDelta + giriş / − çıkış. pool: depo|ihrazat */
function applyStockDelta(cur, item, unit, qtyDelta, pool, meta){
  if(!item || !Number.isFinite(qtyDelta) || qtyDelta===0) return null;
  if(!Array.isArray(cur.stock)) cur.stock=[];
  if(!Array.isArray(cur.movements)) cur.movements=[];
  const p=pool||"depo";
  let line=findStockLine(cur, item, unit, p);
  if(!line){
    line={ id:uid(), item, unit:unit||"ad", qty:0, pool:p, category:p==="ihrazat"?"İhrazat":(meta&&meta.category)||"Diğer", minLevel:0 };
    cur.stock.push(line);
  }
  line.qty=Math.round((Number(line.qty)||0)*1000)/1000 + qtyDelta;
  line.pool=p;
  if(p==="ihrazat") line.category=line.category||"İhrazat";
  const mvType=(meta&&meta.type)||(qtyDelta>0?(p==="ihrazat"?"İhrazat Giriş":"Stok Giriş"):(p==="ihrazat"?"İhrazat Çıkış":"Stok Çıkış"));
  cur.movements.push({
    id:uid(), at:nowISO(), type:mvType, item, qty:qtyDelta, unit:unit||line.unit||"",
    pool:p, ref:(meta&&meta.ref)||"", by:state.session?.fullName||"",
    subId:meta&&meta.subId||null, subName:meta&&meta.subName||null,
    note:meta&&meta.note||""
  });
  return line;
}

function findStockRow(cur, key, name){
  return (cur.stock||[]).find(s=>(s.id&&s.id===key) || s.item===key || (name && s.item===name));
}
/** target: stock satırı veya ürün kartı; unitChoice birim uyuşmazlığında seçilen birim */
function handleStockMerge(opts){
  const { sourceKey, sourceName, targetKey, targetName, targetType, unitChoice } = opts||{};
  mutateData(cur=>{
    const other=findStockRow(cur, sourceKey, sourceName);
    if(!other){ showToast("Kaynak stok satırı bulunamadı.","amber"); return cur; }

    let keep=null;
    let targetProduct=null;
    if(targetType==="product" || String(targetKey||"").startsWith("prod:")){
      const pid=String(targetKey||"").replace(/^prod:/,"");
      targetProduct=(cur.products||[]).find(p=>p.id===pid) || (cur.products||[]).find(p=>foldTR(p.name)===foldTR(targetName||""));
      if(!targetProduct){ showToast("Ürün kartı bulunamadı.","amber"); return cur; }
      // Aynı isimli stok var mı?
      keep=findStockRow(cur, null, targetProduct.name) || (cur.stock||[]).find(s=>foldTR(s.item)===foldTR(targetProduct.name));
      if(!keep){
        keep={ id:uid(), item:targetProduct.name, category:targetProduct.category||other.category||"", unit:unitChoice||targetProduct.unit||other.unit||"Adet", qty:0, minLevel:targetProduct.minLevel||0 };
        cur.stock.push(keep);
      }
    } else {
      keep=findStockRow(cur, targetKey, targetName);
      if(!keep){ showToast("Hedef stok satırı bulunamadı.","amber"); return cur; }
    }

    if(keep===other || (keep.id && other.id && keep.id===other.id)){
      showToast("Kaynak ve hedef aynı satır olamaz.","amber"); return cur;
    }

    const unitSrc=String(other.unit||"").trim();
    const unitTgt=String(keep.unit||"").trim();
    const finalUnit = unitChoice || unitTgt || unitSrc || "Adet";

    // Birimler farklı ve kullanıcı seçmediyse engelle
    if(unitSrc && unitTgt && foldTR(unitSrc)!==foldTR(unitTgt) && !unitChoice){
      showToast("Birimler uyuşmuyor ("+unitSrc+" ≠ "+unitTgt+"). Hangi birimin kullanılacağını seçin.","amber");
      return cur;
    }

    const add=Number(other.qty)||0;
    keep.qty=(Number(keep.qty)||0)+add;
    keep.unit=finalUnit;
    keep.item = targetProduct ? targetProduct.name : keep.item; // ürün kartı ismine sabitle
    if(!keep.category && (other.category||targetProduct?.category)) keep.category=other.category||targetProduct.category;
    if((keep.minLevel==null||keep.minLevel==="") && targetProduct?.minLevel!=null) keep.minLevel=targetProduct.minLevel;
    else if((keep.minLevel==null||keep.minLevel==="") && other.minLevel!=null) keep.minLevel=other.minLevel;

    cur.stock=cur.stock.filter(s=>s!==other);
    // Kaynak ile aynı id kalmasın
    cur.stock=cur.stock.map(s=>s===keep?keep:s);

    cur.movements.push({id:uid(), at:nowISO(), type:"Birleşim", item:keep.item, qty:add, unit:finalUnit, ref:"MERGE", note:"← "+other.item+(unitSrc!==finalUnit?" · birim:"+unitSrc+"→"+finalUnit:""), by:state.session.fullName});
    cur.audit.push(pushAudit("Stok Birleştirme", other.item+" → "+keep.item+" (+"+add+" "+finalUnit+")"));
    showToast("Birleştirildi: "+keep.item+" (+"+add+" "+finalUnit+")");
    return cur;
  });
}
function refreshMergeUnitUI(){
  const fromEl=document.getElementById("merge-from");
  const keepEl=document.getElementById("merge-keep");
  const box=document.getElementById("merge-unit-box");
  const unitEl=document.getElementById("merge-unit");
  const hint=document.getElementById("merge-unit-hint");
  if(!fromEl||!keepEl||!box||!unitEl) return;
  const fo=fromEl.selectedOptions[0];
  const ko=keepEl.selectedOptions[0];
  if(!fo||!fo.value||!ko||!ko.value){
    box.style.display="none";
    if(hint) hint.style.display="none";
    return;
  }
  const u1=(fo.dataset.unit||"").trim();
  const u2=(ko.dataset.unit||"").trim();
  if(u1 && u2 && foldTR(u1)!==foldTR(u2)){
    box.style.display="";
    if(hint){
      hint.style.display="";
      hint.textContent="Birimler farklı: kaynak «"+u1+"» · hedef «"+u2+"». Kullanılacak birimi seçin.";
    }
    const units=[...new Set([u1,u2,...(typeof UNITS!=="undefined"?UNITS:[])])];
    unitEl.innerHTML=units.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join("");
    unitEl.value=u2||u1; // varsayılan hedef birimi
  } else {
    box.style.display="none";
    if(hint) hint.style.display="none";
  }
}
function handleBulkGRReceive(supplier, irsNo){
  const pos=(state.data.purchaseOrders||[]).filter(p=>(p.supplier||"")==supplier && (p.status==="Sipariş Verildi"||p.status==="Kısmi Teslim"));
  if(!pos.length){ showToast("Kalem yok.","amber"); return; }
  mutateData(cur=>{
    let n=0;
    pos.forEach(po0=>{
      const idx=cur.purchaseOrders.findIndex(x=>x.id===po0.id);
      if(idx<0) return;
      const po=cur.purchaseOrders[idx];
      const ordered=Number(po.qty)||0;
      const recv=Number(po.receivedQty)||0;
      const left=Math.max(0, ordered-recv);
      if(left<=0) return;
      const qty=left;
      const grC=(cur.counters.gr||0)+1; const grNo="GR-"+String(grC).padStart(5,"0"); cur.counters.gr=grC;
      po.receivedQty=recv+qty;
      po.lastIrsaliyeNo=irsNo;
      if(po.receivedQty>=ordered) po.status="Teslim Alındı";
      else po.status="Kısmi Teslim";
      cur.goodsReceipts.push({id:uid(), no:grNo, poId:po.id, poNo:po.no, item:po.item, qty, unit:po.unit, supplier:po.supplier, irsaliyeNo:irsNo, at:nowISO(), by:state.session.fullName});
      // stock
      let st=cur.stock.find(s=>s.item===po.item);
      if(st) st.qty=Number(st.qty||0)+qty;
      else cur.stock.push({id:uid(), item:po.item, category:po.category||"Diğer", unit:po.unit||"Adet", qty, minLevel:0});
      cur.movements.push({id:uid(), at:nowISO(), type:"Giriş", item:po.item, qty, unit:po.unit, ref:grNo, note:irsNo, by:state.session.fullName});
      cur.audit.push(pushAudit("Toplu GRN", grNo+" · "+po.no+" · +"+qty+" · "+irsNo));
      n++;
    });
    showToast(n? (n+" kalem GRN · "+irsNo) : "İşlenecek kalan yok", n?"green":"amber");
    return cur;
  });
}
function handleGRReceive(poId){
  const irs=document.getElementById("gr-irs-"+poId)?.value.trim();
  const qty=Number(document.getElementById("gr-qty-"+poId)?.value);
  const note=document.getElementById("gr-note-"+poId)?.value.trim();
  if(!irs){ showToast("İrsaliye no zorunlu.","red"); return; }
  if(!qty||qty<=0){ showToast("Geçerli miktar.","red"); return; }
  mutateData(cur=>{
    const po=cur.purchaseOrders.find(x=>x.id===poId); if(!po) return cur;
    const ordered=Number(po.qty)||0;
    const prevRecv=Number(po.receivedQty)||0;
    const remaining=Math.max(0, ordered-prevRecv);
    if(qty>remaining+1e-9){ showToast(`Kalan miktar ${remaining} ${po.unit}. Daha fazla giremezsiniz.`,"red"); return cur; }

    const grC=(cur.counters.gr||0)+1; const grNo="GR-"+String(grC).padStart(5,"0"); cur.counters.gr=grC;
    if(!Array.isArray(cur.stock)) cur.stock=[];
    let idx=cur.stock.findIndex(s=>s.item.toLowerCase()===po.item.toLowerCase()&&s.unit===po.unit);
    if(idx<0) idx=cur.stock.findIndex(s=>foldTR(s.item)===foldTR(po.item));
    const prod=(cur.products||[]).find(p=>foldTR(p.name)===foldTR(po.item));
    if(idx>=0) cur.stock[idx].qty=Number(cur.stock[idx].qty)+qty;
    else cur.stock.push({id:uid(),item:po.item,category:po.category||prod?.category||"",unit:po.unit,qty,minLevel:prod?.minLevel||0});
    const stock=cur.stock;

    const newRecv=prevRecv+qty;
    const full=newRecv>=ordered-1e-9;
    const left=Math.max(0, ordered-newRecv);

    cur.movements.push({id:uid(),at:nowISO(),type:"GRN Giriş",item:po.item,qty,unit:po.unit,ref:grNo+" / "+po.no,by:state.session.fullName});
    cur.goodsReceipts.push({
      id:uid(), no:grNo, poId:po.id, poNo:po.no, requestNo:po.requestNo,
      item:po.item, qty, unit:po.unit, supplier:po.supplier, irsaliyeNo:irs, note,
      orderedQty:ordered, receivedTotal:newRecv, remaining:left,
      at:nowISO(), by:state.session.fullName
    });

    // Yerinde güncelle (tüm PO/request map yok)
    Object.assign(po, {
      status: full ? "Teslim Alındı" : "Kısmi Teslim",
      receivedQty: newRecv,
      remainingQty: left,
      lastIrsaliyeNo: irs,
      lastGrNo: grNo,
      invoiceEligible: true,
      uninvoicedQty: Math.max(0, newRecv - (Number(po.invoicedQty)||0))
    });
    if(po.requestId){
      const req=(cur.requests||[]).find(r=>r.id===po.requestId);
      if(req){
        req.status= full ? "Teslim Alındı" : (["PO Oluşturuldu","Sipariş Verildi","Kısmi Teslim"].includes(req.status) ? "Kısmi Teslim" : req.status);
        req.irsaliyeNo=irs; req.grNo=grNo;
        req.receivedQty=newRecv; req.remainingQty=left;
        req.history=[...(req.history||[]),{at:nowISO(),by:state.session.fullName,action:`GRN ${grNo}: +${qty} · kalan ${left} ${po.unit} · ${po.no}`}];
        if(req.workOrderId){
          const wo=(cur.workOrders||[]).find(w=>w.id===req.workOrderId);
          if(wo && wo.status==="Malzeme Bekliyor"){
            pushNotif(cur,{ type:"malzeme", title:"Malzeme geldi",
              body:(po.item||"")+" · "+qty+" "+(po.unit||"")+" · WO "+(wo.no||""),
              refType:"wo", refId:wo.id, toRoles:["admin","yonetici","saha","depo"]});
            wo.status="Devam Ediyor";
            wo.history=[...(wo.history||[]),{at:nowISO(),by:state.session.fullName,action:"Malzeme GRN ile geldi → Devam Ediyor"}];
          }
        }
      }
    }
    // Her GRN bildirimi
    pushNotif(cur,{ type:"grn", title:"Stok girişi (GRN)",
      body:(po.item||"")+" · +"+qty+" "+(po.unit||"")+" · "+(po.supplier||""),
      refType:"po", refId:po.id, toRoles:["admin","yonetici","depo","satinalma","muhasebe"]});
    cur.stock=stock;
    cur.audit.push(pushAudit("GRN", `${grNo} · ${po.no} · +${qty} · kalan ${left}`));
    showToast(full ? `${grNo} tam teslim · fatura ekranına düştü` : `${grNo} kısmi · kalan ${left} ${po.unit} · fatura ekranına düştü`);
    return cur;
  });
}
function reverseGRN(grId){
  if(!["admin","yonetici","depo"].includes(state.session.role)){ showToast("Yetkiniz yok.","red"); return; }
  if(!confirm("Bu teslim alma ters kayıt edilecek (stok düşer). Emin misiniz?")) return;
  mutateData(cur=>{
    const gr=(cur.goodsReceipts||[]).find(g=>g.id===grId);
    if(!gr || gr.reversed){ showToast("Kayıt yok veya zaten ters.","amber"); return cur; }
    const qty=Number(gr.qty)||0;
    const po=cur.purchaseOrders.find(x=>x.id===gr.poId);
    if(po){
      const newRecv=Math.max(0,(Number(po.receivedQty)||0)-qty);
      const invd=Number(po.invoicedQty)||0;
      // ERP kuralı: faturalanan miktarın altına düşülemez
      if(newRecv+1e-9 < invd){
        showToast("Bu teslimat kısmen/tam faturalandı (faturalanan "+invd+"). Önce faturayı iptal edin.","red");
        return cur;
      }
    }
    let stock=[...cur.stock];
    const idx=stock.findIndex(s=>s.item.toLowerCase()===String(gr.item).toLowerCase()&&s.unit===gr.unit);
    if(idx>=0){
      const nq=Number(stock[idx].qty)-qty;
      if(nq<-1e-9){ showToast("Stok yetersiz, ters kayıt yapılamaz.","red"); return cur; }
      stock[idx]={...stock[idx], qty:Math.max(0,nq)};
    }
    gr.reversed=true; gr.reversedAt=nowISO(); gr.reversedBy=state.session.fullName;
    if(po){
      const newRecv=Math.max(0,(Number(po.receivedQty)||0)-qty);
      const ordered=Number(po.qty)||0;
      po.receivedQty=newRecv;
      po.remainingQty=Math.max(0,ordered-newRecv);
      po.uninvoicedQty=Math.max(0,newRecv-(Number(po.invoicedQty)||0));
      if(newRecv<=1e-9){ po.status="Sipariş Verildi"; po.invoiceEligible=false; }
      else if(newRecv<ordered-1e-9){ po.status="Kısmi Teslim"; po.invoiceEligible=true; }
      else { po.status="Teslim Alındı"; po.invoiceEligible=true; }
      // PR durumunu senkronla
      if(po.requestId){
        cur.requests=cur.requests.map(r=>{
          if(r.id!==po.requestId) return r;
          let st=r.status;
          if(newRecv<=1e-9) st="PO Oluşturuldu";
          else if(newRecv<ordered-1e-9) st="Kısmi Teslim";
          else st="Teslim Alındı";
          return {...r, status:st, receivedQty:newRecv, remainingQty:Math.max(0,ordered-newRecv),
            history:[...(r.history||[]),{at:nowISO(),by:state.session.fullName,action:"GRN ters: -"+qty}]};
        });
      }
    }
    cur.stock=stock;
    cur.movements.push({id:uid(),at:nowISO(),type:"GRN Ters",item:gr.item,qty:-qty,unit:gr.unit,ref:(gr.no||"")+" TERS",by:state.session.fullName});
    cur.audit.push(pushAudit("GRN Ters Kayıt", (gr.no||grId)+" · -"+qty));
    showToast("Ters kayıt yapıldı · stok ve PO güncellendi");
    return cur;
  });
}

function calculateSupplierBalance(name){
  const inv=state.data.invoices.filter(i=>i.supplier===name&&i.status==="Onaylandı"&&!i.isReturn).reduce((s,i)=>s+Number(i.total||0),0);
  const ret=state.data.invoices.filter(i=>i.supplier===name&&(i.isReturn||i.status==="İade Faturası")).reduce((s,i)=>s+Number(i.total||0),0);
  const paid=state.data.payments.filter(p=>p.supplier===name&&p.status==="Ödendi"&&!p.reversed).reduce((s,p)=>s+Number(p.amount||0),0);
  return {invTotal:inv, returnTotal:ret, paidTotal:paid, balance:inv-ret-paid};
}
/** Cari hesap özeti: tarih sırası borç (+) / alacak (−) */
function buildCariLedger(name, dateFrom, dateTo){
  const rows=[];
  const inRange=d=>{
    if(!d) return true;
    const day=String(d).slice(0,10);
    if(dateFrom && day<dateFrom) return false;
    if(dateTo && day>dateTo) return false;
    return true;
  };
  // Sipariş (bilgi — bakiyeye etki etmez, amount 0)
  (state.data.purchaseOrders||[]).filter(p=>p.supplier===name).forEach(p=>{
    const d=p.orderedAt||p.date||p.createdAt;
    if(!inRange(d)) return;
    rows.push({date:d, type:"Sipariş", ref:p.no, desc:(p.item||"")+" × "+(p.qty||"")+" "+(p.unit||""), debit:0, credit:0, info:true, amount:0});
  });
  // Teslimat / irsaliye
  (state.data.goodsReceipts||[]).forEach(g=>{
    const po=(state.data.purchaseOrders||[]).find(x=>x.id===g.poId);
    if(!po || po.supplier!==name) return;
    const d=g.date||g.at;
    if(!inRange(d)) return;
    rows.push({date:d, type:"Teslimat", ref:g.irsaliyeNo||g.no||po.no, desc:(g.item||po.item||"")+" · "+(g.qty||"")+" "+(g.unit||po.unit||""), debit:0, credit:0, info:true, amount:0});
  });
  // Faturalar + iade faturaları (cari alacak)
  (state.data.invoices||[]).filter(i=>i.supplier===name).forEach(i=>{
    if(!inRange(i.date)) return;
    const amt=Math.abs(Number(i.total)||0);
    if(i.isReturn || i.status==="İade Faturası"){
      rows.push({date:i.date, type:"İade Fatura", ref:i.no, desc:(i.item||"")+(i.reason?" · "+i.reason:""), debit:0, credit:amt, amount:-amt});
    } else if(i.status==="Onaylandı"){
      rows.push({date:i.date, type:"Fatura", ref:i.no, desc:(i.item||"")+(i.partial?" (parçalı)":""), debit:amt, credit:0, amount:amt});
    } else if(i.status==="Fiyat Uyuşmuyor"){
      rows.push({date:i.date, type:"Uyuşmazlık", ref:i.no, desc:(i.item||"")+" · beklenen "+fmtTL(i.expected||0), debit:0, credit:0, info:true, amount:0});
    }
  });
  // Depo iade irsaliyeleri (bilgi)
  (state.data.returnShipments||[]).filter(r=>r.supplier===name).forEach(r=>{
    const d=r.at||r.date;
    if(!inRange(d)) return;
    const desc=(r.lines||[]).map(l=>l.item+" × "+l.qty).join(", ")||r.reason||"";
    rows.push({date:d, type:"İade İrsaliye", ref:r.irsaliyeNo||r.no, desc:desc+(r.status?" · "+r.status:""), debit:0, credit:0, info:true, amount:0});
  });
  // Ödemeler
  (state.data.payments||[]).filter(p=>p.supplier===name).forEach(p=>{
    const d=p.paidDate||p.date;
    if(!inRange(d)) return;
    const amt=Number(p.amount)||0;
    if(p.status==="Ödendi"){
      rows.push({date:d, type:"Ödeme", ref:p.invoiceNo||p.poNo||"", desc:(p.method||"Ödeme")+(p.refNo?" · "+p.refNo:""), debit:0, credit:amt, amount:-amt});
    } else if(p.status==="Ödeme Bekliyor"){
      rows.push({date:d, type:"Ödeme bekliyor", ref:p.invoiceNo||"", desc:"Henüz ödenmedi", debit:0, credit:0, info:true, amount:0});
    }
  });
  // Satış (cari müşteri olarak)
  (state.data.sales||[]).filter(s=>foldTR(s.customer||"")===foldTR(name)).forEach(s=>{
    if(!inRange(s.date||s.at)) return;
    const amt=Number(s.amount)||0;
    rows.push({date:s.date||s.at, type:"Satış", ref:s.no||"", desc:s.item||s.desc||"", debit:0, credit:amt, amount:-amt});
  });
  rows.sort((a,b)=>new Date(a.date||0)-new Date(b.date||0) || String(a.ref).localeCompare(String(b.ref)));
  let running=0;
  rows.forEach(r=>{
    running += (Number(r.debit)||0) - (Number(r.credit)||0);
    r.balance=running;
  });
  const debitSum=rows.reduce((s,r)=>s+(Number(r.debit)||0),0);
  const creditSum=rows.reduce((s,r)=>s+(Number(r.credit)||0),0);
  return { rows, debitSum, creditSum, balance:debitSum-creditSum };
}

function todayISODate(){ return (new Date()).toISOString().slice(0,10); }
function subDailyFor(date, subId){
  return (state.data.subcontractorDaily||[]).find(x=>x.date===date && x.subId===subId);
}
function normalizePhoneTR(p){
  let d=String(p||"").replace(/\D/g,"");
  if(d.startsWith("00")) d=d.slice(2);
  if(d.startsWith("0")&&d.length===11) d="90"+d.slice(1);
  if(d.length===10&&d.startsWith("5")) d="90"+d;
  if(d.length===12&&d.startsWith("90")) return d;
  return d.length>=10?d:"";
}
function siteHeadcount(date){
  return (state.data.subcontractorDaily||[]).filter(x=>x.date===date).reduce((s,x)=>s+(Number(x.headcount)||0),0);
}
function subHakedisList(subId){
  return (state.data.subHakedis||[]).filter(h=>h.subId===subId && h.status!=="İptal");
}
function hakNet(h){
  if(!h) return 0;
  const labor=Number(h.laborAmount!=null?h.laborAmount:h.gross)||0;
  const mat=Number(h.materialAmount)||0;
  const ihz=Number(h.ihrazatAmount)||0;
  // gross alanı: işçilik+malzeme+ihrazat toplamı (eski kayıtlarda tek tutar)
  const g = (h.laborAmount!=null || h.materialAmount || h.ihrazatAmount)
    ? (labor+mat+ihz)
    : (Number(h.gross)||0);
  const d=(h.deductions||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
  return Math.max(0, g-d);
}
function hakGrossTotal(h){
  if(!h) return 0;
  if(h.laborAmount!=null || h.materialAmount || h.ihrazatAmount){
    return (Number(h.laborAmount)||0)+(Number(h.materialAmount)||0)+(Number(h.ihrazatAmount)||0);
  }
  return Number(h.gross)||0;
}
function hakPaidAmount(h){
  if(!h) return 0;
  // Ödenen ayrı alan — yoksa ve durum Ödendi ise net (geriye uyum)
  if(h.paidAmount!=null && h.paidAmount!=="" && Number.isFinite(Number(h.paidAmount))){
    return Math.max(0, Number(h.paidAmount));
  }
  if(h.status==="Ödendi") return hakNet(h);
  return 0;
}
function subHakedisTotals(subId){
  const list=subHakedisList(subId);
  let gross=0, deduct=0, paid=0, approved=0, labor=0, material=0, ihrazat=0;
  list.forEach(h=>{
    const g=hakGrossTotal(h);
    const d=(h.deductions||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);
    const net=Math.max(0,g-d);
    gross+=g; deduct+=d;
    labor+=(Number(h.laborAmount!=null?h.laborAmount:(h.materialAmount||h.ihrazatAmount?0:h.gross))||0);
    material+=(Number(h.materialAmount)||0);
    ihrazat+=(Number(h.ihrazatAmount)||0);
    paid+=hakPaidAmount(h);
    if(["Onaylandı","Fatura Bekliyor","Ödeme Bekliyor"].includes(h.status)) approved+=net;
  });
  return { gross, deduct, net:gross-deduct, paid, approved, remaining:Math.max(0,(gross-deduct)-paid), labor, material, ihrazat };
}
function subContractBalance(s){
  const contract=Number(s.contractAmount)||0;
  const tot=subHakedisTotals(s.id);
  return { contract, hakkedilen:tot.net, kalan:contract>0?contract-tot.net:null, paid:tot.paid };
}
/** Dönem metninden tarih aralığı tahmin et (YYYY-MM, YYYY-MM-DD, ay adı kaba) */
function parseHakPeriodRange(period, fallbackAt){
  const p=String(period||"").trim();
  const iso=p.match(/(\d{4})-(\d{2})(?:-(\d{2}))?/);
  if(iso){
    const y=+iso[1], m=+iso[2];
    if(iso[3]){
      const d=iso[3];
      return { from: y+"-"+String(m).padStart(2,"0")+"-"+d, to: y+"-"+String(m).padStart(2,"0")+"-"+d };
    }
    const last=new Date(y, m, 0).getDate();
    return { from: y+"-"+String(m).padStart(2,"0")+"-01", to: y+"-"+String(m).padStart(2,"0")+"-"+String(last).padStart(2,"0") };
  }
  // fallback: kayıt ayı
  const at=fallbackAt?new Date(fallbackAt):new Date();
  if(isNaN(at.getTime())) return null;
  const y=at.getFullYear(), m=at.getMonth()+1;
  const last=new Date(y, m, 0).getDate();
  return { from: y+"-"+String(m).padStart(2,"0")+"-01", to: y+"-"+String(m).padStart(2,"0")+"-"+String(last).padStart(2,"0") };
}
function subHeadcountInRange(subId, from, to){
  const rows=(state.data.subcontractorDaily||[]).filter(x=>x.subId===subId);
  let sum=0, days=0, max=0;
  rows.forEach(r=>{
    const d=String(r.date||"");
    if(from && d<from) return;
    if(to && d>to) return;
    const n=Number(r.headcount)||0;
    sum+=n; days++; if(n>max) max=n;
  });
  return { sum, days, avg: days?Math.round((sum/days)*10)/10 : 0, max };
}
function hakDeductBreakdown(h){
  const map={};
  (h.deductions||[]).forEach(d=>{
    const k=d.type||"Diğer";
    map[k]=(map[k]||0)+(Number(d.amount)||0);
  });
  return map;
}

/* ============================ İŞ KALEM KARTLARI (pursantaj + taşeron + ekipman) ============================ */

/** İmalat şablonundaki her kalem için taşeronsuz iş kalem kartı oluştur / senkron */
function ensureWorkPackagesFromTemplates(cur, force){
  if(!cur || typeof cur!=="object") return cur;
  if(!Array.isArray(cur.workPackages)) cur.workPackages=[];
  const tpl=getImalatTemplates(cur);
  // Şablon değişmediyse tekrar tarama — performans
  let fp="";
  try{
    Object.keys(tpl).sort().forEach(c=>{ fp+=c+":"+(tpl[c]||[]).join("|")+"||"; });
    fp+="#"+(cur.equipment||[]).length;
  }catch(e){}
  if(!force && cur._wpTplFp===fp && (cur.workPackages||[]).length){
    return cur;
  }
  cur._wpTplFp=fp;
  const bins=(cur.equipment||[]).filter(e=>e.unitType==="Bina" || /bina/i.test(String(e.type||"")+" "+String(e.name||"")));
  const allEqIds=bins.map(e=>e.id);
  const existing=cur.workPackages;
  // index ile O(n) arama
  const byKey=new Map();
  existing.forEach(w=>{
    if(w.active===false) return;
    byKey.set(foldTR(w.imalatCat||"")+"|"+foldTR(w.imalatItem||""), w);
    if(w.name) byKey.set("n|"+foldTR(w.name||""), w);
  });
  function findWP(cat, item){
    return byKey.get(foldTR(cat)+"|"+foldTR(item)) || null;
  }
  let c=Number(cur.counters&&cur.counters.wp)||0;
  Object.keys(tpl).forEach(cat=>{
    (tpl[cat]||[]).forEach(itemName=>{
      const name=String(itemName||"").trim();
      if(!name) return;
      let wp=findWP(cat, name);
      if(!wp){
        const byName=byKey.get("n|"+foldTR(name));
        if(byName && (!byName.imalatItem || foldTR(byName.imalatItem)===foldTR(name))) wp=byName;
      }
      if(wp){
        // sadece şablona bağla; taşeron/pursantaj kullanıcı atamasını bozma
        if(!wp.imalatCat) wp.imalatCat=cat;
        if(!wp.imalatItem) wp.imalatItem=name;
        if(!wp.ownerType) wp.ownerType="atamaYok";
        // ekipman boşsa tüm binaları öner (üzerine yazma: sadece hiç yoksa)
        if(!Array.isArray(wp.equipmentIds) || !wp.equipmentIds.length){
          wp.equipmentIds=[...allEqIds];
          wp.weightMode=wp.weightMode||"byDaire";
        }
      } else {
        c++;
        cur.workPackages.push({
          id:uid(),
          no:"IK-"+String(c).padStart(4,"0"),
          name:name,
          imalatCat:cat,
          imalatItem:name,
          ownerType:"atamaYok",
          subId:null,
          subName:null,
          pursantaj:0,
          budget:null,
          weightMode:"byDaire",
          equipmentIds:[...allEqIds],
          note:"Şablondan otomatik",
          autoFrom:"imalat",
          active:true,
          createdAt:nowISO()
        });
      }
    });
  });
  if(!cur.counters) cur.counters={};
  cur.counters.wp=Math.max(Number(cur.counters.wp)||0, c);
  // Şablondan silinen auto kartları pasifleştir (manuel taşeronlu dokunma)
  const tplSet=new Set();
  Object.keys(tpl).forEach(cat=>(tpl[cat]||[]).forEach(n=>tplSet.add(foldTR(cat)+"|"+foldTR(n))));
  cur.workPackages.forEach(w=>{
    if(w.autoFrom==="imalat" && w.ownerType==="atamaYok" && !w.subId){
      const key=foldTR(w.imalatCat||"")+"|"+foldTR(w.imalatItem||w.name||"");
      if(w.imalatItem && !tplSet.has(key)) w.active=false;
    }
  });
  return cur;
}
function renameWorkPackageKalem(cur, cat, oldName, newName){
  if(!Array.isArray(cur.workPackages)) return;
  cur.workPackages.forEach(w=>{
    if(foldTR(w.imalatCat||"")!==foldTR(cat||"")) return;
    if(foldTR(w.imalatItem||"")===foldTR(oldName) || foldTR(w.name||"")===foldTR(oldName)){
      w.imalatItem=newName;
      if(foldTR(w.name||"")===foldTR(oldName) || w.autoFrom==="imalat") w.name=newName;
    }
  });
}

function wpBudget(wp){
  const b=Number(wp.budget);
  if(Number.isFinite(b)&&b>0) return b;
  // taşeron sözleşme × pursantaj
  if(wp.ownerType==="taseron" && wp.subId){
    const sub=(state.data.subcontractors||[]).find(s=>s.id===wp.subId);
    const c=Number(sub?.contractAmount)||0;
    const p=Number(wp.pursantaj)||0;
    if(c>0 && p>0) return Math.round(c*p)/100;
  }
  // ana firma: company.projectBudget veya toplam sözleşmeler dışı manuel
  if(wp.ownerType==="ana"){
    const c=Number(state.data.company?.projectBudget)||0;
    const p=Number(wp.pursantaj)||0;
    if(c>0 && p>0) return Math.round(c*p)/100;
  }
  return 0;
}
function wpEquipmentWeights(wp){
  const ids=wp.equipmentIds||[];
  const mode=wp.weightMode||"equal";
  const eqs=(state.data.equipment||[]).filter(e=>ids.includes(e.id));
  if(!eqs.length) return [];
  const weights=eqs.map(eq=>{
    let w=1;
    if(mode==="byDaire") w=Math.max(1, Number(eq.daireSayisi)||1);
    else if(mode==="byKat") w=Math.max(1, Number(eq.katSayisi)||1);
    else if(mode==="manual"){
      const m=wp.equipmentWeights&&wp.equipmentWeights[eq.id];
      w=Number(m)>0?Number(m):1;
    }
    return { eq, w };
  });
  const sum=weights.reduce((s,x)=>s+x.w,0)||1;
  return weights.map(x=>({ ...x, share:x.w/sum }));
}
/** İmalat % → tahmini gerçekleşen bedel */
function wpProgressValuation(wp){
  const budget=wpBudget(wp);
  const cat=wp.imalatCat||"";
  const item=wp.imalatItem||"";
  const shares=wpEquipmentWeights(wp);
  if(!shares.length){
    // ekipman yoksa genel — tüm binalar ortalaması ilgili kalem
    const bins=(state.data.equipment||[]).filter(isBinaEq);
    if(!bins.length || !item) return { budget, earned:0, pctAvg:0, lines:[] };
    let sumPct=0,n=0;
    const lines=[];
    bins.forEach(eq=>{
      const pct=packagePct(eq, item==="__CAT__"?"__CAT__":item, item==="__CAT__"?cat:null);
      if(pct==null) return;
      sumPct+=pct; n++;
      lines.push({ eq, pct, share:1/bins.length, partBudget:budget/bins.length, earned:(budget/bins.length)*(pct/100) });
    });
    const pctAvg=n?sumPct/n:0;
    return { budget, earned:budget*(pctAvg/100), pctAvg, lines };
  }
  let earned=0, pctAvg=0;
  const lines=shares.map(({eq, share, w})=>{
    let pct=0;
    if(item==="__CAT__") pct=packagePct(eq, "__CAT__", cat)||0;
    else if(item) pct=packagePct(eq, item, null)||0;
    else pct=overallProgress(ensureEqProgress(eq))||0;
    const partBudget=budget*share;
    const e=partBudget*(pct/100);
    earned+=e;
    pctAvg+=pct*share;
    return { eq, pct, share, w, partBudget, earned:e };
  });
  return { budget, earned, pctAvg, lines };
}
function workPackagesForSub(subId){
  if(!subId) return [];
  return (state.data.workPackages||[]).filter(w=>
    w.active!==false &&
    (w.ownerType==="taseron" || w.ownerType==="taşeron") &&
    w.subId===subId
  );
}
/** Taşeron iş kalemleri + imalat bedeli özeti (hakediş ile kıyas) */
function subWpSummary(subId){
  const list=workPackagesForSub(subId);
  let budget=0, earned=0;
  const rows=list.map(wp=>{
    let v={ budget:0, earned:0, pctAvg:0 };
    try{ v=wpProgressValuation(wp); }catch(e){}
    budget+=Number(v.budget)||0;
    earned+=Number(v.earned)||0;
    return { wp, v };
  });
  return { rows, budget, earned, count:list.length };
}

function handleWpSave(editId){
  if(!["admin","yonetici","muhasebe"].includes(state.session.role)){ showToast("Yetkiniz yok.","red"); return; }
  const name=(document.getElementById("wp-name")?.value||"").trim();
  const imalatCat=document.getElementById("wp-cat")?.value||"";
  const imalatItem=document.getElementById("wp-item")?.value||"";
  const ownerType=document.getElementById("wp-owner")?.value||"taseron";
  const subId=document.getElementById("wp-sub")?.value||"";
  const pursantaj=Number(document.getElementById("wp-purs")?.value)||0;
  const budgetRaw=document.getElementById("wp-budget")?.value;
  const budget=budgetRaw===""||budgetRaw==null?null:Number(budgetRaw);
  const weightMode=document.getElementById("wp-weight")?.value||"equal";
  const note=(document.getElementById("wp-note")?.value||"").trim();
  const eqChecks=[...document.querySelectorAll(".wp-eq-cb:checked")].map(el=>el.value);
  if(!name){ showToast("Kalem adı zorunlu.","red"); return; }
  if(pursantaj<0||pursantaj>100){ showToast("Pursantaj 0–100 arası.","red"); return; }
  mutateData(cur=>{
    if(!Array.isArray(cur.workPackages)) cur.workPackages=[];
    const sub=subId?(cur.subcontractors||[]).find(x=>x.id===subId):null;
    const payload={
      name, imalatCat, imalatItem,
      ownerType, subId:ownerType==="taseron"&&sub?sub.id:null, subName:ownerType==="taseron"&&sub?sub.name:null,
      pursantaj, budget:Number.isFinite(budget)&&budget>=0?budget:null,
      weightMode, equipmentIds:eqChecks, note, active:true
    };
    if(editId){
      const w=cur.workPackages.find(x=>x.id===editId);
      if(w) Object.assign(w, payload, { updatedAt:nowISO(), autoFrom:w.autoFrom||null });
      cur.audit.push(pushAudit("İş Kalem Kartı Güncellendi", (w?.no||"")+" · "+name));
    } else {
      const c=(cur.counters.wp||0)+1; cur.counters.wp=c;
      cur.workPackages.unshift({ id:uid(), no:"IK-"+String(c).padStart(4,"0"), ...payload, createdAt:nowISO() });
      cur.audit.push(pushAudit("İş Kalem Kartı", "IK-"+String(c).padStart(4,"0")+" · "+name));
    }
    showToast(editId?"Güncellendi":"Kalem kartı eklendi");
    return cur;
  });
  state.modal=null;
}


/* ============================ KONAKLAMA / KAMP AMİRİ / OTEL ============================ */
const CAMP_CONDITIONS=["Kullanıma hazır","Temizlik gerekli","Bakımda","Arızalı","Kapalı"];
const CAMP_FLOORS=["Zemin Kat","1. Kat","2. Kat","3. Kat","4. Kat","5. Kat","6. Kat","7. Kat","8. Kat","9. Kat","10. Kat","Bodrum","Çatı Katı"];
function campStayBeds(s){
  if(!s) return 0;
  // Kontenjan: headcount; tek kişi: 1 (headcount yok/0)
  if(s.isQuota || (s.headcount!=null && s.headcount!=="")){
    const n=Number(s.headcount);
    if(Number.isFinite(n) && n>0) return n;
  }
  return 1;
}
function campRoomOcc(roomId, stays){
  const list=stays||(state.data.campStays||[]);
  return list
    .filter(s=>s.roomId===roomId && s.status==="Konaklayan")
    .reduce((sum,s)=>sum+campStayBeds(s),0);
}
function campStayOpen(roomId, stays){
  const list=stays||(state.data.campStays||[]);
  return list.filter(s=>s.roomId===roomId && s.status==="Konaklayan");
}
/** Tüm sitede konaklayan kişi toplamı (kontenjan dahil) */
function campTotalOccupied(stays){
  const list=stays||(state.data.campStays||[]);
  return list.filter(s=>s.status==="Konaklayan").reduce((sum,s)=>sum+campStayBeds(s),0);
}
function campRoomMatches(r, q){
  if(!q || !String(q).trim()) return true;
  const blob=[r.code,r.name,r.block,r.floor,r.note,r.condition,r.no].join(" ");
  if(fuzzyMatch(blob, q)) return true;
  return campStayOpen(r.id).some(s=>fuzzyMatch([s.personName,s.subName,s.phone,s.note,s.no].join(" "), q));
}
function campRoomBlock(r){
  const b=(r.block||"").trim();
  if(b) return b;
  const c=String(r.code||"");
  const m=c.match(/^([A-Za-zÇĞİÖŞÜçğıöşü]+)/);
  return m?m[1].toUpperCase()+" Blok":"Genel";
}
function campRoomFloor(r){
  if(r.floor!=null && String(r.floor).trim()!=="") return String(r.floor).trim();
  const blob=[r.code,r.name,r.block,r.note].map(x=>String(x||"")).join(" ");
  let m=blob.match(/(\d+)\s*\.?\s*kat/i);
  if(m) return m[1]+". Kat";
  return "Kat belirtilmedi";
}
function campFloorSortKey(f){
  const m=String(f).match(/(\d+)/);
  return m?Number(m[1]):999;
}
function campDateOnly(d){
  if(!d) return "";
  const s=String(d);
  return s.length>=10?s.slice(0,10):s;
}
function campRangesOverlap(aFrom, aTo, bFrom, bTo){
  const a1=campDateOnly(aFrom), a2=campDateOnly(aTo||aFrom);
  const b1=campDateOnly(bFrom), b2=campDateOnly(bTo||bFrom);
  if(!a1||!b1) return false;
  return a1<=b2 && b1<=a2;
}
function campBedsBooked(roomId, from, to, excludeId){
  let n=0;
  (state.data.campStays||[]).forEach(s=>{
    if(s.roomId!==roomId) return;
    if(excludeId && s.id===excludeId) return;
    if(s.status==="İptal" || s.status==="Çıktı") return;
    const sFrom=s.checkInPlanned||s.checkIn;
    const sTo=s.checkOutPlanned||s.checkOut||s.checkInPlanned||s.checkIn;
    if(campRangesOverlap(from, to||from, sFrom, sTo)) n+=campStayBeds(s);
  });
  return n;
}
function campRoomAvailableBeds(roomId, from, to, excludeId){
  const room=(state.data.campRooms||[]).find(r=>r.id===roomId);
  if(!room) return 0;
  if(["Kapalı","Bakımda","Arızalı"].includes(room.condition||"")) return 0;
  const cap=Number(room.capacity)||0;
  return Math.max(0, cap - campBedsBooked(roomId, from, to, excludeId));
}
function campBedIcons(cap, guests){
  const slots=[];
  (guests||[]).forEach(g=>{
    const beds=campStayBeds(g);
    for(let i=0;i<beds;i++) slots.push(g);
  });
  const occupied=slots.length;
  // Maksimum 10 yatak gösterimi
  let n=Math.min(10, Math.max(Number(cap)||0, occupied, 1));
  if(Number(cap)>0) n=Math.min(10, Number(cap));
  if(occupied>n) n=Math.min(10, occupied);
  let html="";
  for(let i=0;i<n;i++){
    const g=slots[i];
    if(g){
      const tip=(g.isQuota?(g.subName||g.personName)+" · kontenjan":g.personName)+(g.subName&&!g.isQuota?" · "+g.subName:"");
      html+=`<span class="camp-bed occupied" title="${esc(tip)}">👤</span>`;
    } else {
      html+=`<span class="camp-bed free" title="Boş yatak">🛏️</span>`;
    }
  }
  return html;
}
function renderCampKroki(rooms, can, query){
  if(!rooms.length) return `<div class="card empty">Oda yok — «➕ Oda» ile ekleyin.</div>`;
  const tree={};
  rooms.forEach(r=>{
    const bl=campRoomBlock(r);
    const fl=campRoomFloor(r);
    if(!tree[bl]) tree[bl]={};
    if(!tree[bl][fl]) tree[bl][fl]=[];
    tree[bl][fl].push(r);
  });
  const blocks=Object.keys(tree).sort((a,b)=>a.localeCompare(b,"tr"));
  const q=query && String(query).trim();
  return blocks.map(bl=>{
    const floors=Object.keys(tree[bl]).sort((a,b)=>campFloorSortKey(a)-campFloorSortKey(b));
    let blockOcc=0, blockCap=0, blockFreeRooms=0, blockRooms=0;
    floors.forEach(fl=>tree[bl][fl].forEach(r=>{
      const cap=Math.min(10, Number(r.capacity)||0);
      const occ=campRoomOcc(r.id);
      blockCap+=cap; blockOcc+=occ; blockRooms++;
      if(occ===0) blockFreeRooms++;
    }));
    const pct=blockCap?Math.min(100, Math.round(100*blockOcc/blockCap)):0;
    return `<div class="card camp-block">
      <div class="camp-block-head">
        <div>
          <div class="camp-block-title">🏢 ${esc(bl)}</div>
          <div class="camp-block-meta">${blockRooms} oda · ${blockOcc}/${blockCap||"—"} yatak · ${blockFreeRooms} boş</div>
        </div>
        <div class="camp-block-bar" title="%${pct} dolu"><i style="width:${pct}%"></i></div>
      </div>
      ${floors.map(fl=>{
        const list=tree[bl][fl].slice().sort((a,b)=>String(a.code||"").localeCompare(String(b.code||""),"tr"));
        const fOcc=list.reduce((s,r)=>s+campRoomOcc(r.id),0);
        const fCap=list.reduce((s,r)=>s+Math.min(10,Number(r.capacity)||0),0);
        return `<div class="camp-floor">
          <div class="camp-floor-head">
            <span class="camp-floor-pill">${esc(fl)}</span>
            <span class="camp-floor-count">${list.length} oda · ${fOcc}/${fCap||"—"} yatak</span>
          </div>
          <div class="camp-floor-grid">
            ${list.map(r=>{
              const guests=campStayOpen(r.id);
              const occ=campRoomOcc(r.id);
              const cap=Math.min(10, Number(r.capacity)||0);
              const full=cap>0 && occ>=cap;
              const empty=occ===0;
              const cond=r.condition||"Kullanıma hazır";
              const blocked=["Kapalı","Bakımda","Arızalı"].includes(cond);
              const tone=blocked?"blocked":(full?"full":(empty?"empty":"partial"));
              const hit=q && campRoomMatches(r, q);
              const dim=q && !hit;
              const rezN=(state.data.campStays||[]).filter(s=>s.roomId===r.id&&s.status==="Rezerve").length;
              return `<div class="camp-room-tile ${tone}${hit?" search-hit":""}${dim?" search-dim":""}" data-id="${esc(r.id)}">
                <div class="camp-room-head">
                  <span class="camp-room-code" title="${esc(r.name||r.code||"")}">Oda ${esc(r.name||r.code||"?")}</span>
                  <span class="camp-room-badge">${blocked?esc(cond):(full?"DOLU":(empty?"BOŞ":occ+"/"+cap))}</span>
                </div>
                <div class="camp-beds">${campBedIcons(cap||Math.max(occ,1), guests)}</div>
                ${guests.length
                  ?`<div class="camp-guests">${guests.slice(0,2).map(g=>`<div class="camp-guest-line">${esc(g.personName)}</div>`).join("")}${guests.length>2?`<div class="camp-guest-line">+${guests.length-2}</div>`:""}</div>`
                  :`<div class="camp-guests empty-hint">${blocked?esc(cond):"Müsait"}</div>`}
                ${rezN?`<div style="font-size:9px;color:var(--blue);">📋 ${rezN} rez.</div>`:""}
                ${can?`<div class="camp-room-actions">
                  ${!full && !blocked?`<button type="button" class="btn btn-primary" data-action="camp-bulk" data-id="${esc(r.id)}" title="Kontenjan">👥</button>`:`<span></span>`}

                  ${occ?`<button type="button" class="btn btn-teal" data-action="camp-checkout-room" data-id="${esc(r.id)}" title="Çıkış">↩</button>`:`<span></span>`}

                  <button type="button" class="btn btn-ghost" data-action="camp-room-dup" data-id="${esc(r.id)}" title="Çoğalt">⧉</button>
                  <button type="button" class="btn btn-danger" data-action="camp-room-del" data-id="${esc(r.id)}" title="Sil">🗑</button>
                </div>`:""}
              </div>`;

          </div>
        </div>`;
